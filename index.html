  function renderCrono(){
    var c=document.getElementById('cronoContent'); if(!c)return;
    // Preserva a posição de rolagem da matriz (tcWrap rola tanto na vertical quanto na
    // horizontal) — cada ajuste substitui todo o innerHTML, o que por padrão zeraria a rolagem
    // e jogaria a tela de volta pro início da matriz a cada edição.
    var prevWrap=document.getElementById('tcWrap');
    var prevScrollLeft=prevWrap?prevWrap.scrollLeft:0, prevScrollTop=prevWrap?prevWrap.scrollTop:0;
    // A rolagem da PÁGINA também precisa ser guardada: trocar o innerHTML encolhe o conteúdo
    // por um instante e o navegador joga a janela de volta pro topo (o cabeçalho), tirando a
    // matriz da tela a cada ajuste.
    var prevPageScroll=window.scrollY||window.pageYOffset||0;
    var contentEl=document.getElementById('content');
    var prevContentScroll=contentEl?contentEl.scrollTop:0;
    c.innerHTML=cronoContent();
    var newWrap=document.getElementById('tcWrap');
    if(newWrap){ newWrap.scrollLeft=prevScrollLeft; newWrap.scrollTop=prevScrollTop; }
    if(contentEl)contentEl.scrollTop=prevContentScroll;
    window.scrollTo(0,prevPageScroll);
    // Reaplica no próximo quadro: o navegador pode reajustar a rolagem sozinho depois do
    // script, quando o elemento que estava com foco some junto com o innerHTML antigo.
    requestAnimationFrame(function(){
      var w2=document.getElementById('tcWrap');
      if(w2){ w2.scrollLeft=prevScrollLeft; w2.scrollTop=prevScrollTop; }
      var c2=document.getElementById('content');
      if(c2)c2.scrollTop=prevContentScroll;
      window.scrollTo(0,prevPageScroll);
    });
    wireMatrixZoom();
    refreshTopSaveBtn(); applyReadOnly();
    if((window._cronoTab||'tc')==='ajuste'&&!isReadOnly()){
      renderAssignPanel(); wireDragMatrix();
      var clearB=document.getElementById('clearAdjustsBtn');
      if(clearB)clearB.addEventListener('click',function(){
        if(!confirm('Remover todos os ajustes manuais deste cronograma? (precisa clicar em "Salvar ajustes" pra valer)'))return;
        OVR={}; ADJ_PENDING={}; ADJ_DIRTY=true; renderCrono();
      });
      var saveB=document.getElementById('saveAdjustsBtn');
      if(saveB)saveB.addEventListener('click',async function(){
        saveB.disabled=true; saveB.textContent='Salvando…';
        try{
          if(ACTIVE_CENARIO){ await saveIntoActiveCenario(); }
          else{ await saveOverrides(); ADJ_DIRTY=false; ADJ_PENDING={}; toast('Ajustes salvos.'); renderCrono(); }
        }
        catch(e){ alert('Falha ao salvar: '+((e&&e.message)||e)); saveB.disabled=false; saveB.textContent='💾 Salvar ajustes'; }
      });
    }
  }
  // Arraste: só reposiciona visualmente (transform) durante o movimento — não
  // reconstrói a tabela nem grava no banco a cada pixel. O ajuste só entra em
  // OVR (em memória) no soltar, e só vai pro Supabase quando clicar "Salvar".
  // Ghost solto (position:fixed) que "salta" pra célula alvo — o .tcm-seg
  // original nunca sai do DOM (só fica esmaecido), então o pointer capture
  // nunca se perde, mesmo re-renderizando a matriz depois de soltar.
  var _drag=null, _ghost=null, _seqDrag=null, _colDrag=null, _lotRowDrag=null;
  var _segClickTimer=null, _segClickEl=null, _segClickAt=0;
  /** Menu "Personalizar" de um segmento da matriz (clique simples, sem arrastar): fixa início
   *  e equipe exatamente como definido aqui, pra qualquer lote — essa passa a ser a decisão
   *  final, o cálculo automático (fila dinâmica, sem paralisações, predecessoras, fila da
   *  equipe) não move mais isso. A duração continua sempre calculada de verdade. "Remover
   *  ajuste" volta ao cálculo automático normal. */
  function openSegMenu(li,si){
    var s=SERV[si]; if(!s)return;
    var seg=buildSchedule().filter(function(sg){return sg.li===li&&sg.si===si;})[0];
    if(!seg)return;
    var calStart=isoWeek(mondayOf(seg.start));
    var teams=[]; for(var t=1;t<=s.eq;t++)teams.push(t);
    var lotOpts=LOTS.map(function(l,li2){return '<option value="'+li2+'"'+(li2===li?' selected':'')+'>'+l+'</option>';}).join('');
    var teamOpts=teams.map(function(t){return '<option value="'+t+'"'+(t===seg.team?' selected':'')+'>Equipe '+t+'</option>';}).join('');
    var backdrop=document.createElement('div');
    backdrop.className='segmenu-backdrop';
    backdrop.innerHTML='<div class="segmenu-panel card">'+
      '<div class="eyebrow" style="margin-bottom:2px">Personalizar — '+s.n+'</div>'+
      '<div class="note" style="margin-bottom:12px">Fixa qual equipe faz esse lote e em que semana — essa é a decisão final, não muda mais por causa de predecessora, fila da equipe ou fila dinâmica. A duração continua sempre calculada de verdade (quantidade do lote ÷ produtividade da equipe, considerando a chuva daquela semana) — não dá pra digitar uma duração fixa.</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+
        '<label>Lote<select class="esel" id="smLote">'+lotOpts+'</select></label>'+
        '<label>Equipe<select class="esel" id="smTeam">'+teamOpts+'</select></label>'+
        '<label>Semana do ano de início<input class="einp" type="number" id="smStart" value="'+calStart+'"></label>'+
        '<div class="note" id="smPreview" style="min-height:1.4em"></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap">'+
        (ovrGet(li,si)?'<button class="btn" id="smClear">Remover ajuste</button>':'')+
        '<button class="btn" id="smCancel">Cancelar</button>'+
        '<button class="btn primary" id="smApply">Aplicar</button>'+
      '</div>'+
    '</div>';
    document.body.appendChild(backdrop);
    function close(){ backdrop.remove(); }
    backdrop.addEventListener('pointerdown',function(e){ if(e.target===backdrop)close(); });
    document.getElementById('smCancel').addEventListener('click',close);
    var loteSel=document.getElementById('smLote'), teamSel=document.getElementById('smTeam'),
      startInp=document.getElementById('smStart'), preview=document.getElementById('smPreview');
    // Roda o cálculo de verdade (buildSchedule) com o ajuste proposto, só pra mostrar o
    // resultado — não deixa nada gravado. Assim o número mostrado aqui é sempre exatamente o
    // que vai aparecer na matriz depois de aplicar, nunca uma conta feita à parte que possa
    // divergir do motor real.
    function previewSeg(newLi,newTeam,projWeek){
      if(!projWeek)return null;
      var kNew=ovrKey(newLi,si); if(!kNew)return null;
      var had=Object.prototype.hasOwnProperty.call(OVR,kNew), saved=OVR[kNew];
      OVR[kNew]={pinned:true,pins:[{team:newTeam,startWeek:projWeek}]};
      var dryRun=buildSchedule();
      if(had)OVR[kNew]=saved; else delete OVR[kNew];
      var result=dryRun.filter(function(sg){return sg.li===newLi&&sg.si===si&&sg.team===newTeam;})[0]||null;
      // O motor já divide sozinho a semana de transição entre lotes vizinhos da mesma equipe —
      // só é conflito de verdade se a equipe nem conseguiu começar na semana pedida porque já
      // está comprometida em outro lote (o resultado "atrasou" em relação ao pedido).
      var conflicts=(result&&result.start>projWeek)?dryRun.filter(function(sg){
        return sg.si===si&&sg.team===newTeam&&sg.li!==newLi&&(sg.start+sg.dur-1)>=projWeek&&sg.start<=result.start;
      }):[];
      return {result:result,conflicts:conflicts};
    }
    function refreshPreview(){
      var newLi=+loteSel.value, newTeam=+teamSel.value;
      var calWeek=Math.max(1,parseInt(startInp.value,10)||calStart);
      var projWeek=projWeekForCalWeek(calWeek);
      var qty=QTY[newLi][si]||0;
      if(!projWeek){ preview.textContent='Semana do ano inválida.'; return; }
      if(!(qty>0)){ preview.textContent='Esse lote não tem quantidade cadastrada pra "'+s.n+'".'; return; }
      var p=previewSeg(newLi,newTeam,projWeek);
      if(!p.result){ preview.textContent='Não deu pra calcular — confira os dados.'; return; }
      var result=p.result;
      preview.innerHTML='Quantidade: <b>'+fmtBR(qty)+' '+s.u+'</b> — duração calculada: <b>'+result.dur+' semana(s)</b>'+
        ' (S'+isoWeek(mondayOf(result.start))+' a S'+isoWeek(mondayOf(result.start+result.dur-1))+')'+
        (p.conflicts.length?'<br><b style="color:var(--crit)">⚠ Impossível: Equipe '+newTeam+' já está em '+p.conflicts.map(function(c){return LOTS[c.li];}).join(', ')+' nesse período.</b>':'');
    }
    loteSel.addEventListener('change',refreshPreview);
    teamSel.addEventListener('change',refreshPreview);
    startInp.addEventListener('input',refreshPreview);
    refreshPreview();
    var clearB=document.getElementById('smClear');
    if(clearB)clearB.addEventListener('click',function(){
      var k=ovrKey(li,si); if(k){delete OVR[k]; delete ADJ_PENDING[k]; ADJ_DIRTY=true;}
      close(); renderCrono();
    });
    document.getElementById('smApply').addEventListener('click',function(){
      var newLi=+loteSel.value, newTeam=+teamSel.value;
      var calWeek=Math.max(1,parseInt(startInp.value,10)||calStart);
      var projWeek=projWeekForCalWeek(calWeek);
      if(!projWeek){alert('Semana do ano inválida.');return;}
      if(!(QTY[newLi][si]>0)){alert('O lote "'+LOTS[newLi]+'" não tem quantidade cadastrada pra "'+s.n+'".');return;}
      var kOld=ovrKey(li,si), kNew=ovrKey(newLi,si);
      if(!kNew)return;
      var p=previewSeg(newLi,newTeam,projWeek);
      function finalize(){
        if(kOld&&kOld!==kNew){
          // Mesma lógica do arraste: se o lote de origem nunca teve ajuste manual, ele voltaria
          // pro rodízio padrão e podia cair de volta na mesma equipe por coincidência. Fixa
          // explicitamente a próxima equipe da rotação em vez de deixar ambíguo.
          delete OVR[kOld];
          if(s.eq>1)OVR[kOld]={team:(seg.team%s.eq)+1};
        }
        OVR[kNew]={pinned:true,pins:[{team:newTeam,startWeek:projWeek}]};
        ADJ_PENDING[kNew]=true; if(kOld)ADJ_PENDING[kOld]=true;
        ADJ_DIRTY=true;
        close(); renderCrono();
      }
      if(p.conflicts.length){
        openOverlapWarning(s.n,newTeam,p.conflicts,function(choice){
          if(choice==='cancel')return;
          if(choice==='push'){
            // Usa a duração calculada (que não muda com a posição) a partir da semana PEDIDA,
            // não da semana onde tinha ficado atrasado — senão sobra um vão ocioso sem necessidade.
            var pushTo=projWeek+p.result.dur;
            p.conflicts.forEach(function(c){ pinSegmentTeam(c.li,si,newTeam,pushTo); });
          }
          finalize();
        });
      } else { finalize(); }
    });
  }
  /** Prompt "Incluir ou Substituir" quando o arraste solta num lote que já tem outra equipe
   *  nesse mesmo serviço. Incluir divide o lote entre as equipes (continua calculado

  function openOverlapWarning(svcName,team,conflicts,onChoice){

      return '<li>'+LOTS[c.li]+' — S'+isoWeek(mondayOf(c.start))+' a S'+isoWeek(mondayOf(c.start+c.dur-1))+'</li>';

    document.getElementById('owPush').addEventListener('click',function(){ close(); onChoice('push'); });
  }
  function dragCleanup(){
    if(_drag&&_drag.el){_drag.el.style.opacity='';}
    if(_ghost){_ghost.remove();_ghost=null;}
    if(_drag&&_drag.hlRow)_drag.hlRow.classList.remove('tcm-droprow');
    if(_drag&&_drag.hlCol)_drag.hlCol.classList.remove('tcm-dropcol');
  }
  function wireDragMatrix(){
    // O cronograma não muda entre o clique (pointerdown) e o soltar (pointerup) dentro do
    // mesmo arraste — só depois, ao soltar de fato. Calcula uma vez por render e reaproveita
    // nos dois lugares, em vez de recalcular o cronograma inteiro a cada clique/soltar (ficava
    // lento/travava em obras com muitos lotes, já que o cálculo é recalculado do zero).
    var _wdmSegs=null;
    function wdmSchedule(){ if(!_wdmSegs)_wdmSegs=buildSchedule(); return _wdmSegs; }
    // Pointer events em vez de drag-and-drop nativo (mesmo motivo do seqrow — DnD nativo pode
    // simplesmente não iniciar em certos contextos, sem erro, deixando a coluna "presa").
    document.querySelectorAll('th[data-lotcol]').forEach(function(th){
      th.addEventListener('pointerdown',function(e){
        e.preventDefault();
        try{th.setPointerCapture(e.pointerId);}catch(err){}
        _colDrag={li:+th.getAttribute('data-lotcol'),el:th,overEl:null,lastX:e.clientX,lastY:e.clientY,rafPending:false};
        th.style.opacity='.5';
      });
      th.addEventListener('pointermove',function(e){
        if(!_colDrag||_colDrag.el!==th)return;
        _colDrag.lastX=e.clientX; _colDrag.lastY=e.clientY;
        if(_colDrag.rafPending)return;
        _colDrag.rafPending=true;
        requestAnimationFrame(function(){
          if(!_colDrag||_colDrag.el!==th)return;
          _colDrag.rafPending=false;
          var elAt=document.elementFromPoint(_colDrag.lastX,_colDrag.lastY);
          var over=elAt&&elAt.closest('th[data-lotcol]');
          if(_colDrag.overEl&&_colDrag.overEl!==over)_colDrag.overEl.style.outline='';
          if(over&&over!==th){ over.style.outline='2px dashed var(--accent)'; _colDrag.overEl=over; }
          else { _colDrag.overEl=null; }
        });
      });
      th.addEventListener('pointerup',function(e){
        if(!_colDrag||_colDrag.el!==th)return;
        try{th.releasePointerCapture(e.pointerId);}catch(err){}
        var d=_colDrag; _colDrag=null;
        th.style.opacity=''; if(d.overEl)d.overEl.style.outline='';
        if(d.overEl){ var target=+d.overEl.getAttribute('data-lotcol'); reorderLote(d.li,target,renderCrono); }
      });
      th.addEventListener('pointercancel',function(){
        if(!_colDrag||_colDrag.el!==th)return;
        th.style.opacity=''; if(_colDrag.overEl)_colDrag.overEl.style.outline='';
        _colDrag=null;
      });
    });
    document.querySelectorAll('.tcm-seg[data-li]').forEach(function(el){
      el.addEventListener('pointerdown',function(e){
        e.preventDefault();
        try{el.setPointerCapture(e.pointerId);}catch(err){}
        var li=+el.getAttribute('data-li'), si=+el.getAttribute('data-si');
        var seg=wdmSchedule().filter(function(sg){return sg.li===li&&sg.si===si;})[0];
        if(!seg)return;
        var r=el.getBoundingClientRect();
        _ghost=document.createElement('div');
        _ghost.className='tcm-seg';
        _ghost.style.cssText='position:fixed;pointer-events:none;z-index:999;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;'+
          'background:'+seg.color+';color:'+pickFont(seg.color)+';border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:left .1s,top .1s,width .1s,height .1s;';
        _ghost.textContent=el.textContent;
        document.body.appendChild(_ghost);
        el.style.opacity='0.25';
        _drag={li:li,si:si,startWeek:seg.start,currentStart:seg.start,currentLi:li,el:el,hlRow:null,hlCol:null};
      });
      el.addEventListener('pointermove',function(e){
        // pointermove dispara muitas vezes por segundo (bem mais que a tela redesenha) — cada
        // leitura de posição (elementFromPoint/getBoundingClientRect) força o navegador a
        // recalcular o layout na hora se alguma classe mudou desde a última leitura. Fazer isso
        // a cada evento, sem agrupar, deixa o arraste lento/travado numa matriz grande (muitos
        // lotes/semanas). Só guarda a posição mais recente aqui; o trabalho pesado roda no
        // máximo uma vez por frame (requestAnimationFrame), usando sempre a posição mais nova.
        if(!_drag||_drag.el!==el||!_ghost)return;
        _drag.lastX=e.clientX; _drag.lastY=e.clientY;
        if(_drag.rafPending)return;
        _drag.rafPending=true;
        requestAnimationFrame(function(){
          if(!_drag||_drag.el!==el||!_ghost)return;
          _drag.rafPending=false;
          var elAt=document.elementFromPoint(_drag.lastX,_drag.lastY);
          if(!elAt)return;
          var rowEl=elAt.closest('[data-week]'), lotEl=elAt.closest('[data-lot]');
          if(rowEl){var w=+rowEl.getAttribute('data-week'); if(w>0)_drag.currentStart=w;}
          if(lotEl){
            var li2=+lotEl.getAttribute('data-lot'); if(!isNaN(li2))_drag.currentLi=li2;
            var tr=lotEl.getBoundingClientRect();
            _ghost.style.left=tr.left+'px'; _ghost.style.top=tr.top+'px';
            _ghost.style.width=tr.width+'px'; _ghost.style.height=tr.height+'px';
          }
          if(_drag.hlRow&&_drag.hlRow!==rowEl)_drag.hlRow.classList.remove('tcm-droprow');
          if(rowEl){rowEl.classList.add('tcm-droprow'); _drag.hlRow=rowEl;}
          if(_drag.hlCol&&_drag.hlCol!==lotEl)_drag.hlCol.classList.remove('tcm-dropcol');
          if(lotEl){lotEl.classList.add('tcm-dropcol'); _drag.hlCol=lotEl;}
        });
      });
      el.addEventListener('pointerup',function(e){
        if(!_drag||_drag.el!==el)return;
        try{el.releasePointerCapture(e.pointerId);}catch(err){}
        var d=_drag; dragCleanup(); _drag=null;
        var si=d.si, sv=SERV[si];
        var noMove=(d.currentStart===d.startWeek&&d.currentLi===d.li);
        if(noMove){
          // Não arrastou (soltou onde pegou) — pode ser um clique simples (abre o menu de
          // personalizar) ou o primeiro dos dois cliques de um dblclick (reseta o ajuste, ver
          // abaixo). Espera um pouco pra ver se vem um segundo clique antes de abrir o menu.
          var liC=d.li, siC=si;
          if(_segClickEl===el&&(Date.now()-_segClickAt)<400){
            clearTimeout(_segClickTimer); _segClickTimer=null; _segClickEl=null;
          } else {
            _segClickEl=el; _segClickAt=Date.now();
            clearTimeout(_segClickTimer);
            _segClickTimer=setTimeout(function(){ _segClickEl=null; openSegMenu(liC,siC); },380);
          }
          return;
        }
        if(sv&&sv.cfg&&sv.cfg.pullFromQueue){
          // Fila dinâmica escolhe a equipe automaticamente (a que termina mais cedo) — um
          // ajuste manual aqui seria ignorado no cálculo, então nem tenta: avisa em vez de
          // mudar o OVR silenciosamente e o usuário achar que "não fez nada". Dá pra
          // personalizar um lote específico mesmo assim clicando nele (sem arrastar).
          alert('"'+sv.n+'" está com "fila dinâmica" ligada — a equipe de cada lote é escolhida automaticamente pelo cronograma (a que termina mais cedo), então arrastar não funciona. Clique (sem arrastar) no bloco pra personalizar só esse lote, ou desligue "Equipe livre pega o próximo lote vazio (fila dinâmica)" em Serviços pra mover livremente.');
          return;
        }
        var segs=wdmSchedule();
        var srcSeg=segs.filter(function(sg){return sg.li===d.li&&sg.si===si;})[0];
        if(!srcSeg)return;
        var destLi=d.currentLi, destWeek=d.currentStart;
        var destQty=(QTY[destLi]||[])[si]||0;
        if(!(destQty>0)){
          alert('O lote "'+LOTS[destLi]+'" não tem quantidade cadastrada pra "'+sv.n+'" — não dá pra mover a equipe pra lá.');
          return;
        }
        var others=segs.filter(function(sg){return sg.li===destLi&&sg.si===si&&sg.team!==srcSeg.team;});
        var otherTeams=[]; others.forEach(function(sg){ if(otherTeams.indexOf(sg.team)<0)otherTeams.push(sg.team); });
        function cleanupOrigin(kOrig){
          if(!kOrig)return;
          if(OVR[kOrig]&&Array.isArray(OVR[kOrig].pins)){
            OVR[kOrig].pins=OVR[kOrig].pins.filter(function(p){return p.team!==srcSeg.team;});
            if(!OVR[kOrig].pins.length)delete OVR[kOrig];
            return;
          }
          if(OVR[kOrig]&&Array.isArray(OVR[kOrig].teams)){
            OVR[kOrig].teams=OVR[kOrig].teams.filter(function(t){return t!==srcSeg.team;});
            if(!OVR[kOrig].teams.length)delete OVR[kOrig];
            return;
          }
          // Tira a equipe arrastada desse lote. Sem isso, se esse lote nunca teve ajuste manual
          // (seguia o rodízio padrão lote%equipes), ele continuaria caindo pra essa mesma equipe
          // de novo por coincidência — ela ficaria "roubada" em dois lugares por um efeito colateral,
          // não por uma decisão sua. Fixa explicitamente a próxima equipe da rotação nesse lote.
          delete OVR[kOrig];
          if(sv.eq>1)OVR[kOrig]={team:(srcSeg.team%sv.eq)+1};
        }
        // Testa a colocação ANTES de gravar de verdade: o motor agora divide sozinho a semana de
        // transição entre lotes vizinhos da mesma equipe (empurra pra depois quando não cabe) —
        // mas se a equipe pedida não conseguiu nem começar na semana que o usuário escolheu
        // porque já está comprometida em outro lote naquele período, avisa e deixa escolher:
        // "Empurrar" o lote que tava no caminho, ou "Cancelar" (nada é gravado). Isso é a única
        // coisa que o ajuste manual não sobrepõe — a impossibilidade física de produzir em dois
        // lugares ao mesmo tempo.
        function commitWithOverlapCheck(kOrig,kDst,newVal,team,requestedWeek){
          var hadDst=Object.prototype.hasOwnProperty.call(OVR,kDst), savedDst=OVR[kDst];
          var moveOrig=!!(kOrig&&kOrig!==kDst);
          var hadOrig=moveOrig&&Object.prototype.hasOwnProperty.call(OVR,kOrig);
          var savedOrig=hadOrig?JSON.parse(JSON.stringify(OVR[kOrig])):undefined;
          OVR[kDst]=newVal;
          // O teste tem que considerar que a equipe está SAINDO do lote de origem — senão ela
          // aparece "ocupada" lá e o app acusa conflito dela com ela mesma.
          if(moveOrig)cleanupOrigin(kOrig);
          var dryRun=buildSchedule();
          if(hadDst)OVR[kDst]=savedDst; else delete OVR[kDst];
          if(moveOrig){ if(hadOrig)OVR[kOrig]=savedOrig; else delete OVR[kOrig]; }
          var placed=dryRun.filter(function(sg){return sg.si===si&&sg.team===team&&sg.li===destLi;})[0];
          var conflicts=(placed&&placed.start>requestedWeek)?dryRun.filter(function(sg){
            return sg.si===si&&sg.team===team&&sg.li!==destLi&&(sg.start+sg.dur-1)>=requestedWeek&&sg.start<=placed.start;
          }):[];
          function finalize(){
            OVR[kDst]=newVal;
            if(kOrig&&kOrig!==kDst)cleanupOrigin(kOrig);
            ADJ_PENDING[kDst]=true; if(kOrig)ADJ_PENDING[kOrig]=true;
            ADJ_DIRTY=true; renderCrono();
          }
          if(conflicts.length){
            openOverlapWarning(sv.n,team,conflicts,function(choice){
              if(choice==='cancel')return;
              if(choice==='push'){
                // Usa a duração calculada (não muda com a posição) a partir da semana PEDIDA,
                // não de onde tinha ficado atrasado — senão sobra um vão ocioso sem necessidade.
                var pushTo=requestedWeek+placed.dur;
                conflicts.forEach(function(c){ pinSegmentTeam(c.li,si,team,pushTo); });
              }
              finalize();
            });
          } else { finalize(); }
        }
        function doMove(mode){
          // Fixa a equipe e a semana exata — essa é a decisão final do usuário, o cálculo
          // automático não move mais isso por causa de predecessora, fila da equipe ou fila
          // dinâmica. A duração continua sempre calculada de verdade (quantidade × produtividade
          // × praticabilidade daquela semana), só a posição no tempo é que fica travada.
          var kOrig=ovrKey(d.li,si), kDst=ovrKey(destLi,si);
          if(!kDst)return;
          if(mode==='replace'){
            commitWithOverlapCheck(kOrig,kDst,{pinned:true,pins:[{team:srcSeg.team,startWeek:destWeek}]},srcSeg.team,destWeek);
          } else if(mode==='include'){
            // A equipe que JÁ estava no lote não se mexe: mantém exatamente a semana de início
            // dela, num bloco só. Ela fica com tudo que já ia fazer sozinha até a semana
            // escolhida, mais a sua parte do que sobra dali em diante. A equipe arrastada entra
            // exatamente na semana escolhida, com a outra parte do que sobra.
            var totalQty=QTY[destLi][si], sumBefore=0, existing=[];
            otherTeams.forEach(function(t){
              var cur=others.filter(function(sg){return sg.team===t;})[0];
              if(!cur)return;
              var beforeQty=0;
              cur.wq.forEach(function(q,i){ if(cur.start+i<destWeek)beforeQty+=q; });
              existing.push({team:t,startWeek:cur.start,before:beforeQty});
              sumBefore+=beforeQty;
            });
            var remaining=Math.max(0,totalQty-sumBefore);
            var share=remaining/(existing.length+1);
            var pins=existing.map(function(e){ return {team:e.team,startWeek:e.startWeek,qty:e.before+share}; });
            pins.push({team:srcSeg.team,startWeek:destWeek,qty:share});
            commitWithOverlapCheck(kOrig,kDst,{pinned:true,pins:pins},srcSeg.team,destWeek);
          }
        }
        if(otherTeams.length){
          openMoveConflictMenu(sv.n,LOTS[destLi],otherTeams,doMove);
        } else {
          doMove('replace');
        }
      });
      el.addEventListener('pointercancel',function(){
        if(!_drag||_drag.el!==el)return;
        dragCleanup(); _drag=null;
      });
      el.addEventListener('dblclick',function(){
        clearTimeout(_segClickTimer); _segClickTimer=null; _segClickEl=null;
        var li=+el.getAttribute('data-li'), si=+el.getAttribute('data-si');
        var k=ovrKey(li,si); if(!k||!OVR[k])return;
        delete OVR[k]; delete ADJ_PENDING[k]; ADJ_DIRTY=true; renderCrono();
      });
    });
  }

  /* Quantas coisas estão carregando agora. É um contador, não um booleano: duas consultas em
   * paralelo não podem fazer a primeira a terminar apagar a barra da outra. */
  var CARGA=0;
  function cargaMais(){ CARGA++; document.body.classList.add('carregando'); }
  function cargaMenos(){ CARGA=Math.max(0,CARGA-1); if(!CARGA)document.body.classList.remove('carregando'); }
  /** Envolve uma promessa com a barra de carregamento, liberando mesmo se der erro. */
  async function comCarga(fn){ cargaMais(); try{ return await fn(); } finally{ cargaMenos(); } }
  function toast(msg){
    var t=document.getElementById('appToast');
    if(!t){t=document.createElement('div');t.id='appToast';t.className='apptoast';document.body.appendChild(t);}
    t.textContent=msg; t.classList.add('show');
    clearTimeout(window._toastT); window._toastT=setTimeout(function(){t.classList.remove('show');},2400);
  }

  /** Salva o cronograma em edição de volta no cenário carregado (não mexe no ajustes_manuais da obra). */
  /** Salva TUDO que está em edição (ajustes manuais, calendário, parâmetros de serviços) de
   *  volta no cenário carregado, num snapshot só — não mexe em nada da obra ao vivo. */
  async function saveIntoActiveCenario(){
    if(!ACTIVE_CENARIO||!selectedObra)return;
    try{
      var snap=captureLiveSnapshot();
      await sbUpdateCenario(ACTIVE_CENARIO.id,{ajustes_manuais:snap});
      var c=CENARIOS.filter(function(x){return x.id===ACTIVE_CENARIO.id;})[0];
      if(c)c.snap=snap;
      ADJ_DIRTY=false; ADJ_PENDING={}; SVC_DIRTY={}; CAL_DIRTY=false;
      toast('Alterações salvas no cenário "'+ACTIVE_CENARIO.nome+'".');
      go(current);
    }catch(e){ alert('Falha ao salvar no cenário: '+((e&&e.message)||e)); }

      // Fila dinâmica: a equipe de cada lote é escolhida automaticamente (a que termina mais
      // cedo) — a lista de "sequência por equipe" abaixo (baseada em round-robin) não bate com
      // isso e confunde. Mostra em vez disso a ordem REAL que o cronograma calculou, só leitura.
      var svcSelHtml0='<label style="font-size:12.5px;display:flex;align-items:center;gap:6px">Serviço: <select id="assignSvc">'+svcOpts+'</select></label>';
      var segsReal=buildSchedule().filter(function(sg){return sg.si===si;}).sort(function(a,b){return a.start-b.start;});
      var realRows=segsReal.map(function(sg){
        return '<div class="seqrow" style="cursor:default"><span class="seqname">'+LOTS[sg.li]+'</span>'+
          '<span class="note" style="margin-left:auto;white-space:nowrap">Equipe '+sg.team+' · S'+isoWeek(mondayOf(sg.start))+'–S'+isoWeek(mondayOf(sg.start+sg.dur-1))+'</span></div>';
      }).join('');
      p.innerHTML='<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">'+
        asgBtn('panel')+'<span class="lab">Lotes e sequência de execução por equipe</span>'+svcSelHtml0+'</div>'+
        (!OPEN.panel?'':'')+
        '<div class="banner" style="margin:10px 0">⚠ "'+s.n+'" está com <b>fila dinâmica</b> ligada — a equipe de cada lote é escolhida automaticamente pelo cronograma, então não dá pra fixar manualmente aqui (nem arrastando na matriz). Se quiser atribuir equipes na mão, desligue "Equipe livre pega o próximo lote vazio (fila dinâmica)" em Serviços. Abaixo, a ordem que o cronograma calculou de verdade (só consulta):</div>'+
        (!OPEN.panel?'':(realRows?'<div class="seqlist">'+realRows+'</div>':'<div class="note">Nenhum lote com quantidade pra este serviço ainda.</div>'));
      wireAssignToggles(p);
      var selFD=document.getElementById('assignSvc');
      if(selFD){selFD.value=si;selFD.addEventListener('change',function(){window._tcAssignSvc=+selFD.value;window._tcAssignTeam=1;renderAssignPanel();});}
      return;
    }
    var team=window._tcAssignTeam||1; if(team>s.eq)team=1;
    var teamOpts='';for(var t=1;t<=s.eq;t++)teamOpts+='<option value="'+t+'"'+(t===team?' selected':'')+'>Equipe '+t+'</option>';
    function lotTeams(li){
      var o=ovrGet(li,si);
      if(o&&Array.isArray(o.teams)&&o.teams.length)return o.teams.filter(function(t){return t>0&&t<=s.eq;});
      if(o&&o.team>0&&o.team<=s.eq)return [o.team];
      return [(li%s.eq)+1];
    }
    var chips=LOTS.map(function(l,li){
      if(QTY[li][si]<=0)return '';
      var curTeams=lotTeams(li);
      var mine=curTeams.indexOf(team)>=0;
      var others=curTeams.filter(function(t){return t!==team;});
      return '<label class="lotchip'+(mine?' on':' other')+'"><input type="checkbox" data-li="'+li+'"'+(mine?' checked':'')+'>'+l+(others.length?' <span style="font-size:10px">(+eq.'+others.join(', ')+')</span>':'')+'</label>';
    }).join('');
    var seqItems=[];
    LOTS.forEach(function(l,li){
      if(QTY[li][si]<=0)return;
      if(lotTeams(li).indexOf(team)<0)return;
      var o=ovrGet(li,si);
      seqItems.push({li:li,seq:(o&&o.seq!=null)?o.seq:li});
    });
    seqItems.sort(function(a,b){return a.seq-b.seq;});
    var seqRows=seqItems.map(function(item,idx){
      var others=lotTeams(item.li).filter(function(t){return t!==team;});
      return '<div class="seqrow" data-seqli="'+item.li+'"><span data-seqgrip style="opacity:.4;font-weight:700;cursor:grab;touch-action:none;padding:0 4px" title="Arraste pra reordenar">⋮</span><span class="seqnum">'+(idx+1)+'</span><span class="seqname">'+LOTS[item.li]+(others.length?' <span style="font-size:10px;color:var(--muted)">(dividido c/ eq.'+others.join(', ')+')</span>':'')+'</span>'+
        '<span class="seqbtns"><button class="iconbtn" data-squp="'+item.li+'" title="Executar antes"'+(idx===0?' disabled':'')+'>↑</button>'+
        '<button class="iconbtn" data-sqdn="'+item.li+'" title="Executar depois"'+(idx===seqItems.length-1?' disabled':'')+'>↓</button></span></div>';
    }).join('');
    var nChips=seqItems.length, nLotes=LOTS.filter(function(l,li){return QTY[li][si]>0;}).length;
    p.innerHTML='<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">'+
      asgBtn('panel')+'<span class="lab">Lotes e sequência de execução por equipe</span>'+
      '<label style="font-size:12.5px;display:flex;align-items:center;gap:6px">Serviço: <select id="assignSvc">'+svcOpts+'</select></label>'+
      '<label style="font-size:12.5px;display:flex;align-items:center;gap:6px">Equipe: <select id="assignTeam">'+teamOpts+'</select></label>'+
      (OPEN.panel?'':'<span class="note">recolhido · '+nChips+' lote(s) na Equipe '+team+'</span>')+'</div>'+
      (!OPEN.panel?'':
        '<div class="note" style="margin:8px 0 4px;display:flex;align-items:center;gap:6px">'+asgBtn('chips')+'Lotes desta equipe (marque/desmarque pra reatribuir — marque o mesmo lote em mais de uma equipe pra dividir ele entre elas)'+(OPEN.chips?':':' — '+nLotes+' lote(s)')+'</div>'+
        (OPEN.chips?'<div class="lotchips">'+chips+'</div>':'')+
        '<div class="note" style="margin:10px 0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+asgBtn('seq')+'Sequência de execução da Equipe '+team+' — do primeiro ao último lote (arraste ⋮ ou use as setas)'+(OPEN.seq?':':' — '+nChips+' lote(s)')+
          '<label style="display:flex;align-items:center;gap:5px;margin-left:auto;font-size:12px" title="Sem isso, quando o serviço está com &quot;sem paralisações&quot; ou fila dinâmica, o app reordena os lotes sozinho pra não deixar equipe parada"><input type="checkbox" data-cfgbool="seqManual" data-si="'+si+'"'+((s.cfg&&s.cfg.seqManual)?' checked':'')+'>Seguir esta sequência</label>'+
        '</div>'+
        (OPEN.seq?(seqItems.length?'<div class="seqlist">'+seqRows+'</div>':'<div class="note">Nenhum lote atribuído a esta equipe ainda.</div>'):''));
    wireAssignToggles(p);
    var sel=document.getElementById('assignSvc');
    if(sel){sel.value=si;sel.addEventListener('change',function(){window._tcAssignSvc=+sel.value;window._tcAssignTeam=1;renderAssignPanel();});}
    var selT=document.getElementById('assignTeam');
    if(selT)selT.addEventListener('change',function(){window._tcAssignTeam=+selT.value;renderAssignPanel();});
    function setLotTeams(li,teamsArr){
      var k=ovrKey(li,si); if(!k)return;
      if(teamsArr.length===0){
        if(OVR[k]){ delete OVR[k].team; delete OVR[k].teams; delete OVR[k].seq; if(Object.keys(OVR[k]).length===0)delete OVR[k]; }
      } else if(teamsArr.length===1){
        OVR[k]=Object.assign({},OVR[k],{team:teamsArr[0]}); delete OVR[k].teams;
      } else {
        OVR[k]=Object.assign({},OVR[k],{teams:teamsArr}); delete OVR[k].team;
      }
      ADJ_PENDING[k]=true;
    }
    p.querySelectorAll('[data-li]').forEach(function(cb){
      cb.addEventListener('change',function(){
        var li=+cb.getAttribute('data-li');
        var cur=lotTeams(li);
        var next=cb.checked?(cur.indexOf(team)>=0?cur:cur.concat([team])):cur.filter(function(t){return t!==team;});
        setLotTeams(li,next);
        ADJ_DIRTY=true;
        renderCrono();
      });
    });
    function moveSeq(li,dir){
      var idx=-1; seqItems.forEach(function(it,i){if(it.li===li)idx=i;});
      var swapIdx=idx+dir;
      if(idx<0||swapIdx<0||swapIdx>=seqItems.length)return;
      var tmp=seqItems[idx]; seqItems[idx]=seqItems[swapIdx]; seqItems[swapIdx]=tmp;
      seqItems.forEach(function(it,i){
        var k=ovrKey(it.li,si); if(!k)return;
        OVR[k]=Object.assign({},OVR[k],{seq:i});
        ADJ_PENDING[k]=true;
      });
      ADJ_DIRTY=true;
      renderCrono();
    }
    function reorderSeqTo(fromLi,toLi){
      if(fromLi==null||toLi==null||fromLi===toLi)return;
      var fromIdx=-1,toIdx=-1;
      seqItems.forEach(function(it,i){ if(it.li===fromLi)fromIdx=i; if(it.li===toLi)toIdx=i; });
      if(fromIdx<0||toIdx<0)return;
      var moved=seqItems.splice(fromIdx,1)[0];
      seqItems.splice(toIdx,0,moved);
      seqItems.forEach(function(it,i){
        var k=ovrKey(it.li,si); if(!k)return;
        OVR[k]=Object.assign({},OVR[k],{seq:i});
        ADJ_PENDING[k]=true;
      });
      ADJ_DIRTY=true;
      renderCrono();
    }
    // Arraste por pointer events (não drag-and-drop nativo do navegador) — mesmo mecanismo já
    // usado nos blocos da matriz Tempo-Caminho. O DnD nativo (draggable="true") depende do
    // navegador reconhecer o gesto de arrastar, e em alguns contextos (ex. touchpad, ou o
    // elemento estar dentro de containers com scroll/transform) ele simplesmente não inicia — o
    // item fica "parado" sem erro nenhum. Pointer events funcionam de forma confiável em
    // qualquer caso, porque o app controla o gesto inteiro (não depende do navegador iniciar
    // um drag nativo).
    p.querySelectorAll('.seqrow[data-seqli]').forEach(function(row){
      var grip=row.querySelector('[data-seqgrip]'); if(!grip)return;
      // Arraste só começa pelo ⋮ (grip), não na linha inteira — senão clicar nos botões ↑↓ (que
      // também ficam dentro da linha) dispararia um "arraste" em vez do clique normal.
      grip.addEventListener('pointerdown',function(e){
        e.preventDefault();
        try{grip.setPointerCapture(e.pointerId);}catch(err){}
        _seqDrag={li:+row.getAttribute('data-seqli'),el:grip,overEl:null,lastX:e.clientX,lastY:e.clientY,rafPending:false};
        row.style.opacity='.5';
      });
      grip.addEventListener('pointermove',function(e){
        if(!_seqDrag||_seqDrag.el!==grip)return;
        _seqDrag.lastX=e.clientX; _seqDrag.lastY=e.clientY;
        if(_seqDrag.rafPending)return;
        _seqDrag.rafPending=true;
        requestAnimationFrame(function(){
          if(!_seqDrag||_seqDrag.el!==grip)return;
          _seqDrag.rafPending=false;
          var elAt=document.elementFromPoint(_seqDrag.lastX,_seqDrag.lastY);
          var over=elAt&&elAt.closest('.seqrow[data-seqli]');
          if(_seqDrag.overEl&&_seqDrag.overEl!==over)_seqDrag.overEl.style.outline='';
          if(over&&over!==row){ over.style.outline='2px dashed var(--accent)'; _seqDrag.overEl=over; }
          else { _seqDrag.overEl=null; }
        });
      });
      grip.addEventListener('pointerup',function(e){
        if(!_seqDrag||_seqDrag.el!==grip)return;
        try{grip.releasePointerCapture(e.pointerId);}catch(err){}
        var d=_seqDrag; _seqDrag=null;
        row.style.opacity=''; if(d.overEl)d.overEl.style.outline='';
        if(d.overEl){ var target=+d.overEl.getAttribute('data-seqli'); reorderSeqTo(d.li,target); }
      });
      grip.addEventListener('pointercancel',function(){
        if(!_seqDrag||_seqDrag.el!==grip)return;
        row.style.opacity=''; if(_seqDrag.overEl)_seqDrag.overEl.style.outline='';
        _seqDrag=null;
      });
    });
    p.querySelectorAll('[data-squp]').forEach(function(b){b.addEventListener('click',function(){moveSeq(+b.getAttribute('data-squp'),-1);});});
    p.querySelectorAll('[data-sqdn]').forEach(function(b){b.addEventListener('click',function(){moveSeq(+b.getAttribute('data-sqdn'),1);});});
  }

    window._OBRAS=obras;

      .map(function(o,i){var cor=PALVARS[i%6];

          '<div class="stats" style="border-top:1px solid var(--line-2);padding-top:12px">'+
            '<div class="st"><div class="k">Início</div><div class="v small">'+(o.data_inicio||'—')+'</div></div>'+
            '<div class="st" style="margin-left:auto"><span class="obra-del" data-del="'+o.id+'" title="Excluir obra">✕</span></div>'+
          '</div></div></button>';
      }).join('');
    var podeCriar=await sbPodeCriarObra();

      '<div class="obra-new" style="cursor:default;opacity:.65;text-align:center;padding:18px"><div style="font-size:13px;font-weight:600;margin-bottom:4px">Criação de obra bloqueada</div><div class="note">'+
      (obras.length?'Você já criou a sua obra. Só o desenvolvedor pode criar outras — peça pra ele.':'Seu perfil não permite criar obras. Peça ao desenvolvedor pra liberar.')+'</div></div>';

  async function selectObra(id,initialView,silent){
    cargaMais();
    try{ return await selectObraInterno(id,initialView,silent); } finally{ cargaMenos(); }
  }
  async function selectObraInterno(id,initialView,silent){
    var o=(window._OBRAS||[]).find(function(x){return x.id===id;})||{id:id,nome:'Obra'};
    document.getElementById('obraSelName').textContent=o.nome||'Obra';
    OFFLINE_MODE=false; OFFLINE_EM='';
    try{ await sbLoadCadastro(id); }
    catch(e){
      var snap=null; try{ snap=await offlineLer(id); }catch(e2){}
      if(snap&&snap.dados){ aplicarCadastro(snap.dados); OFFLINE_MODE=true; OFFLINE_EM=snap.em||''; }
      else { if(!silent)alert('Falha ao carregar a obra: '+((e&&e.message)||e)); return; }
    }
    selectedObra={id:id,nome:o.nome}; CUR={id:id,nome:o.nome};
    // Perfil nesta obra. Sem linha em obra_membros (admin global) ou erro (migração 14 ainda
    // não rodada) → segue como planejador, igual era antes.
    MY_ROLE={papel:'planejador',permissoes:['*']};
    try{
      if(OFFLINE_MODE)throw new Error('offline');   // sem rede não dá pra conferir o perfil
      if(!IS_APP_ADMIN)IS_APP_ADMIN=await sbIsAppAdmin(); // entrou direto numa obra, sem passar pela lista
      var role=await sbLoadMyRole(id);
      // Desenvolvedor não é rebaixado pelo papel que tiver (ou não tiver) nesta obra.
      if(role&&role.papel&&!IS_APP_ADMIN)MY_ROLE={papel:role.papel,permissoes:Array.isArray(role.permissoes)?role.permissoes:[]};
    }
    catch(e){ console.warn('Perfil não carregado (rodou a migração 14?):',e&&e.message); }
    buildNav();
    loadLotView();
    document.getElementById('landing').classList.remove('show');
    try{ safeStore.setItem('lps-tripoloni-lastobra',id); }catch(e){}
    go(initialView&&CRUMB[initialView]?initialView:'torre');
    sbPresencaPing().then(presRefresh);
  }

    var nome=prompt('Nome da nova obra:','Nova obra'); if(nome===null)return;
    try{ var id=await sbCreateObra({nome:nome}); await selectObra(id); }

      alert('Falha ao criar obra: '+m);
    }
  }

  });

  // Login wiring
  var af=document.getElementById('authForm'); if(af)af.addEventListener('submit',function(e){e.preventDefault();doAuth('in');});
  var au=document.getElementById('authUp'); if(au)au.addEventListener('click',function(){doAuth('up');});
  document.querySelectorAll('.avatar').forEach(function(el){el.style.cursor='pointer';if(!el.title||el.title==='Conta')el.title='Sair da conta';el.addEventListener('click',function(){if(confirm('Sair da conta?'))signOut();});});

  // Boot: sessão
  /* ---------- Service worker ----------
   * Guarda o app (não os dados) pra abrir sem sinal e permite instalar na tela inicial.
   * Só roda em http/https — aberto direto do arquivo (file://) o navegador não aceita. */
  (function registraSW(){
    if(!('serviceWorker' in navigator))return;
    if(location.protocol!=='http:'&&location.protocol!=='https:')return;
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){
        var novo=reg.installing; if(!novo)return;
        novo.addEventListener('statechange',function(){
          // Só avisa quando JÁ existia uma versão rodando — na primeira visita não há o que atualizar.
          if(novo.state==='installed'&&navigator.serviceWorker.controller)mostrarAtualizacao(reg);
        });
      });
    }).catch(function(e){ console.warn('Service worker não registrado:',e&&e.message); });
    var recarregando=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(recarregando)return; recarregando=true; location.reload();
    });
  })();
  function mostrarAtualizacao(reg){
    var b=document.createElement('div');
    b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:200;display:flex;gap:10px;align-items:center;'+
      'background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:11px;padding:10px 14px;font-size:13px';
    b.innerHTML='Nova versão disponível. <button class="btn primary" style="padding:5px 11px">Atualizar</button>';
    b.querySelector('button').addEventListener('click',function(){
      if(reg.waiting)reg.waiting.postMessage('pular-espera'); else location.reload();
    });
    document.body.appendChild(b);
  }

  (async function boot(){
    if(!SB){ showAuth(); return; }
    try{ var s=await SB.auth.getSession(); if(s&&s.data&&s.data.session){ hideAuth(); await enterApp(); } else { showAuth(); } }
    catch(e){ showAuth(); }
  })();
})();
</script>

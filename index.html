  var HIST_FILTER='todos', HIST_SVC=null;
  var HIST_ORIGEM='todos'; // 'todos'|'direto'|'indireto' — filtro do gráfico por origem (serviço × apoio administrativo)
  // Classificação da mão de obra (característica da função, independente de onde está alocada):
  // 'todas'|'mod' (direta)|'moi' (indireta)|'sem' (função ainda sem classificação).
  var HIST_CLASSE='todas';   // mão de obra: todas|direto|indireto|terceirizado|sem
  // Equipamentos: qual PARCELA do realizado mostrar (o previsto é sempre o geral).
  var HIST_CLASSE_EQ='todos'; // todos (total) | proprio | terceiro
  /** Classificação de um recurso, por domínio:
   *   mão de obra  -> 'direto' | 'indireto' | 'terceirizado'
   *   equipamento  -> 'proprio' (Tripoloni) | 'terceiro' (locado)
   *  Entende o texto da categoria, da coluna TIPO do DP (MOD/MOI) e do Locador do CEQ. */
  function normClasse(v,tipo){
    var t=String(v==null?'':v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
    if(tipo==='equipamento')return ''; // equipamento não tem classe: próprio × terceiro vem do realizado
    if(/TERCEIR|^PJ$/.test(t))return 'terceirizado';
    if(/INDIRET|^MOI$/.test(t))return 'indireto';
    if(/DIRET|^MOD$/.test(t))return 'direto';
    return '';
  }
  function classeLabel(c){
    return c==='direto'?'Direto':(c==='indireto'?'Indireto':(c==='terceirizado'?'Terceirizada':'—'));
  }
  function classeCor(c){ return (c==='direto'||c==='proprio')?'var(--good)':(c?'var(--warn)':'var(--muted)'); }
  /** Opções de classificação disponíveis pra cada tipo de recurso. */
  function classeOpcoes(){ return [['','—'],['direto','Direto'],['indireto','Indireto'],['terceirizado','Terceirizada']]; }
  /** A classificação MOD/MOI é definida por CATEGORIA (a mesma já cadastrada em cada função):
   *  todas as funções de "Serventes" são MOD, todas de "Encarregados - Escritório" são MOI, etc.
   *  Guardamos em cada recurso (recursos.classe), mas quem manda é a categoria — mudar a
   *  categoria de uma função faz ela herdar a classificação da nova categoria. */
  function catKey(r){ return (r&&r.cat||'').trim(); }
  /** A categoria da obra já pode dizer tudo ("DIRETO"/"INDIRETO"): nesse caso a classificação sai
   *  direto dela, sem ninguém precisar escolher nada. Categorias com outro nome ("Serventes",
   *  "Encarregados - Escritório") usam a escolha guardada em recursos.classe. */
  function classeFromCat(cat,tipo){ return normClasse(cat,tipo||'funcao'); }
  function resClasse(r){ return (r&&r.classe)||classeFromCat(r&&r.cat,r&&r.tipo); }
  function classeOfCat(cat,tipo){
    cat=(cat||'').trim(); tipo=tipo||'funcao';
    var pelaCat=classeFromCat(cat,tipo); if(pelaCat)return pelaCat;
    var found='';
    RECURSOS.forEach(function(r){ if(r.tipo===tipo&&catKey(r)===cat&&r.classe&&!found)found=r.classe; });
    return found;
  }
  /** Categorias cadastradas de um tipo de recurso, na ordem em que aparecem. */
  function catsDoTipo(tipo){
    var seen={}, out=[];
    RECURSOS.forEach(function(r){ if(r.tipo!==tipo)return; var c=catKey(r); if(seen[c])return; seen[c]=1; out.push(c); });
    return out;
  }
  function setClasseCat(cat,classe,tipo){
    tipo=tipo||'funcao'; classe=normClasse(classe,tipo);
    var n=0;
    RECURSOS.forEach(function(r,ri){ if(r.tipo!==tipo||catKey(r)!==(cat||'').trim())return; if((r.classe||'')===(classe||''))return; r.classe=classe||''; REC_DIRTY[ri]=true; n++; });
    return n;

  /** O recurso passa pelos filtros de classificação (um pra mão de obra, outro pra equipamento)? */
  function passaClasse(r,cMO){
    if(r.tipo==='equipamento')return true; // equipamento é filtrado pela parcela do realizado, não pelo recurso
    if(!cMO||cMO==='todas')return true;
    return cMO==='sem'?!resClasse(r):resClasse(r)===cMO;
  }
  var HIST_OPEN={cadastro:false}; // o grupo "Cadastro histograma" começa recolhido — é configuração, não análise do dia a dia
  var REP_FROM=null, REP_TO=null, REP_TIPO='todos'; // relatório do período (semanas do projeto) e filtro de tipo
  // Mesmos recortes do gráfico: origem (serviços × apoio) e classificação da mão de obra.
  var REP_ORIGEM='todos', REP_CLASSE='todas', REP_CLASSE_EQ='todos';
  // Plano de mobilização: semana do previsto (alvo) × semana do realizado (situação atual).

  /** Aloca o realizado de cada recurso, por semana, proporcionalmente ao previsto de cada serviço que o utiliza naquela semana. */
  /** Previsto/realizado semanal por "linha" — uma por serviço (chave 's'+si) + uma linha única
   * pro Apoio Administrativo inteiro (chave 'apoio', somando todos os itens/funções/equipamentos
   * cadastrados — constante em todas as semanas do cronograma, já que não tem equipes próprias).
   * O realizado apontado por recurso é rateado entre TODAS as linhas que o usam naquela semana
   * (serviços e apoio juntos), proporcional ao previsto de cada uma. */
  function computeServicePR(hist,tipoFilter,classeMO,parteEQ){
    tipoFilter=tipoFilter||'todos'; classeMO=classeMO||'todas'; parteEQ=parteEQ||'todos';
    function resMatch(r){
      if(!r)return false;
      if(tipoFilter!=='todos'&&r.tipo!==tipoFilter)return false;
      return passaClasse(r,classeMO);
    }
    function crewMatch(item){
      if(tipoFilter==='todos'&&classeMO==='todas')return true;
      return resMatch(RECURSOS.filter(function(x){return x.id===item.resourceId;})[0]);
    }
    var atbw=activeTeamsByWeek(), tw=atbw.tw, teamsByService=atbw.teamsByService;
    var previsto={}, realizado={};
    // Abertura por recurso dentro de cada consumidor: previstoRes[key][resourceId][w] / realizadoRes[...]
    // (mesmos números da linha do serviço, só que sem somar os recursos — pra expandir a linha).
    var previstoRes={}, realizadoRes={};
    function zeros(){ var a=[]; for(var i=0;i<tw;i++)a.push(0); return a; }
    SERV.forEach(function(s,si){
      var arr=zeros(), key='s'+si;
      previsto[key]=arr; previstoRes[key]={}; realizadoRes[key]={};
      var crew=((s.cfg&&s.cfg.crew)||[]).filter(crewMatch), teams=teamsByService[si]||[];
      crew.forEach(function(item){
        var pr=previstoRes[key][item.resourceId]||(previstoRes[key][item.resourceId]=zeros());
        if(!realizadoRes[key][item.resourceId])realizadoRes[key][item.resourceId]=zeros();
        for(var w2=0;w2<tw;w2++){ var v=(teams[w2]||0)*(item.qtyPerTeam||0); arr[w2]+=v; pr[w2]+=v; }
      });
      realizado[key]=zeros();
    });
    var arrApoio=zeros(); previstoRes.apoio={}; realizadoRes.apoio={};
    APOIO.forEach(function(a){
      ((a.cfg&&a.cfg.crew)||[]).filter(crewMatch).forEach(function(item){
        var pr=previstoRes.apoio[item.resourceId]||(previstoRes.apoio[item.resourceId]=zeros());
        if(!realizadoRes.apoio[item.resourceId])realizadoRes.apoio[item.resourceId]=zeros();
        for(var w4=0;w4<tw;w4++){ arrApoio[w4]+=(item.qtyPerTeam||0); pr[w4]+=(item.qtyPerTeam||0); }
      });
    });
    previsto.apoio=arrApoio;
    realizado.apoio=zeros();
    // Realizado de recurso que não estava previsto em serviço nenhum (nem apoio) naquela semana:
    // não dá pra ratear, mas não pode sumir — vai pro balde "semprev" (recurso cadastrado e
    // mobilizado, mas fora da equipe típica / fora do período previsto).
    previsto.semprev=zeros(); realizado.semprev=zeros(); previstoRes.semprev={}; realizadoRes.semprev={};

    for(var w=1;w<=tw;w++){
      var d=calWeekDate(w).toISOString().slice(0,10);
      RECURSOS.forEach(function(r){
        if(!resMatch(r))return;
        var rv=realRec(r.id,d,r.tipo==='equipamento'?parteEQ:'todos'); if(!rv)return;
        var totalPrev=0, shares=[];
        SERV.forEach(function(s,si){
          var crew=((s.cfg&&s.cfg.crew)||[]).filter(crewMatch);
          var item=crew.filter(function(c){return c.resourceId===r.id;})[0];
          if(!item)return;
          var teams=(teamsByService[si]||[])[w-1]||0, p=teams*item.qtyPerTeam;
          if(p>0){shares.push({key:'s'+si,p:p}); totalPrev+=p;}
        });
        var apoioP=0;
        APOIO.forEach(function(a){
          var item=((a.cfg&&a.cfg.crew)||[]).filter(crewMatch).filter(function(c){return c.resourceId===r.id;})[0];
          if(item)apoioP+=item.qtyPerTeam||0;
        });
        if(apoioP>0){shares.push({key:'apoio',p:apoioP}); totalPrev+=apoioP;}
        if(totalPrev<=0){ realizado.semprev[w-1]+=rv; if(!realizadoRes.semprev[r.id]){realizadoRes.semprev[r.id]=zeros();previstoRes.semprev[r.id]=zeros();} realizadoRes.semprev[r.id][w-1]+=rv; return; }
        shares.forEach(function(x){ var v=rv*(x.p/totalPrev); realizado[x.key][w-1]+=v; if(realizadoRes[x.key][r.id])realizadoRes[x.key][r.id][w-1]+=v; });
      });
    }
    return {previsto:previsto,realizado:realizado,previstoRes:previstoRes,realizadoRes:realizadoRes,tw:tw};
  }
  /** Tabela de composição da equipe típica (Recurso · Tipo · Qtd por equipe · Total nas N equipes),

  /** Relatório do período (Histograma): previsto × realizado entre duas semanas do projeto,
   *  com IAH (Índice de Aderência do Histograma = realizado ÷ previsto), por semana, por
   *  função/equipamento e por serviço. Previsto vem do cronograma × equipe típica
   *  (computeHistogram); realizado por recurso vem dos apontamentos semanais (REALIZADO_REC) e
   *  o realizado por serviço é o rateio de computeServicePR. */
  function relatorioPeriodoData(hist){
    var tw=hist.tw||0; if(!tw)return null;
    var hoje=hojeCalWeek(tw)||1;
    var from=Math.min(tw,Math.max(1,REP_FROM||hoje)), to=Math.min(tw,Math.max(from,REP_TO||from));
    var recs=RECURSOS.filter(function(r){
      if(REP_TIPO!=='todos'&&r.tipo!==REP_TIPO)return false;
      return passaClasse(r,REP_CLASSE);
    });
    var weeks=[]; for(var w=from;w<=to;w++)weeks.push(w);
    var dateOf={}; weeks.forEach(function(w){ dateOf[w]=calWeekDate(w).toISOString().slice(0,10); });
    var prevW={}, realW={}; weeks.forEach(function(w){prevW[w]=0;realW[w]=0;});
    // Origem: "direto" = o que está na equipe típica dos serviços; "indireto" = Apoio
    // Administrativo. O realizado apontado por recurso não vem separado por origem, então é
    // rateado proporcional ao previsto de cada lado — mesma regra do gráfico do histograma.
    var porRecurso=recs.map(function(r){
      var p=0, rv=0, terc=0, aD=hist.byResourceDireto[r.id]||[], aI=hist.byResourceIndireto[r.id]||[];
      var parte=r.tipo==='equipamento'?REP_CLASSE_EQ:'todos';
      weeks.forEach(function(w){
        var pd=aD[w-1]||0, pi=aI[w-1]||0, rTot=realRec(r.id,dateOf[w],parte), pv, rr;
        terc+=realRec(r.id,dateOf[w],'terceiro');
        if(REP_ORIGEM==='direto'){ pv=pd; rr=(pd+pi>0)?rTot*(pd/(pd+pi)):0; }
        else if(REP_ORIGEM==='indireto'){ pv=pi; rr=(pd+pi>0)?rTot*(pi/(pd+pi)):0; }
        else { pv=pd+pi; rr=rTot; }
        p+=pv; rv+=rr; prevW[w]+=pv; realW[w]+=rr;
      });
      return {r:r,prev:p,real:rv,terc:terc};
    }).filter(function(x){return x.prev>0||x.real>0;});
    var spr=computeServicePR(hist,REP_TIPO,REP_CLASSE,REP_CLASSE_EQ);
    var porServico=(REP_ORIGEM==='indireto'?[]:SERV).map(function(s,si){

  /** Última semana com algum apontamento (a "situação atual" da obra). 0 se não houver. */
  function ultimaSemanaApontada(tw){
    var last=0;
    for(var w=1;w<=tw;w++){
      var d=calWeekDate(w).toISOString().slice(0,10);
      for(var i=0;i<RECURSOS.length;i++){ if((+REALIZADO_REC[RECURSOS[i].id+'::'+d]||0)>0){ last=w; break; } }
    }
    return last;

  /** Plano de mobilização: o que falta (ou sobra) pra sair do efetivo de hoje e chegar no
   *  previsto de uma semana escolhida. Respeita os mesmos filtros do relatório (tipo, origem
   *  e classificação da mão de obra). */
  function mobilizacaoData(hist){
    var tw=hist.tw||0; if(!tw)return null;
    var real=Math.min(tw,Math.max(1,REP_MOB_REAL||ultimaSemanaApontada(tw)||hojeCalWeek(tw)||1));
    var prev=Math.min(tw,Math.max(1,REP_MOB_PREV||Math.min(tw,real+1)));
    var dReal=calWeekDate(real).toISOString().slice(0,10);
    var recs=RECURSOS.filter(function(r){
      if(REP_TIPO!=='todos'&&r.tipo!==REP_TIPO)return false;
      return passaClasse(r,REP_CLASSE);
    });
    var linhas=recs.map(function(r){
      var aD=hist.byResourceDireto[r.id]||[], aI=hist.byResourceIndireto[r.id]||[];
      var pdP=aD[prev-1]||0, piP=aI[prev-1]||0, pdR=aD[real-1]||0, piR=aI[real-1]||0;
      var rTot=realRec(r.id,dReal,r.tipo==='equipamento'?REP_CLASSE_EQ:'todos'), p, rv;
      if(REP_ORIGEM==='direto'){ p=pdP; rv=(pdR+piR>0)?rTot*(pdR/(pdR+piR)):0; }
      else if(REP_ORIGEM==='indireto'){ p=piP; rv=(pdR+piR>0)?rTot*(piR/(pdR+piR)):0; }
      else { p=pdP+piP; rv=rTot; }
      return {r:r,prev:p,real:rv,dif:p-rv};
    }).filter(function(x){return x.prev>0||x.real>0;});
    var mob=0, desmob=0;
    linhas.forEach(function(x){ if(x.dif>0)mob+=x.dif; else desmob+=-x.dif; });
    return {tw:tw,semanaPrev:prev,semanaReal:real,linhas:linhas,mob:mob,desmob:desmob};
  }

  function scenarioStats(snap){
    var segs=scheduleWithSnapshot(snap), tw=0, peak=0;
    segs.forEach(function(sg){ tw=Math.max(tw,sg.start+sg.dur-1); });
    for(var w=1;w<=tw;w++){
      var teams=0;
      segs.forEach(function(sg){ if(w>=sg.start&&w<sg.start+sg.dur&&(sg.wq[w-sg.start]||0)>0)teams++; });
      peak=Math.max(peak,teams);
    }
    return {tw:tw,peak:peak};
  }

    var a=SERV[si], b=SERV[target];

    try{
      await sbUpdateServico(a.id,{ordem:target});
      await sbUpdateServico(b.id,{ordem:si});
      var tmp=SERV[si]; SERV[si]=SERV[target]; SERV[target]=tmp;

  /** Importa Apoio Administrativo — Nível 1/2 podem vir em células mescladas (só a primeira
   * linha do grupo preenchida) igual à planilha real da obra; a "desce" pras linhas seguintes
   * até aparecer o próximo valor. Não apaga nada — só cria o que ainda não existe (mesma
   * combinação exata de Nível 1+2+3 já cadastrada é ignorada, não duplica). */
  async function importApoioWorkbook(wb){
    if(!selectedObra){alert('Abra uma obra antes de importar.');return;}
    var ws=wb.Sheets['ApoioAdministrativo']||wb.Sheets['Apoio Administrativo']||wb.Sheets[wb.SheetNames[0]];
    if(!ws){alert('Planilha vazia.');return;}
    var aoa=sheetRows(ws);
    if(aoa.length<2){alert('Planilha vazia.');return;}
    if(!confirm('Importar essa planilha de Apoio Administrativo? Itens com Nível 1+2+3 idênticos a um já cadastrado são ignorados (não duplica); os demais são criados. Nada é apagado.'))return;
    var existing={}; APOIO.forEach(function(a){existing[(a.n1||'').trim().toLowerCase()+'::'+(a.n2||'').trim().toLowerCase()+'::'+(a.n3||'').trim().toLowerCase()]=true;});
    var rows=aoa.slice(1);
    var lastN1='', lastN2='', created=0;
    for(var i=0;i<rows.length;i++){
      var row=rows[i]; if(!row)continue;
      var n1=row[0]!=null?String(row[0]).trim():''; if(n1)lastN1=n1; else n1=lastN1;
      var n2=row[1]!=null?String(row[1]).trim():''; if(n2)lastN2=n2; else n2=lastN2;
      var n3=row[2]!=null?String(row[2]).trim():''; if(!n3)continue;
      var key=n1.toLowerCase()+'::'+n2.toLowerCase()+'::'+n3.toLowerCase();
      if(existing[key])continue;
      var id=await sbCreateApoio(selectedObra.id,{nivel1:n1,nivel2:n2||null,nivel3:n3,ordem:APOIO.length});
      APOIO.push({id:id,n1:n1,n2:n2,n3:n3,cfg:{}});
      existing[key]=true; created++;
    }
    go('cad-apoio');
    toast(created+' item(ns) importado(s).');
  }

    var segsAll=buildSchedule(); var tw=1; segsAll.forEach(function(s){tw=Math.max(tw,s.start+s.dur-1);});
    var segs=viewSegs(segsAll);
    var M=SERV.map(function(){var a=[];for(var i=0;i<=tw;i++)a.push(0);return a;});
    segs.forEach(function(sg){for(var i=0;i<sg.dur;i++){M[sg.si][sg.start+i]+=sg.wq[i];}});
    return {M:M,tw:tw};
  }
  function svcSpan(){var segs=viewSegs(buildSchedule());return SERV.map(function(s,si){var mn=1e9,mx=0;segs.forEach(function(g){if(g.si===si){mn=Math.min(mn,g.start);mx=Math.max(mx,g.start+g.dur-1);}});return mx>0?{s:mn,e:mx}:{s:0,e:0};});}

  function barLine(el,labels,real,prev,colHex,acc,weekStart){
    if(!el)return;
    // acc (opcional) = {prev:[],real:[]} acumulados, desenhados como linhas no eixo da direita.
    // weekStart (opcional) = nº da semana do projeto do 1º ponto: liga o eixo com todas as semanas + meses.
    var W=900,H=290,pl=52,pr=acc?60:14,pt=26,pb=weekStart?48:26,iw=W-pl-pr,ih=H-pt-pb,n=labels.length||1;
    var mx=Math.max(1,Math.max.apply(null,real.concat(prev)));
    var unit=mx>2000?1000:(mx>200?100:10),top=Math.max(unit,Math.ceil(mx/4/unit)*unit*4);
    var yy=function(v){return pt+ih-ih*v/top;}, gap=iw/n, bw=gap*0.5;
    var s='';
    for(var g=0;g<=4;g++){var val=top*g/4;s+='<line x1="'+pl+'" y1="'+yy(val)+'" x2="'+(W-pr)+'" y2="'+yy(val)+'" stroke="var(--line)"/><text class="axm" x="'+(pl-6)+'" y="'+(yy(val)+3)+'" text-anchor="end">'+fmtBR(val)+'</text>';}
    var passoB=labelStep(gap,7);
    for(var i=0;i<n;i++){var x=pl+gap*i+(gap-bw)/2,h=Math.max(0,yy(0)-yy(real[i]));
      s+='<rect x="'+x.toFixed(1)+'" y="'+yy(real[i]).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+colHex+'"><title>'+labels[i]+' · realizado '+fmtBR(real[i])+'</title></rect>';
      if(i%passoB===0)s+=barLabelSVG(x+bw/2,yy(real[i]),bw,real[i]);
      if(!weekStart)s+='<text class="axm" x="'+(x+bw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+labels[i]+'</text>';}
    if(weekStart){ var wn=[]; for(var k=0;k<n;k++)wn.push(weekStart+k); s+=weekAxisSVG(wn,function(i){return pl+gap*i+gap/2;},gap,pt+ih,pl,W-pr); }
    var d=prev.map(function(v,i){return (i?'L':'M')+(pl+gap*i+gap/2).toFixed(1)+' '+yy(v).toFixed(1);}).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="var(--ink-2)" stroke-width="2.5" stroke-dasharray="5 3"/>';
    prev.forEach(function(v,i){s+='<circle cx="'+(pl+gap*i+gap/2).toFixed(1)+'" cy="'+yy(v).toFixed(1)+'" r="3" fill="var(--ink-2)"><title>previsto '+fmtBR(v)+'</title></circle>';});
    if(acc)s+=accLinesSVG(acc,function(i){return pl+gap*i+gap/2;},W-pr,pt,ih,labels);
    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;
  }
  /** Rótulo de valor em cima da barra. Quando a barra é estreita (obra longa), o número sai
   *  na vertical e com fonte menor pra não encavalar; some de vez se nem assim couber. */
  /** De quantas em quantas barras dá pra rotular sem encavalar (pitch = distância entre elas). */
  function labelStep(pitch,fs){ return Math.max(1,Math.ceil((fs+1.5)/Math.max(0.1,pitch))); }
  function barLabelSVG(xCentro,yTopo,larguraBarra,valor){
    if(!(valor>0))return '';
    var txt=fmtBR(valor), rot=larguraBarra<txt.length*5.2;
    var fs=rot?(larguraBarra<5?5.5:6.5):Math.min(9,Math.max(6,larguraBarra/txt.length*1.6));
    if(rot&&larguraBarra<3.2)return '';
    if(rot)return '<text class="axm" font-size="'+fs+'" transform="translate('+(xCentro+fs*0.35).toFixed(1)+','+(yTopo-3).toFixed(1)+') rotate(-90)" text-anchor="start">'+txt+'</text>';
    return '<text class="axm" font-size="'+fs.toFixed(1)+'" x="'+xCentro.toFixed(1)+'" y="'+(yTopo-3).toFixed(1)+'" text-anchor="middle">'+txt+'</text>';
  }
  /** Eixo do tempo dos gráficos semanais: rótulo de TODAS as semanas (na vertical quando não cabem
   *  na horizontal) e, abaixo, uma faixa com os meses (mês da segunda-feira de cada semana).
   *  weekNums = nº da semana do projeto de cada ponto; xAt(i) = centro do ponto i; gap = largura
   *  de uma semana; yTop = base da área do gráfico; xl/xr = limites horizontais. Ocupa ~46 de altura. */
  function weekAxisSVG(weekNums,xAt,gap,yTop,xl,xr,dateFn){
    dateFn=dateFn||calWeekDate;
    var MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    var rot=gap<22, s='';
    weekNums.forEach(function(w,i){
      var lbl='S'+isoWeek(dateFn(w)), x=xAt(i);
      if(rot)s+='<text class="axm" font-size="'+(gap<12?7:8)+'" transform="translate('+(x+3).toFixed(1)+','+(yTop+4)+') rotate(90)" text-anchor="start">'+lbl+'</text>';
      else s+='<text class="axm" x="'+x.toFixed(1)+'" y="'+(yTop+12)+'" text-anchor="middle">'+lbl+'</text>';
    });
    var yBand=yTop+(rot?30:18);
    var groups=[];
    weekNums.forEach(function(w,i){
      var d=dateFn(w), k=d.getFullYear()*12+d.getMonth(), g=groups[groups.length-1];
      if(g&&g.k===k)g.to=i; else groups.push({k:k,from:i,to:i,m:d.getMonth(),y:d.getFullYear()});
    });
    s+='<line x1="'+xl+'" y1="'+yBand+'" x2="'+xr+'" y2="'+yBand+'" stroke="var(--line)"/>';
    groups.forEach(function(g,gi){
      var x0=xAt(g.from)-gap/2, x1=xAt(g.to)+gap/2, wpx=x1-x0;
      s+='<line x1="'+x0.toFixed(1)+'" y1="'+yBand+'" x2="'+x0.toFixed(1)+'" y2="'+(yBand+14)+'" stroke="var(--line)"/>';
      if(gi===groups.length-1)s+='<line x1="'+x1.toFixed(1)+'" y1="'+yBand+'" x2="'+x1.toFixed(1)+'" y2="'+(yBand+14)+'" stroke="var(--line)"/>';
      var full=MES[g.m]+'/'+String(g.y).slice(2);
      if(wpx>=20)s+='<text class="axm" font-size="8.5" font-weight="600" x="'+((x0+x1)/2).toFixed(1)+'" y="'+(yBand+11)+'" text-anchor="middle"><title>'+full+'</title>'+(wpx>=40?full:MES[g.m])+'</text>';
    });
    return s;
  }
  /** Linhas de acumulado (previsto tracejado, realizado cheio) com eixo próprio à direita —
   *  compartilhado pelo histograma e pelo relatório. xAt(i) = centro da semana i; xr = borda direita. */
  function accLinesSVG(acc,xAt,xr,pt,ih,labels){
    var aP=acc.prev||[], aR=acc.real||[], mx=1;
    aP.concat(aR).forEach(function(v){ mx=Math.max(mx,v||0); });
    var ya=function(v){return pt+ih-ih*v/mx;}, s='';
    for(var g=0;g<=4;g++){ var val=mx*g/4; s+='<text class="axm" x="'+(xr+6)+'" y="'+(ya(val)+3)+'" text-anchor="start">'+fmtBR(val)+'</text>'; }
    s+='<line x1="'+xr+'" y1="'+pt+'" x2="'+xr+'" y2="'+(pt+ih)+'" stroke="var(--line)"/>';
    function path(a){ return a.map(function(v,i){ return (i?'L':'M')+xAt(i).toFixed(1)+' '+ya(v||0).toFixed(1); }).join(' '); }
    if(aP.length)s+='<path d="'+path(aP)+'" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 4"/>';
    if(aR.length)s+='<path d="'+path(aR)+'" fill="none" stroke="var(--accent)" stroke-width="2.5"/>';
    aR.forEach(function(v,i){ s+='<circle cx="'+xAt(i).toFixed(1)+'" cy="'+ya(v||0).toFixed(1)+'" r="2.5" fill="var(--accent)"><title>'+(labels?labels[i]+' · ':'')+'acumulado realizado '+fmtBR(v||0)+' / previsto '+fmtBR(aP[i]||0)+'</title></circle>'; });
    return s;
  }
  function curveSVG(el,labels,prev,real,trend){
    if(!el)return;
    var W=660,H=280,pl=38,pr=14,pt=14,pb=28,iw=W-pl-pr,ih=H-pt-pb,n=labels.length||1;
    var xx=function(i){return pl+iw*i/Math.max(1,n-1);},yy=function(v){return pt+ih-ih*v/100;};
    var s='';
    for(var g=0;g<=100;g+=25){s+='<line x1="'+pl+'" y1="'+yy(g)+'" x2="'+(W-pr)+'" y2="'+yy(g)+'" stroke="var(--line)"/><text class="axm" x="'+(pl-6)+'" y="'+(yy(g)+3)+'" text-anchor="end">'+g+'</text>';}
    function path(a){var d='',st=false;for(var i=0;i<a.length;i++){if(a[i]==null)continue;d+=(st?'L':'M')+xx(i).toFixed(1)+' '+yy(a[i]).toFixed(1)+' ';st=true;}return d;}
    s+='<path d="'+path(prev)+'" fill="none" stroke="var(--c1)" stroke-width="2.5"/>';
    if(trend)s+='<path d="'+path(trend)+'" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 4"/>';
    s+='<path d="'+path(real)+'" fill="none" stroke="var(--accent)" stroke-width="3"/>';
    var st2=Math.ceil(n/10);
    for(var i=0;i<n;i++){if(i%st2===0)s+='<text class="axm" x="'+xx(i)+'" y="'+(H-8)+'" text-anchor="middle">'+labels[i]+'</text>';}
    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;
  }

  /* ---- Torre: desempenho por serviço + curva S ponderada ---- */
  function renderTorreDesempenho(){
    var svc=window._torreSvc==null?1:+window._torreSvc, per=window._torrePer||8;
    var wq=weeklyQtyBySvc(), end=Math.min(wq.tw,HOJE_W), start=Math.max(1,end-per+1);
    var labels=[],prev=[],real=[];
    for(var w=start;w<=end;w++){labels.push('S'+w);var pv=wq.M[svc][w]||0;prev.push(pv);real.push(Math.round(pv*(0.72+((w*7)%28)/100)));}
    barLine(document.getElementById('torreBar'),labels,real,prev,svcColor(SERV[svc]));
  }
  function svcCumFrac(){
    var wq=weeklyQtyBySvc(),tw=wq.tw;
    var frac=SERV.map(function(s,si){var tot=0;LOTS.forEach(function(l,li){tot+=QTY[li][si];});tot=tot||1;var a=[0],acc=0;for(var w=1;w<=tw;w++){acc+=wq.M[si][w]||0;a[w]=acc/tot;}return a;});
    return {frac:frac,tw:tw};
  }
  function curveWeights(wgt){
    if(wgt==='financeiro'){var s=0;window.PESO.forEach(function(p){s+=(+p||0);});return window.PESO.map(function(p){return (+p||0)/(s||1);});}
    if(wgt==='tempo'){var sp=svcSpan(),d=sp.map(function(x){return x.e>0?x.e-x.s+1:0;}),t=0;d.forEach(function(x){t+=x;});return d.map(function(x){return x/(t||1);});}
    var tq=SERV.map(function(s,si){var t=0;LOTS.forEach(function(l,li){t+=QTY[li][si];});return t;}),g=0;tq.forEach(function(x){g+=x;});return tq.map(function(x){return x/(g||1);});
  }
  function renderTorreCurva(){
    var wgt=window._torreW||'financeiro', sc=window._torreScope==null?-1:+window._torreScope;
    var cf=svcCumFrac(),w=curveWeights(wgt),labels=[],prev=[],real=[];
    for(var t=1;t<=cf.tw;t++){var p=0;if(sc<0){SERV.forEach(function(s,si){p+=w[si]*(cf.frac[si][t]||0);});}else{p=cf.frac[sc][t]||0;}
      labels.push('S'+t);prev.push(Math.min(100,p*100));real.push(t<=HOJE_W?Math.min(100,p*100*0.93):null);}
    curveSVG(document.getElementById('torreCurva'),labels,prev,real,null);
  }

    cancelada :{lab:'Cancelada',           cor:'#9ca3af'}
  };
  var MP_SIT_ORDEM=['rem_prazo','rem_atraso','atrasada','no_prazo','sem_data','cancelada'];
  /** A data que decide tudo é a de IMPACTO — quando a restrição passa a atrapalhar a obra.
   *  A previsão de remoção é o plano de quem vai resolver e pode ser revisada; adiar o plano
   *  não muda o fato de a obra ser impactada na mesma data, então não mexe no IRR. */
  function mpLimite(r){ return r.data_impacto||r.data_prazo||''; }
  function mpSit(r){
    if(r.status==='cancelada')return 'cancelada';
    var lim=mpLimite(r);
    if(r.status==='removida')return (r.data_conclusao&&lim&&r.data_conclusao>lim)?'rem_atraso':'rem_prazo';
    if(!lim)return 'sem_data';
    return (lim<todayISO())?'atrasada':'no_prazo';
  }
  function mpDias(a,b){ if(!a||!b)return null; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
  function mpAtraso(r){
    var s=mpSit(r), lim=mpLimite(r);
    if(s==='atrasada')return mpDias(lim,todayISO());
    if(s==='rem_atraso')return mpDias(lim,r.data_conclusao);
    return 0;
  }
  function mpLoteNome(id){ var i=(window._LOTIDS||[]).indexOf(id); return i>=0?LOTS[i]:''; }
  function mpServNome(id){ var s=SERV.filter(function(x){return x.id===id;})[0]; return s?s.n:''; }
  function mpProxCodigo(){
    var max=0;
    MP.forEach(function(r){ var m=/(\d+)\s*$/.exec(r.codigo||''); if(m)max=Math.max(max,+m[1]); });
    var n=String(max+1); while(n.length<3)n='0'+n;
    return 'R-'+n;
  }
  async function mpCarregar(){
    if(!selectedObra||MP_CARREGANDO)return;
    MP_CARREGANDO=true; MP_ERRO=''; cargaMais();
    try{ MP=await sbMPListar(selectedObra.id); }
    catch(e){ MP_ERRO=(e&&e.message)||String(e); MP=[]; }
    finally{ cargaMenos(); }
    MP_LIDO=true; MP_CARREGANDO=false;
    if(current==='lp-medio')renderMedio();
  }

  /** Indicadores de um conjunto de restrições.
   *  IRR = removidas no prazo ÷ tudo que já venceu (removidas + atrasadas em aberto). Canceladas
   *  ficam fora dos dois lados, e o que ainda está dentro do prazo também — senão o índice cairia
   *  só por existir restrição nova, que ainda nem deveria ter sido removida.
   *  TMD = média de dias entre identificar e o prazo ORIGINAL (o tempo que se tinha pra remover).
   *  TMR = média de dias entre identificar e remover de fato. */
  function mpIndicadores(lista){
    var c={}; MP_SIT_ORDEM.forEach(function(k){c[k]=0;});
    lista.forEach(function(r){ c[mpSit(r)]++; });
    var venc=c.rem_prazo+c.rem_atraso+c.atrasada;
    var tmdS=0,tmdN=0,tmrS=0,tmrN=0;
    lista.forEach(function(r){
      var base=mpLimite(r);
      if(base&&r.data_identificacao){ var d=mpDias(r.data_identificacao,base); if(d!=null&&d>=0){tmdS+=d;tmdN++;} }
      if(r.status==='removida'&&r.data_conclusao&&r.data_identificacao){ var d2=mpDias(r.data_identificacao,r.data_conclusao); if(d2!=null&&d2>=0){tmrS+=d2;tmrN++;} }
    });
    return {c:c,total:lista.length,venc:venc,irr:venc?Math.round(100*c.rem_prazo/venc):null,
      tmd:tmdN?tmdS/tmdN:null,tmr:tmrN?tmrS/tmrN:null,tmdN:tmdN,tmrN:tmrN};
  }
  function mpNoPeriodo(){
    return MP.filter(function(r){
      if(MP_DASH.ini&&(r.data_identificacao||'')<MP_DASH.ini)return false;
      if(MP_DASH.fim&&(r.data_identificacao||'')>MP_DASH.fim)return false;
      return true;
    });
  }
  function mpFiltrada(){
    var q=(MP_F.q||'').toLowerCase();
    return MP.filter(function(r){
      if(MP_F.sit!=='todas'&&mpSit(r)!==MP_F.sit)return false;
      if(MP_F.cat&&r.categoria!==MP_F.cat)return false;
      if(MP_F.setor&&(r.setor||'')!==MP_F.setor)return false;
      if(MP_F.resp&&(r.responsavel||'')!==MP_F.resp)return false;
      if(q&&((r.descricao||'')+' '+(r.codigo||'')).toLowerCase().indexOf(q)<0)return false;
      return true;
    });
  }
  /* ---------- Agrupamento por período ---------- */
  var MP_MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  function mpPer(iso,modo){
    if(!iso)return null;
    var d=new Date(iso+'T00:00:00'); if(isNaN(d))return null;
    if(modo==='mes')return {k:d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2),
                            lab:MP_MESES[d.getMonth()]+'/'+String(d.getFullYear()).slice(-2)};
    var sem=isoWeek(d);
    return {k:d.getFullYear()+'-W'+('0'+sem).slice(-2), lab:'S'+sem};
  }
  /** Eixo de períodos presente nos dados, do mais antigo pro mais novo, limitado aos últimos n. */
  function mpEixo(mapa,n){
    var ks=Object.keys(mapa).sort();
    return ks.slice(-(n||24));
  }

  /** Restrições por semana/mês: barras empilhadas por situação (na data de impacto) e a linha
   *  de identificadas (na data em que apareceram) — a leitura do Excel da obra. */
  function mpPorPeriodoHTML(lista,modo){
    var g={};
    function slot(k,lab){ return g[k]||(g[k]={lab:lab,ident:0,c:{}}); }
    lista.forEach(function(r){
      var pi=mpPer(mpLimite(r),modo);
      if(pi){ var s=slot(pi.k,pi.lab); var sit=mpSit(r); s.c[sit]=(s.c[sit]||0)+1; }
      var pd=mpPer(r.data_identificacao,modo);
      if(pd)slot(pd.k,pd.lab).ident++;
    });
    var ks=mpEixo(g,modo==='mes'?18:24);
    if(!ks.length)return '<div class="note">Sem dados no período.</div>';
    var maxV=1;
    ks.forEach(function(k){
      var t=0; MP_SIT_ORDEM.forEach(function(s){ t+=g[k].c[s]||0; });
      maxV=Math.max(maxV,t,g[k].ident);
    });
    var W=Math.max(300,ks.length*27), H=190, base=H-26, topo=14, passo=W/ks.length;
    var bw=Math.min(17,passo*0.6);
    var y=function(v){ return base-(base-topo)*v/maxV; };
    var barras='', pts=[];
    ks.forEach(function(k,i){
      var x=(i+0.5)*passo, acc=0;
      MP_SIT_ORDEM.forEach(function(s){
        var v=g[k].c[s]||0; if(!v)return;
        var y1=y(acc+v), y2=y(acc);
        barras+='<rect x="'+(x-bw/2)+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(1,y2-y1)+'" fill="'+MP_SITS[s].cor+'"><title>'+g[k].lab+' · '+MP_SITS[s].lab+': '+v+'</title></rect>';
        acc+=v;
      });
      if(acc)barras+='<text x="'+x+'" y="'+(y(acc)-4)+'" text-anchor="middle" font-size="9" fill="var(--ink-2)">'+acc+'</text>';
      pts.push([x,y(g[k].ident),g[k].ident,g[k].lab]);
      barras+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+g[k].lab+'</text>';
    });
    var linha='<polyline points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>'+
      pts.map(function(p){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="var(--ink)"><title>'+p[3]+': '+p[2]+' identificadas</title></circle>'; }).join('');
    var leg=MP_SIT_ORDEM.map(function(s){
      return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)"><span style="width:10px;height:10px;border-radius:3px;background:'+MP_SITS[s].cor+'"></span>'+MP_SITS[s].lab+'</span>';
    }).join('')+'<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)"><span style="width:14px;height:2px;background:var(--ink)"></span>Identificadas</span>';
    return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+W+'px;height:'+H+'px;display:block">'+
      '<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)"/>'+barras+linha+'</svg></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px">'+leg+'</div>';
  }

  /** Evolução do TMD e do TMR: barras de identificadas no período e as duas médias em dias. */
  function mpEvolucaoHTML(lista,modo){
    var g={};
    lista.forEach(function(r){
      var p=mpPer(r.data_identificacao,modo); if(!p)return;
      var s=g[p.k]||(g[p.k]={lab:p.lab,n:0,tmdS:0,tmdN:0,tmrS:0,tmrN:0});
      s.n++;
      var d=mpDias(r.data_identificacao,mpLimite(r)); if(d!=null&&d>=0){ s.tmdS+=d; s.tmdN++; }
      if(r.status==='removida'){ var d2=mpDias(r.data_identificacao,r.data_conclusao); if(d2!=null&&d2>=0){ s.tmrS+=d2; s.tmrN++; } }
    });
    var ks=mpEixo(g,modo==='mes'?18:24);
    if(!ks.length)return '<div class="note">Sem dados no período.</div>';
    var maxN=1,maxD=1;
    ks.forEach(function(k){ var s=g[k];
      maxN=Math.max(maxN,s.n);
      if(s.tmdN)maxD=Math.max(maxD,s.tmdS/s.tmdN);
      if(s.tmrN)maxD=Math.max(maxD,s.tmrS/s.tmrN);
    });
    var W=Math.max(300,ks.length*27), H=190, base=H-26, topo=16, passo=W/ks.length;
    var bw=Math.min(16,passo*0.55);
    var yN=function(v){ return base-(base-topo)*v/maxN; };
    var yD=function(v){ return base-(base-topo)*v/maxD; };
    var barras='', ptsD=[], ptsR=[];
    ks.forEach(function(k,i){
      var s=g[k], x=(i+0.5)*passo;
      barras+='<rect x="'+(x-bw/2)+'" y="'+yN(s.n)+'" width="'+bw+'" height="'+Math.max(1,base-yN(s.n))+'" rx="2" fill="var(--accent)" opacity=".30"><title>'+s.lab+': '+s.n+' identificadas</title></rect>'+
        '<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+s.lab+'</text>';
      if(s.tmdN)ptsD.push([x,yD(s.tmdS/s.tmdN),(s.tmdS/s.tmdN)]);
      if(s.tmrN)ptsR.push([x,yD(s.tmrS/s.tmrN),(s.tmrS/s.tmrN)]);
    });
    var linha=function(pts,cor,nome){
      if(!pts.length)return '';
      return '<polyline points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'" fill="none" stroke="'+cor+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
        pts.map(function(p){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.8" fill="'+cor+'"><title>'+nome+': '+p[2].toFixed(1)+' dias</title></circle>'; }).join('');
    };
    var leg='<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)"><span style="width:10px;height:10px;border-radius:3px;background:var(--accent);opacity:.4"></span>Identificadas</span>'+
      '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)"><span style="width:14px;height:2px;background:#3b82f6"></span>TMD (dias disponíveis)</span>'+
      '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2)"><span style="width:14px;height:2px;background:#22c55e"></span>TMR (dias até remover)</span>';
    return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+W+'px;height:'+H+'px;display:block">'+
      '<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)"/>'+barras+
      linha(ptsD,'#3b82f6','TMD')+linha(ptsR,'#22c55e','TMR')+
      '<text x="2" y="'+(topo-5)+'" font-size="9" fill="var(--muted)">máx '+Math.round(maxD)+' d · '+maxN+' restrições</text></svg></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px">'+leg+'</div>';
  }

  /** Barra empilhada de situação — mais legível que a rosca do Excel na largura de uma tela. */
  function mpBarraSit(c,total){
    if(!total)return '<div class="note">Sem restrições no período.</div>';
    var segs=MP_SIT_ORDEM.filter(function(k){return c[k]>0;}).map(function(k){
      return '<div title="'+MP_SITS[k].lab+': '+c[k]+'" style="width:'+(100*c[k]/total)+'%;background:'+MP_SITS[k].cor+'"></div>';
    }).join('');
    var leg=MP_SIT_ORDEM.map(function(k){
      return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)">'+
        '<span style="width:10px;height:10px;border-radius:3px;background:'+MP_SITS[k].cor+(c[k]?'':';opacity:.3')+'"></span>'+
        MP_SITS[k].lab+' <b class="mono">'+c[k]+'</b></span>';
    }).join('');
    return '<div style="display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--elev)">'+segs+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px">'+leg+'</div>';
  }
  /** Quebra por um campo (categoria, setor, responsável): barra empilhada por linha + IRR. */
  function mpQuebra(lista,chave,rotulo){
    var grupos={};
    lista.forEach(function(r){
      var k=(chave==='categoria'?catMeta(r.categoria).label:(r[chave]||'(não informado)'));
      (grupos[k]||(grupos[k]=[])).push(r);
    });
    var nomes=Object.keys(grupos).sort(function(a,b){return grupos[b].length-grupos[a].length;});
    if(!nomes.length)return '';
    var maxN=nomes.reduce(function(m,k){return Math.max(m,grupos[k].length);},0);
    var linhas=nomes.map(function(k){
      var ind=mpIndicadores(grupos[k]), n=grupos[k].length;
      var segs=MP_SIT_ORDEM.filter(function(s){return ind.c[s]>0;}).map(function(s){
        return '<div title="'+MP_SITS[s].lab+': '+ind.c[s]+'" style="width:'+(100*ind.c[s]/n)+'%;background:'+MP_SITS[s].cor+'"></div>';
      }).join('');
      return '<div class="mpq"><div class="mpq-l" title="'+escAttr(k)+'">'+escAttr(k)+'</div>'+
        '<div class="mpq-b"><div style="display:flex;height:100%;width:'+Math.max(4,100*n/maxN)+'%;border-radius:3px;overflow:hidden">'+segs+'</div></div>'+
        '<div class="mpq-n mono">'+n+'</div>'+
        '<div class="mpq-i mono">'+(ind.irr==null?'—':ind.irr+'%')+'</div></div>';
    }).join('');
    return '<div class="card"><div class="eyebrow">IRR e situação por '+rotulo+'</div>'+
      '<div class="mpq mpq-head"><div class="mpq-l">'+rotulo+'</div><div class="mpq-b"></div><div class="mpq-n">Nº</div><div class="mpq-i">IRR</div></div>'+
      linhas+'</div>';
  }
  /** IRR por semana do prazo: quanto do que vencia naquela semana saiu no prazo. */
  function mpIrrSemanaHTML(lista){
    var porSem={};
    lista.forEach(function(r){
      var s=mpSit(r); if(s!=='rem_prazo'&&s!=='rem_atraso'&&s!=='atrasada')return;
      var lim=mpLimite(r); if(!lim)return;
      var d=new Date(lim+'T00:00:00'), k=d.getFullYear()+'-'+('0'+isoWeek(d)).slice(-2);
      var g=porSem[k]||(porSem[k]={lab:'S'+isoWeek(d),prazo:0,tot:0});
      g.tot++; if(s==='rem_prazo')g.prazo++;
    });
    var ks=Object.keys(porSem).sort(); if(!ks.length)return '<div class="note">Nenhuma restrição com prazo já vencido no período.</div>';
    ks=ks.slice(-20);
    var W=Math.max(320,ks.length*34), H=150, base=H-22, topo=10;
    var faixas='<rect x="0" y="'+topo+'" width="'+W+'" height="'+((base-topo)*0.4)+'" fill="#22c55e" opacity=".10"/>'+
      '<rect x="0" y="'+(topo+(base-topo)*0.4)+'" width="'+W+'" height="'+((base-topo)*0.2)+'" fill="#eab308" opacity=".12"/>'+
      '<rect x="0" y="'+(topo+(base-topo)*0.6)+'" width="'+W+'" height="'+((base-topo)*0.4)+'" fill="#ef4444" opacity=".10"/>';
    var bw=Math.min(26,(W/ks.length)*0.62);
    var barras=ks.map(function(k,i){
      var g=porSem[k], pct=g.tot?Math.round(100*g.prazo/g.tot):0;
      var x=(i+0.5)*(W/ks.length), h=(base-topo)*pct/100;
      var cor=pct>=60?'#22c55e':(pct>=40?'#eab308':'#ef4444');
      return '<rect x="'+(x-bw/2)+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" rx="2" fill="'+cor+'"><title>'+g.lab+': '+g.prazo+' de '+g.tot+' no prazo</title></rect>'+
        '<text x="'+x+'" y="'+(base-h-3)+'" text-anchor="middle" font-size="9" fill="var(--ink-2)">'+pct+'%</text>'+
        '<text x="'+x+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+g.lab+'</text>';
    }).join('');
    return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:'+W+'px;height:'+H+'px;display:block">'+
      faixas+'<line x1="0" y1="'+base+'" x2="'+W+'" y2="'+base+'" stroke="var(--line)"/>'+barras+'</svg></div>'+
      '<div class="note" style="margin-top:6px">Semana em que a restrição deveria estar removida. Verde ≥ 60%, amarelo 40–60%, vermelho &lt; 40%.</div>';
  }

  /* ---------- Importar a planilha de restrições que a obra já acompanha ----------
   * Formato esperado (uma linha por restrição, cabeçalho em qualquer uma das 10 primeiras linhas):
   *   ID · Data Identificada · Pacote de Trabalho · Ação · Setor/Equipe · Responsável ·
   *   Categoria · Data Limite · Data Remoção · Status · Local · Restrição/Comentários
   * Nomes de coluna são procurados por aproximação, então variações pequenas passam.
   *
   * Quem manda são as DATAS, não o rótulo da coluna Status: "Concluída no Prazo" com remoção
   * depois do limite entra como removida com atraso, e a divergência aparece no resumo. O Status
   * só decide se a restrição está removida, cancelada, em andamento ou em aberto. */
  function mpNorm(v){ return String(v==null?'':v).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim(); }
  function mpCatImport(txt){
    var t=mpNorm(txt);
    if(!t)return 'outro';
    if(/MAO DE OBRA|EFETIVO/.test(t))return 'mao_de_obra';
    if(/EQUIPAMENT/.test(t))return 'equipamento';
    if(/MATERIAL|INSUMO/.test(t))return 'material';
    if(/PROJETO/.test(t))return 'projeto';
    if(/DOCUMENT/.test(t))return 'documento';
    if(/MEDICAO/.test(t))return 'medicao';
    if(/SSMA|SEGURANCA|SAUDE/.test(t))return 'ssma';
    if(/ACESSO/.test(t))return 'acesso';
    if(/INTERFEREN/.test(t))return 'interferencia';
    if(/EXTERNO|TERCEIRO/.test(t))return 'externo';
    if(/CLIENTE/.test(t))return 'cliente';
    return 'outro';
  }
  function mpStatusImport(txt){
    var t=mpNorm(txt);
    if(/CANCEL/.test(t))return 'cancelada';
    if(/CONCLU|REMOVID|RESOLVID/.test(t))return 'removida';
    if(/ANDAMENTO|TRATATIV|EXECUCAO/.test(t))return 'em_tratativa';
    return 'aberta';
  }
  function mpAchaCol(hrow,regexes){
    for(var j=0;j<regexes.length;j++)
      for(var i=0;i<hrow.length;i++)
        if(regexes[j].test(hrow[i]))return i;
    return -1;
  }
  async function sbMPCriarVarios(obraId,lista){
    for(var i=0;i<lista.length;i+=100){
      var lote=lista.slice(i,i+100).map(function(p){ return Object.assign({id:newUuid(),obra_id:obraId},p); });
      var r=await SB.from('restricoes').insert(lote);
      if(r.error)throw r.error;
    }
  }
  function mpImportarArquivo(){
    if(!selectedObra){ alert('Abra uma obra antes de importar.'); return; }
    if(isReadOnly()){ alert('Seu perfil é só de visualização.'); return; }
    pickExcelFile(function(file){
      readWorkbookFile(file).then(importarRestricoesWorkbook).catch(function(e){
        alert('Não consegui ler o arquivo: '+((e&&e.message)||e));
      });
    });
  }
  async function importarRestricoesWorkbook(wb){
    var nomes=wb.SheetNames, aoa=null, hdr=-1, hrow=null;
    for(var n=0;n<nomes.length&&hdr<0;n++){
      var linhas=sheetRows(wb.Sheets[nomes[n]]);
      for(var i=0;i<Math.min(linhas.length,10);i++){
        var h=(linhas[i]||[]).map(mpNorm);
        if(mpAchaCol(h,[/^ACAO$/,/RESTRICAO/,/^DESCRICAO$/])>=0 && mpAchaCol(h,[/DATA IDENTIFIC/,/^IDENTIFICADA$/,/^DATA$/])>=0){ aoa=linhas; hdr=i; hrow=h; break; }
      }
    }
    if(hdr<0){ alert('Não achei o cabeçalho da planilha.\n\nPreciso de uma aba com as colunas Ação (ou Restrição) e Data Identificada.'); return; }
    var col={
      id:      mpAchaCol(hrow,[/^ID$/,/^ITEM$/,/^N\.?$/]),
      ident:   mpAchaCol(hrow,[/DATA IDENTIFIC/,/^IDENTIFICADA$/,/^DATA$/]),
      pacote:  mpAchaCol(hrow,[/PACOTE/,/FRENTE/]),
      acao:    mpAchaCol(hrow,[/^ACAO$/,/^ACAO /,/RESTRICAO$/,/^DESCRICAO$/]),
      setor:   mpAchaCol(hrow,[/SETOR/,/EQUIPE/]),
      resp:    mpAchaCol(hrow,[/RESPONSAVEL/]),
      cat:     mpAchaCol(hrow,[/CATEGORIA/,/TIPO/]),
      limite:  mpAchaCol(hrow,[/DATA LIMITE/,/PRAZO ATUAL/,/^PRAZO$/,/PREVIS/,/PRAZO/]),
      remocao: mpAchaCol(hrow,[/DATA REMOCAO/,/^CONCLUSAO$/,/CONCLUSAO/,/REMOCAO/]),
      status:  mpAchaCol(hrow,[/^STATUS$/,/^SITUACAO$/,/SITUACAO/]),
      local:   mpAchaCol(hrow,[/^LOCAL$/]),
      codigo:  mpAchaCol(hrow,[/^CODIGO$/]),
      obs:     mpAchaCol(hrow,[/COMENTARIO/,/OBSERVAC/])
    };
    // de-para de pacote -> serviço e local -> lote, só quando o nome bate
    var semSigla=function(x){ return x.replace(/^[A-Z0-9]{1,5}\s*[-–]\s*/,''); };
    var servPorNome={}; SERV.forEach(function(sv){ var k=mpNorm(sv.n); servPorNome[k]=sv.id; servPorNome[semSigla(k)]=sv.id; });
    var lotePorNome={}; (window._LOTIDS||[]).forEach(function(id,i){ lotePorNome[mpNorm(LOTS[i])]=id; });

    var novas=[], divergencias=[], semData=0, casouServ=0, casouLote=0, ignoradas=0;
    var cats={}, sits={};
    for(var L=hdr+1;L<aoa.length;L++){
      var row=aoa[L]||[];
      var acao=col.acao>=0?String(row[col.acao]==null?'':row[col.acao]).trim():'';
      if(!acao){ ignoradas++; continue; }
      var ident=col.ident>=0?excelDateToIso(row[col.ident]):'';
      var limite=col.limite>=0?excelDateToIso(row[col.limite]):'';
      var remoc=col.remocao>=0?excelDateToIso(row[col.remocao]):'';
      if(!/^\d{4}-\d{2}-\d{2}$/.test(ident))ident='';
      if(!/^\d{4}-\d{2}-\d{2}$/.test(limite)){ limite=''; semData++; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(remoc))remoc='';
      var statusTxt=col.status>=0?String(row[col.status]||''):'';
      var st=mpStatusImport(statusTxt);
      if(st==='removida'&&!remoc){ remoc=limite||ident; divergencias.push('linha '+(L+1)+': marcada como concluída sem data de remoção — usei '+brDate(remoc)); }
      // o rótulo da planilha diz no prazo/atraso; as datas é que decidem
      if(st==='removida'&&remoc&&limite){
        var dizAtraso=/ATRASO/.test(mpNorm(statusTxt)), temAtraso=(remoc>limite);
        if(dizAtraso!==temAtraso)divergencias.push('linha '+(L+1)+': status diz "'+statusTxt.trim()+'" mas as datas dizem '+(temAtraso?'atraso':'no prazo')+' — valeram as datas');
      }
      var pacote=col.pacote>=0?String(row[col.pacote]==null?'':row[col.pacote]).trim():'';
      var local =col.local >=0?String(row[col.local ]==null?'':row[col.local ]).trim():'';
      var servId=servPorNome[mpNorm(pacote)]||null; if(servId)casouServ++;
      var loteId=lotePorNome[mpNorm(local)]||null;  if(loteId)casouLote++;
      var cat=mpCatImport(col.cat>=0?row[col.cat]:'');
      cats[cat]=(cats[cat]||0)+1;
      var reg={
        _id:(col.id>=0?row[col.id]:(col.codigo>=0?row[col.codigo]:null)),
        descricao:acao,
        pacote:pacote||null, local:local||null,
        servico_id:servId, lote_id:loteId,
        categoria:cat,
        setor:col.setor>=0?(String(row[col.setor]||'').trim()||null):null,
        responsavel:col.resp>=0?(String(row[col.resp]||'').trim()||null):null,
        data_identificacao:ident||todayISO(),
        data_impacto:limite||null, data_prazo:limite||null, data_prazo_original:limite||null,
        data_conclusao:(st==='removida'?(remoc||null):null),
        status:st, revisoes:[],
        observacao:col.obs>=0?(String(row[col.obs]||'').trim()||null):null,
        semana:null, equipe:null
      };
      sits[mpSit(reg)]=(sits[mpSit(reg)]||0)+1;
      novas.push(reg);
    }
    if(!novas.length){ alert('A planilha não tem nenhuma linha com Ação preenchida.'); return; }
    var escolha=await mpDialogoImport(novas,{divergencias:divergencias,semData:semData,casouServ:casouServ,
      casouLote:casouLote,ignoradas:ignoradas,cats:cats,sits:sits,temId:(col.id>=0||col.codigo>=0)});
    if(!escolha)return;

    // código de cada uma: o número da planilha ou a sequência do app
    var usados={}; MP.forEach(function(r){ if(r.codigo)usados[r.codigo]=1; });
    var prox=0; MP.forEach(function(r){ var m=/(\d+)\s*$/.exec(r.codigo||''); if(m)prox=Math.max(prox,+m[1]); });
    var colidiu=0;
    var prontos=novas.map(function(reg){
      var cod='';
      if(escolha.manterId&&reg._id!=null&&String(reg._id).trim()!==''){
        var n=String(reg._id).trim();
        if(/^R-/i.test(n)){ cod=n.toUpperCase(); }
        else { while(n.length<3)n='0'+n; cod='R-'+n; }
        if(usados[cod]){ colidiu++; cod=''; }
      }
      if(!cod){ prox++; var k=String(prox); while(k.length<3)k='0'+k; cod='R-'+k; }
      usados[cod]=1;
      var out={}; Object.keys(reg).forEach(function(k2){ if(k2!=='_id')out[k2]=reg[k2]; });
      out.codigo=cod;
      return out;
    });
    try{
      await sbMPCriarVarios(selectedObra.id,prontos);
    }catch(e){
      alert('Falha ao importar: '+((e&&e.message)||e)+'\n\nSe fala em coluna que não existe, rode sql/26 e sql/27 no Supabase.');
      return;
    }
    MP_LIDO=false; await mpCarregar();
    MP_TAB='acomp'; renderMedio();
    alert(prontos.length+' restrições importadas.'+
      (colidiu?' '+colidiu+' tinham código já usado nesta obra e foram renumeradas.':'')+
      (divergencias.length?'\n\n'+divergencias.length+' observação(ões) sobre os dados — veja o resumo que apareceu antes.':''));
  }
  /** Resumo antes de gravar: o que vai entrar, como ficou classificado e o que não bateu. */
  function mpDialogoImport(novas,info){
    return new Promise(function(resolve){
      var back=document.createElement('div'); back.className='segmenu-backdrop';
      var linhaCat=Object.keys(info.cats).sort(function(a,b){return info.cats[b]-info.cats[a];}).map(function(k){
        return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px"><span style="width:10px;height:10px;border-radius:3px;background:'+catMeta(k).color+'"></span>'+catMeta(k).label+' <b>'+info.cats[k]+'</b></span>';
      }).join('');
      var linhaSit=MP_SIT_ORDEM.filter(function(k){return info.sits[k];}).map(function(k){
        return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px"><span style="width:10px;height:10px;border-radius:3px;background:'+MP_SITS[k].cor+'"></span>'+MP_SITS[k].lab+' <b>'+info.sits[k]+'</b></span>';
      }).join('');
      var avisos=[];
      if(info.ignoradas)avisos.push(info.ignoradas+' linha(s) sem Ação foram ignoradas.');
      if(info.semData)avisos.push(info.semData+' sem Data Limite — entram como "sem data definida".');
      avisos.push(info.casouServ+' casaram com um serviço cadastrado e '+info.casouLote+' com um lote; o resto fica como texto em Pacote/Local.');
      var div=info.divergencias.length?('<div class="eyebrow" style="margin:14px 0 6px">Divergências entre o status escrito e as datas ('+info.divergencias.length+')</div>'+
        '<div class="note" style="max-height:130px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px">'+
        info.divergencias.map(function(x){return escAttr(x);}).join('<br>')+'</div>'):'';
      back.innerHTML='<div class="segmenu-panel card" style="max-width:640px;max-height:86vh;overflow:auto">'+
        '<div class="eyebrow" style="margin-bottom:2px">Importar restrições</div>'+
        '<div class="note" style="margin-bottom:12px"><b>'+novas.length+'</b> restrições prontas pra entrar nesta obra. Nada é gravado até você confirmar.</div>'+
        '<div class="eyebrow" style="margin:0 0 6px">Situação (calculada pelas datas)</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px">'+linhaSit+'</div>'+
        '<div class="eyebrow" style="margin:0 0 6px">Categorias</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px">'+linhaCat+'</div>'+
        '<div class="note">'+avisos.join('<br>')+'</div>'+div+
        (info.temId?'<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px"><input type="checkbox" id="mpImpId" checked> Manter o ID da planilha como código (R-001, R-002…)</label>':'')+
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">'+
          '<button class="btn" id="mpImpCancel">Cancelar</button>'+
          '<button class="btn primary" id="mpImpOk">Importar '+novas.length+' restrições</button></div></div>';
      document.body.appendChild(back);
      function fim(v){ back.remove(); resolve(v); }
      back.addEventListener('pointerdown',function(e){ if(e.target===back)fim(null); });
      back.querySelector('#mpImpCancel').addEventListener('click',function(){ fim(null); });
      back.querySelector('#mpImpOk').addEventListener('click',function(){
        var c=document.getElementById('mpImpId');
        fim({manterId:!c||c.checked});
      });
    });
  }

  async function mpSalvarNova(){

    var prazo=mpVal('mpResol')||impacto;   // sem previsão própria, vale a data de impacto
    var p={codigo:mpProxCodigo(),descricao:desc,
      lote_id:mpVal('mpLote')||null, servico_id:mpVal('mpServ')||null,
      pacote:(mpVal('mpPacote')||'').trim()||null, local:(mpVal('mpLocal')||'').trim()||null,
      categoria:MP_FORM.cat||'mao_de_obra', setor:mpVal('mpSetor')||null,
      responsavel:(mpVal('mpResp')||'').trim()||null,

      status:'aberta', semana:MP_FORM.semana||null, equipe:MP_FORM.equipe||null,
      revisoes:[], observacao:null};
    try{

      MP.push(Object.assign({id:id},p));

      (porCelula[k]||(porCelula[k]=[])).push(r);
    });

  }

        '<td class="note" style="white-space:nowrap">'+escAttr([mpLoteNome(r.lote_id)||r.local,mpServNome(r.servico_id)||r.pacote].filter(Boolean).join(' / ')||'—')+'</td>'+
        '<td class="note" style="white-space:nowrap">'+escAttr(r.setor||'—')+'</td>'+

  function mpAcharId(id){ return MP.filter(function(x){return x.id===id;})[0]; }
  async function mpPatch(id,patch){
    var r=mpAcharId(id); if(!r)return;
    try{ await sbMPAtualizar(id,patch); Object.assign(r,patch); }
    catch(e){ alert('Falha ao salvar: '+((e&&e.message)||e)+'\n\nSe fala em coluna inexistente, falta rodar sql/26_restricoes_acompanhamento.sql.'); return; }
    renderMedio();
  }
  function mpExportar(){
    if(typeof XLSX==='undefined'){ alert('Biblioteca de planilha não carregou.'); return; }
    var cab=['Código','Descrição','Categoria','Pacote','Local','Lote','Serviço','Setor','Responsável','Identificada',
             'Data de impacto','Prev. remoção','Prazo original','Conclusão','Situação','Dias disponíveis','Dias até remover','Revisões','Observação'];
    var linhas=mpFiltrada().map(function(r){
      return [r.codigo||'',r.descricao||'',catMeta(r.categoria).label,r.pacote||'',r.local||'',mpLoteNome(r.lote_id),mpServNome(r.servico_id),
        r.setor||'',r.responsavel||'',r.data_identificacao||'',mpLimite(r),r.data_prazo||'',r.data_prazo_original||'',
        r.data_conclusao||'',MP_SITS[mpSit(r)].lab,
        mpDias(r.data_identificacao,mpLimite(r)),
        (r.status==='removida'?mpDias(r.data_identificacao,r.data_conclusao):''),
        (Array.isArray(r.revisoes)?r.revisoes.length:0), r.observacao||''];
    });
    var ws=XLSX.utils.aoa_to_sheet([cab].concat(linhas));
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Restrições');
    XLSX.writeFile(wb,'restricoes_'+((selectedObra&&selectedObra.nome)||'obra').replace(/[^\w]+/g,'_')+'.xlsx');
  }

  function renderMedio(){
    var root=document.getElementById('mpRoot'); if(!root)return;
    if(!selectedObra){ root.innerHTML='<div class="card"><div class="note">Abra uma obra.</div></div>'; return; }
    var abas=[['janela','Janela'],['acomp','Acompanhamento'],['dash','Dashboard']].map(function(t){
      return '<button class="subtab'+(MP_TAB===t[0]?' active':'')+'" data-mptab="'+t[0]+'">'+t[1]+'</button>';
    }).join('');
    var corpo;
    if(MP_ERRO){
      corpo='<div class="banner" style="border-color:var(--crit)">Não deu pra carregar as restrições: '+escAttr(MP_ERRO)+
        '<br>Se a mensagem fala em coluna que não existe, rode <b>sql/26_restricoes_acompanhamento.sql</b> no Supabase.</div>';
    } else if(!MP_LIDO){ corpo='<div class="note">Carregando…</div>'; }
    else if(MP_TAB==='acomp'){ corpo=mpAcompHTML(); }
    else if(MP_TAB==='dash'){ corpo=mpDashHTML(); }
    else { corpo=mpJanelaHTML(); }
    root.innerHTML='<div class="subtabs">'+abas+'</div>'+corpo;

    root.querySelectorAll('[data-mptab]').forEach(function(b){
      b.addEventListener('click',function(){ MP_TAB=b.getAttribute('data-mptab'); MP_FORM=null; renderMedio(); });
    });
    if(MP_TAB==='janela')mpWireJanela(root);
    if(MP_TAB==='acomp')mpWireAcomp(root);
    if(MP_TAB==='dash')mpWireDash(root);
  }

  function mpWireJanela(root){
    root.querySelectorAll('[data-mpwin]').forEach(function(b){ b.addEventListener('click',function(){ window.MP_WIN=+b.getAttribute('data-mpwin'); renderMedio(); }); });
    root.querySelectorAll('[data-mpnav]').forEach(function(b){ b.addEventListener('click',function(){
      var wc=mpWindowCells();
      window.MP_START=Math.max(1,Math.min(wc.tw,window.MP_START+(+b.getAttribute('data-mpnav')))); renderMedio();
    }); });
    root.querySelectorAll('[data-mpnova]').forEach(function(b){ b.addEventListener('click',function(){
      var p=b.getAttribute('data-mpnova').split('::'), li=+p[1], si=+p[2];
      MP_FORM={cat:'mao_de_obra', semana:+p[0], equipe:+p[3]||null,
        loteId:(window._LOTIDS||[])[li]||'', servicoId:(si>=0&&SERV[si])?SERV[si].id:''};
      renderMedio();
      var d=document.getElementById('mpDesc'); if(d)d.focus();
    }); });
    root.querySelectorAll('[data-mplote]').forEach(function(b){ b.addEventListener('click',function(){
      var li=+b.getAttribute('data-mplote');
      MP_FORM={cat:'mao_de_obra', semana:window.MP_START, equipe:null, loteId:(window._LOTIDS||[])[li]||'', servicoId:''};
      renderMedio();
      var d=document.getElementById('mpDesc'); if(d)d.focus();
    }); });
    root.querySelectorAll('[data-mpimport]').forEach(function(b){ b.addEventListener('click',mpImportarArquivo); });
    root.querySelectorAll('[data-mpformclose]').forEach(function(b){ b.addEventListener('click',function(){ MP_FORM=null; renderMedio(); }); });
    root.querySelectorAll('[data-mpcat]').forEach(function(b){ b.addEventListener('click',function(){
      if(MP_FORM)MP_FORM.cat=b.getAttribute('data-mpcat');
      root.querySelectorAll('[data-mpcat]').forEach(function(x){
        var c=catMeta(x.getAttribute('data-mpcat')), on=(x===b);
        x.style.background=on?c.color:'transparent'; x.style.color=on?pickFont(c.color):'var(--ink)';
      });
    }); });
    var add=document.getElementById('mpAdd'); if(add)add.addEventListener('click',mpSalvarNova);
  }

  function mpWireAcomp(root){
    var b1=document.getElementById('mpBusca');
    if(b1)b1.addEventListener('change',function(){ MP_F.q=b1.value; renderMedio(); });
    [['mpFSit','sit'],['mpFCat','cat'],['mpFSetor','setor'],['mpFResp','resp']].forEach(function(p){
      var el=document.getElementById(p[0]);
      if(el)el.addEventListener('change',function(){ MP_F[p[1]]=el.value; renderMedio(); });
    });
    var ex=document.getElementById('mpExport'); if(ex)ex.addEventListener('click',mpExportar);
    var im=document.getElementById('mpImport'); if(im)im.addEventListener('click',mpImportarArquivo);
    root.querySelectorAll('[data-mpdet]').forEach(function(b){ b.addEventListener('click',function(){
      var id=b.getAttribute('data-mpdet'); MP_DET=(MP_DET===id)?null:id; renderMedio();
    }); });
    root.querySelectorAll('[data-mpresolver]').forEach(function(b){ b.addEventListener('click',function(){
      var data=mpVal('mpConcData')||todayISO();
      mpPatch(b.getAttribute('data-mpresolver'),{status:'removida',data_conclusao:data});
    }); });
    root.querySelectorAll('[data-mpreabrir]').forEach(function(b){ b.addEventListener('click',function(){
      mpPatch(b.getAttribute('data-mpreabrir'),{status:'aberta',data_conclusao:null});
    }); });
    root.querySelectorAll('[data-mpcancelar]').forEach(function(b){ b.addEventListener('click',function(){
      if(!confirm('Cancelar esta restrição? Ela sai da conta do IRR mas continua no histórico.'))return;
      mpPatch(b.getAttribute('data-mpcancelar'),{status:'cancelada'});
    }); });
    root.querySelectorAll('[data-mprevisar]').forEach(function(b){ b.addEventListener('click',function(){
      var id=b.getAttribute('data-mprevisar'), r=mpAcharId(id); if(!r)return;
      var novoImp=mpVal('mpNovoImpacto'), nova=mpVal('mpNovoPrazo'), motivo=(mpVal('mpMotivo')||'').trim();
      var mudaImp=(novoImp&&novoImp!==(mpLimite(r)||'')), mudaPrazo=(nova&&nova!==(r.data_prazo||''));
      if(!mudaImp&&!mudaPrazo){ alert('As datas são as mesmas que já estão lá.'); return; }
      if(!motivo){ alert('Escreva o motivo da revisão — é ele que explica o escorregão da data.'); return; }
      var agora=new Date().toISOString(), quem=window._MEU_EMAIL||'';
      var rev=(Array.isArray(r.revisoes)?r.revisoes:[]).slice(), patch={};
      if(mudaImp){ rev.push({campo:'impacto',de:mpLimite(r)||null,para:novoImp,motivo:motivo,em:agora,por:quem}); patch.data_impacto=novoImp; }
      if(mudaPrazo){ rev.push({campo:'prazo',de:r.data_prazo||null,para:nova,motivo:motivo,em:agora,por:quem});
        patch.data_prazo=nova; patch.data_prazo_original=r.data_prazo_original||r.data_prazo||nova; }
      patch.revisoes=rev;
      mpPatch(id,patch);
    }); });
    root.querySelectorAll('[data-mpdel]').forEach(function(b){ b.addEventListener('click',async function(){
      var id=b.getAttribute('data-mpdel');
      if(!confirm('Excluir esta restrição de vez? Isso tira ela do histórico e dos indicadores.'))return;
      try{ await sbMPApagar(id); MP=MP.filter(function(x){return x.id!==id;}); MP_DET=null; renderMedio(); toast('Restrição excluída.'); }
      catch(e){ alert('Falha ao excluir: '+((e&&e.message)||e)); }
    }); });
    root.querySelectorAll('[data-mpobs]').forEach(function(t){ t.addEventListener('blur',function(){
      var id=t.getAttribute('data-mpobs'), r=mpAcharId(id);
      if(r&&(r.observacao||'')!==t.value)mpPatch(id,{observacao:t.value||null});
    }); });
  }

  function mpWireDash(root){
    var i=document.getElementById('mpDashIni'), f=document.getElementById('mpDashFim'), l=document.getElementById('mpDashLimpar');
    if(i)i.addEventListener('change',function(){ MP_DASH.ini=i.value; renderMedio(); });
    if(f)f.addEventListener('change',function(){ MP_DASH.fim=f.value; renderMedio(); });
    if(l)l.addEventListener('click',function(){ MP_DASH={ini:'',fim:''}; renderMedio(); });
    root.querySelectorAll('[data-mpevo]').forEach(function(b){
      b.addEventListener('click',function(){ MP_EVO=b.getAttribute('data-mpevo'); renderMedio(); });
    });
  }

  /* ================= Programação Semanal =================
   * O que o Tempo-Caminho e a Linha de Balanço dizem da semana entra aqui como SUGESTÃO: o
   * botão "Puxar sugestões" cria as linhas, e dali em diante elas são da programação — editar,
   * apagar ou acrescentar não mexe em cronograma nenhum. Campos do previsto: serviço/etapa,
   * grupo (livre), lote início, lote fim, detalhamento e quantidade prevista; do acompanhamento:
   * status, quantidade realizada e causa de não cumprimento. */
  var PROG_PLANOS=[], PROG_PLANO=null, PROG_ITENS=[], PROG_CAUSAS=[], PROG_ERRO='', PROG_CARREGANDO=false;
  var PROG_LIDO=false; // já consultou o banco nesta obra (mesmo que não exista semana nenhuma)
  var PROG_SEM_ABERTA=true, PROG_GRUPO_FECHADO={}; // chaves de agrupamento da semana e de cada grupo
  var PROG_STATUS=[['planejado','Planejado'],['concluido','Concluído'],['parcial','Parcial'],['nao_concluido','Não concluído']];
  async function sbProgPlanos(obraId){
    var r=await SB.from('planos_semanais').select('id,semana_iso,data_inicio,data_fim').eq('obra_id',obraId).order('data_inicio',{ascending:false});
    if(r.error)throw r.error; return r.data||[];
  }
  async function sbProgCriarPlano(obraId,semanaIso,ini,fim){
    var id=newUuid();
    var r=await SB.from('planos_semanais').insert({id:id,obra_id:obraId,semana_iso:semanaIso,data_inicio:ini,data_fim:fim});
    if(r.error)throw r.error; return id;
  }
  async function sbProgItens(planoId){
    var r=await SB.from('compromissos').select('id,servico_id,etapa,grupo,lote_id,lote_fim_id,detalhamento,quantidade_prevista,quantidade_realizada,status,causa_id,origem,ordem,descricao').eq('plano_id',planoId).order('ordem',{ascending:true});
    if(r.error)throw r.error; return r.data||[];
  }
  async function sbProgSalvarItem(item){
    var r=await SB.from('compromissos').upsert(item,{onConflict:'id'});
    if(r.error)throw r.error;
  }
  async function sbProgApagarItem(id){
    var r=await SB.from('compromissos').delete().eq('id',id);
    if(r.error)throw r.error;
  }
  async function sbProgCausas(obraId){
    var r=await SB.from('causas_nao_cumprimento').select('id,nome,categoria').or('obra_id.is.null,obra_id.eq.'+obraId).order('nome',{ascending:true});
    if(r.error)return [];
    return r.data||[];
  }
  /** Semana do projeto -> {iso,ini,fim} (segunda a domingo). */
  function progSemanaInfo(w){
    var seg=mondayOf(w), dom=new Date(seg.getTime()); dom.setDate(dom.getDate()+6);
    var dm=function(d){ var p=function(n){return (n<10?'0':'')+n;}; return p(d.getDate())+'/'+p(d.getMonth()+1); };
    return {w:w,iso:'S'+isoWeek(seg)+'/'+seg.getFullYear(),
      rotulo:'S'+isoWeek(seg)+'/'+seg.getFullYear()+' ('+dm(seg)+' a '+dm(dom)+')',
      ini:seg.toISOString().slice(0,10),fim:dom.toISOString().slice(0,10),seg:seg};
  }
  function progSemanaDoPlano(p){
    if(!p||!p.data_inicio)return null;
    for(var w=1;w<=520;w++){ if(mondayOf(w).toISOString().slice(0,10)===p.data_inicio)return w; }
    return null;
  }
  /** Junta lotes consecutivos (na ordem da obra) em trechos "do lote X ao lote Y". */
  function progTrechos(idxs){
    var ord=idxs.slice().sort(function(a,b){return a-b;}), out=[], ini=null, ant=null;
    ord.forEach(function(li){
      if(ini===null){ ini=li; ant=li; return; }
      if(li===ant+1){ ant=li; return; }
      out.push([ini,ant]); ini=li; ant=li;
    });
    if(ini!==null)out.push([ini,ant]);
    return out;
  }
  /** Sugestões da semana: o que o Tempo-Caminho e a Linha de Balanço preveem. Só leitura. */
  function progSugestoes(w){
    var sug=[], ids=window._LOTIDS||[];
    // --- Tempo-Caminho: serviços ativos na semana, agrupados por trecho de lotes ---
    var segs=viewSegs(buildSchedule());
    var porSvc={};
    segs.forEach(function(sg){
      var i=w-sg.start; if(i<0||i>=sg.dur)return;
      var q=sg.wq[i]||0;
      var acc=porSvc[sg.si]||(porSvc[sg.si]={lotes:[],qtd:0,equipes:{}});
      if(acc.lotes.indexOf(sg.li)<0)acc.lotes.push(sg.li);
      acc.qtd+=q; acc.equipes[sg.team]=1;
    });
    Object.keys(porSvc).forEach(function(si){
      var s=SERV[si], acc=porSvc[si];
      progTrechos(acc.lotes).forEach(function(tr){
        var qtd=acc.qtd*( (tr[1]-tr[0]+1) / acc.lotes.length ); // rateio simples quando há vários trechos
        sug.push({origem:'tc',servico_id:s.id||null,etapa:null,descricao:s.n,
          grupo:'',lote_id:ids[tr[0]]||null,lote_fim_id:ids[tr[1]]||null,
          detalhamento:'Tempo-Caminho · equipe(s) '+Object.keys(acc.equipes).join(', ')+' · '+LOTS[tr[0]]+(tr[1]!==tr[0]?(' a '+LOTS[tr[1]]):''),
          quantidade_prevista:Math.round(qtd*100)/100});
      });
    });
    // --- Linha de Balanço: etapas que caem na semana, por serviço detalhado ---
    var root=lbRoot();
    Object.keys(root.servicos||{}).forEach(function(svId){
      var antes=root.servicoSel; root.servicoSel=svId;
      var calc=null; try{ calc=lbCalc(); }catch(e){}
      root.servicoSel=antes;
      if(!calc||!calc.itens.length)return;
      var c=calc.c, sv=SERV[lbSvcIdx(svId)];
      var d0=(w-(+c.inicio||1))*DIAS_SEM, d1=d0+DIAS_SEM;
      if(d1<=0)return;
      var porEtapa={};
      calc.itens.forEach(function(it){
        if(it.fim<=d0||it.ini>=d1)return;
        var e=(c.etapas.filter(function(x){return x.id===it.eid;})[0])||{};
        var acc=porEtapa[it.eid]||(porEtapa[it.eid]={nome:e.nome||'Etapa',lotes:[],dias:0});
        var li=ids.indexOf(it.lote); if(li>=0&&acc.lotes.indexOf(li)<0)acc.lotes.push(li);
        acc.dias+=Math.max(0,Math.min(it.fim,d1)-Math.max(it.ini,d0));
      });
      Object.keys(porEtapa).forEach(function(eid){
        var acc=porEtapa[eid];
        progTrechos(acc.lotes).forEach(function(tr){
          sug.push({origem:'lb',servico_id:(sv&&sv.id)||null,etapa:acc.nome,descricao:acc.nome,
            grupo:(sv&&sv.n)||'',lote_id:ids[tr[0]]||null,lote_fim_id:ids[tr[1]]||null,
            detalhamento:'Linha de balanço · '+((sv&&sv.n)||'')+' · '+(Math.round(acc.dias*10)/10)+' dia(s) nesta semana',
            quantidade_prevista:null});
        });
      });
    });
    return sug;
  }
  function progNomeItem(it){
    if(it.etapa)return it.etapa;
    var s=SERV.filter(function(x){return x.id===it.servico_id;})[0];
    return (s&&s.n)||it.descricao||'—';
  }
  function progLoteSel(it,campo){
    var ids=window._LOTIDS||[], atual=it[campo]||'';
    return '<select class="esel" data-pitem="'+it.id+'" data-pcampo="'+campo+'" style="width:110px"><option value="">—</option>'+
      ids.map(function(id,i){ return '<option value="'+escAttr(id)+'"'+(id===atual?' selected':'')+'>'+escAttr(LOTS[i]||id)+'</option>'; }).join('')+'</select>';
  }
  function progPPCAtual(){
    var t=PROG_ITENS.length; if(!t)return null;
    var ok=PROG_ITENS.filter(function(i){return i.status==='concluido';}).length;
    return Math.round(ok/t*100);
  }

          PROG_CAUSAS.map(function(cz){ return '<option value="'+cz.id+'"'+(cz.id===it.causa_id?' selected':'')+'>'+escAttr(cz.nome)+'</option>'; }).join('')+'</select>';
        var tag=it.origem==='tc'?'<span class="pill" title="Sugerido pelo Tempo-Caminho">TC</span>':(it.origem==='lb'?'<span class="pill" title="Sugerido pela Linha de Balanço">LB</span>':'');
        return '<tr>'+
          '<td style="min-width:200px">'+tag+' <select class="esel" data-pitem="'+it.id+'" data-pcampo="servico_id" style="width:170px">'+svcOpts+'</select>'+
            '<div style="margin-top:3px"><input class="einp" data-pitem="'+it.id+'" data-pcampo="etapa" value="'+escAttr(it.etapa||'')+'" placeholder="etapa (livre)" style="width:170px"></div></td>'+
          '<td><input class="einp" data-pitem="'+it.id+'" data-pcampo="grupo" value="'+escAttr(it.grupo||'')+'" placeholder="grupo" style="width:120px"></td>'+
          '<td>'+progLoteSel(it,'lote_id')+'</td>'+
          '<td>'+progLoteSel(it,'lote_fim_id')+'</td>'+
          '<td><input class="einp" data-pitem="'+it.id+'" data-pcampo="detalhamento" value="'+escAttr(it.detalhamento||'')+'" placeholder="o que será feito" style="width:230px"></td>'+
          '<td><input class="einp" type="number" step="0.01" data-pitem="'+it.id+'" data-pcampo="quantidade_prevista" value="'+(it.quantidade_prevista==null?'':it.quantidade_prevista)+'" style="width:90px"></td>'+
          '<td><select class="esel" data-pitem="'+it.id+'" data-pcampo="status" style="width:130px">'+PROG_STATUS.map(function(st){ return '<option value="'+st[0]+'"'+(it.status===st[0]?' selected':'')+'>'+st[1]+'</option>'; }).join('')+'</select></td>'+
          '<td><input class="einp" type="number" step="0.01" data-pitem="'+it.id+'" data-pcampo="quantidade_realizada" value="'+(it.quantidade_realizada==null?'':it.quantidade_realizada)+'" style="width:90px"></td>'+
          '<td>'+causaSel+'</td>'+
          '<td><button class="iconbtn" data-pdel="'+it.id+'" title="Excluir linha">✕</button></td></tr>';
      };
      var linhas='';
      if(PROG_SEM_ABERTA){

          linhas+='<tr style="background:var(--elev)"><td colspan="6" style="font-weight:700">'+

          (PROG_ITENS.length?'<button class="iconbtn" id="progSemChave" title="Abrir/fechar as linhas desta semana">'+(PROG_SEM_ABERTA?'▾':'▸')+'</button><span class="note">'+PROG_ITENS.length+' linha(s)</span>':'')+
        '</div>'+corpo+

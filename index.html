<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D6FA6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>LPS Tripoloni · Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --elev:#F5F7F9; --line:#DDE3E9; --line-2:#E9EDF1;
    --ink:#1A2127; --ink-2:#54636F; --muted:#8593A0;
    --nav-bg:#141A20; --nav-ink:#C7D2DC; --nav-ink-2:#8695A2; --nav-active:#5FA0D6; --nav-hover:#1E262E;
    --accent:#2D6FA6; --accent-soft:#D9E8F5;
    --lps-1:#16212B; --lps-2:#2F8FD8; --lps-3:#9AA7B4;
    --c1:#3E7CB1; --c2:#5F9E6E; --c3:#C98A2B; --c4:#9A6DB0; --c5:#C0653F; --c6:#4FA3A8;
    --good:#2E9E6B; --warn:#C98A2B; --crit:#D33A3F; --info:#3E7CB1;
    --good-bg:#E4F3EC; --warn-bg:#F7EBD6; --crit-bg:#F8E2E3;
    --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.05);
    --radius:12px;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --bg:#0D1115; --surface:#161B21; --elev:#1D242B; --line:#28313A; --line-2:#212932;
    --ink:#EAEEF2; --ink-2:#A6B3BE; --muted:#71808C;
    --nav-bg:#0A0E12; --nav-ink:#C7D2DC; --nav-ink-2:#7A8894; --nav-active:#5FA0D6; --nav-hover:#161D24;
    --accent:#5FA0D6; --accent-soft:#16283A;
    --lps-1:#E8EEF4; --lps-2:#3B9AE1; --lps-3:#8A97A5;
    --c1:#5FA0D6; --c2:#5FB98A; --c3:#E0A93F; --c4:#B98BD4; --c5:#DB855C; --c6:#5FC2C8;
    --good:#41C089; --warn:#E0A93F; --crit:#E5565B; --info:#5FA0D6;
    --good-bg:#12281F; --warn-bg:#2C2413; --crit-bg:#301719;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.32);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1115; --surface:#161B21; --elev:#1D242B; --line:#28313A; --line-2:#212932;
    --ink:#EAEEF2; --ink-2:#A6B3BE; --muted:#71808C;
    --nav-bg:#0A0E12; --nav-ink:#C7D2DC; --nav-ink-2:#7A8894; --nav-active:#5FA0D6; --nav-hover:#161D24;
    --accent:#5FA0D6; --accent-soft:#16283A;
    --lps-1:#E8EEF4; --lps-2:#3B9AE1; --lps-3:#8A97A5;
    --c1:#5FA0D6; --c2:#5FB98A; --c3:#E0A93F; --c4:#B98BD4; --c5:#DB855C; --c6:#5FC2C8;
    --good:#41C089; --warn:#E0A93F; --crit:#E5565B; --info:#5FA0D6;
    --good-bg:#12281F; --warn-bg:#2C2413; --crit-bg:#301719;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.32);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;transition:grid-template-columns .18s ease}
  .app.nav-collapsed{grid-template-columns:0 1fr}
  .app.nav-collapsed .side{min-width:0;overflow:hidden;padding:0;border:0}
  .app.nav-collapsed .content{max-width:none}

  /* ---------- Sidebar ---------- */
  .side{background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
  .side-brand .g{width:34px;height:34px;border-radius:9px;flex:0 0 auto;background:linear-gradient(150deg,var(--nav-active),#164a73);display:grid;place-items:center}
  .side-brand .g svg{width:19px;height:19px}
  .side-brand h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:15.5px;margin:0;color:#fff;letter-spacing:-.01em;line-height:1.1}
  .side-brand .sub{font-size:10.5px;color:var(--nav-ink-2);letter-spacing:.06em;text-transform:uppercase}
  .nav{padding:6px 10px;flex:1}
  .nav-group{margin-bottom:3px}
  .nav-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--nav-ink);font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
  .nav-head:hover{background:var(--nav-hover)}
  .nav-head .ic{width:17px;height:17px;flex:0 0 auto;opacity:.85}
  .nav-head .chev{margin-left:auto;transition:transform .15s;opacity:.6}
  .nav-group.open .chev{transform:rotate(90deg)}
  .nav-sub{max-height:0;overflow:hidden;transition:max-height .2s ease}
  .nav-group.open .nav-sub{max-height:340px}
  .nav-item{display:block;width:100%;background:none;border:0;color:var(--nav-ink-2);font-family:inherit;font-size:13px;padding:7px 10px 7px 38px;border-radius:8px;cursor:pointer;text-align:left}
  .nav-item:hover{background:var(--nav-hover);color:var(--nav-ink)}
  .nav-item.active{color:#fff;background:var(--nav-hover)}
  .nav-item.active::before{content:"";position:absolute;left:22px;width:6px;height:6px;border-radius:99px;background:var(--nav-active);margin-top:6px}
  .nav-item{position:relative}
  .nav-solo .nav-head.active{background:var(--nav-hover);color:#fff}
  .nav-solo .nav-head.active .ic{opacity:1;color:var(--nav-active)}
  .side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:var(--nav-ink-2)}

  /* ---------- Topbar ---------- */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .obra-sel{display:flex;align-items:center;gap:8px;background:var(--elev);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;cursor:pointer}
  .obra-sel .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .obra-sel b{font-weight:600}
  .obra-sel.active{border-color:var(--accent);background:var(--accent-soft)}
  /* modo somente leitura (visualizador) */
  body.ro #topSaveBtn{display:none!important}
  body.ro .tcm-seg{cursor:default}
  body.ro .tcm-grip{display:none}
  body.ro #cronoToolbar [data-act^="imp"],body.ro #cronoToolbar [data-act="rev00"]{display:none!important}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:9px}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
  .icon-btn:hover{border-color:var(--accent);color:var(--ink)}
  .avatar{width:34px;height:34px;border-radius:99px;background:linear-gradient(140deg,var(--c4),var(--c1));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}

  /* ---------- Content ---------- */
  .content{padding:22px;max-width:1700px;width:100%}
  .page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .page-head h2{font-family:"Archivo",sans-serif;font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em}
  .page-head .desc{font-size:13px;color:var(--muted);margin-top:3px}
  .page-actions{margin-left:auto;display:flex;gap:8px}
  .page-head-mini{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}
  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}

  .subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:0}
  .subtab{font-size:13px;font-weight:600;color:var(--muted);padding:8px 12px;border:0;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
  .subtab:hover{color:var(--ink)}
  .subtab.active{color:var(--ink);border-bottom-color:var(--accent)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 17px;min-width:0}
  .card h3{font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;margin:0 0 3px}
  .card .eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .g-2-1{grid-template-columns:2fr 1fr}.g-1-2{grid-template-columns:1fr 2fr}

  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kpi .lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .kpi .val{font-family:"Archivo",sans-serif;font-weight:800;font-size:25px;line-height:1.05;margin-top:7px;letter-spacing:-.02em}
  .kpi .foot{font-size:11.5px;color:var(--ink-2);margin-top:4px}
  .cv-cardgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .cv-compact .kpi{padding:8px 11px}
  .cv-compact .kpi .lab{font-size:10px}
  .cv-compact .kpi .val{font-size:19px;margin-top:3px}
  .cv-compact .kpi .foot{font-size:10px;margin-top:2px}
  .up{color:var(--good)}.down{color:var(--crit)}.flat{color:var(--warn)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  th.r,td.r{text-align:right}
  .tbl-wrap{overflow-x:auto}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.good{background:var(--good-bg);color:var(--good)}.pill.mut{background:var(--elev);color:var(--ink-2)}
  .swatch{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:6px}
  .inp{width:100%;font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--elev);color:var(--ink)}
  .field{margin-bottom:11px}.field label{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:4px}

  /* Matrix (tempo-caminho) */
  .tc-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:76vh}
  .tc-zoom{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  /* Tela cheia da matriz: o bloco do cronograma vira uma camada sobre a página inteira —
     só ficam os filtros de serviço, a barra de zoom e a própria matriz. */
  body.mat-fullscreen #cronoContent{position:fixed;inset:0;z-index:190;background:var(--bg);padding:10px 14px;display:flex;flex-direction:column;overflow:auto}
  #lbPrint{display:none}
  body.mat-fullscreen #cronoContent .tc-head{display:none!important}
  body.mat-fullscreen #cronoContent .tc-svctoggle{margin-bottom:6px}
  /* Barra de edição da tela cheia: abas, ações do ajuste manual e saída. Fora da tela cheia não aparece. */
  .fs-bar{display:none}
  body.mat-fullscreen .fs-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  body.mat-fullscreen .fs-bar .fs-title{font-family:"Archivo",sans-serif;font-weight:800;font-size:14px;margin-right:6px;white-space:nowrap}
  body.mat-fullscreen .fs-bar .btn{padding:4px 10px;font-size:12px}
  body.mat-fullscreen .fs-bar .subtab{padding:4px 10px;font-size:12px}
  /* Painel "Lotes e sequência" vira gaveta lateral; a matriz se desloca pra não ficar coberta. */
  body.mat-fullscreen #cronoContent .assign{display:none!important}
  body.mat-fullscreen.assign-open #cronoContent{padding-left:calc(min(420px,42vw) + 20px)}
  body.mat-fullscreen.assign-open #cronoContent .assign{display:block!important;position:fixed;left:0;top:0;bottom:0;width:min(420px,42vw);z-index:196;overflow:auto;background:var(--surface);border-right:1px solid var(--line);border-radius:0;padding:14px;box-shadow:var(--shadow)}
  .tc-zoom button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700}
  .tc-zoom button:hover{border-color:var(--accent)}
  .tc-zoom .lvl{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);min-width:38px;text-align:center}
  table.tc{border-collapse:separate;border-spacing:0;font-size:11px;min-width:640px}
  table.tc th,table.tc td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:0}
  table.tc thead th{position:sticky;top:0;background:var(--surface);z-index:3;padding:8px 6px;font-size:10.5px;color:var(--ink-2);text-transform:none;letter-spacing:0;text-align:center}
  table.tc tbody th{position:sticky;left:0;background:var(--surface);z-index:2;padding:4px 10px;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap;font-family:"IBM Plex Mono",monospace}
  table.tc td{height:22px;text-align:center;color:#0d0d0d;font-weight:600}
  .cellwk{font-size:9px;line-height:22px}

  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  svg.chart{width:100%;height:auto;display:block;overflow:visible}
  .axm{fill:var(--muted);font-size:9px;font-family:"IBM Plex Mono",monospace}
  .lb-drag{cursor:grab}
  .lb-res{cursor:col-resize}
  .mf-wrap{border:1px solid var(--line);border-radius:10px;background:var(--elev);overflow:auto;position:relative}
  .mf-wrap svg{display:block;touch-action:none;user-select:none}
  .mf-node rect{cursor:grab}
  .mf-wrap.ligando .mf-node rect{cursor:crosshair}
  .mf-wrap.apagando .mf-node rect{cursor:not-allowed}
  .mf-node.sel rect{stroke-width:3}
  .exec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(640px,1fr));gap:12px}
  .exec-grid .card{padding:8px 12px}
  .crew-tbl{min-width:0!important;width:auto!important;font-size:11.5px;margin:2px 0 6px}
  .crew-tbl th,.crew-tbl td{padding:3px 10px}
  .barrow{display:grid;grid-template-columns:70px 1fr 32px;align-items:center;gap:9px;margin:8px 0;font-size:12px}
  .track{height:8px;background:var(--elev);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;border-radius:99px}
  .note{font-size:12px;color:var(--muted)}
  .wip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:99px}

  .banner{display:flex;gap:11px;align-items:flex-start;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink);padding:11px 14px;border-radius:11px;margin-bottom:18px;font-size:13px}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;z-index:60;width:248px;transform:translateX(-100%);transition:transform .2s}
    .side.open{transform:none}
    .g2,.g3,.g4,.g-2-1,.g-1-2{grid-template-columns:1fr}
    .menu-toggle{display:grid!important}
    .nav-toggle{display:none!important}
    .app.nav-collapsed{grid-template-columns:1fr}
  }
  /* Barra de carregamento: fica no topo de tudo e aparece enquanto houver algo em andamento.
     Indeterminada de propósito — não dá pra saber o progresso de uma consulta ao banco, e barra
     que finge porcentagem mente. */
  #barraCarga{position:fixed;left:0;right:0;top:0;height:3px;z-index:300;pointer-events:none;display:none;overflow:hidden}
  body.carregando #barraCarga{display:block}
  #barraCarga::before{content:"";position:absolute;top:0;bottom:0;width:36%;border-radius:0 3px 3px 0;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:cargaAnda 1.1s ease-in-out infinite}
  @keyframes cargaAnda{0%{left:-38%}100%{left:100%}}
  @media (prefers-reduced-motion:reduce){ #barraCarga::before{animation:none;width:100%;background:var(--accent);opacity:.5} }
  .menu-toggle{display:none}

  /* ---------- Modo campo (celular) ----------
     O app nasceu pra tela larga. Abaixo de 760px a gente compacta o que dá, deixa as tabelas
     e as abas rolarem na horizontal em vez de quebrar, e sobe uma barra fixa embaixo com as
     telas que se usa na obra. A barra some em tela grande. */
  .fieldbar{display:none}
  @media (max-width:760px){
    .content{padding:14px 12px calc(78px + env(safe-area-inset-bottom))}
    .topbar{padding:9px 12px;gap:8px}
    .crumb{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .top-right{gap:6px}
    .top-right .obra-sel .k{display:none}
    .top-right .obra-sel{padding:4px 8px}
    .card{padding:13px 12px;border-radius:12px}
    .page-head h2{font-size:19px}
    .page-head-mini{justify-content:flex-start}
    .page-actions{margin-left:0;flex-wrap:wrap}
    .subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .subtabs::-webkit-scrollbar{display:none}
    .subtab{white-space:nowrap;padding:9px 11px}
    .tbl-wrap{-webkit-overflow-scrolling:touch}
    .btn{min-height:38px;padding:9px 13px}
    .icon-btn{min-width:36px;min-height:36px}
    .einp{height:34px;font-size:13.5px}
    .esel{height:32px;font-size:13px}
    .banner{display:block;font-size:12.5px;padding:10px 12px}
    /* A barra de importar/exportar do Tempo-Caminho tem ~16 botões e tomaria a tela inteira
       antes das abas. Importação é trabalho de computador — no celular ela sai de cena. */
    #cronoToolbar{display:none!important}
    /* A legenda repete o que já está nas caixinhas de serviço logo abaixo — some pra sobrar tela. */
    .legend{display:none!important}
    /* A data come 100px dos 375 da tela. Encolhe (o left da coluna "Semana" acompanha). */
    table.tcm td.dt,table.tcm th:nth-child(1){width:66px;min-width:66px;max-width:66px;font-size:9px;padding:3px 4px}
    table.tcm td.wk,table.tcm th:nth-child(2){left:66px;width:46px;min-width:46px;max-width:46px}
    .fieldbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:55;
      background:var(--surface);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));
      box-shadow:0 -2px 10px rgba(0,0,0,.08)}
    .fieldbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;
      font-family:inherit;font-size:10px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:9px;min-height:46px}
    .fieldbar button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .fieldbar button.active{color:var(--accent)}
  }

  /* ---------- Landing: seleção de obras ---------- */
  .landing{position:fixed;inset:0;overflow-y:auto;background:var(--bg);z-index:80;display:none}
  .landing.show{display:block}
  .land-top{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0}
  .land-top .g{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--accent),#164a73);display:grid;place-items:center}
  .land-top .g svg{width:19px;height:19px}
  .land-top h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:16px;margin:0;letter-spacing:-.01em}
  .land-top .sub{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .land-body{max-width:1080px;margin:0 auto;padding:32px 26px 60px}
  .land-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .land-head h2{font-family:"Archivo",sans-serif;font-weight:800;font-size:26px;margin:0;letter-spacing:-.02em}
  .land-head .desc{font-size:14px;color:var(--muted);margin-top:4px}
  .land-search{margin-left:auto;position:relative}
  .land-search input{font-family:inherit;font-size:13px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:230px}
  .land-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .obras-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .obra-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;text-align:left;padding:0;font-family:inherit;color:inherit;display:block;width:100%}
  .obra-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 28px rgba(20,30,40,.12)}
  .obra-card .top{height:6px}
  .obra-card .in{padding:16px 17px}
  .obra-card .code{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace;letter-spacing:.03em}
  .obra-card h3{font-family:"Archivo",sans-serif;font-weight:700;font-size:17px;margin:5px 0 2px;letter-spacing:-.01em}
  .obra-card .trecho{font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
  .obra-card .prog{margin-bottom:13px}
  .obra-card .prog .pl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .obra-card .prog .pl b{color:var(--ink);font-weight:600}
  .obra-card .stats{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line-2);padding-top:12px}
  .obra-card .st .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .obra-card .st .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;margin-top:2px}
  .obra-card .st .v.small{font-size:12.5px}
  .obra-new{border:1.5px dashed var(--line);background:transparent;border-radius:14px;display:grid;place-items:center;min-height:210px;cursor:pointer;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;gap:8px;transition:border-color .12s,color .12s}
  .obra-new:hover{border-color:var(--accent);color:var(--accent)}
  .obra-new .plus{width:44px;height:44px;border-radius:99px;border:1.5px solid currentColor;display:grid;place-items:center;font-size:22px;font-weight:400}
  .obra-sel{cursor:pointer}

  /* ---------- Matriz Tempo-Caminho (fiel ao app) ---------- */
  .tc-head h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:0}
  .tc-head p{font-size:12px;color:var(--muted);margin:4px 0 0;max-width:660px;line-height:1.45}
  .assign{border:1px solid var(--line);background:var(--elev);border-radius:10px;padding:12px 13px;margin:14px 0}
  .assign .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .assign select{height:30px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:0 8px;font-family:inherit;font-size:12.5px}
  .lotchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .lotchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
  .lotchip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .lotchip.other{border-style:dashed;color:var(--muted)}
  .tc-svctoggle{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .seqlist{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-width:420px}
  .seqrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px}
  .seqnum{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}
  .seqname{flex:1;font-size:12.5px}
  .seqbtns{display:flex;gap:4px}
  table.tcm{border-collapse:collapse;font-size:11px;min-width:700px;width:100%}
  table.tcm th,table.tcm td{border:1px solid var(--line-2)}
  table.tcm thead th{position:sticky;top:0;background:var(--surface);z-index:3;padding:7px 8px;color:var(--ink-2);font-size:10.5px;text-align:center;white-space:nowrap}
  table.tcm thead th.lot{font-weight:700;color:var(--ink)}
  /* Colunas "Segunda-feira" e "Semana" fixas ao rolar a matriz na horizontal, pra sempre dar
     pra saber em que semana está — largura fixa porque a posição da 2ª coluna (left) depende
     do tamanho exato da 1ª. As células de cabeçalho (th:nth-child) ficam fixas nas duas direções
     (topo E esquerda) por já serem sticky no topo. */
  table.tcm td.dt,table.tcm th:nth-child(1){position:sticky;left:0;width:100px;min-width:100px;max-width:100px;z-index:2;background:var(--surface)}
  table.tcm td.wk,table.tcm th:nth-child(2){position:sticky;left:100px;width:62px;min-width:62px;max-width:62px;z-index:2}
  table.tcm thead th:nth-child(1),table.tcm thead th:nth-child(2){z-index:4}
  table.tcm td.dt{padding:3px 8px;color:var(--muted);white-space:nowrap;font-family:"IBM Plex Mono",monospace}
  table.tcm td.wk{padding:3px 8px;text-align:center;font-weight:600;background:var(--elev);font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}
  table.tcm td.sumname{position:sticky;left:0;z-index:2}
  table.tcm td.cell{padding:0}
  .tcm-row{display:flex;min-height:28px;width:100%}
  .tcm-seg{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:"IBM Plex Mono",monospace;position:relative;padding:2px 3px;cursor:grab;touch-action:none}
  .tcm-seg:active{cursor:grabbing}
  tr.tcm-droprow{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  td.tcm-dropcol{outline:2px dashed var(--accent);outline-offset:-2px}
  .tcm-grip{position:absolute;left:2px;opacity:.4;font-weight:400}
  .tcm-badge{position:absolute;top:0;right:0;display:flex;align-items:center;gap:2px;padding:0 3px;font-size:9px;font-weight:700;color:#fff;border-bottom-left-radius:4px}
  .tcm-team{position:absolute;bottom:0;left:2px;font-size:8px;font-weight:700;line-height:1;opacity:.75}
  .tcm-rain{font-size:9px;font-weight:600;color:var(--info);white-space:nowrap}
  /* Linha de "hoje" na matriz: a borda marca o começo da semana corrente. As semanas descem
     da mais nova pra mais antiga, então essa borda é literalmente a linha do tempo de agora. */
  table.tcm tr.tcm-hoje > td{box-shadow:inset 0 2px 0 var(--accent)}
  .tcm-hojetag{display:inline-block;margin-left:4px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:8.5px;font-weight:700;vertical-align:middle}
  tr.tcm-holrow td{background:var(--elev);color:var(--muted)}
  table.tcm tr.tcm-holrow td.dt,table.tcm tr.tcm-holrow td.wk{background:var(--elev)}
  tr.tcm-rainrow td.dt,tr.tcm-rainrow td.wk,tr.tcm-rainrow td.cell{background:var(--accent-soft)}
  td.tcm-holcell{text-align:center;font-size:11px;font-weight:600;letter-spacing:.03em}
  table.tcm tr.sumrow td{padding:6px 8px;font-weight:600;border-color:var(--line)}
  table.tcm td.sumname{text-align:center;font-weight:700;font-size:11.5px}
  table.tcm td.sumq{text-align:center;font-family:"IBM Plex Mono",monospace;color:var(--ink)}
  .apptoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:210;box-shadow:0 8px 24px rgba(0,0,0,.32)}
  .segmenu-backdrop{position:fixed;inset:0;z-index:198;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
  .segmenu-panel{max-width:380px;width:100%;max-height:90vh;overflow-y:auto}
  /* Oficina: célula vazia convida o clique, mas sem virar um tabuleiro xadrez que cansa a vista. */
  .ofi td.cell{cursor:cell}
  .ofi td.cell:hover{background:var(--accent-soft)}
  .ofi .tcm-seg{cursor:pointer}
  .ofi-aviso{border-left:3px solid var(--warn);padding-left:9px;margin:8px 0;font-size:12.5px;color:var(--ink-2)}
  /* Paleta: o serviço escolhido fica na mão até trocar, igual pincel. */
  .ofi-pal{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ofi-tinta{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .ofi-tinta .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
  .ofi-tinta.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
  .ofi.pincel td.cell{cursor:crosshair}
  .segmenu-panel label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
  .segmenu-panel .einp,.segmenu-panel .esel{width:100%;box-sizing:border-box}
  .apptoast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Editores de cadastro ---------- */
  .edtbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
  .edtbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px;background:var(--elev);border-bottom:1px solid var(--line);white-space:nowrap}
  .edtbl th.r,.edtbl td.r{text-align:right}
  .edtbl td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  .einp{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:0 8px;font-family:inherit;font-size:13px}
  .einp[type=number]{text-align:right}
  .edtbl.compact{min-width:0}
  .edtbl.compact th,.edtbl.compact td{padding:3px 4px}
  .edtbl.compact th.estgrp{text-align:center;color:#fff;font-size:10px}
  .edtbl.compact .einp{height:24px;padding:0 4px;font-size:11.5px;border-radius:4px}
  .edtbl.compact .einp[type=number]{width:58px}
  .edtbl.compact .einp[type=date]{width:112px}
  .esel{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:0 6px;font-family:inherit;font-size:12px}
  .esw{width:40px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:none}
  .iconbtn{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-grid;place-items:center;font-size:12px;line-height:1}
  .iconbtn:disabled{opacity:.35;cursor:not-allowed}
  .iconbtn:hover{border-color:var(--accent);color:var(--ink)}
  .predwrap{display:flex;flex-wrap:wrap;gap:4px;max-width:280px}
  .predchip{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;background:var(--surface);white-space:nowrap}
  .predchip.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
  .ed-detail td{background:var(--elev)}
  .ed-sec{margin-bottom:14px}
  .ed-sec .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:block;margin-bottom:7px}
  .ed-team{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 8px;font-size:12px;margin:0 6px 6px 0}
  .ed-team em{color:var(--muted);font-style:normal}
  .ed-checks{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px}
  .ed-checks label{display:flex;align-items:center;gap:6px}
  .mpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
  .mpf{display:flex;flex-direction:column;gap:5px}
  .mpf label{font-size:11px;font-weight:600;color:var(--ink-2)}
  @media (max-width:760px){.mpgrid{grid-template-columns:1fr}}
  .mp-cell{cursor:pointer;border:0;font-family:"IBM Plex Mono",monospace;font-weight:700}
  .mp-badge{position:absolute;top:1px;right:1px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:99px;font-size:10px;font-weight:700;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);padding:0 3px}
  .mp-restr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 10px;font-size:12.5px}
  .mp-tag{color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
  .mp-cats{display:flex;flex-wrap:wrap;gap:6px}
  .mp-catchip{cursor:pointer;border:1px solid;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;background:transparent;font-family:inherit}
  /* Cabeçalho do lote e célula vazia também lançam restrição — o pedido é "clicar no lote". */
  .mp-lotebtn{background:none;border:0;font:inherit;font-weight:700;color:inherit;cursor:pointer;padding:0;width:100%}
  .mp-lotebtn:hover{color:var(--accent);text-decoration:underline}
  .mp-vazia{display:block;width:100%;min-height:34px;background:none;border:0;cursor:pointer;border-radius:5px}
  .mp-vazia:hover{background:var(--elev);box-shadow:inset 0 0 0 1px var(--line)}
  /* Quebra por categoria/setor/responsável: tudo numa linha só, sem rolagem lateral. */
  .mpq{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;border-top:1px solid var(--line-2)}
  .mpq-head{border-top:0;color:var(--muted);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding-top:10px}
  .mpq-l{flex:0 0 86px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
  .mpq-b{flex:1;min-width:0;height:13px}
  .mpq-n{flex:0 0 26px;text-align:right}
  .mpq-i{flex:0 0 36px;text-align:right;font-weight:700}
  .mp-list{list-style:none;margin:0;padding:0}
  .mp-li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 4px;border-top:1px solid var(--line-2);font-size:12.5px}
  .mp-li:first-child{border-top:0}
  /* ---------- Login (Supabase) ---------- */
  .authgate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:20px}
  .authgate[hidden]{display:none}
  .authbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 26px 22px;width:100%;max-width:360px}
  .authbrand{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .authbrand b{font-family:"Archivo",sans-serif;font-weight:800;font-size:16px}
  .authbrand span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .authbox h2{font-family:"Archivo",sans-serif;font-weight:700;font-size:18px;margin:0 0 14px}
  .authf{margin-bottom:12px}
  .authf label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
  .authf input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--elev);color:var(--ink);padding:0 11px;font-family:inherit;font-size:14px}
  .autherr{font-size:12.5px;margin-bottom:10px}
  .authbtns{display:flex;gap:8px;margin-top:6px}
  .authbtns .btn{flex:1;justify-content:center}
  .authnote{font-size:11px;color:var(--muted);margin-top:14px;text-align:center}
  .obra-del{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:6px}
  .obra-del:hover{background:var(--crit-bg);color:var(--crit)}

  /* ---------- Brand / logo ---------- */
  .logo{width:auto;display:block;height:30px}
  .logo-color{display:block}
  .logo-white{display:none}
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){ .logo-color{display:none} .logo-white{display:block} } }
  :root[data-theme="dark"]{ .logo-color{display:none} .logo-white{display:block} }
  .on-dark .logo-color{display:none!important}
  .on-dark .logo-white{display:block!important}
  /* Marca LPS: escada de quadrados em três tons. O tom escuro inverte no tema escuro e
     dentro do menu lateral (.on-dark), senão some no fundo. */
  .lpsmark{width:26px;height:26px;flex:0 0 auto;display:block}
  .on-dark .lpsmark,.lpsmark.on-dark{--lps-1:#E8EEF4}
  .brand-tag{display:inline-flex;flex-direction:column;line-height:1;border-left:1px solid var(--line);padding-left:12px}
  .brand-tag b{font-family:"Archivo",sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em}
  .brand-tag span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
  .on-dark .brand-tag{border-color:rgba(255,255,255,.16)}
  .on-dark .brand-tag b{color:#fff}
  .on-dark .brand-tag span{color:var(--nav-ink-2)}
  .topbar-brand{display:none;align-items:center;gap:10px;margin-right:2px}
  @media (max-width:900px){ .topbar-brand{display:flex} }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .print-only{display:none}
  /* Matriz compacta nas folhas do PDF (.print-page): linhas mais baixas, fonte menor, sem grip
     de arraste nem etiqueta de equipe (o tom da cor já distingue as equipes), nada sticky. Fica
     fora do @media print de propósito — a impressão mede a matriz nesse formato antes de
     escalar, e #printMat é display:none na tela, então isso não afeta a matriz normal. */
  .print-page .print-zoom{width:max-content} /* tabela no tamanho do conteúdo, igual à medição — nunca espremida pelo container */
  .print-page table.tcm{width:auto;min-width:0;font-size:9px}
  .print-page table.tcm thead th{position:static;padding:2px 4px;font-size:8.5px}
  .print-page table.tcm td.dt,.print-page table.tcm td.wk,.print-page table.tcm th:nth-child(1),.print-page table.tcm th:nth-child(2){position:static;width:auto;min-width:0;max-width:none}
  .print-page table.tcm td.dt,.print-page table.tcm td.wk{padding:1px 4px;font-size:8.5px;white-space:nowrap}
  .print-page .tcm-row{min-height:17px;max-width:120px} /* uma semana com muitos segmentos lado a lado não pode alargar a coluna inteira — encolhem, como na tela */
  .print-page .tcm-seg{padding:0 2px;font-size:8.5px;line-height:1.1;cursor:default}
  .print-page .tcm-grip,.print-page .tcm-team{display:none}
  .print-page .tcm-rain{font-size:7px}
  .print-page table.tcm td.sumname,.print-page table.tcm td.sumq{padding:1px 4px;font-size:8.5px}
  .print-page .tcm-badge{font-size:7px}
  @media print{
    @page{size:landscape;margin:10mm}
    @page lbFolha{size:auto;margin:10mm}
    body.printing-lb{page:lbFolha}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
    .side,.topbar,.tc-zoom,#cronoToolbar,.banner,.page-actions,.subtabs,.legend,.wip,.apptoast,.assign,.tc-svctoggle,.cv-toolbar{display:none!important}
    .cv-compact svg.chart{max-height:none!important}
    .app{display:block}
    .content{max-width:none!important;padding:0!important}
    .card{box-shadow:none;border:1px solid #ccc}
    .tc-wrap{max-height:none!important;overflow:visible!important}
    .print-only{display:block}
    /* No PDF, a matriz vem de #printMat (fatiada em folhas); a matriz da tela e o cabeçalho
       global saem do fluxo. Se #printMat estiver vazio (outra aba), volta ao comportamento
       normal via :empty. */
    .print-head{margin-bottom:8px}
    .print-head h2{font-family:"Archivo",sans-serif;font-size:16px;margin:0}
    body.printing-mat .print-head,
    body.printing-mat #cronoContent{display:none!important}

    body.printing-lb #lbPrint th,body.printing-lb #lbPrint td{border:1px solid #bbb;padding:2px 6px}

    body.printing-report #execRep select,body.printing-report #execRep button,body.printing-report #execRep .subtab{display:none!important}

    body.printing-report #repCard .card{break-inside:avoid;page-break-inside:avoid}

  /** Atualiza a "ordem" de vários lotes numa chamada só (upsert só na coluna ordem, por id) —
   * em vez de uma requisição sequencial por lote. Reordenar um lote arrastando desloca a ordem
   * de todos os lotes entre a posição de origem e a de destino; com dezenas/centenas de lotes,
   * atualizar um por um (esperando cada resposta) parecia travar o app por dezenas de segundos. */
  async function sbReorderLotes(items){
    if(!items.length)return;
    await sbRequireSession();
    // update em paralelo (não upsert): upsert roda a policy de INSERT mesmo quando o conflito
    // resolve pra update, e como só mandamos {id,ordem} (sem obra_id), a checagem de RLS do
    // insert rejeitava. update() de cada linha usa a policy de UPDATE (baseada na obra_id que já
    // está na linha), e continua tudo numa única leva em paralelo — não trava como o loop sequencial antigo.
    var results=await Promise.all(items.map(function(it){return SB.from('lotes').update({ordem:it.ordem}).eq('id',it.id);}));
    var failed=results.filter(function(r){return r.error;})[0];
    if(failed)throw failed.error;
  }

  /** Grava muitas quantidades de uma vez. Uma a uma eram 1200 idas ao banco numa planilha

  async function sbUpsertQuantidades(obraId,lista){
    if(!lista.length)return;
    await sbRequireSession();
    for(var i=0;i<lista.length;i+=400){
      var bloco=lista.slice(i,i+400).map(function(q){
        return {obra_id:obraId,lote_id:q.loteId,servico_id:q.servicoId,quantidade:q.quantidade,unidade:q.unidade||null};
      });
      var r=await SB.from('lote_servico').upsert(bloco,{onConflict:'lote_id,servico_id'});
      if(r.error)throw r.error;
    }
  }

  async function sbGerarEstacas(loteId,comprimento,espacamento){
    await sbRequireSession();
    // numero = distância em metros arredondada (não um índice sequencial à parte) — assim as
    // estacas criadas manualmente e as importadas via planilha (por distância) nunca colidem.
    var n=Math.max(0,Math.floor((Number(comprimento)||0)/(Number(espacamento)||20)));
    var existingDist={}; (ESTACAS[loteId]||[]).forEach(function(e){existingDist[Math.round(e.dist)]=true;});
    var toCreate=[];
    for(var i=0;i<=n;i++){
      var dist=Math.round(i*(Number(espacamento)||20));
      if(!existingDist[dist])toCreate.push({id:newUuid(),obra_id:selectedObra.id,lote_id:loteId,numero:dist,distancia_m:dist});
    }
    if(!toCreate.length)return 0;
    var r=await SB.from('lote_estacas').insert(toCreate);
    if(r.error)throw r.error;
    return toCreate.length;
  }

  /* O Supabase corta todo SELECT em 1000 linhas por padrão (Settings → API → Max rows) e NÃO
   * avisa: devolve a primeira página como se fosse o resultado inteiro. Numa obra com 80 lotes
   * × 14 serviços são 1120 quantidades — as que sobravam simplesmente não existiam pro app, a
   * matriz vinha com buracos e a importação parecia não ter gravado nada. Lê em páginas até vir
   * uma incompleta. A query é remontada a cada página porque o builder do supabase-js só pode
   * ser executado uma vez, e precisa de ordem estável (id) senão o Postgres pode repetir ou
   * pular linha entre as páginas. */
  async function sbTudo(fazQuery,tamPagina){
    var tam=tamPagina||1000, ini=0, out=[];
    for(;;){
      var r=await fazQuery().range(ini,ini+tam-1);
      if(r.error)return {data:null,error:r.error};
      var d=r.data||[];
      out=out.length?out.concat(d):d;
      if(d.length<tam)return {data:out,error:null};
      ini+=tam;
    }
  }
  async function sbLoadEstacas(loteId){
    await sbRequireSession();
    var res=await Promise.all([
      sbTudo(function(){return SB.from('lote_estacas').select('*').eq('lote_id',loteId).order('numero',{ascending:true}).order('id',{ascending:true});}),
      sbTudo(function(){return SB.from('estaca_quantidades').select('estaca_id,servico_id,quantidade,volume_projeto,volume_realizado').eq('lote_id',loteId).order('id',{ascending:true});}),
      sbTudo(function(){return SB.from('estaca_apontamentos').select('estaca_id,servico_id,data_inicio,data_fim,producao_diaria_id').eq('lote_id',loteId).order('id',{ascending:true});})
    ]);
    res.forEach(function(x){if(x.error)throw x.error;});
    var est=res[0].data||[], qty=res[1].data||[], ap=res[2].data||[];
    ESTACAS[loteId]=est.map(function(r){return {id:r.id,numero:r.numero,dist:Number(r.distancia_m)||0};});
    var qtyMap={}, volMap={};
    qty.forEach(function(r){
      var k=r.estaca_id+'::'+r.servico_id;
      qtyMap[k]=Number(r.quantidade)||0;
      volMap[k]={proj:r.volume_projeto!=null?Number(r.volume_projeto):null,
                 real:r.volume_realizado!=null?Number(r.volume_realizado):null};
    });
    ESTACA_QTY[loteId]=qtyMap; ESTACA_VOL[loteId]=volMap;
    var apMap={}; ap.forEach(function(r){apMap[r.estaca_id+'::'+r.servico_id]={inicio:r.data_inicio||'',fim:r.data_fim||'',prodId:r.producao_diaria_id||null};});

  /* ---------- Retrato offline da obra (IndexedDB) ----------
   * Guarda as linhas como vieram do banco. Serve o que o cronograma precisa: obra, serviços,
   * lotes, quantidades, recursos, realizado, cenários, produção e apoio. As telas que buscam
   * sozinhas quando abrem (programação semanal, médio prazo, PPC, medições) continuam pedindo
   * rede — offline elas avisam em vez de mostrar dado velho. */
  var IDB_NOME='lps-tripoloni', IDB_LOJA='obras';
  function idbAbrir(){
    return new Promise(function(ok,err){
      try{
        var r=indexedDB.open(IDB_NOME,1);
        r.onupgradeneeded=function(){ var db=r.result; if(!db.objectStoreNames.contains(IDB_LOJA))db.createObjectStore(IDB_LOJA); };
        r.onsuccess=function(){ ok(r.result); };
        r.onerror=function(){ err(r.error); };
      }catch(e){ err(e); }
    });
  }
  function idbTx(modo,fn){
    return idbAbrir().then(function(db){
      return new Promise(function(ok,err){
        var tx=db.transaction(IDB_LOJA,modo), st=tx.objectStore(IDB_LOJA), req=fn(st);
        req.onsuccess=function(){ ok(req.result); };
        req.onerror=function(){ err(req.error); };
      });
    });
  }
  function offlineSalvar(obraId,dados){
    return idbTx('readwrite',function(st){ return st.put({em:new Date().toISOString(),dados:dados},'obra:'+obraId); })
      .catch(function(){ /* aparelho sem IndexedDB ou armazenamento cheio: segue sem retrato */ });
  }
  function offlineLer(obraId){
    return idbTx('readonly',function(st){ return st.get('obra:'+obraId); }).catch(function(){ return null; });
  }

   * A produtividade é cadastrada por equipe e por SEMANA, mas em campo a conversa é por hora.
   * Aqui a mesma produtividade aparece dividida pela jornada, e com a opção de ler tudo em metro
   * linear ou em m3 — o que depende da seção de cada serviço (largura x espessura). Seção e
   * jornada ficam na config do próprio serviço, que já vai pro banco: nenhuma coluna nova. */
  var REL_UNID='cad';                     // unidade de exibição: cad | m | m3
  var SUP2=String.fromCharCode(178);      // o "2" sobrescrito de m2
  var SUP3=String.fromCharCode(179);      // o "3" sobrescrito de m3
  var M3=('m'+SUP3);
  function fmtDec(n,c){
    if(n==null||!isFinite(n))return '—';
    c=(c==null)?2:c;
    return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
  }
  /** Casas decimais conforme a ordem de grandeza: 0,42 e 1.280 na mesma coluna, ambos legíveis. */
  function fmtAuto(n){
    if(n==null||!isFinite(n))return '—';
    var a=Math.abs(n);
    return fmtDec(n, a>=100?0 : (a>=10?1:2));
  }
  /** Jornada em horas por dia. Guardada igual em todos os serviços porque é a única forma de
   *  gravar um ajuste da obra inteira sem coluna nova — quem lê pega o primeiro que tiver. */
  function relHorasDia(){
    for(var i=0;i<SERV.length;i++){ var h=+((SERV[i].cfg||{}).horas_dia); if(h>0)return h; }
    return 8.8;                           // 44h semanais / 5 dias úteis
  }
  /** Seção transversal: largura x espessura = quantos m3 cabem em 1 metro linear do serviço. */
  function svcSecao(sv){
    var c=sv.cfg||{}, l=+c.largura_m||0, e=+c.espessura_m||0;
    return {larg:l,esp:e,area:(l>0&&e>0)?(l*e):0};
  }
  /** Só dá pra converter entre linear e volume; m2, un, t e afins ficam como estão. */
  function tipoUnid(u){
    // O expoente vira digito ANTES de limpar: sem isso "m2" sobrava como "m" e area entrava na
    // conversao como se fosse metro linear.
    var k=String(u==null?'':u).toLowerCase().split(SUP3).join('3').split(SUP2).join('2').replace(/[^a-z0-9]/g,'');
    if(k==='m3'||k==='mc')return 'volume';
    if(k==='m'||k==='ml')return 'linear';
    return 'outra';
  }
  /** Valor da unidade cadastrada do serviço para a unidade escolhida no relatório.
   *  ok=false quer dizer que falta a seção: devolve o valor original em vez de inventar número. */
  function relConv(v,sv){
    var t=tipoUnid(sv.u);
    if(REL_UNID==='cad'||t==='outra')return {v:v,u:sv.u,ok:true};
    var a=svcSecao(sv).area;
    if(REL_UNID==='m3'){
      if(t==='volume')return {v:v,u:M3,ok:true};
      if(!a)return {v:v,u:sv.u,ok:false};
      return {v:v*a,u:M3,ok:true};
    }
    if(t==='linear')return {v:v,u:'m',ok:true};
    if(!a)return {v:v,u:sv.u,ok:false};
    return {v:v/a,u:'m',ok:true};
  }

    await comCarga(async function(){

  /** Praticabilidade média que o cronograma aplica a ESTE serviço: a média do fator das semanas
   *  em que ele produz. É o mesmo weekFactor que alonga a duração dentro do motor, então o número
   *  daqui fecha com o cronograma em vez de ser uma conta paralela. Serviço que não está no
   *  cronograma cai no pior período cadastrado — sem semana, não há o que ponderar. */
  function svcPratFator(si,segs,cache,periods){
    if(!periods||!periods.length)return 1;
    var soma=0,n=0;
    (segs||[]).forEach(function(sg){
      if(sg.si!==si)return;
      for(var i=0;i<sg.dur;i++){ if(!(sg.wq[i]>0))continue; soma+=weekFactor(sg.start+i,periods,cache); n++; }
    });
    if(n)return soma/n;
    var pior=1;
    periods.forEach(function(rp){
      if(!rp.start||!rp.end)return;
      var f=(1-Math.min(100,Math.max(0,+rp.producao||0))/100)*(1-Math.min(100,Math.max(0,+rp.dias||0))/100);
      pior=Math.min(pior,f);

  /** Barras por semana (uma ou mais séries lado a lado) com eixo de semanas + meses. opts.dateFn
   *  diz qual calendário: mondayOf (cronograma, pula recesso) ou calWeekDate (histograma). */
  function barsSVG(el,series,opts){
    if(!el)return; opts=opts||{};
    var W=opts.W||900,H=opts.H||200,pl=52,pr=opts.acc?60:12,pt=24,pb=48,iw=W-pl-pr,ih=H-pt-pb, dateFn=opts.dateFn||mondayOf;
    var n=0; series.forEach(function(sr){n=Math.max(n,sr.values.length);}); n=Math.max(1,n);
    var mx=0; series.forEach(function(sr){sr.values.forEach(function(v){mx=Math.max(mx,v||0);});}); if(mx<=0)mx=1;
    var unit=mx>2000?1000:(mx>200?100:(mx>20?10:1)), top=Math.max(unit,Math.ceil(mx/4/unit)*unit*4);
    var yy=function(v){return pt+ih-ih*v/top;}, gap=iw/n, k=series.length, bw=gap*0.8/k, s='';
    for(var g=0;g<=4;g++){var val=top*g/4;s+='<line x1="'+pl+'" y1="'+yy(val)+'" x2="'+(W-pr)+'" y2="'+yy(val)+'" stroke="var(--line)"/><text class="axm" x="'+(pl-6)+'" y="'+(yy(val)+3)+'" text-anchor="end">'+fmtBR(val)+'</text>';}
    var passoS=labelStep(gap/Math.max(1,k),7);
    series.forEach(function(sr,j){ sr.values.forEach(function(v,i){ if(!(v>0))return; var x=pl+gap*i+gap*0.1+bw*j;
      s+='<rect x="'+x.toFixed(1)+'" y="'+yy(v).toFixed(1)+'" width="'+Math.max(0.5,bw-0.6).toFixed(1)+'" height="'+Math.max(0,yy(0)-yy(v)).toFixed(1)+'" rx="1" fill="'+sr.color+'"><title>S'+isoWeek(dateFn(i+1))+(sr.label?' · '+sr.label:'')+': '+fmtBR(v)+'</title></rect>';
      if(i%passoS===0)s+=barLabelSVG(x+bw/2,yy(v),bw,v); }); });
    var wn=[]; for(var i2=0;i2<n;i2++)wn.push(i2+1);
    s+=weekAxisSVG(wn,function(i){return pl+gap*i+gap/2;},gap,pt+ih,pl,W-pr,dateFn);
    if(opts.acc)s+=accLinesSVG(opts.acc,function(i){return pl+gap*i+gap/2;},W-pr,pt,ih,wn.map(function(w){return 'S'+isoWeek(dateFn(w));}));
    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;
  }

      var r=ws.addRow(v);
      r.getCell(1).font={color:{argb:argb(svcColor(L.sv))},bold:true};

      r.getCell(7).numFmt='#,##0.##';
      [8+d,9+d].forEach(function(i){ r.getCell(i).numFmt='#,##0.00'; });
      [10+d,11+d].forEach(function(i){ r.getCell(i).numFmt='#,##0.##'; });
      if(!L.okConv&&REL_UNID!=='cad')r.getCell(12+d).font={color:{argb:'FFB45309'}};

    a.download=(nome.replace(/[\\/:*?"<>|]+/g,'_').trim()||'obra')+'_produtividade.xlsx';

  }
  /* A mesma calculadora do relatório, agora como aba de trabalho do Tempo Caminho: é aqui que se
   * cadastra a seção de cada serviço e se compara o ritmo cheio com o ritmo que a chuva deixa. */
  VIEWS['cr-prod']=function(){
    if(!SERV.length)return '<div class="card"><div class="note">Nenhum serviço cadastrado ainda. Cadastre em Tempo Caminho &rarr; Serviços.</div></div>';
    return prodHoraHTML();
  };
  /* ================= Oficina do Tempo-Caminho (estudo) =================
   * Uma bancada: matriz em branco, e o cronograma nasce de clicar célula a célula em vez de ser
   * calculado de ponta a ponta. O que muda em relação à Matriz é QUEM decide a ordem — aqui a
   * sequência dos lotes é livre (pode ir de trás pra frente, pular, voltar), e o app só garante
   * duas coisas: predecessora concluída no mesmo lote e equipe livre. A duração nunca é digitada:
   * sai de packSegment, o mesmo do motor, com a chuva reduzindo semana a semana.
   *
   * Nada daqui vai pro banco, nem pro cronograma ao vivo, nem pra um cenário. Vive na memória
   * desta aba e some ao recarregar a página — é de propósito, pra poder experimentar sem medo. */
  var OFI=null;
  function ofiInit(){ if(!OFI)OFI={plano:[],prox:1,pincel:{si:null,team:0},fimAuto:null};
    if(!OFI.pincel)OFI.pincel={si:null,team:0};
    return OFI; }
  /** Equipes já colocadas neste serviço dentro deste lote. */
  function ofiEquipesNoLote(li,si,ignoraId){
    return ofiInit().plano.filter(function(x){ return x.li===li&&x.si===si&&x.id!==ignoraId; })
      .map(function(x){ return x.team; });
  }
  /** Quanto cabe a cada equipe quando mais de uma ataca o mesmo serviço no mesmo lote.
   *  O rateio é PROPORCIONAL à produtividade de cada equipe, pra todas terminarem na mesma
   *  semana. Em partes iguais, a equipe rápida acaba antes e deixa a lenta sozinha no fim: o
   *  lote passa a terminar na data da mais lenta e juntar equipe chega a ATRASAR o lote — com
   *  16.000 m3, uma equipe de 6.000/sem leva 3 semanas, e somar uma de 2.000/sem em partes
   *  iguais levava a 4. Proporcional, as duas terminam em 2. */
  function ofiRateio(li,si,times){
    var sv=SERV[si], tot=(QTY[li]||[])[si]||0, soma=0, out={};
    times.forEach(function(t){ soma+=ofiProd(sv,t); });
    times.forEach(function(t){
      out[t]=(soma>0)?(tot*ofiProd(sv,t)/soma):(tot/Math.max(1,times.length));
    });
    return out;
  }
  /** Parte de uma equipe específica, considerando quem mais está no lote. */
  function ofiQtdDaEquipe(li,si,times,team){
    return ofiRateio(li,si,times)[team];
  }
  /** Produtividade da equipe: a específica dela, se cadastrada; senão a do serviço. */
  function ofiProd(s,team){
    var tp=(s.cfg&&s.cfg.teamProductivities)||[];
    return (tp[team-1]>0)?Number(tp[team-1]):pnum(s.p);
  }
  /** O plano vira segmentos do mesmo formato da matriz — duração calculada, nunca digitada. */
  function ofiCalc(plano){
    var periods=calRainPeriods(), cache={};
    var lista=plano||ofiInit().plano;
    var times={}; lista.forEach(function(x){ var k=x.li+'::'+x.si; (times[k]||(times[k]=[])).push(x.team); });
    var rateios={};
    Object.keys(times).forEach(function(k){ var pr=k.split('::'); rateios[k]=ofiRateio(+pr[0],+pr[1],times[k]); });
    return lista.map(function(it){
      var s=SERV[it.si]; if(!s)return null;
      var k=it.li+'::'+it.si;
      var prod=ofiProd(s,it.team), qty=(rateios[k]||{})[it.team]||0;
      if(!(prod>0)||!(qty>0))return null;
      var pk=packSegment(it.ini-1,qty/prod,prod,qty,periods,cache);
      return {id:it.id,li:it.li,si:it.si,team:it.team,qty:qty,
              start:pk.start,dur:pk.duration,wq:pk.wq,color:svcColor(s),name:s.n,
              divididoEm:times[k].length};
    }).filter(Boolean);
  }
  /** Primeira semana >= desejada em que dá pra começar: predecessoras concluídas NESTE lote e a
   *  equipe livre. A posição do lote na lista não entra na conta — é exatamente a amarra que a
   *  oficina existe pra soltar. Devolve também o porquê, pra tela poder explicar o deslize. */
  function ofiPrimeiraValida(li,si,team,desejada,ignoraId,qtdEquipe){
    var s=SERV[si], periods=calRainPeriods(), cache={};
    var segs=ofiCalc().filter(function(g){ return g.id!==ignoraId; });
    var minW=1, nomes=[];
    ((s.cfg&&s.cfg.predecessors)||[]).forEach(function(pid){
      var psi=-1; SERV.forEach(function(x,i){ if(x.id===pid)psi=i; });
      if(psi<0)return;
      segs.forEach(function(g){
        if(g.li!==li||g.si!==psi)return;
        var alvo=(s.cfg&&s.cfg.parallelWithPredecessor)
          ? (g.start+(s.lag||0))
          : (g.start+g.dur+(s.lag||0));
        if(alvo>minW){ minW=alvo; nomes=[SERV[psi].n]; }
        else if(alvo===minW&&nomes.indexOf(SERV[psi].n)<0)nomes.push(SERV[psi].n);
      });
    });
    var prod=ofiProd(s,team);
    var qty=(qtdEquipe!=null)?qtdEquipe
      :ofiQtdDaEquipe(li,si,ofiEquipesNoLote(li,si,ignoraId).concat([team]),team);
    var w=Math.max(desejada,minW), porEquipe=false, guard=0;
    if(!(prod>0)||!(qty>0))return {semana:w,minPred:minW,predNomes:nomes,porEquipe:false,impossivel:true};
    while(guard++<1000){
      var pk=packSegment(w-1,qty/prod,prod,qty,periods,cache);
      var meu={start:pk.start,dur:pk.duration}, bate=null;
      for(var i=0;i<segs.length;i++){
        var g=segs[i];
        if(g.si!==si||g.team!==team)continue;
        // Sobreposição ESTRITA, diferente da matriz. Lá o lote seguinte começa numa posição
        // fracionária e consome só o resto da semana de transição; aqui toda colocação começa em
        // semana cheia, então deixar as duas dividirem a semana daria à equipe mais de uma semana
        // de capacidade — era por isso que a mesma equipe aparecia fazendo 9.000 numa semana de
        // 6.000.
        if(!((meu.start+meu.dur-1)<g.start||meu.start>(g.start+g.dur-1))){ bate=g; break; }
      }
      if(!bate)return {semana:w,minPred:minW,predNomes:nomes,porEquipe:porEquipe};
      w=bate.start+bate.dur; porEquipe=true;
    }
    return {semana:w,minPred:minW,predNomes:nomes,porEquipe:porEquipe};
  }
  /** O que está fora de ordem AGORA. A sugestão na hora de colocar só enxerga o que já existe:
   *  quem coloca o CFT antes do Corte não viola nada naquele instante, e passa a violar quando o
   *  Corte entra. Sem esta lista a bancada mentiria sobre a própria regra. */
  function ofiPendencias(segs){
    var out=[], porLoteSvc={};
    segs.forEach(function(g){ porLoteSvc[g.li+'::'+g.si]=g; });
    segs.forEach(function(g){
      var sv=SERV[g.si];
      ((sv.cfg&&sv.cfg.predecessors)||[]).forEach(function(pid){
        var psi=-1; SERV.forEach(function(x,i){ if(x.id===pid)psi=i; });
        if(psi<0)return;
        var pg=porLoteSvc[g.li+'::'+psi];
        if(!pg){
          if(((QTY[g.li]||[])[psi]||0)>0)
            out.push({id:g.id,txt:SERV[psi].n+' ainda não foi colocado em '+LOTS[g.li]+', e vem antes de '+sv.n+'.'});
          return;
        }
        var alvo=(sv.cfg&&sv.cfg.parallelWithPredecessor)?(pg.start+(sv.lag||0)):(pg.start+pg.dur+(sv.lag||0));
        if(g.start<alvo)
          out.push({id:g.id,txt:sv.n+' em '+LOTS[g.li]+' começa na S'+isoWeek(mondayOf(g.start))+
            ', antes do que a predecessora '+SERV[psi].n+' permite (S'+isoWeek(mondayOf(alvo))+').'});
      });
    });
    for(var i=0;i<segs.length;i++)for(var j=i+1;j<segs.length;j++){
      var a=segs[i], b=segs[j];
      if(a.si!==b.si||a.team!==b.team)continue;
      if(!((a.start+a.dur-1)<b.start||a.start>(b.start+b.dur-1)))
        out.push({id:b.id,txt:teamLabel(a.name,a.team)+' de '+a.name+' estaria em '+LOTS[a.li]+' e '+LOTS[b.li]+' na mesma semana.'});
    }
    // Invariante: numa semana, uma equipe não produz mais do que a produtividade dela (reduzida
    // pela praticabilidade). Vale a checagem porque o estouro nasce da SOMA de dois segmentos da
    // mesma equipe, e cada um isolado parece certo.
    var periods=calRainPeriods(), cacheC={}, porEqSem={};
    segs.forEach(function(g){
      for(var i=0;i<g.dur;i++){
        var k=g.si+'::'+g.team+'::'+(g.start+i);
        porEqSem[k]=(porEqSem[k]||0)+(g.wq[i]||0);
      }
    });
    Object.keys(porEqSem).forEach(function(k){
      var pr=k.split('::'), si=+pr[0], team=+pr[1], w=+pr[2], sv=SERV[si];
      if(!sv)return;
      var teto=ofiProd(sv,team)*weekFactor(w,periods,cacheC);
      if(porEqSem[k]>teto+0.5)
        out.push({id:0,txt:teamLabel(sv.n,team)+' de '+sv.n+' produziria '+fmtBR(porEqSem[k])+' '+sv.u+
          ' na S'+isoWeek(mondayOf(w))+', acima dos '+fmtBR(teto)+' que a equipe faz numa semana.'});
    });
    return out;
  }
  /** Reaplica a sugestão em quem está fora de ordem, em passadas, até não sobrar nada que dê pra
   *  resolver deslizando. Não inventa colocação que falta — isso é decisão de quem monta. */
  function ofiArrumar(){
    for(var passo=0;passo<12;passo++){
      var segs=ofiCalc(), pend=ofiPendencias(segs);
      var mexeu=false;
      var ids={}; pend.forEach(function(x){ ids[x.id]=1; });
      OFI.plano.slice().sort(function(a,b){ return a.ini-b.ini; }).forEach(function(it){
        if(!ids[it.id])return;
        var r=ofiPrimeiraValida(it.li,it.si,it.team,1,it.id);
        if(r.impossivel)return;
        if(r.semana!==it.ini){ it.ini=r.semana; mexeu=true; }
      });
      if(!mexeu)break;
    }
  }
  /** Uma pincelada: coloca o serviço que está na mão, sem diálogo, e avisa por toast se deslizou.
   *  É o modo de desenhar — escolhe a tinta uma vez e sai aplicando lote a lote. */
  function ofiPincela(li,semana){
    var si=ofiInit().pincel.si; if(si==null)return false;
    var sv=SERV[si]; if(!sv)return false;
    if(!((QTY[li]||[])[si]>0)){ toast(sv.n+' não tem quantidade em '+LOTS[li]+'.'); return true; }
    // Mais de uma equipe no mesmo lote é permitido — o que não dá é repetir a MESMA equipe, que
    // seria a mesma gente em dois lugares. A quantidade passa a ser dividida entre elas.
    var usadas=ofiEquipesNoLote(li,si,null);
    var fixa=OFI.pincel.team, times=[];
    if(fixa>0){
      if(usadas.indexOf(fixa)>=0){ toast(teamLabel(sv.n,fixa)+' já está em '+LOTS[li]+' — escolha outra equipe ou solte o pincel pra mover o bloco.'); return true; }
      times=[fixa];
    } else {
      for(var t=1;t<=Math.max(1,sv.eq||1);t++)if(usadas.indexOf(t)<0)times.push(t);
      if(!times.length){ toast('Todas as equipes de '+sv.n+' já estão em '+LOTS[li]+'.'); return true; }
    }
    var melhor=null;
    times.forEach(function(t){
      var q=ofiQtdDaEquipe(li,si,usadas.concat([t]),t);
      var r=ofiPrimeiraValida(li,si,t,semana,null,q);
      if(r.impossivel)return;
      if(!melhor||r.semana<melhor.r.semana)melhor={t:t,r:r,q:q};
    });
    if(!melhor){ toast('Não dá pra calcular '+sv.n+' em '+LOTS[li]+' — falta quantidade ou produtividade.'); return true; }
    OFI.plano.push({id:OFI.prox++,li:li,si:si,team:melhor.t,ini:melhor.r.semana});
    if(melhor.r.semana!==semana){
      var m=[];
      if(melhor.r.predNomes.length)m.push('depende de '+melhor.r.predNomes.join(', '));
      if(melhor.r.porEquipe)m.push(teamLabel(sv.n,melhor.t)+' já ocupada');
      toast(sv.n+' em '+LOTS[li]+' deslizou pra S'+isoWeek(mondayOf(melhor.r.semana))+(m.length?' — '+m.join(' e '):'')+'.');
    } else if(usadas.length){
      toast(sv.n+' em '+LOTS[li]+' agora com '+(usadas.length+1)+' equipes, rateadas pela produtividade — '+
        fmtBR(melhor.q)+' '+sv.u+' pra '+teamLabel(sv.n,melhor.t)+'.');
    }
    go(current);
    return true;
  }
  /** Diálogo de colocar/mover um serviço numa célula (lote x semana). */
  function ofiDialogo(li,semana,editId){
    var atual=editId?ofiInit().plano.filter(function(x){return x.id===editId;})[0]:null;
    var cands=SERV.map(function(sv,si){ return {sv:sv,si:si,qty:(QTY[li]||[])[si]||0}; })
      .filter(function(c){ return c.qty>0; });
    if(!cands.length&&!atual){
      alert('Nenhum serviço com quantidade em ' + LOTS[li] + '.' + String.fromCharCode(10) + String.fromCharCode(10) +

    }).join('');
    back.innerHTML='<div class="segmenu-panel card" style="max-width:460px">'+

      '<div class="note" style="margin-bottom:12px">A duração não se digita: sai da quantidade do lote dividida pela produtividade da equipe, com a chuva reduzindo semana a semana. Se a semana escolhida não servir, o app desliza pra primeira que serve e diz por quê.</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+
        '<label>Serviço<select class="esel" id="ofiSvc">'+svcOpts+'</select></label>'+
        '<label>Equipe<select class="esel" id="ofiTeam"></select></label>'+
        '<div class="note" id="ofiPrev" style="min-height:3.2em"></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap">'+
        (atual?'<button class="btn" id="ofiDel">Remover</button>':'')+
        '<button class="btn" id="ofiCancel">Cancelar</button>'+

    document.body.appendChild(back);

    var selSvc=back.querySelector('#ofiSvc'), selTeam=back.querySelector('#ofiTeam'), prev=back.querySelector('#ofiPrev');
    function enchEquipes(){
      var sv=SERV[+selSvc.value], n=Math.max(1,sv.eq||1), o='', usadas=ofiEquipesNoLote(li,+selSvc.value,editId), primeira=null;
      for(var t=1;t<=n;t++){
        var ocupada=usadas.indexOf(t)>=0;
        if(!ocupada&&primeira==null)primeira=t;
        o+='<option value="'+t+'"'+(ocupada?' disabled':'')+(atual&&atual.team===t?' selected':'')+'>'+
          escAttr(teamLabel(sv.n,t))+(ocupada?' — já neste lote':'')+'</option>';
      }
      selTeam.innerHTML=o;
      if(!(atual&&usadas.indexOf(atual.team)<0)&&primeira!=null&&selTeam.selectedOptions[0]&&selTeam.selectedOptions[0].disabled)selTeam.value=String(primeira);
      if(primeira==null&&!atual)selTeam.innerHTML=o;   // todas ocupadas: deixa visível o porquê
    }
    function previa(){
      var si=+selSvc.value, team=+selTeam.value;
      var outras=ofiEquipesNoLote(li,si,editId);
      var nEq=outras.length+1;
      var qty=ofiQtdDaEquipe(li,si,outras.concat([team]),team);
      var r=ofiPrimeiraValida(li,si,team,semana,editId,qty);
      if(r.impossivel){ prev.innerHTML='<span style="color:var(--crit)">Sem quantidade neste lote ou sem produtividade cadastrada — não dá pra calcular a duração.</span>'; return r; }
      var sv=SERV[si], prod=ofiProd(sv,team);
      var pk=packSegment(r.semana-1,qty/prod,prod,qty,calRainPeriods(),{});
      var fim=pk.start+pk.duration-1;
      var txt='<b>S'+isoWeek(mondayOf(pk.start))+'</b> até <b>S'+isoWeek(mondayOf(fim))+'</b> — '+pk.duration+' semana(s), '+fmtBR(qty)+' '+escAttr(sv.u)+
        (nEq>1?(' <span style="color:var(--warn)">(de '+fmtBR((QTY[li]||[])[si]||0)+' — rateado entre '+nEq+' equipes pela produtividade de cada uma)</span>'):'')+'.';
      var motivos=[];
      if(r.semana>semana){
        if(r.predNomes.length)motivos.push('depende de '+r.predNomes.join(', ')+' neste lote');
        if(r.porEquipe)motivos.push(escAttr(teamLabel(sv.n,team))+' já está ocupada antes');
        txt+='<br><span style="color:var(--warn)">Deslizou da S'+isoWeek(mondayOf(semana))+' para a S'+isoWeek(mondayOf(r.semana))+
          (motivos.length?' — '+motivos.join(' e '):'')+'.</span>';
      }
      prev.innerHTML=txt;
      return r;
    }
    selSvc.addEventListener('change',function(){ enchEquipes(); previa(); });
    selTeam.addEventListener('change',previa);
    back.querySelector('#ofiCancel').addEventListener('click',fecha);
    var del=back.querySelector('#ofiDel');
    if(del)del.addEventListener('click',function(){
      OFI.plano=OFI.plano.filter(function(x){ return x.id!==editId; });
      fecha(); go(current);
    });
    back.querySelector('#ofiOk').addEventListener('click',function(){
      var r=previa(); if(r.impossivel)return;
      var si=+selSvc.value, team=+selTeam.value;
      if(editId){
        OFI.plano.forEach(function(x){ if(x.id===editId){ x.si=si; x.team=team; x.ini=r.semana; } });
      } else {
        OFI.plano.push({id:OFI.prox++,li:li,si:si,team:team,ini:r.semana});
      }
      fecha(); go(current);
    });
    enchEquipes(); previa();
  }
  function ofiMatrizHTML(segs,lotIdxs,totalWeeks){
    var cell={};
    segs.forEach(function(sg){
      for(var i=0;i<sg.dur;i++){
        var k=(sg.start+i)+'::'+sg.li;
        (cell[k]||(cell[k]=[])).push({sg:sg,qty:sg.wq[i],isStart:i===0});
      }
    });
    var th='<th>Segunda-feira</th><th>Semana</th>'+lotIdxs.map(function(li){return '<th class="lot">'+escAttr(LOTS[li])+'</th>';}).join('');

    var calRows=buildCalendarRows(totalWeeks), body='';
    for(var idx=calRows.length-1;idx>=0;idx--){
      var entry=calRows[idx], d=entry.date;
      if(entry.isHoliday){
        body+='<tr class="tcm-holrow'+(ehSemanaDeHoje(d)?' tcm-hoje':'')+'"><td class="dt">'+fmtDate(d)+'</td><td class="wk">S'+isoWeek(d)+'</td>'+
          '<td class="tcm-holcell" colspan="'+Math.max(1,lotIdxs.length)+'">⏸ Semana paralisada — produção 0</td></tr>';
        continue;
      }
      var w=entry.working, f=weekFactor(w,periods,cacheF), tds='';
      var rainBadge=f<0.999?' <span class="tcm-rain" title="Praticabilidade reduzida">🌧 '+Math.round(f*100)+'%</span>':'';
      for(var lx=0;lx<lotIdxs.length;lx++){
        var li=lotIdxs[lx];
        var subs=(cell[w+'::'+li]||[]).filter(function(sc){ return sc.qty>0; });
        if(!subs.length){ tds+='<td class="cell" data-ofinovo="'+li+'::'+w+'" title="Clique pra colocar um serviço aqui"></td>'; continue; }
        var inner=subs.map(function(sc,i){
          return '<div class="tcm-seg" data-ofiedit="'+sc.sg.id+'" style="flex:'+Math.max(sc.qty,1)+' 1 0;background:'+sc.sg.color+';color:'+pickFont(sc.sg.color)+

        }).join('');
        tds+='<td class="cell" data-ofinovo="'+li+'::'+w+'"><div class="tcm-row">'+inner+'</div></td>';
      }
      var ehHoje=ehSemanaDeHoje(d);
      var cls=[(f<0.999?'tcm-rainrow':''),(ehHoje?'tcm-hoje':'')].filter(Boolean).join(' ');
      body+='<tr'+(cls?' class="'+cls+'"':'')+'><td class="dt">'+fmtDate(d)+'</td><td class="wk">S'+isoWeek(d)+(ehHoje?'<span class="tcm-hojetag">hoje</span>':'')+rainBadge+'</td>'+tds+'</tr>';
    }
    return '<div class="tc-wrap ofi'+(ofiInit().pincel.si!=null?' pincel':'')+'"><table class="tcm"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div>';

  VIEWS['cr-oficina']=function(){

    var lotIdxs=viewLotIdxs();
    var segs=ofiCalc();
    var fimEstudo=0; segs.forEach(function(g){ fimEstudo=Math.max(fimEstudo,g.start+g.dur-1); });
    var totalWeeks=Math.max(fimEstudo+6,26);
    // quantas colocações faltam: serviço com quantidade no lote e ainda não colocado
    var postos={}; segs.forEach(function(g){ postos[g.li+'::'+g.si]=1; });
    var faltam=0, total=0;
    lotIdxs.forEach(function(li){ SERV.forEach(function(sv,si){
      if(!((QTY[li]||[])[si]>0))return;
      total++; if(!postos[li+'::'+si])faltam++;
    }); });
    // comparação com o automático: é pra isso que a oficina existe
    // O cronograma ao vivo não muda enquanto se desenha aqui, e buildSchedule() a cada pincelada
    // deixaria o clique lento numa obra grande. Calcula uma vez por sessão da oficina.
    if(OFI.fimAuto==null){
      var fa=0; buildSchedule().forEach(function(g){ fa=Math.max(fa,g.start+g.dur-1); });
      OFI.fimAuto=fa;
    }
    var fimAuto=OFI.fimAuto;
    var cmp='';
    if(fimEstudo>0){
      var dif=fimEstudo-fimAuto;
      cmp='<div class="grid g4" style="margin-bottom:12px">'+
        kpi('accent','Seu estudo','S'+isoWeek(mondayOf(fimEstudo)),fimEstudo+' semanas de projeto')+
        kpi('info','Cronograma automático','S'+isoWeek(mondayOf(fimAuto)),fimAuto+' semanas de projeto')+
        // Comparar um estudo pela metade com o cronograma inteiro daria uma vitória falsa: falta
        // serviço pra colocar, não é que o estudo seja mais rápido.
        (faltam
          ? kpi('warn','Diferença','—','estudo incompleto: faltam '+faltam+' colocação(ões)')
          : kpi(dif>0?'crit':(dif<0?'good':'info'),'Diferença',(dif>0?'+':'')+dif+' sem',
                dif>0?'o estudo termina depois':(dif<0?'o estudo termina antes':'empatam')))+
        kpi('warn','Colocações',(total-faltam)+' de '+total,faltam?(faltam+' ainda sem colocar'):'tudo colocado')+
      '</div>';
    }
    // Paleta: só serviços com quantidade em algum lote à vista — o resto não tem o que desenhar.
    var pincel=OFI.pincel, sel=(pincel.si!=null)?SERV[pincel.si]:null;
    var tintas=SERV.map(function(sv,si){
      var temQtd=lotIdxs.some(function(li){ return ((QTY[li]||[])[si]||0)>0; });
      if(!temQtd)return '';
      var on=(pincel.si===si);
      return '<button class="ofi-tinta'+(on?' on':'')+'" data-ofitinta="'+si+'" title="'+(on?'Serviço na mão — clique pra soltar':'Escolher este serviço pra desenhar')+'">'+
        '<span class="swatch" style="background:'+svcColor(sv)+'"></span>'+escAttr(sv.n)+'</button>';
    }).join('');
    var equipeSel='';
    if(sel){
      var o='<option value="0"'+(pincel.team===0?' selected':'')+'>equipe que estiver livre</option>';
      for(var t=1;t<=Math.max(1,sel.eq||1);t++)o+='<option value="'+t+'"'+(pincel.team===t?' selected':'')+'>'+escAttr(teamLabel(sel.n,t))+'</option>';
      equipeSel='<select class="esel" id="ofiEquipe" style="height:28px;font-size:12px">'+o+'</select>';
    }
    var paleta='<div class="ofi-pal" style="margin-bottom:10px">'+
      '<span class="note" style="margin-right:2px">Desenhar:</span>'+tintas+equipeSel+
      (sel?'<button class="ofi-tinta" data-ofitinta="" title="Voltar a abrir o diálogo a cada célula">\u2715 soltar</button>':'')+
      '</div>'+
      '<div class="note" style="margin:-4px 0 10px">'+(sel
        ? '<b>'+escAttr(sel.n)+'</b> está na mão — clique nas células e ele vai sendo desenhado, lote após lote, até você escolher outro serviço. Dá pra pintar por cima do que já existe: vários serviços podem dividir a mesma semana no mesmo lote, e uma segunda equipe no mesmo lote rateia a quantidade com a primeira pela produtividade de cada uma. Pra mover ou remover um bloco, solte o pincel antes.'
        : 'Escolha um serviço acima pra sair desenhando, ou clique numa célula pra abrir o diálogo e escolher na hora. Clique num bloco pra mover ou remover.')+'</div>';
    var pend=ofiPendencias(segs);
    var listaPend=pend.length?('<div class="ofi-aviso" style="border-left-color:var(--crit)"><b>'+pend.length+' pendência(s)</b> — montar fora de ordem é permitido, mas o que ficou inconsistente aparece aqui:<ul style="margin:6px 0 0 16px;padding:0">'+
      pend.slice(0,12).map(function(x){ return '<li>'+escAttr(x.txt)+'</li>'; }).join('')+
      (pend.length>12?('<li>e mais '+(pend.length-12)+'</li>'):'')+'</ul></div>'):'';
    var acoes='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+
      '<button class="btn" id="ofiLimpar"'+(segs.length?'':' disabled')+'>Limpar estudo</button>'+
      '<button class="btn" id="ofiArrumar"'+(pend.length?'':' disabled')+' title="Desliza quem está fora de ordem para a primeira semana válida">Arrumar pendências</button>'+
      '<span class="note" style="align-self:center">'+segs.length+' colocação(ões) · '+faltam+' serviço(s) com quantidade ainda fora da matriz</span></div>';
    return '<div class="card">'+
      '<div class="eyebrow">Oficina — montagem manual <span class="wip">◔ estudo</span></div>'+
      '<div class="ofi-aviso"><b>Nada aqui é gravado.</b> Este estudo não toca o cronograma ao vivo, nem um cenário, nem o banco — vive só nesta aba e some ao recarregar a página. '+
        'Serve pra testar uma montagem e comparar com o automático antes de decidir qualquer coisa.</div>'+
      '<div class="note" style="margin-bottom:10px">Monte clicando nas células. Um lote aceita vários serviços na mesma semana (frentes em paralelo) e mais de uma equipe no mesmo serviço — nesse caso a quantidade do lote é rateada entre elas pela produtividade de cada uma, pra todas terminarem na mesma semana. '+
        'A ordem dos lotes é livre — pode montar de trás pra frente, pular e voltar. O app só garante predecessora concluída no mesmo lote e equipe livre, e desliza pra primeira semana que serve, dizendo por quê. '+
        'A duração é sempre calculada (quantidade ÷ produtividade da equipe, com a chuva de cada semana).</div>'+
      paleta+acoes+listaPend+cmp+ofiMatrizHTML(segs,lotIdxs,totalWeeks)+'</div>';
  };
  function ofiDraw(){
    document.querySelectorAll('[data-ofitinta]').forEach(function(b){
      b.addEventListener('click',function(){
        var v=b.getAttribute('data-ofitinta');
        var si=(v==='')?null:+v;
        OFI.pincel.si=(OFI.pincel.si===si)?null:si;   // clicar de novo no mesmo solta o pincel
        OFI.pincel.team=0;
        go(current);
      });
    });
    var eqs=document.getElementById('ofiEquipe');
    if(eqs)eqs.addEventListener('change',function(){ OFI.pincel.team=+eqs.value; });
    document.querySelectorAll('[data-ofinovo]').forEach(function(td){
      td.addEventListener('click',function(){
        var p=td.getAttribute('data-ofinovo').split('::');
        if(ofiPincela(+p[0],+p[1]))return;
        ofiDialogo(+p[0],+p[1],null);
      });
    });
    document.querySelectorAll('[data-ofiedit]').forEach(function(el){
      el.addEventListener('click',function(e){
        // Com tinta na mão o clique pinta, inclusive por cima de um bloco — é como se comporta
        // qualquer ferramenta de desenho. Pra mexer num bloco existente, solte o pincel antes.
        if(ofiInit().pincel.si!=null)return;
        e.stopPropagation();
        var id=+el.getAttribute('data-ofiedit');
        var it=ofiInit().plano.filter(function(x){ return x.id===id; })[0];
        if(it)ofiDialogo(it.li,it.ini,id);
      });
    });
    var arr=document.getElementById('ofiArrumar');
    if(arr)arr.addEventListener('click',function(){ ofiArrumar(); go(current); });
    var lim=document.getElementById('ofiLimpar');
    if(lim)lim.addEventListener('click',function(){
      if(!confirm('Apagar todas as colocações deste estudo? Nada mais é afetado.'))return;
      OFI={plano:[],prox:1,pincel:OFI.pincel,fimAuto:OFI.fimAuto}; go(current);
    });
  }

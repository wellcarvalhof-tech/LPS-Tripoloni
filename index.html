          var startPos=Math.max(p.startWeek-1,tPos);
          var packed=packSegment(startPos,p.qty/effProd,effProd,p.qty,periods,wfCache);
          segs.push({li:p.li,si:si,team:t2,teams:teams,start:packed.start,dur:packed.duration,qty:p.qty,wq:packed.wq,
            color:teamColor(hex,t2,Math.max(1,teams)),name:s.n,adjusted:true,pinned:true});
          if(!loteRange[p.li])loteRange[p.li]={min:Infinity,max:-Infinity};
          loteRange[p.li].min=Math.min(loteRange[p.li].min,packed.start);
          loteRange[p.li].max=Math.max(loteRange[p.li].max,packed.start+packed.duration-1);
          tPos=packed.endPos;
        });
      });
      Object.keys(loteRange).forEach(function(liKey){
        startByKey[liKey+'::'+si]=loteRange[liKey].min; endByKey[liKey+'::'+si]=loteRange[liKey].max;
      });
      if(s.cfg&&s.cfg.pullFromQueue){
        // Fila dinâmica: ignora a equipe fixa por lote. A cada passo, entre todas as
        // combinações (lote pronto × equipe), escolhe a que termina mais cedo — considerando
        // predecessoras, produtividade de cada equipe e a logística (distância do último lote
        // que a equipe fez).
        var remaining=[];
        LOTS.forEach(function(l,li){
          if(QTY[li][si]<=0||pinnedLis[li])return;
          var o=ovrGet(li,si);
          remaining.push({li:li,seq:(o&&o.seq!=null)?o.seq:li,ready:readyPosFor(li)});
        });
        if(seqFixa)remaining.sort(function(a,b){return a.seq-b.seq;});
        var teamPos=[]; for(var t0=0;t0<teams;t0++)teamPos.push(0);
        var teamLastLi=[]; for(var t0b=0;t0b<teams;t0b++)teamLastLi.push(null);
        // Cache do "melhor candidato" por equipe — resultado idêntico ao recalcular do zero a
        // cada rodada (mesma escolha, mesmo desempate), só que sem repetir a varredura completa
        // de todos os lotes pras equipes cuja posição não mudou nessa rodada. Uma equipe só
        // refaz a varredura quando ela venceu a rodada anterior (mudou de posição) ou quando o
        // lote que ela tinha em cache como melhor acabou de ser tomado por outra equipe. Sem
        // isso, o custo cresce com lotes² × equipes — pesado em obras com muitos lotes.
        var teamBest=[]; for(var t0c=0;t0c<teams;t0c++)teamBest.push(null);
        while(remaining.length){
          var bestOverall=null, bestTeam=0;
          if(seqFixa){
            // Ordem dos lotes é a definida; o app só escolhe qual equipe pega o próximo.
            var prox=[remaining[0]];
            for(var tf=0;tf<teams;tf++){
              var candF=bestCandidate(prox,teamPos[tf],teamProds[tf]>0?teamProds[tf]:prod,teamLastLi[tf]);
              if(!bestOverall||candF.endPos<bestOverall.endPos-1e-9||(Math.abs(candF.endPos-bestOverall.endPos)<1e-9&&candF.dist<bestOverall.dist-1e-9)){
                bestOverall=candF; bestTeam=tf;
              }
            }
            bestOverall.idx=0;
          } else
          for(var tt=0;tt<teams;tt++){
            if(!teamBest[tt]){
              var teamProdT=teamProds[tt]>0?teamProds[tt]:prod;
              teamBest[tt]=bestCandidate(remaining,teamPos[tt],teamProdT,teamLastLi[tt]);
            }
            var cand=teamBest[tt];
            if(!bestOverall||cand.endPos<bestOverall.endPos-1e-9||(Math.abs(cand.endPos-bestOverall.endPos)<1e-9&&cand.dist<bestOverall.dist-1e-9)){
              bestOverall=cand; bestTeam=tt;
            }
          }
          var packed=bestOverall.packed, li3=bestOverall.li, qty3=bestOverall.qty;
          segs.push({li:li3,si:si,team:bestTeam+1,teams:teams,start:packed.start,dur:packed.duration,qty:qty3,wq:packed.wq,
            color:teamColor(hex,bestTeam+1,Math.max(1,teams)),name:s.n,adjusted:!!(ovrKey(li3,si)&&ADJ_PENDING[ovrKey(li3,si)])});
          startByKey[li3+'::'+si]=packed.start; endByKey[li3+'::'+si]=packed.start+packed.duration-1;
          teamPos[bestTeam]=packed.endPos; teamLastLi[bestTeam]=li3;
          var removeIdx=-1; for(var ri=0;ri<remaining.length;ri++){ if(remaining[ri].li===li3){removeIdx=ri;break;} }
          if(removeIdx>=0)remaining.splice(removeIdx,1);
          teamBest[bestTeam]=null;
          for(var tt2=0;tt2<teams;tt2++){ if(tt2!==bestTeam&&teamBest[tt2]&&teamBest[tt2].li===li3)teamBest[tt2]=null; }
        }
      } else {
        // Times fixos por lote (manual ou round-robin). Sem paralisações ligado: dentro de
        // cada equipe, escolhe dinamicamente o próximo lote (mais pronto e mais perto do
        // último que a equipe fez) em vez da sequência manual fixa — evita ociosidade. A chuva
        // continua reduzindo a produção normalmente (weekFactor não é ignorado).
        // Um lote pode ter mais de uma equipe (o.teams=[1,3,...]) — divide a quantidade em
        // partes iguais entre elas, cada uma trabalhando em paralelo com sua própria produtividade.
        var teamLots=[]; for(var t=1;t<=teams;t++)teamLots.push([]);
        LOTS.forEach(function(l,li){
          if(QTY[li][si]<=0||pinnedLis[li])return;
          var o=ovrGet(li,si);
          var teamsArr=(o&&Array.isArray(o.teams)&&o.teams.length)?o.teams.filter(function(x){return x>0&&x<=teams;}):null;
          if(!teamsArr||!teamsArr.length)teamsArr=[(o&&o.team>0&&o.team<=teams)?o.team:((li%teams)+1)];
          var seq=(o&&o.seq!=null)?o.seq:li;
          var qtyEach=QTY[li][si]/teamsArr.length;
          teamsArr.forEach(function(t2){
            teamLots[t2-1].push({li:li,seq:seq,ready:readyPosFor(li),qtyOverride:teamsArr.length>1?qtyEach:null});
          });
        });
        if(!noInt||seqFixa)teamLots.forEach(function(arr){arr.sort(function(a,b){return a.seq-b.seq;});});
        teamLots.forEach(function(lotIdxs,tIdx){
          var team=tIdx+1, tPos=0, lastLi=null;
          var teamProd=teamProds[tIdx]>0?teamProds[tIdx]:prod;
          if(noInt&&!seqFixa){
            var remainingT=lotIdxs.slice();
            while(remainingT.length){
              var pick=bestCandidate(remainingT,tPos,teamProd,lastLi);
              var packedP=pick.packed, liP=pick.li, qtyP=pick.qty;
              segs.push({li:liP,si:si,team:team,teams:teams,start:packedP.start,dur:packedP.duration,qty:qtyP,wq:packedP.wq,
                color:teamColor(hex,team,Math.max(1,teams)),name:s.n,adjusted:!!(ovrKey(liP,si)&&ADJ_PENDING[ovrKey(liP,si)])});
              tPos=packedP.endPos; lastLi=liP;
              remainingT.splice(pick.idx,1);
            }
          } else {
            lotIdxs.forEach(function(item){
              var li=item.li, qty=item.qtyOverride!=null?item.qtyOverride:QTY[li][si], o=ovrGet(li,si);
              var effProd=(o&&o.productivity>0)?o.productivity:teamProd;
              var startPos=Math.max(item.ready,tPos);
              var fixedDur=(o&&o.duration>0)?o.duration:undefined;
              var packed=packSegment(startPos,qty/effProd,effProd,qty,periods,wfCache,fixedDur);
              segs.push({li:li,si:si,team:team,teams:teams,start:packed.start,dur:packed.duration,qty:qty,wq:packed.wq,
                color:teamColor(hex,team,Math.max(1,teams)),name:s.n,adjusted:!!(ovrKey(li,si)&&ADJ_PENDING[ovrKey(li,si)])});
              tPos=packed.endPos;
            });
          }
        });
      }
      // Reconcilia início/fim do lote (pra predecessoras) considerando TODAS as equipes que
      // trabalharam nele, no caso de lote dividido entre mais de uma equipe.
      LOTS.forEach(function(l,li){
        var svcSegsForLot=segs.filter(function(sg){return sg.si===si&&sg.li===li;});
        if(!svcSegsForLot.length)return;
        var minStart=Infinity, maxEnd=-Infinity;
        svcSegsForLot.forEach(function(sg){ minStart=Math.min(minStart,sg.start); maxEnd=Math.max(maxEnd,sg.start+sg.dur-1); });
        startByKey[li+'::'+si]=minStart; endByKey[li+'::'+si]=maxEnd;
      });
      var target=(s.cfg&&s.cfg.targetEndWeek>0)?s.cfg.targetEndWeek:null;
      if(target){
        var svcSegs=segs.filter(function(sg){return sg.si===si;});
        var maxEnd=0; svcSegs.forEach(function(sg){maxEnd=Math.max(maxEnd,sg.start+sg.dur-1);});
        if(maxEnd>target)svcSegs.forEach(function(sg){sg.overTarget=true;});
      }
    });
    return segs;
  }
  /** Soma do realizado (Produção Diária) apontado pra esse lote+serviço específico. */
  function realizadoQtyForLoteServ(li,si){
    var loteId=(window._LOTIDS||[])[li], servId=SERV[si]&&SERV[si].id;
    if(!loteId||!servId)return 0;
    var t=0;
    (window.PROD_LIST||[]).forEach(function(r){ if(r.loteId===loteId&&r.servId===servId)t+=r.qtd||0; });
    return t;
  }
  /** Semana de trabalho do primeiro apontamento de Produção Diária desse lote+serviço (ou null se nunca apontado). */
  function firstRealWeekForLoteServ(li,si){
    var loteId=(window._LOTIDS||[])[li], servId=SERV[si]&&SERV[si].id;
    if(!loteId||!servId)return null;
    var minDate=null;
    (window.PROD_LIST||[]).forEach(function(r){ if(r.loteId===loteId&&r.servId===servId&&(!minDate||r.data<minDate))minDate=r.data; });
    if(!minDate)return null;
    var mon=mondayOfIso(minDate);
    for(var w=1;w<=1000;w++){ if(mondayOf(w).toISOString().slice(0,10)===mon)return w; }
    return null;
  }
  /** Semana de CALENDÁRIO w (1 = segunda-feira do início da obra), contando também as semanas
   *  de recesso/feriado — diferente de mondayOf(w), que pula essas semanas (semana de trabalho,
   *  usada pelo cronograma). O histograma usa calendário: recurso parado no recesso continua
   *  mobilizado. */
  function calWeekDate(w){
    var d=new Date(TC_START()+'T00:00:00');
    var day=d.getDay(), diff=day===0?-6:1-day; d.setDate(d.getDate()+diff+7*(w-1));
    return d;
  }
  function hojeCalWeek(tw){
    var today=new Date(); today.setHours(0,0,0,0);
    var hojeW=0; for(var i=1;i<=tw;i++){ if(calWeekDate(i)<=today)hojeW=i; else break; }
    return hojeW;
  }
  /** A semana de calendário que contém hoje começa nesta segunda? Serve pra marcar "onde
   *  estamos" na matriz e na linha de balanço. */
  function ehSemanaDeHoje(d){
    if(!d)return false;
    var hoje=new Date(); hoje.setHours(0,0,0,0);
    var ini=new Date(d.getTime()); ini.setHours(0,0,0,0);
    var fim=new Date(ini.getTime()); fim.setDate(fim.getDate()+7);
    return hoje>=ini&&hoje<fim;
  }
  function hojeWeekNumber(tw){
    var today=new Date(); today.setHours(0,0,0,0);
    var hojeW=0; for(var i=1;i<=tw;i++){ if(mondayOf(i)<=today)hojeW=i; else break; }
    return hojeW;
  }
  /** Cronograma dinâmico: pra cada lote+serviço já com produção apontada, desconta o que já foi
   *  feito e reprojeta o restante a partir de hoje — no ritmo previsto (mode='previsto') ou no
   *  ritmo real observado até agora (mode='historico'). Itens sem apontamento ficam como estão
   *  (usam o cronograma ao vivo normalmente). Simplificação: usa a equipe já atribuída a cada
   *  lote (manual/round-robin) — não recalcula fila dinâmica nem divisão entre várias equipes.
   */
  function buildProjectedSchedule(mode){
    var segs=[], startByKey={}, endByKey={};
    var order=topoSortServices();
    var periods=calRainPeriods(), wfCache={};
    var hojeW=hojeWeekNumber(1000);
    function predReadyWeek(s,li){
      var earliest=1;
      var preds=(s.cfg&&s.cfg.predecessors)||[];
      preds.forEach(function(pid){
        var psi=null; SERV.forEach(function(x,i){if(x.id===pid)psi=i;});
        if(psi==null)return;
        var pk=li+'::'+psi, pe=endByKey[pk], ps=startByKey[pk];
        if(pe!=null){
          if(s.cfg&&s.cfg.parallelWithPredecessor&&ps!=null)earliest=Math.max(earliest,ps+(s.lag||0));
          else earliest=Math.max(earliest,pe+1+(s.lag||0));
        }
      });
      return earliest;
    }
    order.forEach(function(si){
      var s=SERV[si], teams=s.eq, prod=pnum(s.p), hex=svcColor(s);
      if(teams<=0||prod<=0)return;
      var teamProds=(s.cfg&&s.cfg.teamProductivities)||[];
      LOTS.forEach(function(l,li){
        if(QTY[li][si]<=0)return;
        var o=ovrGet(li,si);
        var teamsArr=(o&&Array.isArray(o.teams)&&o.teams.length)?o.teams.filter(function(x){return x>0&&x<=teams;}):null;
        var team=(teamsArr&&teamsArr.length)?teamsArr[0]:((o&&o.team>0&&o.team<=teams)?o.team:((li%teams)+1));
        var teamProd=teamProds[team-1]>0?teamProds[team-1]:prod;
        var effProd=(o&&o.productivity>0)?o.productivity:teamProd;
        var real=realizadoQtyForLoteServ(li,si);
        var remaining=Math.max(0,QTY[li][si]-real);
        var earliestPos=predReadyWeek(s,li)-1;
        var pin=(o&&o.startWeek>0)?o.startWeek:0, pinPos=pin>0?pin-1:0;
        var svcMin=(s.cfg&&s.cfg.minStartWeek>0)?s.cfg.minStartWeek-1:0;
        var startPos=Math.max(earliestPos,pinPos,svcMin);
        if(real>0){
          // já começou de verdade: retoma a projeção a partir de hoje (ou da posição prevista, se ainda for futura)
          startPos=Math.max(startPos,hojeW);
          if(mode==='historico'){
            var fw=firstRealWeekForLoteServ(li,si);
            var weeksElapsed=Math.max(1,hojeW-(fw!=null?fw-1:startPos));
            var rate=real/weeksElapsed;
            if(rate>0)effProd=rate;
          }
        }
        var fixedDur=(o&&o.duration>0)?o.duration:undefined;
        var packed=remaining>0?packSegment(startPos,remaining/effProd,effProd,remaining,periods,wfCache,fixedDur):null;
        if(packed)segs.push({li:li,si:si,team:team,teams:teams,start:packed.start,dur:packed.duration,qty:remaining,wq:packed.wq,
          color:teamColor(hex,team,Math.max(1,teams)),name:s.n,real:real,total:QTY[li][si]});
        startByKey[li+'::'+si]=packed?packed.start:startPos+1;
        endByKey[li+'::'+si]=packed?(packed.start+packed.duration-1):Math.max(startPos,hojeW);
      });
    });
    return segs;
  }
  async function saveOverrides(){
    if(!selectedObra)return;
    await sbUpdateObra(selectedObra.id,{ajustes_manuais:OVR});
  }
  /** Substitui o cronograma ao vivo da obra (ajustes manuais, calendário e parâmetros de cada
   *  serviço — equipes/produtividade/config) pelo snapshot guardado num cenário. Diferente de
   *  "Carregar" (que abre o cenário num modo de edição à parte, sem tocar na obra): isso grava
   *  direto nas tabelas reais (servicos, obras), igual "Salvar ajustes" faria. */
  async function applyCenarioToLive(c){
    if(!c||!selectedObra)return;
    var snap=c.snap||{ovr:{},feriados:{holidayWeeks:[],rainPeriods:[]},servicos:null};
    ACTIVE_CENARIO=null;
    OVR=JSON.parse(JSON.stringify(snap.ovr||{}));
    if(snap.servicos&&snap.servicos.length){
      for(var i=0;i<snap.servicos.length;i++){
        var sc=snap.servicos[i];
        var live=SERV.filter(function(x){return x.id===sc.id;})[0];
        if(!live)continue; // serviço do cenário não existe mais na obra — ignora
        var patch={teams:Math.max(1,parseInt(sc.eq,10)||1),produtividade:pnum(sc.produtividade),lag_semanas:parseInt(sc.lag,10)||0,config:sc.config||{}};
        if(sc.cor)patch.cor=sc.cor;
        await sbUpdateServico(sc.id,patch);
        live.eq=patch.teams; live.p=String(patch.produtividade); live.lag=patch.lag_semanas;
        live.cfg=JSON.parse(JSON.stringify(sc.config||{}));
        if(sc.cor)live.hex=sc.cor;
      }
    }
    var feriados=snap.feriados||{holidayWeeks:[],rainPeriods:[]};
    await saveCalendarObj(feriados.holidayWeeks||[],feriados.rainPeriods||[]);
    await saveOverrides();
    ADJ_DIRTY=false; ADJ_PENDING={};
  }
  /** Snapshot completo do estado ao vivo: ajustes manuais, calendário (feriados/chuvas) e os
   *  parâmetros de cada serviço (produtividade, nº de equipes, predecessoras, etc). */
  function captureLiveSnapshot(){
    return {
      ovr:JSON.parse(JSON.stringify(OVR)),
      feriados:JSON.parse(JSON.stringify(calData())),
      servicos:SERV.map(function(s){return {id:s.id,nome:s.n,unidade:s.u,cor:s.hex,eq:s.eq,produtividade:s.p,lag:s.lag,config:JSON.parse(JSON.stringify(s.cfg||{}))};})
    };
  }
  /** Normaliza cenarios.ajustes_manuais: formato novo ({ovr,feriados,servicos}) ou o formato
   *  antigo (o próprio objeto de ajustes manuais, sem calendário/serviços — cenários criados
   *  antes dessa funcionalidade). */
  function normalizeSnap(raw){
    raw=(raw&&typeof raw==='object')?raw:{};
    if(raw.ovr||raw.feriados||raw.servicos){
      return {
        ovr:(raw.ovr&&typeof raw.ovr==='object')?raw.ovr:{},
        feriados:(raw.feriados&&typeof raw.feriados==='object')?raw.feriados:{holidayWeeks:[],rainPeriods:[]},
        servicos:Array.isArray(raw.servicos)?raw.servicos:null
      };
    }
    return {ovr:raw,feriados:{holidayWeeks:[],rainPeriods:[]},servicos:null};
  }
  /** Roda buildSchedule() com um snapshot completo (ajustes + calendário + serviços) em vez do
   *  estado ao vivo, sem alterar o estado global (restaura tudo no finally). snap=null usa o
   *  cronograma ao vivo normalmente. */
  /** Roda fn() com o estado de um cenário (ajustes + calendário + serviços) no lugar do estado
   *  ao vivo, sem alterar nada de forma permanente (restaura tudo no finally). snap=null roda
   *  com o cronograma ao vivo normalmente. Serve tanto pro cronograma (buildSchedule) quanto
   *  pro histograma (computeHistogram), que leem SERV/OVR/feriados por baixo. */
  function withSnapshot(snap,fn){
    if(!snap)return fn();
    var savedOVR=OVR, savedSERV=SERV, savedFeriados=window._OBRA?window._OBRA.feriados:null;
    OVR=snap.ovr||{};
    if(snap.servicos&&snap.servicos.length){
      SERV=snap.servicos.map(function(sc){
        var orig=savedSERV.filter(function(x){return x.id===sc.id;})[0]||{};
        return {id:sc.id,n:sc.nome,u:sc.unidade,c:orig.c,hex:sc.cor,eq:sc.eq,p:String(sc.produtividade),lag:sc.lag,cfg:sc.config||{}};
      });
    }
    if(window._OBRA)window._OBRA=Object.assign({},window._OBRA,{feriados:snap.feriados||savedFeriados});
    try{ return fn(); }
    finally{
      OVR=savedOVR; SERV=savedSERV;
      if(window._OBRA)window._OBRA=Object.assign({},window._OBRA,{feriados:savedFeriados});
    }
  }
  function scheduleWithSnapshot(snap){ return withSnapshot(snap,buildSchedule); }
  function histogramWithSnapshot(snap){ return withSnapshot(snap,computeHistogram); }
  function activeBaseline(){
    return CENARIOS.filter(function(c){return c.tipo==='baseline'&&c.ativo;})[0]||null;
  }
  function nextRevisionLabel(){
    var n=CENARIOS.filter(function(c){return c.tipo==='baseline';}).length;
    return 'REV'+String(n).padStart(2,'0');
  }
  async function gerarLinhaDeBase(snapshot,cenarioIdExistente){
    if(!selectedObra)return;
    var rev=nextRevisionLabel();
    if(!confirm('Gerar a linha de base '+rev+' a partir deste cronograma?\n\nIsso fica registrado no histórico e passa a ser a referência (previsto) da Curva S até que uma nova revisão seja gerada.'))return;
    try{
      var atual=activeBaseline();
      if(atual){ await sbUpdateCenario(atual.id,{ativo:false}); atual.ativo=false; }
      if(cenarioIdExistente){
        var patch={tipo:'baseline',revisao:rev,ativo:true,congelado_em:new Date().toISOString()};
        await sbUpdateCenario(cenarioIdExistente,patch);
        var c=CENARIOS.filter(function(x){return x.id===cenarioIdExistente;})[0];
        if(c)Object.assign(c,{tipo:'baseline',revisao:rev,ativo:true,congeladoEm:patch.congelado_em});
      }else{
        var snap=JSON.parse(JSON.stringify(snapshot||captureLiveSnapshot()));
        var id=await sbCreateCenario(selectedObra.id,{nome:'Linha de base '+rev,tipo:'baseline',revisao:rev,ativo:true,ajustes_manuais:snap,ordem:CENARIOS.length,congelado_em:new Date().toISOString()});
        CENARIOS.push({id:id,nome:'Linha de base '+rev,tipo:'baseline',revisao:rev,ativo:true,snap:snap,ordem:CENARIOS.length,congeladoEm:new Date().toISOString()});
      }
      toast('Linha de base '+rev+' gerada.');

  }

  /* ================= HISTOGRAMA DE RECURSOS ================= */
  /** Equipes ativas por serviço em cada semana (índice 0 = semana 1). */
  /** Equipes ativas (mobilizadas) por serviço/semana. Regra: uma vez que a equipe inicia o
   * serviço, ela conta como mobilizada em TODA semana até concluir o último lote que executa
   * nesse serviço — mesmo em semanas "vazias" entre um lote e outro da mesma equipe — sem
   * desmobilizar e remobilizar nesse intervalo. Por isso agrupa por serviço+equipe (do primeiro
   * início ao último término), em vez de olhar semana a semana se há produção naquela semana. */
  function activeTeamsByWeek(){
    var segsAll=buildSchedule(); var tw=1; segsAll.forEach(function(sg){tw=Math.max(tw,sg.start+sg.dur-1);});
    // Filtro global de lotes: conta só as equipes trabalhando nos lotes em exibição. O horizonte
    // (tw) continua o do cronograma integrado inteiro, pra alinhar com as outras visões.
    var segs=viewSegs(segsAll);
    // O cronograma conta só semanas de trabalho (pula recesso/feriado). O histograma é por semana
    // de CALENDÁRIO: uma equipe que trabalha antes e depois do recesso fica mobilizada durante ele.
    var calRows=buildCalendarRows(tw), calIdx={}, isHoliday=[];
    calRows.forEach(function(r,i){ if(r.working)calIdx[r.working]=i+1; isHoliday.push(!!r.isHoliday); });
    var twCal=calRows.length||tw;
    var out={}; SERV.forEach(function(s,si){out[si]=[];for(var w=0;w<twCal;w++)out[si].push(0);});
    var spanByTeam={}; // "si::team" -> {min,max} (semanas de trabalho)
    segs.forEach(function(sg){
      if(!sg.dur)return;
      var k=sg.si+'::'+sg.team, start=sg.start, end=sg.start+sg.dur-1;
      var cur=spanByTeam[k];
      if(!cur)spanByTeam[k]={si:sg.si,min:start,max:end};
      else{ cur.min=Math.min(cur.min,start); cur.max=Math.max(cur.max,end); }
    });
    Object.keys(spanByTeam).forEach(function(k){
      var span=spanByTeam[k], from=calIdx[Math.max(1,span.min)]||1, to=calIdx[Math.min(tw,span.max)]||twCal;
      for(var w=from;w<=to;w++){ if(out[span.si])out[span.si][w-1]+=1; }
    });
    return {teamsByService:out,tw:twCal,isHoliday:isHoliday};
  }
  /** Demanda de recursos por semana = equipes ativas do serviço × qtd/equipe cadastrada (direto)
   * + composição de Apoio Administrativo, constante em todas as semanas do cronograma já que
   * esses itens não têm equipes/cronograma próprio (indireto). byResource é a soma dos dois —
   * byResourceDireto/byResourceIndireto ficam disponíveis à parte pra quem quiser decompor
   * (gráfico, filtro por origem). */
  function computeHistogram(){
    var atbw=activeTeamsByWeek(), tw=atbw.tw, teamsByService=atbw.teamsByService, isHoliday=atbw.isHoliday||[];
    var byResource={}, byResourceDireto={}, byResourceIndireto={};
    RECURSOS.forEach(function(r){
      byResource[r.id]=[]; byResourceDireto[r.id]=[]; byResourceIndireto[r.id]=[];
      for(var w=0;w<tw;w++){ byResource[r.id].push(0); byResourceDireto[r.id].push(0); byResourceIndireto[r.id].push(0); }
    });
    var totalByService={}, totalByServiceResource={}, grandTotal=0;
    SERV.forEach(function(s,si){
      var crew=(s.cfg&&s.cfg.crew)||[], svcTotal=0, perRes={};
      crew.forEach(function(item){
        if(!byResource[item.resourceId])return;
        var mobilized=(item.qtyPerTeam||0)*(s.eq||0);
        perRes[item.resourceId]=(perRes[item.resourceId]||0)+mobilized;
        svcTotal+=mobilized;
        var arr=byResource[item.resourceId], arrD=byResourceDireto[item.resourceId], teams=teamsByService[si]||[];
        for(var i=0;i<arr.length;i++){ var v=(teams[i]||0)*(item.qtyPerTeam||0); arr[i]+=v; arrD[i]+=v; }
      });
      totalByServiceResource[si]=perRes; totalByService[si]=svcTotal; grandTotal+=svcTotal;
    });
    var totalByApoio={}, totalByApoioResource={}, grandTotalIndireto=0;
    APOIO.forEach(function(a){
      var crew=(a.cfg&&a.cfg.crew)||[], apoTotal=0, perRes={};
      crew.forEach(function(item){
        if(!byResource[item.resourceId])return;
        var qty=item.qtyPerTeam||0; // sem "equipes" pro apoio — a quantidade já é o total mobilizado
        perRes[item.resourceId]=(perRes[item.resourceId]||0)+qty;
        apoTotal+=qty;
        var arr=byResource[item.resourceId], arrI=byResourceIndireto[item.resourceId];
        for(var i=0;i<arr.length;i++){ arr[i]+=qty; arrI[i]+=qty; }
      });
      totalByApoioResource[a.id]=perRes; totalByApoio[a.id]=apoTotal; grandTotalIndireto+=apoTotal;
    });
    var peakByResource={};
    RECURSOS.forEach(function(r){ var arr=byResource[r.id]||[]; peakByResource[r.id]=arr.reduce(function(m,v){return Math.max(m,v);},0); });
    return {isHoliday:isHoliday,byResource:byResource,byResourceDireto:byResourceDireto,byResourceIndireto:byResourceIndireto,
      totalByService:totalByService,totalByServiceResource:totalByServiceResource,
      totalByApoio:totalByApoio,totalByApoioResource:totalByApoioResource,
      peakByResource:peakByResource,grandTotal:grandTotal+grandTotalIndireto,grandTotalDireto:grandTotal,grandTotalIndireto:grandTotalIndireto,tw:tw};
  }

  /** Grava o campo editado na tabela Realizado. campo = 'proprio' | 'terceiro' | 'total'.
   *  O banco guarda total e terceiro; próprio é a diferença. */
  function saveRealizadoField(recursoId,dataSemana,val,campo){
    var v=Math.max(0,parseFloat(val)||0), k=recursoId+'::'+dataSemana;
    var tot=+REALIZADO_REC[k]||0, terc=Math.min(tot,+REALIZADO_TERC[k]||0), prop=Math.max(0,tot-terc);
    if(campo==='proprio'){ REALIZADO_REC[k]=v+terc; REALIZADO_TERC[k]=terc; }
    else if(campo==='terceiro'){ REALIZADO_REC[k]=prop+v; REALIZADO_TERC[k]=v; }
    else { REALIZADO_REC[k]=v; if(terc>v)REALIZADO_TERC[k]=v; }
    REALIZADO_DIRTY[k]=true;
    go('cr-hist');
  }
  /** Realizado de um recurso numa semana. parte = 'todos' (total), 'proprio' ou 'terceiro'. */
  function realRec(recursoId,dataISO,parte){
    var k=recursoId+'::'+dataISO, tot=+REALIZADO_REC[k]||0, terc=Math.min(tot,+REALIZADO_TERC[k]||0);
    if(parte==='terceiro')return terc;
    if(parte==='proprio')return Math.max(0,tot-terc);
    return tot;
  }

  function excelDateToIso(v){
    if(v==null||v==='')return '';
    if(v instanceof Date)return v.toISOString().slice(0,10);
    if(typeof v==='number'){
      var epoch=new Date(Date.UTC(1899,11,30)); epoch.setUTCDate(epoch.getUTCDate()+Math.round(v));
      return epoch.toISOString().slice(0,10);
    }
    var s=String(v).trim();
    var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0];
    var m2=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m2)return m2[3]+'-'+m2[2]+'-'+m2[1];
    return s;
  }
  function expandRangeToMondays(startIso,endIso){
    var out=[], d=new Date(startIso+'T00:00:00');
    var day=d.getDay(), diff=day===0?-6:1-day; d.setDate(d.getDate()+diff);
    var end=new Date(endIso+'T00:00:00');
    var guard=0;
    while(d<=end&&guard++<520){ out.push(d.toISOString().slice(0,10)); d=new Date(d); d.setDate(d.getDate()+7); }
    return out;
  }

    var segs=buildSchedule().slice().sort(function(a,b){return a.start-b.start||a.si-b.si||a.li-b.li;});
    var tcRows=[['Servico','Equipe','Lote','SemanaInicio','SemanaFim','Duracao','Quantidade']];
    segs.forEach(function(sg){ tcRows.push([SERV[sg.si]?SERV[sg.si].n:'',sg.team,LOTS[sg.li]||'',sg.start,sg.start+sg.dur-1,sg.dur,sg.qty]); });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tcRows),'TempoCaminho');

    // Ajustes manuais (OVR) por lote+serviço — reproduz as escolhas manuais (equipe/sequência/
    // produtividade) num projeto novo em vez de recalcular do zero com as regras padrão.
    // SemanaInicio/Duracao vão só como referência (o que deu na obra de origem) — a importação
    // NÃO trava essas semanas, senão o cronograma ficaria preso e não daria pra editar depois.
    var ajHeader=['Lote','Servico','SemanaInicio','Equipe','Equipes','Sequencia','Duracao','Produtividade'];
    var ajRows=[ajHeader];
    Object.keys(OVR).forEach(function(k){
      var o=OVR[k]; if(!o)return;
      var parts=k.split('::'), lotId=parts[0], svcId=parts[1];
      var li=(window._LOTIDS||[]).indexOf(lotId); var si=-1;
      SERV.forEach(function(s,i){ if(s.id===svcId)si=i; });
      if(li<0||si<0)return;
      ajRows.push([LOTS[li],SERV[si].n,o.startWeek||'',o.team||'',(Array.isArray(o.teams)?o.teams.join(';'):''),
        (o.seq!=null?o.seq:''),o.duration||'',o.productivity||'']);
    });
    if(ajRows.length>1)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ajRows),'AjustesManuais');

    var nome=((window._OBRA&&window._OBRA.nome)||'obra').replace(/[\\/:*?"<>|]+/g,'_').trim()||'obra';
    XLSX.writeFile(wb,nome+'_dados.xlsx');
    toast('Dados exportados.');
  }

    // "Cabeçalhos e rodapés" no diálogo de impressão, não dá pra remover via código).
    document.title='Tempo Caminho - '+nome;
    buildPrintPages(nome,gerado,tw);
    document.body.classList.add('printing-mat');
    window.onafterprint=function(){
      document.body.classList.remove('printing-mat');
      window._matrixZoom=prevZoom; document.title=prevTitle;

  /** Monta o conteúdo do PDF em #printMat/#printFoot a partir da matriz já renderizada na tela
   *  (zoom 1, aba "tc"). Separado de exportPdf pra dar pra testar sem abrir o diálogo de impressão. */
  function buildPrintPages(nome,gerado,tw){
    // Legenda de serviços compacta (lista em linha, fonte pequena) — antes era uma tabela que
    // comia boa parte da folha e deixava a matriz minúscula.
    var foot=document.getElementById('printFoot');
    if(foot){
      // Tabela-resumo por serviço: nº de equipes e produção total (todas as equipes) por dia,
      // semana e mês — normal e reduzida pela praticabilidade. O fator de redução é o pior
      // (menor) entre os períodos chuvosos cadastrados: (1 − %produção) × (1 − %dias), o mesmo
      // que o cronograma usa em weekFactor. A produtividade cadastrada é por equipe e por
      // semana; dia = semana ÷ 5 dias úteis (seg–sex); mês = 4 semanas (20 dias úteis).
      var DIAS_SEMANA=5, SEM_MES=4;
      var fator=1;
      calRainPeriods().forEach(function(rp){
        if(!rp.start||!rp.end)return;
        var f=(1-Math.min(100,Math.max(0,+rp.producao||0))/100)*(1-Math.min(100,Math.max(0,+rp.dias||0))/100);
        fator=Math.min(fator,f);
      });
      var temChuva=fator<0.999;
      var rows=SERV.map(function(sv){
        var semanal=pnum(sv.p)*(sv.eq||0);
        var cel=function(v){return '<td class="r">'+fmtBR(v)+'</td>';};
        return '<tr><td><span class="swatch" style="background:'+svcColor(sv)+'"></span>'+sv.n+'</td><td>'+sv.u+'</td><td class="r">'+sv.eq+'</td><td class="r">'+fmtBR(pnum(sv.p))+'</td>'+
          cel(semanal/DIAS_SEMANA)+cel(semanal)+cel(semanal*SEM_MES)+
          (temChuva?cel(semanal*fator/DIAS_SEMANA)+cel(semanal*fator)+cel(semanal*fator*SEM_MES):'')+'</tr>';
      }).join('');
      foot.innerHTML='<table class="print-sum"><thead>'+
        '<tr><th rowspan="2" style="text-align:left">Serviço</th><th rowspan="2">Un.</th><th rowspan="2">Equipes</th><th rowspan="2">Cadastrado<br>por equipe/sem</th>'+
          '<th colspan="3">Produção normal — todas as equipes</th>'+(temChuva?'<th colspan="3">Produção reduzida — praticabilidade '+Math.round(fator*100)+'%</th>':'')+'</tr>'+
        '<tr><th>Dia (÷5)</th><th>Semana</th><th>Mês (×4)</th>'+(temChuva?'<th>Dia (÷5)</th><th>Semana</th><th>Mês (×4)</th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table>'+
        '<div class="print-notes">Semana = cadastrado por equipe × nº de equipes · dia = semana ÷ '+DIAS_SEMANA+' dias úteis (seg–sex) · mês = '+SEM_MES+' semanas ('+(DIAS_SEMANA*SEM_MES)+' dias úteis)'+(temChuva?' · produção reduzida = pior fator entre os períodos chuvosos cadastrados':' · nenhum período chuvoso cadastrado')+'. '+
          'Tons mais escuros lado a lado no mesmo serviço = equipes diferentes · sub-células lado a lado na mesma semana = atividades em paralelo no mesmo lote · a última semana de uma atividade mostra o saldo.</div>';
    }
    // A matriz é escalada pra preencher a ALTURA da folha (paisagem) e fatiada em várias folhas
    // na horizontal — cada folha mostra uma faixa de lotes com TODAS as semanas. Antes ela era
    // encolhida pra caber a largura inteira numa folha só, e com muitos lotes ficava ilegível.
    var mat=document.getElementById('printMat');
    if(mat&&LOTS.length){
      var pxPerMm=96/25.4;
      var pageW=(297-20)*pxPerMm, pageH=(210-20)*pxPerMm;
      var headH=30, slack=14; // cabeçalho por folha + folga fixa
      var segsAll=buildSchedule();
      var allIdxs=viewLotIdxs(); // respeita o filtro global de lotes em exibição
      // Mede a matriz no formato COMPACTO de impressão (linhas mais baixas, sem grips/etiquetas
      // de equipe — estilos de .print-page), num elemento fora da tela. Medir a matriz da tela
      // daria uma altura maior que a real e a escala sairia menor do que podia.
      var probe=document.createElement('div');
      probe.className='print-page';
      probe.style.cssText='position:absolute;left:-100000px;top:0;visibility:hidden;width:max-content';
      probe.innerHTML=matrixTableCore(true,allIdxs,segsAll);
      document.body.appendChild(probe);
      var ptable=probe.querySelector('table');
      var naturalH=ptable.offsetHeight;
      var ths=ptable.querySelectorAll('thead th');
      var fixedW=(ths[0]?ths[0].offsetWidth:0)+(ths[1]?ths[1].offsetWidth:0);
      var lotWs=[]; for(var ti=2;ti<ths.length;ti++)lotWs.push(ths[ti].offsetWidth||60);
      probe.remove();
      // 3% a menos: o zoom fracionário arredonda cada linha pra cima em até 1px, e com dezenas
      // de semanas isso soma — sem a folga a última linha pode escorregar pra uma folha vazia.
      var scale=Math.max(0.12,Math.min(1.6,+((pageH-headH-slack)/Math.max(1,naturalH)*0.97).toFixed(3)));
      // Quantos lotes cabem em cada folha: acumula a largura real de cada coluna até estourar.
      // Primeiro descobre quantas folhas são necessárias (guloso), depois redistribui os lotes
      // em fatias de largura parecida — senão a última folha podia ficar com um lote sozinho.
      var availW=pageW/scale*0.97-fixedW;
      function splitLots(target){
        var out=[], cur=[], curW=0;
        for(var k=0;k<allIdxs.length;k++){
          var wcol=lotWs[k]||60; // lotWs está na ordem de allIdxs (uma coluna por lote em exibição)
          if(cur.length&&(curW+wcol>availW||curW>=target)){ out.push(cur); cur=[]; curW=0; }
          cur.push(allIdxs[k]); curW+=wcol;
        }
        if(cur.length)out.push(cur);
        return out;
      }
      var chunks=splitLots(Infinity);
      if(chunks.length>1){
        var totalW=lotWs.reduce(function(a,b){return a+b;},0);
        var balanced=splitLots(totalW/chunks.length);
        if(balanced.length===chunks.length)chunks=balanced;
      }
      mat.innerHTML=chunks.map(function(chunk,pi){
        var faixa=chunks.length>1?(' — Lotes '+LOTS[chunk[0]]+' a '+LOTS[chunk[chunk.length-1]]+' — folha '+(pi+1)+'/'+chunks.length):'';
        return '<div class="print-page'+(pi<chunks.length-1?' brk':'')+'">'+
          '<div class="print-page-head"><b>'+nome+' — Rascunho</b><span>Gerado em '+gerado+' · '+tw+' semana'+(tw===1?'':'s')+faixa+'</span></div>'+
          '<div class="print-zoom" style="zoom:'+scale+'">'+matrixTableCore(true,chunk,segsAll)+'</div></div>';
      }).join('');
    }
  }

  /** Importa recursos (funções OU equipamentos, nunca os dois juntos — o botão clicado já diz
   * qual é) reconhecendo três formatos de planilha: genérico (Nome/Categoria/Unidade), "FuncaoObra"
   * do ERP (codNatureza+descricao) e "Taxonomia" de equipamentos (FAMILIA em células mescladas +
   * EQUIPAMENTO "CÓD - Descrição"). O tipo do recurso vem sempre de forcedTipo, nunca da planilha —
   * assim a mesma planilha genérica serve tanto pra importar como função quanto como equipamento,
   * dependendo de qual botão foi clicado. */
  async function importRecursosTyped(wb,forcedTipo){
    if(!selectedObra){alert('Abra uma obra antes de importar.');return;}
    var sheetName=wb.SheetNames.filter(function(n){return ['recursos','funcoes','funções','funcaoobra','função obra','equipamentos','taxonomia','resources'].indexOf(n.trim().toLowerCase())>=0;})[0]||wb.SheetNames[0];
    if(!sheetName){alert('Planilha vazia.');return;}
    var aoa=sheetRows(wb.Sheets[sheetName]);
    if(!aoa.length){alert('Planilha vazia.');return;}
    var header=(aoa[0]||[]).map(function(h){return String(h||'').trim().toLowerCase();});
    // Formato "FuncaoObra" do ERP: só codNatureza + descricao — sem categoria/unidade.
    var isFuncaoObra=header.length<=2&&(header.indexOf('descricao')>=0||header.indexOf('descrição')>=0||header.indexOf('codnatureza')>=0);
    // Formato "Taxonomia" de equipamentos: FAMILIA (categoria, em células mescladas — só a
    // primeira linha do grupo vem preenchida) + EQUIPAMENTO ("CÓD - Descrição"). Como a célula é
    // mesclada, a família "desce" pras linhas seguintes até aparecer a próxima.
    var isTaxonomia=header.length<=2&&(header.indexOf('familia')>=0||header.indexOf('família')>=0)&&header.indexOf('equipamento')>=0;
    var rows=aoa.slice(1);
    var existing={}; RECURSOS.forEach(function(r){existing[(r.n.trim().toLowerCase())+'::'+r.tipo]=true;});
    var created=0, lastFamilia='';
    for(var i=0;i<rows.length;i++){
      var r=rows[i]; if(!r)continue;
      var nome,categoria,unidade;
      if(isFuncaoObra){
        nome=String(r[1]||'').trim(); if(!nome)continue;
        categoria=''; unidade='un';
      }else if(isTaxonomia){
        var fam=String(r[0]||'').trim(); if(fam)lastFamilia=fam;
        nome=String(r[1]||'').trim(); if(!nome)continue;
        categoria=lastFamilia; unidade='un';
      }else{
        nome=String(r[0]||'').trim(); if(!nome)continue;
        categoria=String(r[1]||'').trim();
        unidade=String(r[2]||'').trim()||'un';
      }
      var key=nome.toLowerCase()+'::'+forcedTipo; if(existing[key])continue;
      var id=await sbCreateRecurso(selectedObra.id,{nome:nome,tipo:forcedTipo,unidade:unidade,categoria:categoria||null,ordem:RECURSOS.length});
      RECURSOS.push({id:id,n:nome,tipo:forcedTipo,u:unidade,cat:categoria});
      existing[key]=true; created++;
    }
    go('cr-hist'); toast(created+' '+(forcedTipo==='funcao'?'função(ões)':'equipamento(s)')+' importado(s).');
  }

  async function importEquipesWorkbook(wb){
    if(!selectedObra){alert('Abra uma obra antes de importar.');return;}
    var ws=wb.Sheets['Equipes']||wb.Sheets[wb.SheetNames[0]];
    if(!ws){alert('Planilha vazia.');return;}
    var aoa=sheetRows(ws);
    if(aoa.length<2){alert('Planilha vazia.');return;}
    var svcIdxByName={}; SERV.forEach(function(s,si){svcIdxByName[s.n.trim().toLowerCase()]=si;});
    var recByKey={}; RECURSOS.forEach(function(r){recByKey[r.tipo+'::'+r.n.trim().toLowerCase()]=r;});
    var rows=aoa.slice(1).map(function(r,idx){return {row:r,line:idx+2};}).filter(function(x){return x.row&&x.row[0]!=null&&x.row[0]!==''&&x.row[2]!=null&&x.row[2]!=='';});

    // Verificação prévia: os nomes de Serviço/Função/Equipamento da planilha precisam bater
    // (exatamente, sem contar maiúsc./minúsc.) com o que já está cadastrado nesta obra. Se algo
    // não bater, para tudo e mostra o motivo — nada é criado ou alterado automaticamente, pra
    // evitar duplicar cadastro por causa de um nome digitado diferente.
    var svcProblems=[], recProblems=[], seenSvc={}, seenRec={};
    rows.forEach(function(x){
      var row=x.row;
      var svcName=String(row[0]).trim(), svcKey=svcName.toLowerCase();
      if(svcIdxByName[svcKey]==null&&!seenSvc[svcKey]){
        seenSvc[svcKey]=true;
        svcProblems.push('Linha '+x.line+': serviço "'+svcName+'" não encontrado em Serviços');
      }
      var tipoRaw=String(row[1]||'').trim().toLowerCase();
      var tipo=tipoRaw.indexOf('eq')===0?'equipamento':'funcao';
      var recName=String(row[2]).trim(), recKey=tipo+'::'+recName.toLowerCase();
      if(recByKey[recKey]==null&&!seenRec[recKey]){
        seenRec[recKey]=true;
        recProblems.push('Linha '+x.line+': '+(tipo==='funcao'?'função':'equipamento')+' "'+recName+'" não encontrado(a) no catálogo de '+(tipo==='funcao'?'Funções':'Equipamentos'));
      }
    });
    if(svcProblems.length||recProblems.length){
      var msg='A planilha tem nomes que não batem com o que já está cadastrado nesta obra. Verifique a lista de importação e corrija — o nome precisa ser idêntico ao já cadastrado em Serviços/Funções/Equipamentos (ou cadastre o item que falta antes de importar). Nada foi importado ainda.\n';
      if(svcProblems.length)msg+='\nSERVIÇOS não encontrados:\n'+svcProblems.join('\n');
      if(recProblems.length)msg+='\nFUNÇÕES/EQUIPAMENTOS não encontrados:\n'+recProblems.join('\n');
      alert(msg);
      return;
    }

    if(!confirm('Importar essa planilha de equipes? Para cada serviço mencionado na planilha, a composição da equipe é SUBSTITUÍDA pela da planilha (serviços não mencionados não são tocados).'))return;
    var touchedSi={}, appliedRows=0;
    for(var i=0;i<rows.length;i++){
      var row=rows[i].row;
      var si=svcIdxByName[String(row[0]).trim().toLowerCase()];
      var tipoRaw2=String(row[1]||'').trim().toLowerCase();
      var tipo2=tipoRaw2.indexOf('eq')===0?'equipamento':'funcao';
      var r=recByKey[tipo2+'::'+String(row[2]).trim().toLowerCase()];
      var qty=Math.max(0,+row[3]||0); if(qty<=0)continue;
      var s=SERV[si];
      if(!touchedSi[si]){ s.cfg=Object.assign({},s.cfg,{crew:[]}); touchedSi[si]=true; }
      var crew=s.cfg.crew.filter(function(c){return c.resourceId!==r.id;});
      crew.push({resourceId:r.id,qtyPerTeam:qty});
      s.cfg=Object.assign({},s.cfg,{crew:crew});
      SVC_DIRTY[si]=true;
      appliedRows++;
    }
    go('cr-hist');
    toast('Importado: '+appliedRows+' item(ns) de equipe em '+Object.keys(touchedSi).length+' serviço(s). Clique em "Salvar alterações" pra confirmar.');
  }
  /** Lê a planilha de realizado sem depender da posição fixa das colunas: acha a linha de
   *  cabeçalho, a coluna do nome do recurso e as colunas de semana (rótulo "S38", uma data, ou
   *  qualquer coluna numérica depois do cabeçalho conhecido). */
  function detectRealizadoLayout(aoa){
    var FIXAS=['RECURSO','NOME','FUNCAO','FUNÇÃO','EQUIPAMENTO','CATEGORIA','TIPO','UNIDADE','UN','PICO','PICO SIMULTANEO','CLASSIFICACAO','DESCRICAO','DESCRIÇÃO','ITEM'];
    for(var i=0;i<Math.min(aoa.length,12);i++){
      var row=aoa[i]||[]; if(row.length<2)continue;
      var nomeCol=-1, weekCols=[];
      for(var c=0;c<row.length;c++){
        var raw=row[c], t=normName(raw);
        if(!t&&raw==null)continue;
        var isSem=/^S\s*\d{1,2}$/.test(t)||/^SEMANA\s*\d*$/.test(t)||/^\d{4}-\d{2}-\d{2}/.test(String(raw))||(raw instanceof Date)||(typeof raw==='number'&&raw>40000&&raw<60000)||/^\d{2}\/\d{2}\/\d{2,4}$/.test(String(raw).trim());
        if(isSem){ weekCols.push({c:c,label:String(raw instanceof Date?excelDateToIso(raw):raw).trim(),raw:raw}); continue; }
        if(nomeCol<0&&FIXAS.indexOf(t)>=0&&(t==='RECURSO'||t==='NOME'||t==='FUNCAO'||t==='FUNÇÃO'||t==='EQUIPAMENTO'||t==='DESCRICAO'||t==='DESCRIÇÃO'||t==='ITEM'))nomeCol=c;
      }
      if(weekCols.length){ if(nomeCol<0)nomeCol=0; return {headerRow:i,nomeCol:nomeCol,weekCols:weekCols}; }
    }
    return null;
  }
  /** Qual semana do projeto tem esse rótulo/data? Devolve 0 quando não dá pra saber. */
  function semanaDoRotulo(label,raw,tw){
    var iso=excelDateToIso(raw);
    if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){
      var mon=mondayOfIso(iso);
      for(var w=1;w<=tw;w++){ if(calWeekDate(w).toISOString().slice(0,10)===mon)return w; }
      return 0;
    }
    var m=String(label||'').match(/(\d{1,2})/);
    if(m){ var n=+m[1];
      for(var w2=1;w2<=tw;w2++){ if(isoWeek(calWeekDate(w2))===n)return w2; }
    }
    return 0;
  }
  /** Semanas que já têm algum apontamento (qualquer recurso) — usadas pra proteger o que já
   *  foi importado/digitado: importação nova não mexe nelas, a não ser que o usuário marque. */
  function semanasComApontamento(tw){
    var out={};
    for(var w=1;w<=tw;w++){
      var d=calWeekDate(w).toISOString().slice(0,10);
      for(var i=0;i<RECURSOS.length;i++){ if((+REALIZADO_REC[RECURSOS[i].id+'::'+d]||0)>0){ out[w]=true; break; } }
    }
    return out;
  }
  /** Diálogo de período/proteção das importações de realizado. Resolve com

      back.innerHTML='<div class="segmenu-panel card" style="max-width:620px;max-height:88vh;overflow:auto">'+

          (hoje?'<span class="note">hoje: <b>S'+isoWeek(calWeekDate(hoje))+'</b></span>':'')+'</div>'+

          '<div class="eyebrow" style="margin-bottom:4px">Semanas já apontadas</div>'+

          '<div id="impSemanas" class="lotchips" style="max-height:150px;overflow:auto"></div>'+
        '</div>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="impCancel">Cancelar</button><button class="btn primary" id="impOk">Importar</button></div></div>';
      document.body.appendChild(back);

  async function importRealizadoWorkbook(wb){
    if(!selectedObra){alert('Abra uma obra antes de importar.');return;}
    if(isReadOnly()){alert('Seu perfil é só de visualização.');return;}
    var ws=wb.Sheets['Histograma']||wb.Sheets[wb.SheetNames[0]];
    if(!ws){alert('Planilha não reconhecida.');return;}
    var aoa=sheetRows(ws); if(aoa.length<2){alert('Planilha vazia.');return;}
    var tw=computeHistogram().tw||0; if(!tw){alert('Monte o cronograma antes: o histograma ainda não tem semanas.');return;}
    var info=detectRealizadoLayout(aoa);
    if(!info){alert('Não achei colunas de semana na planilha.\n\nO cabeçalho precisa ter colunas com o número da semana (S38, S39…) ou a data da segunda-feira. Use o botão "Modelo" como referência.');return;}
    var detectada=semanaDoRotulo(info.weekCols[0].label,info.weekCols[0].raw,tw)||hojeCalWeek(tw)||1;
    var fimCols=Math.min(tw,detectada+info.weekCols.length-1);
    var colsTxt=info.weekCols.map(function(x){return escAttr(x.label||('coluna '+(x.c+1)));}).slice(0,10).join(', ')+(info.weekCols.length>10?'…':'');
    var escolha=await openImportPeriodoDialog({
      tw:tw, titulo:'Importar realizado — período e semanas',
      nota:'Encontrei <b>'+info.weekCols.length+'</b> coluna(s) de período na planilha ('+colsTxt+'). Diga a qual semana do cronograma corresponde a <b>primeira</b> delas — as seguintes entram em ordem.',
      mostrarInicio:true, inicioPadrao:detectada, ateDefault:fimCols
    });
    if(!escolha)return;
    var byName={};
    RECURSOS.forEach(function(r){ byName[normName(r.n)]=r; (r.aliases||[]).forEach(function(a){ if(!byName[normName(a)])byName[normName(a)]=r; }); });
    var applied=0, semRec=[], foraDoPrazo=0, protegidos=0, semanasPuladas={};
    for(var i=info.headerRow+1;i<aoa.length;i++){
      var row=aoa[i]; if(!row)continue;
      var nome=String(row[info.nomeCol]==null?'':row[info.nomeCol]).trim(); if(!nome)continue;
      var r=byName[normName(nome)];
      if(!r){ if(semRec.indexOf(nome)<0)semRec.push(nome); continue; }
      for(var wi=0;wi<info.weekCols.length;wi++){
        var w=escolha.startWeek+wi;
        if(w>tw||w>escolha.ateWeek){foraDoPrazo++;continue;}
        var cell=row[info.weekCols[wi].c];
        if(cell===''||cell==null)continue;
        var val=Number(String(cell).replace(/\./g,'').replace(',','.'));
        if(!isFinite(val))continue;
        var d=calWeekDate(w).toISOString().slice(0,10), k=r.id+'::'+d;
        // Já apontado antes? Só sobrescreve se o usuário marcou essa semana no diálogo.
        if((+REALIZADO_REC[k]||0)>0&&!escolha.sobrescrever[w]){ protegidos++; semanasPuladas[w]=true; continue; }
        REALIZADO_REC[k]=val; REALIZADO_DIRTY[k]=true;
        if((+REALIZADO_TERC[k]||0)>val)REALIZADO_TERC[k]=val;
        applied++;
      }
    }
    HIST_OPEN.realizado=true;
    go('cr-hist');
    var puladasTxt=Object.keys(semanasPuladas).map(function(w){return 'S'+isoWeek(calWeekDate(+w));}).join(', ');
    var msg=applied+' apontamento(s) importado(s) de S'+isoWeek(calWeekDate(escolha.startWeek))+' até S'+isoWeek(calWeekDate(escolha.ateWeek))+'.'+
      (protegidos?' '+protegidos+' valor(es) preservados em semanas que já tinham apontamento ('+puladasTxt+') — pra atualizar, importe de novo marcando essas semanas.':'')+
      (foraDoPrazo?' '+foraDoPrazo+' valor(es) ficaram fora do período escolhido e não entraram.':'')+
      (semRec.length?'\n\nSem recurso correspondente no cadastro (ignorados): '+semRec.slice(0,12).join(', ')+(semRec.length>12?' e mais '+(semRec.length-12):'')+'.':'')+
      '\n\nConfira a tabela Realizado e clique em "Salvar apontamentos" pra confirmar.';
    alert(msg);
  }

  /* ---- Importação do realizado a partir da planilha de acompanhamento (DP + CEQ) ----
   * Abas: "Dados EFETIVO DP" (pessoas: ADMISSÃO / DEMISSÃO / FUNÇÃO OBRA) e
   *       "DADOS Realizado CEQ" (equipamentos: Mobilização / Desmobilização / TIPO TXC).
   * Regra (a mesma da planilha "Histograma MO/Equipamento"): conta na semana quem entrou até a
   * segunda-feira e não saiu antes do domingo. Sem data de saída = ainda está na obra, conta
   * em todas as semanas até a atual. Semanas futuras não são preenchidas.
   * O nome da planilha casa com o recurso do app pelo nome ou por um alias salvo
   * (recursos.aliases); o que não casar vai pra tela de de-para. */
  function normName(v){ return String(v==null?'':v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim(); }
  function findSheetByName(wb,needle){ var n=wb.SheetNames.filter(function(x){return normName(x).indexOf(needle)>=0;})[0]; return n?wb.Sheets[n]:null; }
  function findHeaderRow(aoa,required){
    for(var i=0;i<Math.min(aoa.length,20);i++){
      var row=(aoa[i]||[]).map(normName), ix={}, ok=true;
      required.forEach(function(n){ var j=row.indexOf(normName(n)); if(j<0)ok=false; ix[n]=j; });
      if(ok)return {row:i,ix:ix};
    }
    return null;
  }
  /** Lê uma aba de períodos -> {nome: [contagem por semana de calendário 1..tw]} (só até a semana atual). */
  /** colNomes = colunas candidatas ao nome (a 1ª é a principal). A linha é agrupada pela primeira
   *  coluna cujo valor casa com um recurso do app (matchRes); se nenhuma casar, pela principal
   *  — assim o de-para mostra o nome principal. */
  /** dica(row) (opcional) diz se a linha é de terceiro ('terceiro') ou própria ('proprio') —
   *  ex.: coluna Locador do CEQ. O recurso continua sendo um só (o previsto é geral); a dica
   *  só separa quanto do total realizado é de terceiro. */
  function countPeriodsByWeek(aoa,hdr,colNomes,colIni,colFim,tw,lastW,matchRes,dica){
    var counts={}, rowsOk=0, semData=0;
    if(!Array.isArray(colNomes))colNomes=[colNomes];
    for(var i=hdr.row+1;i<aoa.length;i++){
      var row=aoa[i]||[];
      var cands=colNomes.map(function(c){ var j=hdr.ix[c]; return j>=0?String(row[j]==null?'':row[j]).trim():''; }).filter(Boolean);
      if(!cands.length)continue;
      var hint=dica?dica(row):'';
      var orig=cands[0], res=null;
      for(var ci=0;ci<cands.length;ci++){ var m=matchRes?matchRes(normName(cands[ci])):null; if(m){res=m;orig=cands[ci];break;} }
      var nome=normName(orig); if(!nome)continue;
      var chave=res?('#'+res.id):nome;
      var ini=excelDateToIso(row[hdr.ix[colIni]]), fim=excelDateToIso(row[hdr.ix[colFim]]);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(ini)){semData++;continue;}
      if(!/^\d{4}-\d{2}-\d{2}$/.test(fim))fim=null; // vazio = ainda na obra
      rowsOk++;
      if(!counts[chave]){ counts[chave]=[]; for(var z=0;z<lastW;z++)counts[chave].push(0); counts[chave].orig=orig; counts[chave].nome=nome; counts[chave].res=res; counts[chave].terc=[]; for(var z2=0;z2<lastW;z2++)counts[chave].terc.push(0); }
      var arr=counts[chave];
      for(var w=1;w<=lastW;w++){
        var monD=calWeekDate(w), sunD=new Date(monD.getTime()); sunD.setDate(sunD.getDate()+6);
        var mon=monD.toISOString().slice(0,10), sun=sunD.toISOString().slice(0,10);
        if(ini<=mon&&(!fim||fim>=sun)){ arr[w-1]+=1; if(hint==='terceiro')arr.terc[w-1]+=1; }
      }
    }
    // Nomes que não somam nada no período (ex.: só mobilizado depois de hoje) não têm o que importar
    Object.keys(counts).forEach(function(k){ var any=counts[k].some(function(v){return v>0;}); if(!any)delete counts[k]; });
    return {counts:counts,rowsOk:rowsOk,semData:semData};
  }
  async function importDpCeqWorkbook(wb){
    if(!selectedObra){alert('Abra uma obra antes de importar.');return;}
    if(isReadOnly()){alert('Seu perfil é só de visualização.');return;}
    var wsDp=findSheetByName(wb,'EFETIVO'), wsCeq=findSheetByName(wb,'CEQ');
    if(!wsDp&&!wsCeq){alert('Não achei as abas "Dados EFETIVO DP" nem "DADOS Realizado CEQ" nesse arquivo.');return;}
    var tw=computeHistogram().tw||0; if(!tw){alert('Monte o cronograma antes: o histograma ainda não tem semanas.');return;}
    var hojeW=hojeCalWeek(tw); if(!hojeW){alert('A obra ainda não começou (nenhuma semana até hoje).');return;}
    var per=await openImportPeriodoDialog({
      tw:tw, titulo:'Importar DP + CEQ — período e semanas',
      nota:'O realizado é calculado das datas de admissão/demissão (DP) e mobilização/desmobilização (CEQ), semana a semana, desde o início da obra.',
      mostrarInicio:false, ateDefault:hojeW
    });
    if(!per)return;
    var lastW=Math.min(tw,per.ateWeek);
    // Casamento nome -> recurso (nome ou alias, sem acento/caixa)
    // O cadastro costuma ter sigla antes do nome ("CP - CAMINHAO PIPA"); a planilha vem sem
    // ("CAMINHÃO PIPA"). Casa também sem a sigla, dos dois lados.
    var semSigla=function(n){ return n.replace(/^[A-Z0-9]{1,5}\s*[-–]\s*/,''); };
    var byKey={};
    var addKey=function(k,r){ if(k&&!byKey[k])byKey[k]=r; };
    RECURSOS.forEach(function(r){
      var k=normName(r.n); addKey(k,r); addKey(semSigla(k),r);
      (r.aliases||[]).forEach(function(a){ var ka=normName(a); addKey(ka,r); addKey(semSigla(ka),r); });
    });
    var matchRes=function(nome){ return byKey[nome]||byKey[semSigla(nome)]||null; };
    var sources=[], problems=[], classeVotes=null, temLocador=false;
    if(wsDp){
      var aoa=sheetRows(wsDp), hdr=findHeaderRow(aoa,['ADMISSÃO','DEMISSÃO','FUNÇÃO OBRA']);
      if(!hdr)problems.push('Aba EFETIVO DP: não achei as colunas ADMISSÃO / DEMISSÃO / FUNÇÃO OBRA.');
      else {
        var c=countPeriodsByWeek(aoa,hdr,['FUNÇÃO OBRA'],'ADMISSÃO','DEMISSÃO',tw,lastW,matchRes);
        sources.push({tipo:'funcao',label:'Mão de obra (DP)',counts:c.counts,rowsOk:c.rowsOk,semData:c.semData});
        // Classificação MOD/MOI: conta o TIPO de cada pessoa por função pra preencher recursos.classe
        // que ainda estiver em branco (nunca sobrescreve o que já foi classificado à mão).
        var hrowDp=(aoa[hdr.row]||[]).map(normName), jTipo=hrowDp.indexOf('TIPO'), jFun=hdr.ix['FUNÇÃO OBRA'];
        if(jTipo>=0){
          classeVotes={};
          for(var iDp=hdr.row+1;iDp<aoa.length;iDp++){
            var rowDp=aoa[iDp]||[], fn=normName(rowDp[jFun]), tp=normName(rowDp[jTipo]);
            if(!fn||(tp!=='MOD'&&tp!=='MOI'))continue;
            var v=classeVotes[fn]||(classeVotes[fn]={MOD:0,MOI:0}); v[tp]++;
          }
        }
      }
    }
    if(wsCeq){
      // Equipamento: casa por qualquer uma das três colunas de tipo (TIPO TXC, TIPO V.A., Tipo)
      var aoa2=sheetRows(wsCeq), hdr2=findHeaderRow(aoa2,['TIPO TXC','MOBILIZAÇÃO','DESMOBILIZAÇÃO']);
      if(!hdr2)problems.push('Aba CEQ: não achei as colunas TIPO TXC / Mobilização / Desmobilização.');
      else {
        var hrow=(aoa2[hdr2.row]||[]).map(normName);
        hdr2.ix['TIPO V.A.']=hrow.indexOf('TIPO V.A.'); hdr2.ix['TIPO']=hrow.indexOf('TIPO');
        // Coluna Locador: "TRIPOLONI" = frota própria; qualquer outra empresa = terceiro.
        var jLoc=hrow.indexOf('LOCADOR');
        var dicaLoc=jLoc>=0?function(row){ var t=normName(row[jLoc]); if(!t)return ''; return /TRIPOLONI/.test(t)?'proprio':'terceiro'; }:null;
        var c2=countPeriodsByWeek(aoa2,hdr2,['TIPO TXC','TIPO V.A.','TIPO'],'MOBILIZAÇÃO','DESMOBILIZAÇÃO',tw,lastW,matchRes,dicaLoc);
        sources.push({tipo:'equipamento',label:'Equipamentos (CEQ)',counts:c2.counts,rowsOk:c2.rowsOk,semData:c2.semData});
        temLocador=jLoc>=0;
      }
    }
    if(!sources.length){alert(problems.join('\n'));return;}
    var unmatched=[];
    sources.forEach(function(src){ Object.keys(src.counts).forEach(function(k){
      var b=src.counts[k]; if(b.res||matchRes(b.nome))return;
      unmatched.push({nome:b.nome,orig:b.orig||b.nome,tipo:src.tipo,label:src.label,peak:b.reduce(function(m,v){return Math.max(m,v||0);},0)});
    }); });
    var mapping={}; // nome normalizado -> recurso (ou null = ignorar)
    if(unmatched.length){
      mapping=await openDeParaDialog(unmatched);
      if(mapping===null)return; // cancelou
      // persiste aliases nos recursos escolhidos
      var toSave={};
      Object.keys(mapping).forEach(function(nome){ var r=mapping[nome]; if(!r)return; if((r.aliases||[]).map(normName).indexOf(nome)<0){ r.aliases=(r.aliases||[]).concat([nome]); toSave[r.id]=r; } });
      var ids=Object.keys(toSave);
      for(var i=0;i<ids.length;i++){ try{ await sbUpdateRecurso(ids[i],{aliases:toSave[ids[i]].aliases}); }catch(e){ problems.push('Não consegui salvar o de-para de "'+toSave[ids[i]].n+'": '+((e&&e.message)||e)+' (rodou a migração sql/15?)'); } }
    }
    // Aplica: soma por recurso (dois nomes podem cair no mesmo recurso), sobrescreve só recursos que vieram do arquivo
    var perRes={}, ignored=[];
    sources.forEach(function(src){ Object.keys(src.counts).forEach(function(k){
      var b=src.counts[k], r=b.res||matchRes(b.nome)||mapping[b.nome];
      if(!r){ignored.push(b.orig||b.nome);return;}
      var acc=perRes[r.id]||(perRes[r.id]={tot:[],terc:[]});
      b.forEach(function(v,i){ acc.tot[i]=(acc.tot[i]||0)+(v||0); });
      (b.terc||[]).forEach(function(v,i){ acc.terc[i]=(acc.terc[i]||0)+(v||0); });
    }); });
    // Classificação MOD/MOI: os votos vêm das pessoas (coluna TIPO), mas a decisão é por
    // CATEGORIA — cada categoria ainda sem classificação recebe a predominante e todas as
    // funções dela herdam. Categoria já classificada não é tocada.
    var nClasse=0, nCats=0;
    if(classeVotes){
      var votosCat={};
      Object.keys(classeVotes).forEach(function(nome){
        var r=matchRes(nome)||mapping[nome]; if(!r||r.tipo!=='funcao')return;
        var c=catKey(r), v=votosCat[c]||(votosCat[c]={MOD:0,MOI:0});
        v.MOD+=classeVotes[nome].MOD; v.MOI+=classeVotes[nome].MOI;
      });
      var pend=[];
      Object.keys(votosCat).forEach(function(c){
        if(classeOfCat(c))return; // já classificada à mão ou numa importação anterior
        var v=votosCat[c]; if(!(v.MOD+v.MOI))return;
        var cl=v.MOD>=v.MOI?'direto':'indireto';
        nClasse+=setClasseCat(c,cl); nCats++;
        RECURSOS.forEach(function(r){ if(r.tipo==='funcao'&&catKey(r)===c)pend.push({id:r.id,classe:cl,nome:r.n}); });
      });
      for(var ic=0;ic<pend.length;ic++){
        try{ await sbUpdateRecurso(pend[ic].id,{classe:pend[ic].classe}); }
        catch(e){ problems.push('Não consegui salvar a classificação de "'+pend[ic].nome+'": '+((e&&e.message)||e)+' (rodou a migração sql/16?)'); break; }
      }
      if(!problems.length)REC_DIRTY={};
    }
    var applied=0, nRes=0, protegidos=0, semanasPuladas={}, totTerc=0;
    Object.keys(perRes).forEach(function(id){
      nRes++;
      for(var w=1;w<=lastW;w++){
        var d=calWeekDate(w).toISOString().slice(0,10), k=id+'::'+d;
        var v=perRes[id].tot[w-1]||0, vt=perRes[id].terc[w-1]||0;
        // Não mexe em semana já apontada, a menos que tenha sido marcada no diálogo.
        if((+REALIZADO_REC[k]||0)>0&&!per.sobrescrever[w]){ protegidos++; semanasPuladas[w]=true; continue; }
        REALIZADO_REC[k]=v; REALIZADO_TERC[k]=vt; REALIZADO_DIRTY[k]=true;
        totTerc+=vt; applied++;
      }
    });
    HIST_OPEN.realizado=true;
    go('cr-hist');
    var resumo=sources.map(function(src){return src.label+': '+src.rowsOk+' linhas'+(src.semData?' ('+src.semData+' linhas sem data de entrada, ignoradas)':'');}).join(' · ');
    var puladasTxtD=Object.keys(semanasPuladas).map(function(w){return 'S'+isoWeek(calWeekDate(+w));}).join(', ');
    var msg=nRes+' recurso(s) preenchidos até S'+isoWeek(calWeekDate(lastW))+' ('+lastW+' semanas). '+resumo+'.'+
      (protegidos?' '+protegidos+' valor(es) preservados em semanas que já tinham apontamento ('+puladasTxtD+') — pra atualizar, importe de novo marcando essas semanas.':'')+(nClasse?' '+nCats+' categoria(s) de mão de obra classificadas pela coluna TIPO ('+nClasse+' função(ões)).':'')+
      (temLocador?' A parcela de terceiros veio da coluna Locador (TRIPOLONI = frota própria)'+(totTerc>0?' — '+fmtBR(totTerc)+' equipamento×semana de terceiros':'')+'.':' A planilha não tem coluna Locador, então tudo entrou como próprio.')+(ignored.length?' Sem recurso correspondente (ignorados): '+ignored.slice(0,12).join(', ')+(ignored.length>12?' e mais '+(ignored.length-12):'')+'.':'')+(problems.length?'\n\n'+problems.join('\n'):'')+'\n\nConfira a tabela Realizado e clique em "Salvar apontamentos" pra confirmar.';
    alert(msg);
  }

  /** Lotes + quantidades — uma sheet só: Lote, [Pacote,] Ordem, <serviço1>, <serviço2>...
   * ("Pacote" é opcional — arquivos exportados antes dessa coluna existir continuam funcionando.)
   * Casa as quantidades pelo nome do serviço já cadastrado na obra (precisa dos Serviços prontos). */
  /** Número vindo de planilha: aceita 1234.5, "1.234,56" e "1,234.56". Célula numérica do Excel
   *  já vem como number; o que chega como texto é que precisa de tradução — e antes virava NaN
   *  e a quantidade era descartada em silêncio. */
  function numPlanilha(v){
    if(typeof v==='number')return isFinite(v)?v:null;
    var t=String(v==null?'':v).trim(); if(!t)return null;
    t=t.replace(/\s/g,'').replace(/[R$%]/g,'');
    var ip=t.lastIndexOf('.'), iv=t.lastIndexOf(',');
    if(ip>=0&&iv>=0){
      // tem os dois: o que vem por último é o decimal (1.234,56 é BR; 1,234.56 é EN)
      if(iv>ip)t=t.replace(/\./g,'').replace(',','.');
      else t=t.replace(/,/g,'');
    } else if(iv>=0){
      t=t.replace(',','.');
    } else if(/^-?\d{1,3}(\.\d{3})+$/.test(t)){
      // só pontos, em grupos de três: separador de milhar ("2.000" é dois mil, não dois)
      t=t.replace(/\./g,'');
    }
    var n=Number(t);
    return isFinite(n)?n:null;
  }

  async function importLotesInterno(wsLot){
    var createdLot=0, qtyCount=0, semServico=[], naoNumero=0;

    var lotAoa=sheetRows(wsLot);
    if(lotAoa.length<=1)return {createdLot:0,qtyCount:0,semServico:[],naoNumero:0};

    // As colunas de quantidade são as que têm nome de serviço CADASTRADO, onde quer que estejam.
    // Antes a posição era fixa (pula 2 ou 3 colunas conforme houvesse "Pacote"), e numa planilha
    // montada à mão isso desalinhava tudo ou comia o primeiro serviço sem avisar.
    var svcIdxByName0={}; SERV.forEach(function(sv,si){ svcIdxByName0[chaveNomeServ(sv.n)]=si; });
    var META={lote:1,pacote:1,ordem:1,'pacote contratual':1,comprimento:1,espacamento:1};

      if(si!=null){ colServ.push({c:c,si:si}); return; }
      if(nome&&!META[low])semServico.push(nome);
    });
    var hasPacoteCol=iPacote>=0;
    var lotByName={}; LOTS.forEach(function(l,li){lotByName[l.trim().toLowerCase()]=li;});
    var rows=[];
    for(var j=1;j<lotAoa.length;j++){
      var row=lotAoa[j]; if(!row||row[0]==null||row[0]==='')continue;
      var lname=String(row[0]).trim(); if(!lname)continue;
      var pacoteVal=(hasPacoteCol&&row[iPacote]!=null)?String(row[iPacote]).trim():null;
      if(!lotByName.hasOwnProperty(lname.toLowerCase())){
        await sbCreateLote(selectedObra.id,{nome:lname,ordem:LOTS.length+createdLot+1,pacote_contratual:pacoteVal||null});
        createdLot++;
      }
      rows.push(row);
    }
    if(createdLot>0)await sbLoadCadastro(selectedObra.id);
    var lotIdxByName={}; LOTS.forEach(function(l,li){lotIdxByName[l.trim().toLowerCase()]=li;});
    // os serviços podem ter mudado de índice se a importação criou lotes e recarregou o cadastro
    var svcIdxByName={}; SERV.forEach(function(s,si){svcIdxByName[chaveNomeServ(s.n)]=si;});
    colServ=colServ.map(function(x){
      return {c:x.c,si:svcIdxByName[chaveNomeServ(header[x.c])]};
    }).filter(function(x){ return x.si!=null; });
    if(hasPacoteCol){
      for(var pk=0;pk<rows.length;pk++){
        var prow=rows[pk];
        var pli=lotIdxByName[String(prow[0]).trim().toLowerCase()]; if(pli==null)continue;
        var pval=prow[iPacote]!=null?String(prow[iPacote]).trim():'';
        if((LOTE_PACOTE[pli]||'')!==pval){
          await sbUpdateLote(window._LOTIDS[pli],{pacote_contratual:pval||null});
          LOTE_PACOTE[pli]=pval;
        }
      }
    }
    var pendentes=[], semLote=[];
    for(var k=0;k<rows.length;k++){
      var qrow=rows[k];
      var nomeL=String(qrow[0]).trim();
      var li2=lotIdxByName[nomeL.toLowerCase()];
      if(li2==null){ semLote.push(nomeL); continue; }
      for(var c2=0;c2<colServ.length;c2++){
        var cel=qrow[colServ[c2].c];
        if(cel==null||cel==='')continue;
        var val=numPlanilha(cel);
        if(val==null){ naoNumero++; continue; }

    // Confere o que REALMENTE ficou gravado. Sem isso, uma escrita recusada pelo banco (RLS,

    var naoPersistiu=0;

    var unicos={}; semServico.forEach(function(n){unicos[n]=1;});

    return {createdLot:createdLot,qtyCount:qtyCount,semServico:Object.keys(unicos),
            naoNumero:naoNumero,semLote:Object.keys(unicosL),erro:erro,

  /** Explica por que uma importação de lotes trouxe menos quantidade do que o esperado. Sem isso
   *  a coluna que não casa com nenhum serviço é ignorada em silêncio e parece que "não carregou". */
  /** Nome sem acento, sem pontuação e sem caixa — pra comparar cabeçalho de planilha com nome
   *  de serviço cadastrado sem tropecar em "Sub-Base" x "sub base". */
  function chaveNomeServ(t){
    return String(t==null?'':t).normalize('NFD').replace(/[̀-ͯ]/g,'')
      .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  }
  /** Distância de edição, só pra sugerir o serviço mais parecido quando a coluna não casa.
   *  Erro de digitação no cabeçalho ("Conteções" por "Contenções") é o motivo mais comum de uma
   *  coluna inteira ser ignorada, e sem a sugestão fica por conta do usuário caçar a diferença. */
  function distEdicao(a,b){
    var m=a.length,n=b.length,i,j,ant,tmp,lin=[];
    if(!m)return n; if(!n)return m;
    for(j=0;j<=n;j++)lin[j]=j;
    for(i=1;i<=m;i++){
      ant=lin[0]; lin[0]=i;
      for(j=1;j<=n;j++){
        tmp=lin[j];
        lin[j]=Math.min(lin[j]+1,lin[j-1]+1,ant+(a.charAt(i-1)===b.charAt(j-1)?0:1));
        ant=tmp;
      }
    }
    return lin[n];
  }
  function servicoParecido(nome){
    // Tolerancia proporcional ao MENOR dos dois nomes: com um limite fixo, nome curto vira
    // sugestao sem sentido ("Base" virava "OAE", que esta a 2 edicoes de distancia).
    var k=chaveNomeServ(nome); if(k.length<4)return '';
    var melhor='', md=1e9, empate=false;
    SERV.forEach(function(sv){
      var c=chaveNomeServ(sv.n); if(!c)return;
      var lim=Math.max(1,Math.floor(Math.min(k.length,c.length)*0.25));
      var d=distEdicao(k,c);
      if(d>lim)return;
      if(d<md){ md=d; melhor=sv.n; empate=false; } else if(d===md){ empate=true; }
    });
    return empate?'':melhor;
  }
  function avisoQuantidades(r){
    var NL=String.fromCharCode(10);
    var p=[];
    if(r.erro)p.push('A gravação das quantidades falhou: '+r.erro+'\n\nNada (ou quase nada) foi salvo. Confira a conexão e tente de novo.');
    if(!r.erro&&r.naoPersistiu)
      p.push(r.naoPersistiu+' de '+r.enviadas+' quantidades foram enviadas mas NÃO ficaram gravadas no banco.'+
        NL+NL+'O banco aceitou a chamada e devolveu os valores antigos — quase sempre é permissão (RLS) na tabela lote_servico, ou o seu perfil nesta obra não permite editar.');
    if(!r.erro&&!r.enviadas&&!(r.semServico&&r.semServico.length))
      p.push('Nenhuma célula de quantidade foi encontrada na planilha. Confira se as colunas de serviço têm valor e se a primeira linha é o cabeçalho.');
    if(r.semLote&&r.semLote.length)
      p.push(r.semLote.length+' linha(s) tinham lote que não existe nesta obra e foram ignoradas: '+
        r.semLote.slice(0,6).join(', ')+(r.semLote.length>6?' e mais '+(r.semLote.length-6):'')+'.');
    if(r.semServico&&r.semServico.length)
      p.push(r.semServico.length+' coluna(s) não batem com nenhum serviço desta obra e foram ignoradas:'+NL+
        r.semServico.slice(0,8).map(function(n){
          var sug=servicoParecido(n);
          return '• '+n+(sug?('   →   talvez seja "'+sug+'"'):'');
        }).join(NL)+(r.semServico.length>8?(NL+'• e mais '+(r.semServico.length-8)):'')+
        NL+NL+'O nome da coluna tem que ser igual ao nome do serviço cadastrado em Tempo Caminho → Serviços.');
    if(r.naoNumero)p.push(r.naoNumero+' célula(s) não eram número e foram ignoradas.');
    return p.length?('\n\n'+p.join('\n\n')):'';
  }

  /** Calendário — linha "Início" (data), "Paralisação" (início,fim) e "Chuva" (desc,início,fim,%prod,%dias). */

    var calPatch={};

    var rainsFound=[];

      if(!row||!row[0])return;

        if(row[1])calPatch.data_inicio=excelDateToIso(row[1]);
      } else if(label.indexOf('paralisa')===0){
        if(row[1]){
          var s0=excelDateToIso(row[1]), s1=row[2]?excelDateToIso(row[2]):s0;
          expandRangeToMondays(s0,s1).forEach(function(iso){feriadosSet[iso]=true;});
        }

        var producao=Number(row[4]), dias=Number(row[5]);
        rainsFound.push({desc:desc,start:rs,end:re,producao:isFinite(producao)?producao:20,dias:isFinite(dias)?dias:20});
      }
    });
    var feriadosArr=Object.keys(feriadosSet).sort();

  /** Ajustes manuais (OVR) — restaura equipe/sequência/produtividade por lote+serviço, por nome.
   * De propósito NÃO restaura semana travada nem duração fixa: isso faz o cronograma recalculado
   * bater com o original (mesma equipe, mesma ordem), mas continua 100% editável depois — uma
   * semana travada impediria mexer no cronograma (arrastar, trocar equipe etc.) porque o ajuste
   * importado ganharia do que você mudar depois. */
  function importAjustesSection(wb){
    var wsAdj=wb.Sheets['AjustesManuais'];
    if(!wsAdj)return 0;
    var lotIdxByName2={}; LOTS.forEach(function(l,li){lotIdxByName2[l.trim().toLowerCase()]=li;});
    var svcIdxByName2={}; SERV.forEach(function(s,si){svcIdxByName2[s.n.trim().toLowerCase()]=si;});
    var adjApplied=0;
    sheetRows(wsAdj).slice(1).forEach(function(row){
      if(!row||row[0]==null||row[1]==null)return;
      var li=lotIdxByName2[String(row[0]).trim().toLowerCase()], si=svcIdxByName2[String(row[1]).trim().toLowerCase()];
      if(li==null||si==null)return;
      var k=ovrKey(li,si); if(!k)return;
      var o={};
      var teamsRaw=row[4]!=null?String(row[4]).trim():'';
      if(teamsRaw)o.teams=teamsRaw.split(';').map(function(v){return parseInt(v,10);}).filter(function(v){return v>0;});
      else { var tm=parseInt(row[3],10); if(tm>0)o.team=tm; }
      if(row[5]!=null&&row[5]!==''){ var seq=parseInt(row[5],10); if(isFinite(seq))o.seq=seq; }
      var prod=pnum(row[7]); if(prod>0)o.productivity=prod;
      if(Object.keys(o).length){ OVR[k]=o; adjApplied++; }
    });
    if(adjApplied>0)ADJ_DIRTY=true;
    return adjApplied;
  }

  /** Aplica {li::si -> [{team},...]} em OVR como equipe/equipes — só isso, nunca semana/duração
   * (ver nota em importAjustesSection). Compartilhado por "Importar Tempo-Caminho" e "Importar
   * Cronograma (Project)", que só diferem na forma de ler a planilha de origem. */
  function applyTeamOvrGroups(groups){
    var applied=0;
    Object.keys(groups).forEach(function(k){
      var rows=groups[k];
      var patch={};
      var teamsArr=rows.map(function(r){return r.team;}).filter(function(t){return t>0;});
      teamsArr=teamsArr.filter(function(t,i){return teamsArr.indexOf(t)===i;});
      if(teamsArr.length>1){ patch.teams=teamsArr; patch.team=undefined; }
      else if(teamsArr.length===1){ patch.team=teamsArr[0]; patch.teams=undefined; }
      if(Object.keys(patch).length===0)return;
      OVR[k]=Object.assign({},OVR[k],patch);
      applied++;
    });
    if(applied>0)ADJ_DIRTY=true;
    return applied;
  }

  }

  function buildCalendarRows(totalWorkingWeeks){
    var holidays={}; calHolidays().forEach(function(h){holidays[mondayOfIso(h)]=true;});
    var start=new Date(TC_START()+'T00:00:00');
    var day=start.getDay(), diff=day===0?-6:1-day; start.setDate(start.getDate()+diff);
    var rows=[], cur=new Date(start), working=0, guard=0;
    while(working<totalWorkingWeeks&&guard++<3000){
      var iso=cur.toISOString().slice(0,10), isHol=!!holidays[iso];
      if(!isHol)working++;
      rows.push({date:new Date(cur),working:isHol?null:working,isHoliday:isHol});
      cur=new Date(cur); cur.setDate(cur.getDate()+7);
    }
    return rows;
  }
  var TC_HIDDEN_SVC={}; // {si:true} — serviços ocultos na matriz Tempo-Caminho (só visual, não muda o cronograma)
  /** Só a <table> da matriz (sem toggles/zoom/wrapper). lotIdxs = quais lotes entram (índices)
   *  — a impressão em PDF usa isso pra fatiar a matriz em várias folhas, uma faixa de lotes por
   *  folha, cada uma com todas as semanas. segs é passado de fora pra não recalcular o cronograma
   *  a cada fatia. */
  function matrixTableCore(withSummary,lotIdxs,segs){
    var totalWeeks=1; segs.forEach(function(sg){totalWeeks=Math.max(totalWeeks,sg.start+sg.dur-1);});
    var cell={};
    segs.forEach(function(sg){
      for(var i=0;i<sg.dur;i++){var w=sg.start+i;var k=w+'::'+sg.li;
        (cell[k]||(cell[k]=[])).push({sg:sg,qty:sg.wq[i],isStart:i===0,isEnd:i===sg.dur-1,w:w});}
    });
    var canDragCols=(window._cronoTab==='ajuste');
    var th='<th>Segunda-feira</th><th>Semana</th>'+lotIdxs.map(function(li){return '<th class="lot"'+(canDragCols?' data-lotcol="'+li+'" style="cursor:grab;touch-action:none" title="Arraste pra reordenar"':'')+'>'+LOTS[li]+'</th>';}).join('');
    var periods=calRainPeriods(), wfCache2={};
    var calRows=buildCalendarRows(totalWeeks);
    var body='';
    for(var idx=calRows.length-1;idx>=0;idx--){
      var entry=calRows[idx], d=entry.date;
      if(entry.isHoliday){
        body+='<tr class="tcm-holrow'+(ehSemanaDeHoje(d)?' tcm-hoje':'')+'"><td class="dt">'+fmtDate(d)+'</td><td class="wk">S'+isoWeek(d)+(ehSemanaDeHoje(d)?'<span class="tcm-hojetag">hoje</span>':'')+'</td><td class="tcm-holcell" colspan="'+Math.max(1,lotIdxs.length)+'">⏸ Semana paralisada — produção 0</td></tr>';
        continue;
      }
      var w=entry.working, tds='';
      var f=weekFactor(w,periods,wfCache2);
      var rainBadge=f<0.999?' <span class="tcm-rain" title="Capacidade reduzida por período de baixa praticabilidade">🌧 '+Math.round(f*100)+'%</span>':'';
      for(var lx=0;lx<lotIdxs.length;lx++){
        var li=lotIdxs[lx];
        var subs=(cell[w+'::'+li]||[]).filter(function(sc){return sc.qty>0&&!TC_HIDDEN_SVC[sc.sg.si];});
        if(!subs.length){tds+='<td class="cell" data-lot="'+li+'"></td>';continue;}
        var inner=subs.map(function(sc,i){
          var rk=sc.w+'::'+sc.sg.li+'::'+sc.sg.si, r=RESTR[rk];
          var badge=r?'<span class="tcm-badge" style="background:'+r.cat+'" title="'+r.lab+'">▲'+r.n+'</span>':'';
          var overBadge=(sc.isEnd&&sc.sg.overTarget)?'<span class="tcm-badge" style="background:var(--crit)" title="Previsão de término depois da semana alvo">⚠</span>':'';
          var grip=sc.isStart?'<span class="tcm-grip">⋮</span>':'';
          var teamTag=sc.isStart?'<span class="tcm-team">'+teamLabel(sc.sg.name,sc.sg.team)+'</span>':'';
          var adj=sc.sg.adjusted?';outline:2px solid #fff;outline-offset:-2px':'';
          return '<div class="tcm-seg" data-li="'+sc.sg.li+'" data-si="'+sc.sg.si+'" style="flex:'+Math.max(sc.qty,1)+' 1 0;background:'+sc.sg.color+';color:'+pickFont(sc.sg.color)+
            (i>0?';border-left:1px dashed rgba(255,255,255,.6)':'')+adj+'" title="'+sc.sg.name+' — Equipe '+sc.sg.team+(sc.isEnd?' (saldo)':'')+(sc.sg.adjusted?' (ajustado)':'')+(sc.sg.overTarget?' — previsão de término depois da semana alvo':'')+'">'+
            grip+fmtBR(sc.qty)+badge+overBadge+teamTag+'</div>';
        }).join('');
        tds+='<td class="cell" data-lot="'+li+'"><div class="tcm-row">'+inner+'</div></td>';
      }
      var ehHoje=ehSemanaDeHoje(d);
      var cls=[(f<0.999?'tcm-rainrow':''),(ehHoje?'tcm-hoje':'')].filter(Boolean).join(' ');
      body+='<tr'+(cls?' class="'+cls+'"':'')+' data-week="'+w+'"><td class="dt">'+fmtDate(d)+'</td><td class="wk">S'+isoWeek(d)+(ehHoje?'<span class="tcm-hojetag">hoje</span>':'')+rainBadge+'</td>'+tds+'</tr>';
    }
    if(withSummary){
      body+=SERV.map(function(s,si){
        if(TC_HIDDEN_SVC[si])return '';
        var hex=svcColor(s);
        var cells=lotIdxs.map(function(li){return '<td class="sumq">'+(QTY[li][si]>0?fmtBR(QTY[li][si]):'—')+'</td>';}).join('');
        return '<tr class="sumrow"><td class="sumname" colspan="2" style="background:'+hex+';color:'+pickFont(hex)+'">'+s.n+' ('+s.u+')</td>'+cells+'</tr>';
      }).join('');
    }
    return '<table class="tcm"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table>';
  }
  function matrixTableHTML(withSummary){
    var tableHtml=matrixTableCore(withSummary,viewLotIdxs(),buildSchedule());
    var anyHidden=SERV.some(function(s,si){return !!TC_HIDDEN_SVC[si];});
    var svcToggles=SERV.length?('<div class="tc-svctoggle">'+
      SERV.map(function(sv,si){
        var hidden=!!TC_HIDDEN_SVC[si];
        return '<label class="lotchip'+(hidden?' other':' on')+'"><input type="checkbox" data-svcvis="'+si+'"'+(hidden?'':' checked')+'><span class="swatch" style="background:'+svcColor(sv)+'"></span>'+sv.n+'</label>';
      }).join('')+
      (anyHidden?'<button class="btn" id="svcShowAll" style="padding:4px 10px;font-size:11.5px">Mostrar todos</button>':'')+

    var z=window._matrixZoom||1;
    var zoomBar='<div class="tc-zoom"><button data-zoom="out" title="Diminuir">−</button><span class="lvl">'+Math.round(z*100)+'%</span><button data-zoom="in" title="Aumentar">+</button>'+
      '<button data-zoom="fit" title="Ajustar à tela" style="width:auto;padding:0 10px">Ajustar à tela</button>'+
      (z!==1?'<button data-zoom="reset" title="100%" style="width:auto;padding:0 10px">100%</button>':'')+
      '<button data-zoom="full" title="Ver a matriz ocupando a tela toda (Esc sai)" style="width:auto;padding:0 10px;margin-left:auto">'+(document.body.classList.contains('mat-fullscreen')?'✕ Sair da tela cheia':'⛶ Tela cheia')+'</button>'+'</div>';
    // O zoom vai no conteúdo (tc-zoomin), não no quadro: o quadro (tcWrap) mantém o tamanho e
    // rola por dentro — a página não cresce quando a escala muda.
    return svcToggles+zoomBar+'<div class="tc-wrap" id="tcWrap"><div class="tc-zoomin" style="zoom:'+z+'">'+tableHtml+'</div></div>';

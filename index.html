      '<span class="lab">Lotes e sequência de execução por equipe</span>'+
      '<label style="font-size:12.5px;display:flex;align-items:center;gap:6px">Serviço: <select id="assignSvc">'+svcOpts+'</select></label>'+
      '<label style="font-size:12.5px;display:flex;align-items:center;gap:6px">Equipe: <select id="assignTeam">'+teamOpts+'</select></label></div>'+
      '<div class="note" style="margin:8px 0 4px">Lotes desta equipe (marque/desmarque pra reatribuir — marque o mesmo lote em mais de uma equipe pra dividir ele entre elas):</div>'+
      '<div class="lotchips">'+chips+'</div>'+
      '<div class="note" style="margin:10px 0 4px">Sequência de execução da Equipe '+team+' — do primeiro ao último lote (arraste ⋮ ou use as setas):</div>'+
      (seqItems.length?'<div class="seqlist">'+seqRows+'</div>':'<div class="note">Nenhum lote atribuído a esta equipe ainda.</div>');
    var sel=document.getElementById('assignSvc');
    if(sel){sel.value=si;sel.addEventListener('change',function(){window._tcAssignSvc=+sel.value;window._tcAssignTeam=1;renderAssignPanel();});}
    var selT=document.getElementById('assignTeam');
    if(selT)selT.addEventListener('change',function(){window._tcAssignTeam=+selT.value;renderAssignPanel();});
    function setLotTeams(li,teamsArr){
      var k=ovrKey(li,si); if(!k)return;
      if(teamsArr.length===0){
        if(OVR[k]){ delete OVR[k].team; delete OVR[k].teams; delete OVR[k].seq; if(Object.keys(OVR[k]).length===0)delete OVR[k]; }
      } else if(teamsArr.length===1){
        OVR[k]=Object.assign({},OVR[k],{team:teamsArr[0]}); delete OVR[k].teams;
      } else {
        OVR[k]=Object.assign({},OVR[k],{teams:teamsArr}); delete OVR[k].team;
      }
      ADJ_PENDING[k]=true;
    }
    p.querySelectorAll('[data-li]').forEach(function(cb){
      cb.addEventListener('change',function(){
        var li=+cb.getAttribute('data-li');
        var cur=lotTeams(li);

        setLotTeams(li,next);

    });
    function moveSeq(li,dir){
      var idx=-1; seqItems.forEach(function(it,i){if(it.li===li)idx=i;});
      var swapIdx=idx+dir;
      if(idx<0||swapIdx<0||swapIdx>=seqItems.length)return;
      var tmp=seqItems[idx]; seqItems[idx]=seqItems[swapIdx]; seqItems[swapIdx]=tmp;
      seqItems.forEach(function(it,i){
        var k=ovrKey(it.li,si); if(!k)return;
        OVR[k]=Object.assign({},OVR[k],{seq:i});
        ADJ_PENDING[k]=true;
      });
      ADJ_DIRTY=true;
      renderCrono();
    }
    function reorderSeqTo(fromLi,toLi){
      if(fromLi==null||toLi==null||fromLi===toLi)return;
      var fromIdx=-1,toIdx=-1;
      seqItems.forEach(function(it,i){ if(it.li===fromLi)fromIdx=i; if(it.li===toLi)toIdx=i; });
      if(fromIdx<0||toIdx<0)return;
      var moved=seqItems.splice(fromIdx,1)[0];
      seqItems.splice(toIdx,0,moved);
      seqItems.forEach(function(it,i){
        var k=ovrKey(it.li,si); if(!k)return;
        OVR[k]=Object.assign({},OVR[k],{seq:i});
        ADJ_PENDING[k]=true;
      });
      ADJ_DIRTY=true;
      renderCrono();
    }
    p.querySelectorAll('.seqrow[data-seqli]').forEach(function(row){
      row.addEventListener('dragstart',function(e){
        window._seqDragSrc=+row.getAttribute('data-seqli');
        try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','');}catch(err){}
        row.style.opacity='.5';
      });
      row.addEventListener('dragend',function(){ row.style.opacity=''; });
      row.addEventListener('dragover',function(e){ e.preventDefault(); row.style.outline='2px dashed var(--accent)'; });
      row.addEventListener('dragleave',function(){ row.style.outline=''; });
      row.addEventListener('drop',function(e){
        e.preventDefault(); row.style.outline='';
        var src=window._seqDragSrc; window._seqDragSrc=null;
        var target=+row.getAttribute('data-seqli');
        if(src!=null)reorderSeqTo(src,target);
      });
    });
    p.querySelectorAll('[data-squp]').forEach(function(b){b.addEventListener('click',function(){moveSeq(+b.getAttribute('data-squp'),-1);});});
    p.querySelectorAll('[data-sqdn]').forEach(function(b){b.addEventListener('click',function(){moveSeq(+b.getAttribute('data-sqdn'),1);});});
  }

  /* ---------- Landing (seleção de obras) ---------- */
  async function renderLanding(filter){
    var g=document.getElementById('obrasGrid'); if(!g)return;
    if(!SB){g.innerHTML='<div class="note" style="padding:20px;color:var(--crit)">Supabase não carregou. Abra o arquivo localmente.</div>';return;}
    g.innerHTML='<div class="note" style="padding:20px">Carregando obras…</div>';
    var obras=[];
    try{ obras=await sbListObras(); }
    catch(e){ g.innerHTML='<div class="note" style="padding:20px;color:var(--crit)">Falha ao carregar obras: '+((e&&e.message)||e)+'</div>'; return; }
    window._OBRAS=obras;
    var f=(filter||'').toLowerCase();
    var cards=obras.filter(function(o){return !f||(o.nome||'').toLowerCase().indexOf(f)>=0||(o.codigo||'').toLowerCase().indexOf(f)>=0;})
      .map(function(o,i){var cor=PALVARS[i%6];
        return '<button class="obra-card" data-obra="'+o.id+'"><div class="top" style="background:var('+cor+')"></div>'+
          '<div class="in"><div class="code">'+(o.codigo||'—')+'</div><h3>'+(o.nome||'(sem nome)')+'</h3>'+
          '<div class="trecho">'+(o.rodovia||'&nbsp;')+'</div>'+
          '<div class="stats" style="border-top:1px solid var(--line-2);padding-top:12px">'+
            '<div class="st"><div class="k">Início</div><div class="v small">'+(o.data_inicio||'—')+'</div></div>'+
            '<div class="st" style="margin-left:auto"><span class="obra-del" data-del="'+o.id+'" title="Excluir obra">✕</span></div>'+
          '</div></div></button>';
      }).join('');
    cards+='<button class="obra-new" id="newObra"><span class="plus">+</span>Nova obra</button>';
    g.innerHTML=cards||('<div class="note" style="padding:20px">Nenhuma obra ainda. Crie a primeira.</div>'+cards);
    g.querySelectorAll('[data-obra]').forEach(function(b){b.addEventListener('click',function(e){ if(e.target&&e.target.closest('[data-del]'))return; selectObra(b.getAttribute('data-obra')); });});
    g.querySelectorAll('[data-del]').forEach(function(b){b.addEventListener('click',async function(e){ e.stopPropagation(); if(!confirm('Excluir esta obra e todos os dados dela? Não dá pra desfazer.'))return; try{ await sbDeleteObra(b.getAttribute('data-del')); renderLanding(document.getElementById('obraSearch').value); }catch(err){ alert('Falha ao excluir: '+((err&&err.message)||err)); } });});
    var nb=document.getElementById('newObra'); if(nb)nb.addEventListener('click',enterNewObra);
  }
  function showLanding(){
    selectedObra=null;
    try{ safeStore.removeItem('lps-tripoloni-lastobra'); safeStore.removeItem('lps-tripoloni-lastview'); }catch(e){}
    document.getElementById('landing').classList.add('show');
  }
  async function selectObra(id,initialView,silent){
    var o=(window._OBRAS||[]).find(function(x){return x.id===id;})||{id:id,nome:'Obra'};
    document.getElementById('obraSelName').textContent=o.nome||'Obra';
    try{ await sbLoadCadastro(id); }
    catch(e){ if(!silent)alert('Falha ao carregar a obra: '+((e&&e.message)||e)); return; }
    selectedObra={id:id,nome:o.nome}; CUR={id:id,nome:o.nome};
    document.getElementById('landing').classList.remove('show');
    try{ safeStore.setItem('lps-tripoloni-lastobra',id); }catch(e){}
    go(initialView&&CRUMB[initialView]?initialView:'torre');
  }
  async function enterNewObra(){
    var nome=prompt('Nome da nova obra:','Nova obra'); if(nome===null)return;
    try{ var id=await sbCreateObra({nome:nome}); await selectObra(id); }
    catch(e){ alert('Falha ao criar obra: '+((e&&e.message)||e)); }
  }

  /* ---------- theme + boot ---------- */
  function toggleTheme(){
    var t=root.getAttribute('data-theme');
    var dark = t? t==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme',dark?'light':'dark');
    if(selectedObra) go(current); else renderLanding(document.getElementById('obraSearch').value);
  }
  document.getElementById('themeBtn').addEventListener('click',toggleTheme);
  document.getElementById('themeBtn2').addEventListener('click',toggleTheme);
  document.getElementById('menuBtn').addEventListener('click',function(){document.getElementById('side').classList.toggle('open');});
  document.getElementById('obraSel').addEventListener('click',function(){ renderLanding(); showLanding(); });
  document.getElementById('topSaveBtn').addEventListener('click',saveAllPending);
  document.getElementById('obraSearch').addEventListener('input',function(e){renderLanding(e.target.value);});

  document.getElementById('content').addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('[data-import]');
    if(!t)return;
    pickExcelFile(function(file){readWorkbookFile(file).then(applyImportWorkbook).catch(function(err){alert('Falha ao ler o arquivo: '+((err&&err.message)||err));});});
  });

  // Login wiring
  var af=document.getElementById('authForm'); if(af)af.addEventListener('submit',function(e){e.preventDefault();doAuth('in');});
  var au=document.getElementById('authUp'); if(au)au.addEventListener('click',function(){doAuth('up');});
  document.querySelectorAll('.avatar').forEach(function(el){el.style.cursor='pointer';el.title='Sair da conta';el.addEventListener('click',function(){if(confirm('Sair da conta?'))signOut();});});

  // Boot: sessão
  (async function boot(){
    if(!SB){ showAuth(); return; }
    try{ var s=await SB.auth.getSession(); if(s&&s.data&&s.data.session){ hideAuth(); await enterApp(); } else { showAuth(); } }
    catch(e){ showAuth(); }
  })();
})();
</script>

  /** Quadro da matriz ocupa o que sobra da tela abaixo dele (com a página no topo), com mínimo
   *  de 320px — independe do zoom, que só escala o conteúdo por dentro. Em tela cheia o bloco é
   *  uma camada fixa, então a medida é direto na janela (sem somar a rolagem da página). */
  function fitMatrixFrameHeight(){
    var wrap=document.getElementById('tcWrap'); if(!wrap||document.body.classList.contains('printing-mat'))return;
    var full=document.body.classList.contains('mat-fullscreen');
    var top=wrap.getBoundingClientRect().top+(full?0:(window.scrollY||window.pageYOffset||0));
    var h=Math.max(full?240:320,Math.floor(window.innerHeight-top-(full?14:18)));
    wrap.style.maxHeight=h+'px';
  }
  /** Abre a gaveta de edição quando faz sentido: tela cheia + aba de ajuste + perfil que edita. */
  function abreGavetaAjuste(){
    var vale=document.body.classList.contains('mat-fullscreen')&&
             (window._cronoTab==='ajuste'||window._cronoTab==='equipe')&&!isReadOnly();
    document.body.classList.toggle('assign-open',vale);
    fitMatrixFrameHeight();
    requestAnimationFrame(fitMatrixFrameHeight);
  }
  function setMatrixFullscreen(on){
    document.body.classList.toggle('mat-fullscreen',!!on);
    if(!on)document.body.classList.remove('assign-open');
    else abreGavetaAjuste();
    document.querySelectorAll('.tc-zoom [data-zoom="full"]').forEach(function(b){ b.textContent=on?'✕ Sair da tela cheia':'⛶ Tela cheia'; });
    if(on)window.scrollTo(0,0);
    fitMatrixFrameHeight();
    requestAnimationFrame(fitMatrixFrameHeight);
  }
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape'||!document.body.classList.contains('mat-fullscreen'))return;
    // Esc fecha primeiro a gaveta de edição; só depois sai da tela cheia.
    if(document.body.classList.contains('assign-open')){ document.body.classList.remove('assign-open'); fitMatrixFrameHeight(); return; }
    setMatrixFullscreen(false);
  });
  /** Liga a barra da tela cheia (abas, gaveta e ações do ajuste manual) — refeita a cada render. */
  function wireFsBar(){
    document.querySelectorAll('[data-fstab]').forEach(function(b){
      b.addEventListener('click',function(){
        window._cronoTab=b.getAttribute('data-fstab');
        var tabs=document.getElementById('cronoTabs');
        if(tabs)tabs.querySelectorAll('.subtab').forEach(function(x){ x.classList.toggle('active',x.getAttribute('data-tab')===window._cronoTab); });
        // Em tela cheia o painel de equipes e sequência fica numa gaveta fechada, e entrar no
        // Ajuste manual sem ele dava a impressão de que não dava pra editar. Abre junto; quem
        // fechar continua fechado até trocar de aba de novo.
        abreGavetaAjuste();
        renderCrono();
      });
    });
    document.querySelectorAll('[data-fsdrawer]').forEach(function(b){
      b.addEventListener('click',function(){ document.body.classList.toggle('assign-open'); fitMatrixFrameHeight(); requestAnimationFrame(fitMatrixFrameHeight); });
    });
    document.querySelectorAll('[data-fsact]').forEach(function(b){
      b.addEventListener('click',function(){
        var alvo=document.getElementById(b.getAttribute('data-fsact')==='save'?'saveAdjustsBtn':'clearAdjustsBtn');
        if(alvo)alvo.click();
      });
    });
  }
  window.addEventListener('resize',function(){ fitMatrixFrameHeight(); });
  function wireMatrixZoom(){
    fitMatrixFrameHeight();
    wireFsBar();
    document.querySelectorAll('[data-zoom]').forEach(function(b){
      b.addEventListener('click',function(){
        var act=b.getAttribute('data-zoom'), z=window._matrixZoom||1;
        if(act==='full'){ setMatrixFullscreen(!document.body.classList.contains('mat-fullscreen')); return; }
        if(act==='in')z=Math.min(1.6,+(z+0.1).toFixed(2));
        else if(act==='out')z=Math.max(0.4,+(z-0.1).toFixed(2));
        else if(act==='reset')z=1;
        else if(act==='fit'){
          var wrap=document.getElementById('tcWrap');
          if(wrap){
            var table=wrap.querySelector('table');
            var containerW=wrap.parentElement?wrap.parentElement.clientWidth:0;
            var naturalW=table?table.scrollWidth/(window._matrixZoom||1):0;
            if(naturalW>0&&containerW>0)z=Math.max(0.4,Math.min(1.2,+(containerW/naturalW).toFixed(2)));
          }
        }
        window._matrixZoom=z;
        go(current);
      });
    });
    document.querySelectorAll('[data-svcvis]').forEach(function(cb){
      cb.addEventListener('change',function(){
        var si=+cb.getAttribute('data-svcvis');
        if(cb.checked)delete TC_HIDDEN_SVC[si]; else TC_HIDDEN_SVC[si]=true;
        go(current);
      });
    });
    var showAll=document.getElementById('svcShowAll');
    if(showAll)showAll.addEventListener('click',function(){ TC_HIDDEN_SVC={}; go(current); });
  }

  /* ================= Linha de Balanço (tela própria) =================
   * Detalhamento do Tempo-Caminho para um serviço específico. O fluxo de trabalho é:
   *   1) escolher o serviço a detalhar;
   *   2) desenhar as ETAPAS desse serviço no macro-fluxo (caixas) e ligá-las com setas,
   *      podendo pôr uma latência (espera) em cada ligação;
   *   3) informar a duração de cada etapa em DIAS;
   *   4) escolher em quais lotes o serviço ocorre e em que ordem serão executados.
   * Com isso o app monta a linha de balanço: cada etapa caminha lote a lote (uma equipe por
   * etapa), respeitando as predecessoras + latência dentro do lote e a continuidade da equipe
   * entre lotes. Tempo na horizontal (dias, com as semanas do projeto marcadas), lotes na
   * vertical. Fica guardado em obras.linha_balanco (migração 20) e não altera o cronograma. */
  var LB=null;        // {servicoSel, servicos:{<servicoId>:{inicio,lotes[],etapas[],setas[]}}}
  var LB_DIRTY=false;
  var LB_PAL=['#c0392b','#e67e22','#f1c40f','#27ae60','#2980b9','#8e44ad','#16a085','#7f8c8d'];
  var DIAS_SEM=5;     // dias úteis por semana (igual ao resto do app)
  var MF_MODE='mover', MF_SEL=null;
  var LB_TAB='lb';        // aba interna: lb | ajuste | gantt | curva
  var LB_VIEW='linhas';   // desenho da linha de balanço: linhas (faixas) | quadros (blocos)
  var LB_CONEX=false;     // mostra as ligações do macro-fluxo dentro de cada lote
  var LB_GANTT_FONTE='lb';// gantt: lb | tc
  var LB_GANTT_VISTA='grafico'; // gantt: grafico | cronograma
  var MF_W=1200, MF_H=460, MF_NW=136, MF_NH=44; // caixas compactas: cabem mais etapas

  function lbLoteIds(){ return window._LOTIDS||[]; }
  function lbNomeLote(id){ var ids=lbLoteIds(), i=ids.indexOf(id); return i>=0?(LOTS[i]||id):id; }
  /** Sigla curta da etapa (o que aparece dentro do quadro). Se não for informada, monta pelas
   *  iniciais das palavras: "Armação Pilar" -> "AP", "Concretagem" -> "CON". */
  function lbSigla(e){
    if(e&&e.sigla)return String(e.sigla).trim().slice(0,5);
    var pal=String((e&&e.nome)||'').replace(/[^\wÀ-ÿ\s]/g,' ').split(/\s+/).filter(function(w){return w.length>2||/^[0-9]+$/.test(w);});
    if(!pal.length)return '—';
    if(pal.length===1)return pal[0].slice(0,3).toUpperCase();
    return pal.slice(0,3).map(function(w){return w.charAt(0).toUpperCase();}).join('');
  }
  /** Ajuste manual de uma etapa num lote específico: {off: dias de atraso, dur: duração própria}.
   *  Mexer num lote só empurra dali pra frente — os lotes anteriores ficam como estavam, o que
   *  permite descontinuidade (a equipe espera entre um lote e outro). */
  function lbAjuste(e,loteId){ return (e&&e.aj&&e.aj[loteId])||null; }
  /** A etapa acontece neste lote? (dá pra excluir uma etapa de um lote específico) */
  function lbOcorre(e,loteId){ var a=lbAjuste(e,loteId); return !(a&&a.pula); }
  function lbSetAjuste(e,loteId,patch){
    if(!e.aj)e.aj={};
    var a=e.aj[loteId]||{};
    Object.keys(patch).forEach(function(k){ a[k]=patch[k]; });
    if(!(a.off>0)&&!(a.dur>0)&&!a.pula&&!(a.ini!=null&&a.ini>=0))delete e.aj[loteId]; else e.aj[loteId]=a;
  }
  function lbSvcId(si){ var s=SERV[si]; return (s&&s.id)||('s'+si); }
  function lbSvcIdx(id){ for(var i=0;i<SERV.length;i++){ if(lbSvcId(i)===id)return i; } return -1; }
  function lbRoot(){
    if(LB)return LB;
    var raw=(window._OBRA&&window._OBRA.linha_balanco)||null;
    LB={servicoSel:null,servicos:{}};
    if(raw&&typeof raw==='object'){
      if(raw.servicos&&typeof raw.servicos==='object'){
        LB.servicoSel=raw.servicoSel||null;
        Object.keys(raw.servicos).forEach(function(k){
          var c=raw.servicos[k]||{};
          LB.servicos[k]={inicio:+c.inicio||1,
            lotes:Array.isArray(c.lotes)?c.lotes.slice():[],
            etapas:(c.etapas||[]).map(function(e){return Object.assign({},e);}),
            setas:(c.setas||[]).map(function(e){return Object.assign({},e);})};
        });
      } else if(Array.isArray(raw.lotes)){
        // formato antigo (estudo solto): aproveita só a lista de lotes no primeiro serviço
        LB._lotesAntigos=raw.lotes.slice();
      }
    }
    return LB;
  }
  /** Config do serviço selecionado, criando o padrão na primeira vez. */
  function lbSvc(){
    var root=lbRoot();
    if(root.servicoSel==null||lbSvcIdx(root.servicoSel)<0)root.servicoSel=SERV.length?lbSvcId(0):null;
    var id=root.servicoSel; if(!id)return null;
    if(!root.servicos[id]){
      var si=lbSvcIdx(id), ids=lbLoteIds();
      // padrão: os lotes onde o serviço tem quantidade, na ordem do cadastro
      var lotes=[];
      ids.forEach(function(lid,li){ if(si>=0&&QTY[li]&&QTY[li][si]>0)lotes.push(lid); });
      if(!lotes.length)lotes=(root._lotesAntigos||ids).slice();
      var sp=null; try{ sp=svcSpan()[si]; }catch(e){}
      root.servicos[id]={inicio:(sp&&sp.s>0)?sp.s:1,lotes:lotes,etapas:[],setas:[]};
    }
    return root.servicos[id];
  }
  function lbMarkDirty(){ LB_DIRTY=true; refreshTopSaveBtn(); }
  async function lbSalvar(){
    if(!selectedObra||!LB)return;
    try{
      await sbUpdateObra(selectedObra.id,{linha_balanco:{servicoSel:LB.servicoSel,servicos:LB.servicos}});
      LB_DIRTY=false; go('cr-lb'); toast('Linha de balanço salva.');
    }catch(e){
      var m=(e&&e.message)||e;
      alert('Falha ao salvar: '+m+(/linha_balanco/.test(String(m))?'\n\nRode a migração sql/20_add_linha_balanco.sql no Supabase.':''));
    }
  }
  function lbAddEtapa(nome,cor){
    var c=lbSvc(); if(!c)return;
    var n=c.etapas.length;
    c.etapas.push({id:'e'+Date.now()+Math.floor(Math.random()*999),nome:nome||'Etapa '+(n+1),
      cor:cor||LB_PAL[n%LB_PAL.length],dias:5,x:40+(n%6)*180,y:40+Math.floor(n/6)*78});
    lbMarkDirty(); go('cr-lb');
  }

  /* ---- cálculo da linha de balanço ---- */
  /** Ordem topológica das etapas (predecessora antes). Ciclo: mantém a ordem declarada. */
  function lbOrdemEtapas(c){
    var ids=c.etapas.map(function(e){return e.id;});
    var grau={}, adj={};
    ids.forEach(function(id){grau[id]=0;adj[id]=[];});
    c.setas.forEach(function(st){ if(grau[st.para]==null||adj[st.de]==null)return; grau[st.para]++; adj[st.de].push(st.para); });
    var fila=ids.filter(function(id){return grau[id]===0;}), out=[];
    while(fila.length){
      var id=fila.shift(); out.push(id);
      adj[id].forEach(function(p){ if(--grau[p]===0)fila.push(p); });
    }
    ids.forEach(function(id){ if(out.indexOf(id)<0)out.push(id); }); // sobra de ciclo
    return out;
  }
  /** Agenda cada etapa em cada lote, em DIAS a partir do início do serviço.
   *  Dentro do lote: etapa só começa depois das predecessoras (+ latência).
   *  Entre lotes: a equipe da etapa só vai pro lote seguinte quando termina o atual. */
  function lbCalc(){
    var c=lbSvc(); if(!c)return null;
    var lotes=c.lotes.filter(function(id){return lbLoteIds().indexOf(id)>=0;});
    if(!lotes.length||!c.etapas.length)return {lotes:lotes,itens:[],maxDia:0,c:c};
    var ordem=lbOrdemEtapas(c), porId={}; c.etapas.forEach(function(e){porId[e.id]=e;});
    var preds={}; c.etapas.forEach(function(e){preds[e.id]=[];});
    c.setas.forEach(function(st){ if(preds[st.para])preds[st.para].push({de:st.de,lat:+st.lat||0}); });
    // Uma etapa pode ter mais de uma equipe: cada lote vai pra equipe que estiver livre mais
    // cedo, então os lotes podem acontecer em paralelo (com 1 equipe, vira a fila de sempre).
    var livreEquipe={};
    c.etapas.forEach(function(e){
      var nq=Math.max(1,Math.round(+e.equipes||1)), arr=[];
      for(var k=0;k<nq;k++)arr.push(0);
      livreEquipe[e.id]=arr;
    });
    var itens=[], maxDia=0;
    lotes.forEach(function(lid,j){
      var fimNoLote={};
      ordem.forEach(function(eid){
        var e=porId[eid]; if(!e)return;
        if(!lbOcorre(e,lid))return; // etapa não acontece neste lote
        var ini=0;
        (preds[eid]||[]).forEach(function(p){
          var f=fimNoLote[p.de]; if(f!=null)ini=Math.max(ini,f+(+p.lat||0));
        });
        var livres=livreEquipe[eid]||[0], kEq=0;
        for(var q=1;q<livres.length;q++){ if(livres[q]<livres[kEq]-1e-9)kEq=q; }
        ini=Math.max(ini,livres[kEq]);    // vai pra equipe que fica livre mais cedo
        ini+=Math.max(0,+e.offset||0);   // folga da etapa inteira
        var base=ini;                     // mais cedo possível neste lote (sem o ajuste do lote)
        var aj=lbAjuste(e,lid);
        // Início FIXO: cronograma importado chega com a data decidida. Quando existe, ele manda —
        // senão a continuidade de equipe empurraria a etapa e a data planejada se perderia.
        if(aj&&aj.ini!=null&&aj.ini>=0)ini=+aj.ini;
        else if(aj&&aj.off>0)ini+=aj.off; // atraso só deste lote em diante
        var dur=Math.max(0.5,(aj&&aj.dur>0)?aj.dur:(+e.dias||1)), fim=ini+dur;
        fimNoLote[eid]=fim; livres[kEq]=fim;
        itens.push({eid:eid,lote:lid,j:j,ini:ini,fim:fim,base:base,dur:dur,eq:kEq+1,nEq:livres.length});
        maxDia=Math.max(maxDia,fim);
      });
    });
    return {lotes:lotes,itens:itens,maxDia:maxDia,c:c};
  }
  function lbDiaParaSemana(dia,inicioSem){ return (inicioSem||1)+Math.floor(dia/DIAS_SEM); }
  /** Dia do estudo (0 = início do serviço) -> data real. Conta só dias úteis (seg–sex) e usa as
   *  semanas do projeto, então pula as semanas paradas do calendário da obra. */
  function lbDiaParaData(dia,inicioSem){
    var d=Math.max(0,Math.round(dia));
    var seg=mondayOf((inicioSem||1)+Math.floor(d/DIAS_SEM));
    var dt=new Date(seg.getTime()); dt.setDate(dt.getDate()+(d%DIAS_SEM));
    return dt;
  }
  function lbDataIso(dia,inicioSem){ return lbDiaParaData(dia,inicioSem).toISOString().slice(0,10); }
  /** Data real -> dia do estudo. Fim de semana entra como a segunda seguinte. */
  function lbDataParaDia(iso,inicioSem){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return null;
    var alvo=new Date(iso+'T00:00:00');
    var segAlvo=new Date(mondayOfIso(iso)+'T00:00:00');
    var diaSem=Math.max(0,Math.min(DIAS_SEM-1,Math.round((alvo-segAlvo)/864e5)));
    for(var w=0;w<520;w++){
      var seg=mondayOf((inicioSem||1)+w);
      if(seg.toISOString().slice(0,10)===segAlvo.toISOString().slice(0,10))return w*DIAS_SEM+diaSem;
      if(seg>segAlvo)return w*DIAS_SEM; // caiu numa semana parada: joga pra próxima semana útil
    }
    return null;
  }
  /** Linha vertical de "hoje" na linha de balanço e no Gantt. Vai por último no SVG pra ficar
   *  por cima das barras — marcar o tempo e sumir atrás de uma etapa não serviria de nada.
   *  Fora da janela do estudo (serviço que ainda não começou ou já terminou) não desenha. */
  function lbLinhaHoje(inicioSem,xx,totDias,pt,ih){
    var hoje=new Date(); hoje.setHours(0,0,0,0);
    // Estudo que ainda não começou: lbDataParaDia devolveria 0 (ele empurra data anterior pra
    // primeira semana útil) e a linha apareceria no dia 0, dizendo que hoje é o início. Não é.
    if(hoje<mondayOf(inicioSem||1))return '';
    var dia=lbDataParaDia(todayISO(),inicioSem||1);
    if(dia==null||dia<0||dia>totDias)return '';
    var x=xx(dia).toFixed(1);
    return '<line x1="'+x+'" y1="'+(pt-4)+'" x2="'+x+'" y2="'+(pt+ih)+'" stroke="var(--crit)" stroke-width="1.6" stroke-dasharray="5 3" opacity=".95"><title>Hoje — '+fmtDate(new Date())+'</title></line>'+
      '<text x="'+x+'" y="'+(pt-8)+'" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--crit)">hoje</text>';
  }
  /* ---------- Importar cronograma (Gantt do Excel) para a linha de balanço ----------
   * O cronograma que a obra recebe vem no template Vertex42: uma linha por tarefa, com a
   * hierarquia num código de ID (1 → 1.1 → 1.11 → 1.111 → 1.1111) e as datas já decididas.
   *
   * Níveis encontrados nesse arquivo: 1 local · 2 grupo (infra/meso/super) · 3 conjunto ·
   * 4 elemento · 5 folha (aço/fôrma/concreto). O que vira ETAPA é o elemento — o nível que
   * de fato se executa, logo acima das folhas.
   *
   * Como o cronograma chega com data marcada, cada par etapa × lote entra com INÍCIO FIXO
   * (aj.ini). A linha de balanço deixa de calcular a posição dessas e passa a mostrar o que
   * foi planejado — que é o ponto de transportar um cronograma pra cá. */
  function lbNormNome(v){
    var s=String(v==null?'':v).replace(/\s+/g,' ').trim().toUpperCase();
    // "ENCONTRO 1" e "ENCONTRO 01" são a mesma etapa em lotes diferentes; sem isso viram duas
    s=s.replace(/\b(ENCONTRO|ENC|V|VT|APOIO)\s*0*(\d)\b/g,function(_,p,n){ return p+' 0'+n; });
    s=s.replace(/^LAJE DE APROXIMACAO$/,'LAJES DE APROXIMACAO');
    s=s.replace(/^GABIAO - (.+)$/,'$1 - GABIAO');
    return s;
  }
  function lbSemAcento(v){ return String(v==null?'':v).normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function lbChaveNome(v){ return lbNormNome(lbSemAcento(v)); }
  function lbEhFolha(nome){ return /^(ACO|FORMA|CONCRETO)\b/.test(lbChaveNome(nome)); }

  function importarCronogramaArquivo(){
    if(!selectedObra){ alert('Abra uma obra antes de importar.'); return; }
    if(isReadOnly()){ alert('Seu perfil é só de visualização.'); return; }
    if(!lbSvc()){ alert('Escolha primeiro o serviço que esta linha de balanço detalha.'); return; }
    pickExcelFile(function(file){
      lerCronograma(file).then(importarCronogramaWorkbook).catch(function(e){
        alert('Não consegui ler o arquivo: '+((e&&e.message)||e));
      });
    });
  }
  /** Lê SÓ a aba do cronograma. A pasta de origem mistura físico e financeiro em dezenas de
   *  abas pesadas e abrir a pasta inteira passa de um minuto no navegador. Então primeiro pega
   *  só a lista de nomes (rápido), escolhe a candidata pelo nome e converte apenas aquela aba. */
  async function lerCronograma(file){
    if(typeof XLSX==='undefined')throw new Error('Biblioteca de planilha não carregou.');
    cargaMais();
    try{ return await lerCronogramaInterno(file); } finally{ cargaMenos(); }
  }
  async function lerCronogramaInterno(file){
    var buf=await file.arrayBuffer();
    var so=XLSX.read(buf,{type:'array',bookSheets:true});
    var nomes=(so.SheetNames||[]).slice().sort(function(a,b){
      var pa=/FISIC|REPLANEJ|CRONOGRAM|GANTT/.test(estNorm(a))?0:1;
      var pb=/FISIC|REPLANEJ|CRONOGRAM|GANTT/.test(estNorm(b))?0:1;
      return pa-pb;
    });
    for(var i=0;i<nomes.length;i++){
      var wb=XLSX.read(buf,{type:'array',sheets:[nomes[i]],cellStyles:false,cellNF:false,cellHTML:false});
      var ws=wb.Sheets[nomes[i]];
      if(ws){
        var linhas=sheetRows(ws);
        for(var k=0;k<Math.min(linhas.length,20);k++){
          var h=(linhas[k]||[]).map(estNorm);
          if(h.indexOf('ITEM')>=0&&h.some(function(x){return /^INICIO/.test(x);}))return {aoa:linhas,hdr:k,aba:nomes[i]};
        }
      }
      if(i>=5)break;   // já olhou as candidatas pelo nome e mais algumas; não varre a pasta toda
    }
    throw new Error('Não achei uma aba com a coluna ITEM e as colunas de início e fim.');
  }
  async function importarCronogramaWorkbook(src){
    var aoa=src.aoa, hdr=src.hdr, aba=src.aba;
    var h=(aoa[hdr]||[]).map(estNorm);
    var col={
      lote: estAchaCol(h,[/^COLUNA1$/,/^LOCAL$/,/^KM$/]),
      id:   estAchaCol(h,[/^ID$/]),
      grupo:estAchaCol(h,[/^COLUNA2$/,/^GRUPO$/]),
      item: estAchaCol(h,[/^ITEM$/]),
      qtd:  estAchaCol(h,[/^QTD\.?$/]),
      um:   estAchaCol(h,[/^U\.?M\.?$/]),
      ini:  estAchaCol(h,[/^INICIO PREV/,/^INICIO$/]),
      fim:  estAchaCol(h,[/^FIM PREV/,/^FIM$/,/^TERMINO$/]),
      real: estAchaCol(h,[/^REALIZADO$/]),
      stat: estAchaCol(h,[/^STATUS$/])
    };
    if(col.item<0||col.ini<0||col.fim<0){ alert('Faltou a coluna ITEM, de início ou de fim.'); return; }

    // 2) linhas com data + a profundidade pelo ID
    var reg=[];
    for(var L=hdr+1;L<aoa.length;L++){
      var row=aoa[L]||[];
      var nome=String(row[col.item]==null?'':row[col.item]).trim(); if(!nome)continue;
      var di=excelDateToIso(row[col.ini]), df=excelDateToIso(row[col.fim]);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(di)||!/^\d{4}-\d{2}-\d{2}$/.test(df))continue;
      var idTxt=col.id>=0?String(row[col.id]==null?'':row[col.id]).replace(/[.,]/g,'').trim():'';
      var vr=col.real>=0?Number(row[col.real]):NaN;
      var st=col.stat>=0?estNorm(row[col.stat]):'';
      reg.push({nome:nome,ini:di,fim:df,
        pct:isFinite(vr)?vr:null, status:st,
        concluida:(isFinite(vr)&&vr>=0.999)||/^CONCLU/.test(st),
        lote:col.lote>=0?String(row[col.lote]==null?'':row[col.lote]).trim():'',
        grupo:col.grupo>=0?String(row[col.grupo]==null?'':row[col.grupo]).trim():'',
        id:/^\d+$/.test(idTxt)?idTxt:'', folha:lbEhFolha(nome)});
    }
    if(!reg.length){ alert('Nenhuma tarefa com início e fim preenchidos.'); return; }

    // 3) elemento = quem tem folha por filha, ou quem não tem filho nenhum (e não é folha).
    //    É o nível que se executa; acima dele são agrupamentos e abaixo é aço/fôrma/concreto.
    var elementos=reg.filter(function(r,i){
      if(r.folha)return false;
      if(!r.id)return true;
      var filhos=reg.filter(function(x){ return x.id&&x.id!==r.id&&x.id.indexOf(r.id)===0; });
      if(!filhos.length)return true;
      return filhos.some(function(x){ return x.folha&&x.id.length===r.id.length+1; });
    });
    // Etapa já concluída não entra: a linha de balanço aqui é pra enxergar o que falta executar.
    // Vale tanto o rótulo "Concluído" quanto 100% de avanço — às vezes só um dos dois está
    // preenchido, e quem está a 100% está pronto de qualquer jeito.
    var concluidas=elementos.filter(function(r){ return r.concluida; }).length;
    elementos=elementos.filter(function(r){ return !r.concluida; });
    if(!elementos.length){ alert('Todas as etapas do arquivo já estão concluídas — não há o que trazer pra linha de balanço.'); return; }

    // 4) locais -> lotes da obra (casa pelo número, como no informe de produção)
    var ids=lbLoteIds(), porNome={}, porNum={};
    ids.forEach(function(id){
      var nm=lbNomeLote(id);
      porNome[estNorm(nm)]=id;
      var m=/(\d+)/.exec(nm||''); if(m&&!porNum[m[1]])porNum[m[1]]=id;
    });
    var idxReg={}; reg.forEach(function(r){ if(r.id)idxReg[r.id]=r; });
    var acha=function(txt){
      if(!txt)return null;
      var id=porNome[estNorm(txt)];
      if(id)return id;
      var m=/(\d{3,})\s*$/.exec(String(txt).trim());   // "NEW JERSEY - 249" -> 249
      if(m&&porNum[m[1]])return porNum[m[1]];
      m=/(\d+)/.exec(String(txt));
      return (m&&porNum[m[1]])||null;
    };
    /* O "local" da coluna B nem sempre é um lote: CONTENÇÕES e OUTROS SERVIÇOS são tipos de
     * serviço, e o KM deles está dentro da estrutura — em CONTENÇÕES como um nível da
     * hierarquia ("5.1 → 249"), em OUTROS no fim do nome ("NEW JERSEY - 249"). Então o lote é
     * procurado em três lugares, nesta ordem: a coluna B, os ancestrais e o próprio nome. */
    var deLote={}, semLote={}, loteDe={}, nomeLimpo={};
    elementos.forEach(function(r){
      var id=acha(r.lote);
      if(!id&&r.id){                                   // sobe a hierarquia atrás de um KM
        for(var k=r.id.length-1;k>=1&&!id;k--){
          var pai=idxReg[r.id.slice(0,k)];
          if(pai)id=acha(pai.nome);
        }
      }
      var limpo=r.nome.trim();
      if(!id){                                         // último recurso: o KM no próprio nome
        id=acha(r.nome);
        if(id)limpo=limpo.replace(/\s*[-–]\s*\d{3,}\s*$/,'').trim()||limpo;
      }
      loteDe[r.id||r.nome]=id||null;
      nomeLimpo[r.id||r.nome]=limpo;
      if(id)deLote[r.lote]=deLote[r.lote]||id; else semLote[r.lote]=1;
    });
    var loteEl=function(r){ return loteDe[r.id||r.nome]||null; };
    var nomeEl=function(r){ return nomeLimpo[r.id||r.nome]||r.nome.trim(); };

    // 5) janela: dia 0 = segunda da semana do projeto onde cai a tarefa mais antiga.
    //    A tabela segunda->semana é montada UMA vez: lbDataParaDia varre o calendário a cada
    //    chamada, e com centenas de tarefas (duas conversões cada) isso não termina.
    var semDeSegunda={}, maisCedo=elementos.map(function(r){return r.ini;}).sort()[0], semIni=1;
    (function(){
      // Mesma regra do mondayOf (pula semana parada), mas numa passada só: chamar mondayOf 600
      // vezes refaz a lista de feriados em cada chamada e leva dezenas de segundos.
      var fer={}; calHolidays().forEach(function(f){ fer[mondayOfIso(f)]=true; });
      var d=new Date(TC_START()+'T00:00:00');
      var dw=d.getDay(); d.setDate(d.getDate()+(dw===0?-6:1-dw));
      var w=0;
      for(var k=0;k<900;k++){
        var iso=d.toISOString().slice(0,10);
        if(!fer[iso]){ w++; semDeSegunda[iso]=w; if(iso<=maisCedo)semIni=w; }
        d.setDate(d.getDate()+7);
      }
    })();
    // O cronograma do Excel conta dias corridos; a linha de balanço conta dias úteis. Data que
    // cai no fim de semana é trazida pro dia útil que faz sentido: um INÍCIO vai pra segunda
    // seguinte (ninguém começa no domingo) e um TÉRMINO volta pra sexta anterior.
    var diaDe=function(iso,ehFim){
      var seg=mondayOfIso(iso), w=semDeSegunda[seg];
      if(w==null)return null;                    // semana parada no calendário da obra
      var dow=Math.round((new Date(iso+'T00:00:00')-new Date(seg+'T00:00:00'))/864e5);
      if(dow>DIAS_SEM-1){
        if(ehFim)dow=DIAS_SEM-1;                 // término no fds -> sexta da mesma semana
        else {                                   // início no fds -> segunda seguinte
          var d2=new Date(seg+'T00:00:00'); d2.setDate(d2.getDate()+7);
          var prox=semDeSegunda[d2.toISOString().slice(0,10)];
          if(prox==null)return null;
          w=prox; dow=0;
        }
      }
      return (w-semIni)*DIAS_SEM+Math.max(0,dow);
    };
    var usadosIds=[]; elementos.forEach(function(r){ var l=loteEl(r); if(l&&usadosIds.indexOf(l)<0)usadosIds.push(l); });
    var usados=usadosIds;
    var escolha=await lbDialogoImport({aba:aba,elementos:elementos,reg:reg,deLote:deLote,
      semLote:Object.keys(semLote),semIni:semIni,lotesOk:usados.length,concluidas:concluidas,
      loteEl:loteEl,nomeEl:nomeEl});
    if(!escolha)return;

    // 6) monta o estudo: uma etapa por nome, com início fixo e duração por lote
    var c=lbSvc(); if(!c)return;
    var PAL=['#3E7CB1','#5F9E6E','#C98A2B','#9A6DB0','#C0653F','#4FA3A8','#7B8CA6','#B5705F'];
    // O mesmo nome aparece sob pais diferentes ("ENCONTRO 01" em SAPATAS e em TRAVESSAS, cada um
    // com suas datas). Juntar tudo numa etapa só faria uma sobrescrever a outra, então quando o
    // nome se repete dentro do mesmo lote ele passa a levar o pai junto.
    var porId={}; reg.forEach(function(r){ if(r.id)porId[r.id]=r; });
    var paiDe=function(r){
      if(!r.id||r.id.length<2)return '';
      var p=porId[r.id.slice(0,-1)];
      return p?p.nome.trim():'';
    };
    var vezes={};
    elementos.forEach(function(r){
      var lid=loteEl(r); if(!lid)return;
      var k=lid+'||'+lbChaveNome(nomeEl(r));
      vezes[k]=(vezes[k]||0)+1;
    });
    var repete={};
    Object.keys(vezes).forEach(function(k){ if(vezes[k]>1)repete[k.split('||')[1]]=1; });
    var porChave={}, ordem=[];
    elementos.forEach(function(r){
      if(!loteEl(r))return;
      var base=lbChaveNome(nomeEl(r)), pai=paiDe(r);
      var nome=(repete[base]&&pai&&!/^\d+$/.test(pai))?(pai+' · '+nomeEl(r)):nomeEl(r);
      var k=lbChaveNome(nome);
      if(!porChave[k]){ porChave[k]={nome:nome,itens:[]}; ordem.push(k); }
      porChave[k].itens.push(r);
    });
    var etapas=ordem.map(function(k,i){
      var g=porChave[k];
      var durs=g.itens.map(function(r){ var a=diaDe(r.ini,false),b=diaDe(r.fim,true); return (a==null||b==null)?1:Math.max(1,b-a+1); });
      var aj={};
      g.itens.forEach(function(r){
        var lid=loteEl(r); if(!lid)return;
        var d0=diaDe(r.ini,false), d1=diaDe(r.fim,true);
        if(d0==null||d1==null||d0<0)return;
        aj[lid]={ini:d0,dur:Math.max(1,d1-d0+1)};
      });
      // Lote onde a etapa não aparece no cronograma é marcado como "não ocorre". Sem isso ela
      // seria posicionada pela sequência e apareceria uma barra fantasma — com 27 etapas em 6
      // lotes isso dava 162 barras pra 66 tarefas reais, e esticava o estudo meses a mais.
      usados.forEach(function(lid){ if(lid&&!aj[lid])aj[lid]={pula:true}; });
      return {id:'imp'+i+'_'+Date.now().toString(36),nome:g.nome,
        sigla:lbSiglaAuto(g.nome),cor:PAL[i%PAL.length],
        dias:Math.round(durs.reduce(function(a,b){return a+b;},0)/durs.length)||1,
        equipes:1,offset:0,aj:aj,x:60+(i%6)*170,y:70+Math.floor(i/6)*110};
    });
    var lotesIds=usados.slice();
    var setas=lbSetasPelasDatas(etapas,lotesIds);
    lbArrumaMacroFluxo(etapas,setas);
    c.inicio=semIni;
    c.lotes=lotesIds;
    c.etapas=etapas;
    c.setas=setas;
    LB_DIRTY=true; LB_TAB='lb';
    go('cr-lb');
    alert(etapas.length+' etapa(s) em '+c.lotes.length+' lote(s) e '+setas.length+' ligação(ões), a partir da semana '+semIni+'.'+
      '\n\nAs datas vieram fixas do cronograma — as setas mostram a sequência observada e não movem as barras.'+
      '\n\nNada foi gravado ainda — use "Salvar linha de balanço".');
  }
  /** Liga, dentro de cada lote, o fim de uma etapa ao início da seguinte, seguindo as setas do
   *  macro-fluxo. Fica em cotovelo (sai na horizontal, desce/sobe, entra na horizontal) porque
   *  reta diagonal cruzando cinco faixas não se lê. Ligação que aponta pra trás no tempo ganha
   *  cor de alerta: é onde a sequência do processo não está sendo respeitada. */
  function lbConexoesSVG(calc,c,xx,yy){
    if(!c.setas||!c.setas.length)return '';
    var porLoteEtapa={};
    calc.itens.forEach(function(it){ porLoteEtapa[it.lote+'||'+it.eid]=it; });
    var out='';
    calc.lotes.forEach(function(lid){
      c.setas.forEach(function(st){
        var A=porLoteEtapa[lid+'||'+st.de], B=porLoteEtapa[lid+'||'+st.para];
        if(!A||!B)return;
        var x1=xx(A.fim), y1=yy(A.j,A.faixa), x2=xx(B.ini), y2=yy(B.j,B.faixa);
        // Sobreposição é comum em obra (frentes em paralelo), então ela ganha destaque e não
        // alarme: fica amarela pra chamar atenção sem parecer erro.
        var sobre=Math.round(A.fim-B.ini);
        var cor=(sobre>0)?'var(--warn)':'var(--ink-2)';
        var mx=(sobre>0)?(x1+8):((x1+x2)/2);
        out+='<path d="M'+x1.toFixed(1)+','+y1.toFixed(1)+' H'+mx.toFixed(1)+' V'+y2.toFixed(1)+' H'+x2.toFixed(1)+'" '+
          'fill="none" stroke="'+cor+'" stroke-width="1.1" opacity="'+((sobre>0)?'.75':'.45')+'">'+
          '<title>'+escAttr(lbNomeEtapa(c,st.de))+' \u2192 '+escAttr(lbNomeEtapa(c,st.para))+'\n'+escAttr(lbNomeLote(lid))+
          ((sobre>0)?('\nsobrep\u00f5em '+sobre+' dia(s)'):('\nfolga de '+Math.round(B.ini-A.fim)+' dia(s)'))+'</title></path>'+
          '<circle cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="1.9" fill="'+cor+'" opacity="'+((sobre>0)?'.8':'.5')+'"/>';
      });
    });
    return out;
  }
  function lbNomeEtapa(c,id){ var e=(c.etapas||[]).filter(function(x){return x.id===id;})[0]; return e?e.nome:'?'; }
  /** Sequência do macro-fluxo deduzida das próprias datas: em cada lote, etapas em ordem de
   *  início viram pares "uma depois da outra", e a latência é a folga típica (mediana) entre o
   *  fim de uma e o início da seguinte.
   *
   *  As setas aqui são DESCRITIVAS: como cada etapa tem início fixo vindo do cronograma, elas
   *  não empurram nada — mostram o encadeamento que já existe. */
  function lbSetasPelasDatas(etapas,lotes){
    var ini={}, cont={};
    etapas.forEach(function(e){
      var vs=[]; Object.keys(e.aj||{}).forEach(function(l){ var a=e.aj[l]; if(a&&a.ini!=null)vs.push(a.ini); });
      ini[e.id]=vs.length?vs.reduce(function(x,y){return x+y;},0)/vs.length:1e9;
    });
    var ordem=etapas.slice().sort(function(a,b){ return ini[a.id]-ini[b.id]; });
    var pos={}; ordem.forEach(function(e,i){ pos[e.id]=i; });
    lotes.forEach(function(lid){
      var seq=etapas.filter(function(e){ var a=(e.aj||{})[lid]; return a&&a.ini!=null; })
        .sort(function(a,b){ return a.aj[lid].ini-b.aj[lid].ini; });
      for(var i=0;i+1<seq.length;i++){
        var A=seq[i], B=seq[i+1];
        if(pos[A.id]>=pos[B.id])continue;          // só pra frente: garante grafo sem ciclo
        var k=A.id+'||'+B.id, g=(B.aj[lid].ini)-(A.aj[lid].ini+(A.aj[lid].dur||1));
        (cont[k]||(cont[k]={n:0,gaps:[]})).n++;
        cont[k].gaps.push(Math.max(0,Math.round(g)));
      }
    });
    // Toda vizinhança observada vira ligação. Exigir que o par se repetisse em dois lotes
    // parecia mais seguro, mas com as etapas qualificadas pelo pai quase nenhuma se repete:
    // sobravam 3 setas pra 44 caixas e o macro-fluxo continuava uma grade solta.
    return Object.keys(cont).map(function(k){
      var p=k.split('||'), g=cont[k].gaps.slice().sort(function(a,b){return a-b;});
      return {de:p[0],para:p[1],lat:g[Math.floor(g.length/2)]||0};
    });
  }
  /** Espalha as caixas do macro-fluxo em colunas pela ordem do fluxo: quem não depende de
   *  ninguém fica na primeira coluna, e cada etapa cai uma coluna à frente do seu predecessor
   *  mais tardio. Sem isso as caixas ficam numa grade e as setas se cruzam sem sentido. */
  function lbArrumaMacroFluxo(etapas,setas){
    var preds={}; etapas.forEach(function(e){ preds[e.id]=[]; });
    setas.forEach(function(st){ if(preds[st.para])preds[st.para].push(st.de); });
    var nivel={}, visitando={};
    var calc=function(id){
      if(nivel[id]!=null)return nivel[id];
      if(visitando[id])return 0;
      visitando[id]=true;
      var m=0; (preds[id]||[]).forEach(function(d){ m=Math.max(m,calc(d)+1); });
      visitando[id]=false; nivel[id]=m; return m;
    };
    etapas.forEach(function(e){ calc(e.id); });
    var porNivel={};
    etapas.forEach(function(e){ var n=nivel[e.id]||0; (porNivel[n]||(porNivel[n]=[])).push(e); });
    Object.keys(porNivel).forEach(function(n){
      porNivel[n].forEach(function(e,i){ e.x=60+(+n)*215; e.y=70+i*95; });
    });
  }
  /** Sigla curta a partir do nome, pra caber dentro do bloco na linha de balanço. */
  function lbSiglaAuto(nome){
    var s=lbChaveNome(nome).replace(/[^A-Z0-9 ]/g,' ').trim();
    var p=s.split(/\s+/).filter(Boolean);
    if(!p.length)return '??';
    if(p.length===1)return p[0].slice(0,4);
    if(/^\d+$/.test(p[p.length-1]))return (p[0].slice(0,3)+p[p.length-1]);
    return p.map(function(x){return x[0];}).join('').slice(0,4);
  }

  function lbSVG(arrastavel){

    var c=calc.c;
    if(!calc.lotes.length)return '<div class="note">Escolha os lotes onde este serviço acontece.</div>';
    if(!c.etapas.length)return '<div class="note">Desenhe as etapas do serviço no macro-fluxo abaixo — a linha de balanço é montada a partir delas.</div>';
    var lotes=calc.lotes, n=lotes.length;
    var totDias=Math.max(DIAS_SEM,Math.ceil(calc.maxDia));
    var labelW=Math.min(170,Math.max(70,(function(){var m=0;lotes.forEach(function(id){m=Math.max(m,String(lbNomeLote(id)).length);});return m*6.4+16;})()));
    // Etapas que acontecem ao mesmo tempo no mesmo lote vão uma acima da outra (faixas), pra
    // nenhuma ficar escondida atrás da outra. Cada lote fica com a altura que precisar.

    var faixas=[];

      var fimDaFaixa=[];
      arr.forEach(function(it){
        var k=0; while(k<fimDaFaixa.length&&fimDaFaixa[k]>it.ini+1e-6)k++;
        it.faixa=k; fimDaFaixa[k]=it.fim;

      faixas[j]=Math.max(1,fimDaFaixa.length);
    });
    var faixaH=Math.max(13,Math.min(22,Math.floor(560/Math.max(1,faixas.reduce(function(a,b){return a+b;},0)))));
    var alturaLote=faixas.map(function(f){ return f*faixaH+6; });

    var xx=function(dia){ return pl+iw*dia/Math.max(1,totDias); };

        '<text x="'+(pl-6-larg/2)+'" y="'+(y+h/2+3.5)+'" text-anchor="middle" style="font-size:'+fs+'px;font-weight:700;fill:var(--ink)">'+nome+'</text>';
    });
    s+='<line x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(W-pr)+'" y2="'+(pt+ih)+'" stroke="var(--line-2)"/>';
    // grade: uma linha por semana (5 dias), rótulo da semana do projeto
    var semanas=Math.ceil(totDias/DIAS_SEM);
    var passo=Math.max(1,Math.ceil(semanas/26));
    for(var k=0;k<=semanas;k+=passo){
      var x=xx(k*DIAS_SEM);
      s+='<line x1="'+x.toFixed(1)+'" y1="'+pt+'" x2="'+x.toFixed(1)+'" y2="'+(pt+ih)+'" stroke="var(--line)"/>'+
        '<text class="axm" x="'+x.toFixed(1)+'" y="'+(pt+ih+14)+'" text-anchor="middle">S'+isoWeek(mondayOf(lbDiaParaSemana(k*DIAS_SEM,c.inicio)))+'</text>';
    }
    s+='<text class="axm" x="'+pl+'" y="'+(pt+ih+30)+'" style="font-size:9px">dia 0 = início do serviço (S'+isoWeek(mondayOf(c.inicio||1))+') · '+DIAS_SEM+' dias úteis por semana</text>';
    // faixas por etapa
    var porEtapa={};
    calc.itens.forEach(function(it){ (porEtapa[it.eid]||(porEtapa[it.eid]=[])).push(it); });
    Object.keys(porEtapa).forEach(function(eid){
      var e=porId[eid]; if(!e)return;
      var arr=porEtapa[eid].slice().sort(function(a,b){return a.j-b.j;});
      var cor=e.cor||'#888';
      var pIni=arr.map(function(x2){ return xx(x2.ini).toFixed(1)+','+yy(x2.j,x2.faixa).toFixed(1); });
      var pFim=arr.map(function(x2){ return xx(x2.fim).toFixed(1)+','+yy(x2.j,x2.faixa).toFixed(1); });
      if(arr.length>1&&LB_VIEW!=='quadros'){
        s+='<polygon points="'+pIni.join(' ')+' '+pFim.slice().reverse().join(' ')+'" fill="'+cor+'" opacity=".22"/>';
        s+='<polyline points="'+pIni.join(' ')+'" fill="none" stroke="'+cor+'" stroke-width="1.6"/>';
        s+='<polyline points="'+pFim.join(' ')+'" fill="none" stroke="'+cor+'" stroke-width="1.6"/>';
      }
      if(LB_VIEW==='so-linhas')return; // só as linhas, sem os quadros
      var alt=faixaH*(LB_VIEW==='quadros'?0.86:0.78), sig=lbSigla(e);
      arr.forEach(function(x2){
        var x1=xx(x2.ini), larg=Math.max(2,xx(x2.fim)-x1), yTop=yy(x2.j,x2.faixa)-alt/2;
        var aj=lbAjuste(e,x2.lote);
        s+='<rect'+(arrastavel?' class="lb-drag" data-lbet-drag="'+e.id+'" data-lblote-drag="'+escAttr(x2.lote)+'"':'')+' x="'+x1.toFixed(1)+'" y="'+yTop.toFixed(1)+'" width="'+larg.toFixed(1)+'" height="'+alt.toFixed(1)+'" rx="'+(LB_VIEW==='quadros'?3:2)+'" fill="'+cor+'" opacity="'+(LB_VIEW==='quadros'?'.95':'.9')+'" stroke="'+cor+'" stroke-width="1">'+
          '<title>'+escAttr(e.nome)+' ('+escAttr(sig)+')\n'+escAttr(lbNomeLote(x2.lote))+'\n'+fmtDate(lbDiaParaData(x2.ini,c.inicio))+' a '+fmtDate(lbDiaParaData(x2.fim-1,c.inicio))+' ('+x2.dur+' dias)'+(aj&&aj.off>0?'\natraso manual: +'+aj.off+'d':'')+(aj&&aj.dur>0?'\nduração própria neste lote':'')+((x2.nEq>1)?'\nequipe '+x2.eq+' de '+x2.nEq:'')+(arrastavel?'\n\nClique pra editar data e duração · arraste pra mover · borda direita muda a duração':'')+'</title></rect>';
        if(larg>=13&&alt>=9)s+='<text x="'+(x1+larg/2).toFixed(1)+'" y="'+(yTop+alt/2+3).toFixed(1)+'" text-anchor="middle" style="font-size:'+Math.min(9.5,Math.max(7,alt*0.5)).toFixed(1)+'px;font-weight:700;fill:'+pickFont(cor)+';pointer-events:none">'+escAttr(sig)+'</text>';
        if(arrastavel&&larg>=8)s+='<rect class="lb-res" data-lbet-res="'+e.id+'" data-lblote-res="'+escAttr(x2.lote)+'" x="'+(x1+larg-4).toFixed(1)+'" y="'+yTop.toFixed(1)+'" width="5" height="'+alt.toFixed(1)+'" fill="#fff" opacity=".35"><title>Arraste pra mudar a duração nesta etapa/lote</title></rect>';
      });

      '<div class="legend" style="margin-top:6px">'+c.etapas.map(function(e){
        return '<span><span class="swatch" style="background:'+(e.cor||'#888')+'"></span><b>'+escAttr(lbSigla(e))+'</b> · '+escAttr(e.nome)+'</span>';
      }).join('')+'</div>';
  }

  /* ---- Gantt da linha de balanço: uma barra por etapa em cada lote ---- */
  function lbGanttSVG(compacto){
    var calc=lbCalc(); if(!calc||!calc.itens.length)return '<div class="note">Sem etapas pra montar o Gantt.</div>';
    var c=calc.c, porId={}; c.etapas.forEach(function(e){porId[e.id]=e;});
    // Dentro de cada lote, a ordem segue a sequência construtiva: quem termina antes fica em cima
    // (empate: quem começa antes; depois o nome).
    var linhas=[];
    calc.lotes.forEach(function(lid,j){
      calc.itens.filter(function(x){return x.j===j;})
        .sort(function(a,b){ return a.fim-b.fim||a.ini-b.ini||String((porId[a.eid]||{}).nome||'').localeCompare(String((porId[b.eid]||{}).nome||'')); })
        .forEach(function(it){ linhas.push({lote:lid,e:porId[it.eid],it:it}); });
    });
    var totDias=Math.max(DIAS_SEM,Math.ceil(calc.maxDia));
    // Na tela: colunas tarefa | início | término | duração. Na impressão (compacto): só o rótulo,
    // proporção de folha retrato e altura por linha calculada pra tudo caber numa página só.
    var colT=compacto?212:330, colD=compacto?46:78;
    var labelW=compacto?(colT+colD*2+36):(colT+colD*2+56);
    var W=compacto?900:1320, pl=labelW, pr=compacto?10:16, pt=compacto?26:38, pb=compacto?34:40;
    var rowH=compacto?Math.max(6,Math.min(16,Math.floor(980/Math.max(1,linhas.length))))
                     :Math.max(14,Math.min(26,Math.floor(620/Math.max(1,linhas.length))));
    var ih=linhas.length*rowH, H=pt+ih+pb, iw=W-pl-pr;
    var xIni=colT+8, xFim=xIni+colD, xDur=xFim+colD;
    var xx=function(d){ return pl+iw*d/Math.max(1,totDias); };
    var s='';
    var fsCab=compacto?7.5:10;
    s+='<text class="axm" x="8" y="'+(pt-12)+'" style="font-weight:700;font-size:'+fsCab+'px">Tarefa</text>'+
      '<text class="axm" x="'+xIni+'" y="'+(pt-12)+'" style="font-weight:700;font-size:'+fsCab+'px">Início</text>'+
      '<text class="axm" x="'+xFim+'" y="'+(pt-12)+'" style="font-weight:700;font-size:'+fsCab+'px">Término</text>'+
      '<text class="axm" x="'+(xDur+(compacto?10:16))+'" y="'+(pt-12)+'" text-anchor="end" style="font-weight:700;font-size:'+fsCab+'px">Dias</text>'+
      '<line x1="0" y1="'+(pt-8)+'" x2="'+(W-pr)+'" y2="'+(pt-8)+'" stroke="var(--line-2)"/>'+
      '<line x1="'+(pl-8)+'" y1="'+(pt-8)+'" x2="'+(pl-8)+'" y2="'+(pt+ih)+'" stroke="var(--line-2)"/>';
    var semanas=Math.ceil(totDias/DIAS_SEM), passo=Math.max(1,Math.ceil(semanas/26));
    for(var k=0;k<=semanas;k+=passo){
      var x=xx(k*DIAS_SEM);
      s+='<line x1="'+x.toFixed(1)+'" y1="'+pt+'" x2="'+x.toFixed(1)+'" y2="'+(pt+ih)+'" stroke="var(--line)"/>'+
        '<text class="axm" x="'+x.toFixed(1)+'" y="'+(pt+ih+14)+'" text-anchor="middle">S'+isoWeek(mondayOf(lbDiaParaSemana(k*DIAS_SEM,c.inicio)))+'</text>';
    }
    var loteAnterior=null;
    linhas.forEach(function(L,i){
      var y=pt+i*rowH;
      if(i%2===0)s+='<rect x="0" y="'+y+'" width="'+(W-pr)+'" height="'+rowH+'" fill="var(--elev)" opacity=".5"/>';
      if(loteAnterior!==null&&loteAnterior!==L.lote)s+='<line x1="0" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="var(--line-2)"/>';
      loteAnterior=L.lote;
      var fs=compacto?Math.max(4.6,Math.min(8,rowH*0.62)):(rowH<17?8:9.5);
      var dIni=lbDiaParaData(L.it.ini,c.inicio), dFim=lbDiaParaData(L.it.fim-1,c.inicio);
      var txtIni=compacto?fmtDate(dIni).slice(0,6)+fmtDate(dIni).slice(8):fmtDate(dIni);
      var txtFim=compacto?fmtDate(dFim).slice(0,6)+fmtDate(dFim).slice(8):fmtDate(dFim);
      s+='<text class="axm" x="'+xIni+'" y="'+(y+rowH/2+fs*0.36)+'" style="font-size:'+fs+'px">'+txtIni+'</text>'+
        '<text class="axm" x="'+xFim+'" y="'+(y+rowH/2+fs*0.36)+'" style="font-size:'+fs+'px">'+txtFim+'</text>'+
        '<text class="axm" x="'+(xDur+(compacto?10:16))+'" y="'+(y+rowH/2+fs*0.36)+'" text-anchor="end" style="font-size:'+fs+'px">'+L.it.dur+'</text>';
      var mostraLote=!compacto||i===0||linhas[i-1].lote!==L.lote;
      s+='<text class="axm" x="6" y="'+(y+rowH/2+fs*0.36)+'" style="font-size:'+fs+'px">'+
        (mostraLote?'<tspan style="fill:var(--muted);font-weight:700">'+escAttr(lbNomeLote(L.lote))+' · </tspan>':(compacto?'<tspan> </tspan>':'<tspan style="fill:var(--muted)">'+escAttr(lbNomeLote(L.lote))+' · </tspan>'))+
        escAttr(compacto?(lbSigla(L.e)+' · '+L.e.nome):L.e.nome)+'</text>';
      s+='<rect x="'+xx(L.it.ini).toFixed(1)+'" y="'+(y+rowH*0.18).toFixed(1)+'" width="'+Math.max(2,xx(L.it.fim)-xx(L.it.ini)).toFixed(1)+'" height="'+(rowH*0.64).toFixed(1)+'" rx="3" fill="'+(L.e.cor||'#888')+'"><title>'+escAttr(L.e.nome)+' · '+escAttr(lbNomeLote(L.lote))+'\ndia '+Math.round(L.it.ini)+' → '+Math.round(L.it.fim)+'</title></rect>';
    });
    s+=lbLinhaHoje(c.inicio,xx,totDias,pt,ih);
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"'+(compacto?' preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto"':' style="min-width:1100px"')+'>'+s+'</svg>';
  }
  /** Visão "cronograma" (estilo MS Project): tabela agrupada por lote, com início, término e
   *  duração de cada etapa e a linha-resumo do lote. */
  function lbProjectHTML(){
    var calc=lbCalc(); if(!calc||!calc.itens.length)return '<div class="note">Sem etapas pra montar o cronograma.</div>';
    var c=calc.c, porId={}; c.etapas.forEach(function(e){porId[e.id]=e;});
    var linhas='';
    calc.lotes.forEach(function(lid,j){

        .sort(function(a,b){ return a.fim-b.fim||a.ini-b.ini||String((porId[a.eid]||{}).nome||'').localeCompare(String((porId[b.eid]||{}).nome||'')); });
      if(!itens.length)return;
      var ini=Math.min.apply(null,itens.map(function(x){return x.ini;}));
      var fim=Math.max.apply(null,itens.map(function(x){return x.fim;}));
      linhas+='<tr style="background:var(--elev);font-weight:700"><td>'+escAttr(lbNomeLote(lid))+'</td>'+
        '<td class="mono">'+fmtDate(lbDiaParaData(ini,c.inicio))+'</td><td class="mono">'+fmtDate(lbDiaParaData(fim-1,c.inicio))+'</td>'+
        '<td class="r mono">'+Math.round((fim-ini)*10)/10+'</td><td class="note">'+itens.length+' etapa(s)</td></tr>';
      itens.forEach(function(it){

        linhas+='<tr><td style="padding-left:26px"><span class="swatch" style="background:'+(e.cor||'#888')+'"></span><b>'+escAttr(lbSigla(e))+'</b> · '+escAttr(e.nome)+'</td>'+
          '<td class="mono">'+fmtDate(lbDiaParaData(it.ini,c.inicio))+'</td><td class="mono">'+fmtDate(lbDiaParaData(it.fim-1,c.inicio))+'</td>'+
          '<td class="r mono">'+it.dur+'</td><td class="note">'+(it.nEq>1?('equipe '+it.eq+' de '+it.nEq):'')+'</td></tr>';
      });
    });
    return '<div class="tbl-wrap"><table class="edtbl"><thead><tr><th>Lote / etapa</th><th>Início</th><th>Término</th><th class="r">Dias</th><th>Equipe</th></tr></thead><tbody>'+linhas+'</tbody></table></div>';
  }
  /** Converte um SVG do app em PNG (data URL) pra embutir em planilha: resolve as variáveis de
   *  cor do tema, fixa a fonte e põe fundo branco. Resolve com null se o navegador recusar. */
  function lbSvgParaPng(svgStr,larguraPx){
    return new Promise(function(res){
      try{
        var m=svgStr.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/); if(!m){res(null);return;}
        var vw=+m[1], vh=+m[2], W=Math.round(larguraPx||900), H=Math.round(W*vh/vw);
        var limpo=svgStr.replace(/var\((--[\w-]+)\)/g,function(_,n){ return cssHex(n)||'#888888'; });
        limpo=limpo.replace(/<svg[^>]*>/,function(tag){
          return tag.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"')+
            '<style>text{font-family:Arial,Helvetica,sans-serif}.axm{fill:#555}</style><rect width="100%" height="100%" fill="#ffffff"/>';
        });
        var img=new Image();
        img.onload=function(){
          var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
          var ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); ctx.drawImage(img,0,0,W,H);
          try{ res({url:cv.toDataURL('image/png'),w:W,h:H}); }catch(e){ res(null); }
        };
        img.onerror=function(){ res(null); };
        img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(limpo)));
      }catch(e){ res(null); }
    });
  }
  /** Exporta o cronograma da linha de balanço em Excel, agrupado por lote e formatado
   *  (cabeçalho fixo, linha-resumo de cada lote em negrito, cor da etapa na coluna da sigla). */
  async function lbExportarCronograma(){
    var calc=lbCalc(); if(!calc||!calc.itens.length){alert('Nada pra exportar.');return;}
    var c=calc.c, porId={}; c.etapas.forEach(function(e){porId[e.id]=e;});
    var sv=SERV[lbSvcIdx(lbRoot().servicoSel)];
    var obra=(window._OBRA&&window._OBRA.nome)||(selectedObra&&selectedObra.nome)||'Obra';
    var arquivo='linha-de-balanco-'+String((sv&&sv.n)||'servico').replace(/[^\w]+/g,'-').toLowerCase()+'.xlsx';
    var porLote=calc.lotes.map(function(lid,j){
      return {lote:lid,itens:calc.itens.filter(function(x){return x.j===j;})
        .sort(function(a,b){ return a.fim-b.fim||a.ini-b.ini; })};
    }).filter(function(g){return g.itens.length;});
    if(typeof ExcelJS==='undefined'){ // sem ExcelJS: cai pro Excel simples
      if(typeof XLSX==='undefined'){alert('Biblioteca de planilha não carregou.');return;}
      var rows=[['Lote','Etapa','Sigla','Início','Término','Duração (dias)','Equipe']];
      porLote.forEach(function(g){ g.itens.forEach(function(it){ var e=porId[it.eid];
        rows.push([lbNomeLote(g.lote),e.nome,lbSigla(e),fmtDate(lbDiaParaData(it.ini,c.inicio)),fmtDate(lbDiaParaData(it.fim-1,c.inicio)),it.dur,it.nEq>1?('Equipe '+it.eq+'/'+it.nEq):'']); }); });
      var wb0=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb0,XLSX.utils.aoa_to_sheet(rows),'Cronograma');
      XLSX.writeFile(wb0,arquivo); toast('Cronograma exportado.'); return;
    }
    var hex=function(cor){ var m=String(cor||'#888888').replace('#',''); return 'FF'+(m.length===3?m[0]+m[0]+m[1]+m[1]+m[2]+m[2]:m).toUpperCase(); };
    var wb=new ExcelJS.Workbook();
    var ws=wb.addWorksheet('Linha de Balanço',{views:[{state:'frozen',ySplit:3}],pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.5,right:0.5,top:0.6,bottom:0.6,header:0.3,footer:0.3}}});
    ws.columns=[{key:'nome',width:46},{key:'sigla',width:8},{key:'ini',width:13},{key:'fim',width:13},{key:'dur',width:9},{key:'eq',width:14}];
    var t1=ws.addRow([obra+' — Linha de Balanço']); t1.font={bold:true,size:14};
    ws.mergeCells(t1.number,1,t1.number,6);
    var t2=ws.addRow([((sv&&sv.n)||'')+' · '+porLote.length+' lote(s) · '+c.etapas.length+' etapa(s) · gerado em '+fmtDate(new Date())]);
    t2.font={size:10,color:{argb:'FF666666'}}; ws.mergeCells(t2.number,1,t2.number,6);
    var head=ws.addRow(['Lote / etapa','Sigla','Início','Término','Dias','Equipe']);
    head.font={bold:true,color:{argb:'FFFFFFFF'}}; head.height=18;
    head.eachCell(function(cl){ cl.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF17405E'}};
      cl.alignment={vertical:'middle',horizontal:'center'};
      cl.border={bottom:{style:'thin',color:{argb:'FF999999'}}}; });
    porLote.forEach(function(g){
      var i0=Math.min.apply(null,g.itens.map(function(x){return x.ini;}));
      var i1=Math.max.apply(null,g.itens.map(function(x){return x.fim;}));
      var lr=ws.addRow([lbNomeLote(g.lote),'',fmtDate(lbDiaParaData(i0,c.inicio)),fmtDate(lbDiaParaData(i1-1,c.inicio)),Math.round((i1-i0)*10)/10,g.itens.length+' etapa(s)']);
      lr.font={bold:true};
      lr.eachCell(function(cl){ cl.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDDEBF7'}}; });
      g.itens.forEach(function(it){
        var e=porId[it.eid]; if(!e)return;
        var r=ws.addRow(['    '+e.nome,lbSigla(e),fmtDate(lbDiaParaData(it.ini,c.inicio)),fmtDate(lbDiaParaData(it.fim-1,c.inicio)),it.dur,it.nEq>1?('Equipe '+it.eq+'/'+it.nEq):'']);
        r.getCell(2).fill={type:'pattern',pattern:'solid',fgColor:{argb:hex(e.cor)}};
        r.getCell(2).font={bold:true,color:{argb:'FFFFFFFF'}};
        r.getCell(2).alignment={horizontal:'center'};
      });
    });
    ws.eachRow(function(r,n){ if(n<3)return; r.eachCell(function(cl,ci){
      cl.border=Object.assign({},cl.border,{top:{style:'hair',color:{argb:'FFCCCCCC'}},bottom:{style:'hair',color:{argb:'FFCCCCCC'}}});
      if(ci>=3)cl.alignment={horizontal:ci===5?'right':'center'};
    }); });
    ws.autoFilter={from:{row:3,column:1},to:{row:3,column:6}};
    // Aba com o gráfico (o mesmo Gantt da impressão, virado em imagem).
    try{
      var png=await lbSvgParaPng(lbGanttSVG(true),900);
      if(png){
        var wsG=wb.addWorksheet('Gantt',{pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:1}});
        wsG.getCell('A1').value=obra+' — Linha de Balanço · '+((sv&&sv.n)||'');
        wsG.getCell('A1').font={bold:true,size:13};
        var imgId=wb.addImage({base64:png.url.split(',')[1],extension:'png'});
        wsG.addImage(imgId,{tl:{col:0,row:2},ext:{width:png.w,height:png.h}});
      }
    }catch(e){ /* sem gráfico, a planilha sai com a tabela mesmo */ }
    var buf=await wb.xlsx.writeBuffer();
    var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=arquivo; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    toast('Cronograma exportado.');
  }
  /** Imprime (ou salva em PDF) o cronograma da linha de balanço: cabeçalho, o Gantt e a tabela
   *  agrupada por lote — numa folha só, com o resto da tela escondido. */
  function lbImprimirCronograma(){

    var c=calc.c, sv=SERV[lbSvcIdx(lbRoot().servicoSel)];

        '<div><h2>'+escAttr(obra)+' — Linha de Balanço</h2>'+
        '<div class="lbp-sub">'+escAttr((sv&&sv.n)||'')+' · '+calc.lotes.length+' lote(s) · '+c.etapas.length+' etapa(s) · '+
        fmtDate(lbDiaParaData(ini,c.inicio))+' a '+fmtDate(lbDiaParaData(fim-1,c.inicio))+' ('+Math.ceil(fim-ini)+' dias úteis)</div></div>'+
        '<div class="lbp-sub">Gerado em '+fmtDate(new Date())+'</div>'+

        }).join('')+'</div>'+
      '</div>'+
      '<div class="lbp-legend" style="display:none">'+c.etapas.map(function(e){

  /** Curva S da linha de balanço: % acumulado do trabalho (soma das durações etapa×lote). */
  function lbCurvaSVG(){
    var calc=lbCalc(); if(!calc||!calc.itens.length)return '<div class="note">Sem etapas pra montar a curva.</div>';
    var c=calc.c, porId={}; c.etapas.forEach(function(e){porId[e.id]=e;});
    var total=0; calc.itens.forEach(function(it){ total+=Math.max(0.5,+(porId[it.eid]||{}).dias||1); });
    if(total<=0)return '';
    var totDias=Math.max(DIAS_SEM,Math.ceil(calc.maxDia));
    var semanas=Math.ceil(totDias/DIAS_SEM), vals=[];
    for(var w=0;w<=semanas;w++){
      var dia=w*DIAS_SEM, feito=0;
      calc.itens.forEach(function(it){
        var dur=Math.max(0.5,+(porId[it.eid]||{}).dias||1);
        if(dia>=it.fim)feito+=dur;
        else if(dia>it.ini)feito+=dur*((dia-it.ini)/(it.fim-it.ini));
      });
      vals.push(feito/total*100);
    }
    var W=900,H=280,pl=46,pr=14,pt=14,pb=46,iw=W-pl-pr,ih=H-pt-pb;
    var xx=function(i){ return pl+iw*i/Math.max(1,semanas); }, yy=function(v){ return pt+ih-ih*v/100; };
    var s='';
    for(var g=0;g<=100;g+=25)s+='<line x1="'+pl+'" y1="'+yy(g)+'" x2="'+(W-pr)+'" y2="'+yy(g)+'" stroke="var(--line)"/><text class="axm" x="'+(pl-6)+'" y="'+(yy(g)+3)+'" text-anchor="end">'+g+'%</text>';
    var passo=Math.max(1,Math.ceil(semanas/22));
    for(var k2=0;k2<=semanas;k2+=passo)s+='<text class="axm" x="'+xx(k2).toFixed(1)+'" y="'+(pt+ih+14)+'" text-anchor="middle">S'+isoWeek(mondayOf(lbDiaParaSemana(k2*DIAS_SEM,c.inicio)))+'</text>';
    var d=vals.map(function(v,i){ return (i?'L':'M')+xx(i).toFixed(1)+' '+yy(v).toFixed(1); }).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5"/>';
    vals.forEach(function(v,i){ if(semanas<=40||i%passo===0)s+='<circle cx="'+xx(i).toFixed(1)+'" cy="'+yy(v).toFixed(1)+'" r="2.5" fill="var(--accent)"><title>S'+isoWeek(mondayOf(lbDiaParaSemana(i*DIAS_SEM,c.inicio)))+': '+Math.round(v)+'%</title></circle>'; });
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="min-width:820px">'+s+'</svg>';
  }

  /* ---- macro-fluxo (etapas do serviço) ---- */
  function mfSVG(){
    var c=lbSvc(); if(!c)return '';
    if(!c.etapas.length)return '<div class="note" style="padding:18px">Nenhuma etapa ainda. Clique em <b>+ Etapa</b> pra desenhar o processo deste serviço.</div>';
    var s='<defs><marker id="mfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)" opacity=".85"/></marker></defs>';
    var byId={}; c.etapas.forEach(function(e){byId[e.id]=e;});
    // A seta sai e entra pelo lado mais curto (direita/esquerda quando a distância é horizontal,
    // baixo/cima quando é vertical) e a curva usa controles curtos — assim ela não cruza as caixas.
    c.setas.forEach(function(e,ei){
      var a=byId[e.de], b=byId[e.para]; if(!a||!b)return;
      var acx=a.x+MF_NW/2, acy=a.y+MF_NH/2, bcx=b.x+MF_NW/2, bcy=b.y+MF_NH/2;
      var dx=bcx-acx, dy=bcy-acy, ax,ay,bx,by,c1x,c1y,c2x,c2y,off;
      if(Math.abs(dx)>=Math.abs(dy)*1.1){            // fluxo horizontal
        var pDir=dx>=0;
        ax=pDir?a.x+MF_NW:a.x; ay=acy;
        bx=pDir?b.x-6:b.x+MF_NW+6; by=bcy;
        off=Math.min(70,Math.max(10,Math.abs(bx-ax)*0.45)); // gap curto -> curva curta (sem zigue-zague)
        c1x=ax+(pDir?off:-off); c1y=ay; c2x=bx-(pDir?off:-off); c2y=by;
      } else {                                        // fluxo vertical (linha de baixo/de cima)
        var pBaixo=dy>=0;
        ax=acx; ay=pBaixo?a.y+MF_NH:a.y;
        bx=bcx; by=pBaixo?b.y-6:b.y+MF_NH+6;
        off=Math.min(60,Math.max(10,Math.abs(by-ay)*0.45));
        c1x=ax; c1y=ay+(pBaixo?off:-off); c2x=bx; c2y=by-(pBaixo?off:-off);
      }
      s+='<path d="M'+ax.toFixed(1)+','+ay.toFixed(1)+' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+bx.toFixed(1)+','+by.toFixed(1)+'" fill="none" stroke="var(--ink-2)" stroke-width="1.6" opacity=".75" marker-end="url(#mfArrow)" data-mfseta="'+ei+'" style="cursor:pointer"><title>'+escAttr(a.nome)+' → '+escAttr(b.nome)+((+e.lat)?' (latência '+(+e.lat)+' dia'+((+e.lat)===1?'':'s')+')':'')+(MF_MODE==='apagar'?' — clique pra excluir':'')+'</title></path>';
      if(+e.lat){
        var mx=(c1x+c2x)/2, my=(c1y+c2y)/2;
        s+='<rect x="'+(mx-11).toFixed(1)+'" y="'+(my-7).toFixed(1)+'" width="22" height="12" rx="3" fill="var(--surface)" opacity=".9"/>'+
          '<text x="'+mx.toFixed(1)+'" y="'+(my+2).toFixed(1)+'" text-anchor="middle" class="axm" style="font-size:8.5px;font-weight:700">+'+(+e.lat)+'d</text>';
      }
    });
    c.etapas.forEach(function(e){
      var sel=(MF_SEL===e.id)?' sel':'';
      var linhas=String(e.nome||'').split(/\s+/).reduce(function(acc,w){
        var last=acc[acc.length-1];
        if(last&&(last+' '+w).length<=17)acc[acc.length-1]=last+' '+w; else acc.push(w);
        return acc;
      },[]).slice(0,2);
      var txt=linhas.map(function(t,i){ return '<tspan x="'+(e.x+MF_NW/2)+'" dy="'+(i===0?0:11)+'">'+escAttr(t)+'</tspan>'; }).join('');
      s+='<g class="mf-node'+sel+'" data-mfno="'+e.id+'">'+
        '<rect x="'+e.x+'" y="'+e.y+'" width="'+MF_NW+'" height="'+MF_NH+'" rx="8" fill="'+e.cor+'" fill-opacity=".18" stroke="'+e.cor+'" stroke-width="1.8"/>'+
        '<text x="'+(e.x+MF_NW/2)+'" y="'+(e.y+MF_NH/2+(linhas.length>1?-6:0))+'" text-anchor="middle" style="font-size:10.5px;font-weight:600;fill:var(--ink)">'+txt+'</text>'+
        '<text x="'+(e.x+MF_NW/2)+'" y="'+(e.y+MF_NH-6)+'" text-anchor="middle" class="axm" style="font-size:8.5px"><tspan style="font-weight:700">'+escAttr(lbSigla(e))+'</tspan> · '+(+e.dias||1)+'d'+((+e.equipes||1)>1?' · '+Math.round(+e.equipes)+' eq':'')+'</text>'+
        '<title>'+escAttr(e.nome)+(MF_MODE==='mover'?' — arraste pra mover, duplo clique renomeia':(MF_MODE==='ligar'?' — clique pra ligar':' — clique pra excluir'))+'</title></g>';
    });
    var alturaNec=MF_H;
    c.etapas.forEach(function(e){ alturaNec=Math.max(alturaNec,(+e.y||0)+MF_NH+40); });
    return '<svg id="mfSvg" viewBox="0 0 '+MF_W+' '+alturaNec+'" style="width:100%;height:auto;min-width:900px">'+s+'</svg>';
  }

   * Lê a tabela de auditoria (preenchida por trigger no banco) e mostra, por alteração, quem

   * da obra e o desenvolvedor enxergam. */
  var LOG_TABELA='', LOG_EMAIL='', LOG_LIMITE=200, LOG_LISTA=null, LOG_ERRO='';
  var LOG_NOMES={obras:'Obra',lotes:'Lotes',servicos:'Serviços',lote_servico:'Quantidades (lote × serviço)',
    equipes:'Equipes',servico_precedencias:'Precedências',cenarios:'Cenários',recursos:'Recursos do histograma',
    apontamento_recursos:'Realizado (histograma)',apoio_admin:'Apoio Administrativo',apoio_alocacao:'Alocação do apoio',

    compromissos:'Compromissos',obra_membros:'Acessos',lote_estacas:'Estacas',estaca_quantidades:'Quantidades por estaca',
    estaca_apontamentos:'Apontamentos por estaca'};
  var LOG_IGNORA={id:1,obra_id:1,created_at:1,updated_at:1,created_by:1,ordem:1};
  function logNomeTabela(t){ return LOG_NOMES[t]||t; }
  function logResumo(l){
    var a=l.antes||{}, d=l.depois||{};
    if(l.acao==='insert')return '<span class="pill">criado</span> '+escAttr(logTitulo(d)||'');
    if(l.acao==='delete')return '<span class="pill warn">excluído</span> '+escAttr(logTitulo(a)||'');
    var mud=[];
    Object.keys(d).forEach(function(k){
      if(LOG_IGNORA[k])return;
      var va=a[k], vd=d[k];
      var sa=(va&&typeof va==='object')?JSON.stringify(va):String(va==null?'':va);
      var sd=(vd&&typeof vd==='object')?JSON.stringify(vd):String(vd==null?'':vd);
      if(sa===sd)return;
      if(sa.length>60)sa=sa.slice(0,60)+'…';
      if(sd.length>60)sd=sd.slice(0,60)+'…';
      mud.push('<b>'+escAttr(k)+'</b>: <span class="note">'+escAttr(sa||'—')+'</span> → '+escAttr(sd||'—'));
    });
    if(!mud.length)return '<span class="note">sem mudança de valor</span>';
    return (logTitulo(d)?('<b>'+escAttr(logTitulo(d))+'</b> · '):'')+mud.slice(0,4).join(' · ')+(mud.length>4?' <span class="note">(+'+(mud.length-4)+')</span>':'');
  }
  function logTitulo(o){ return (o&&(o.nome||o.titulo||o.descricao||o.email))||''; }

    var d=new Date(iso), hoje=new Date();
    var hh=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    return (d.toDateString()===hoje.toDateString()?'hoje':fmtDate(d))+' '+hh;
  }

  /** Caixa de edição de uma etapa num lote: data de início e duração em dias. */
  function lbAbrirEditor(cfg,eid,loteId){
    var e=cfg.etapas.filter(function(x){return x.id===eid;})[0]; if(!e)return;
    var calc=lbCalc(), it=null;
    (calc?calc.itens:[]).forEach(function(x){ if(x.eid===eid&&x.lote===loteId)it=x; });
    if(!it)return;
    var maisCedo=lbDataIso(it.base,cfg.inicio), atual=lbDataIso(it.ini,cfg.inicio);
    var aj=lbAjuste(e,loteId)||{};
    var back=document.createElement('div'); back.className='segmenu-backdrop';
    back.innerHTML='<div class="segmenu-panel card" style="max-width:460px">'+
      '<div class="eyebrow" style="margin-bottom:2px"><span class="swatch" style="background:'+(e.cor||'#888')+'"></span>'+escAttr(e.nome)+' — '+escAttr(lbNomeLote(loteId))+'</div>'+
      '<div class="note" style="margin-bottom:10px">Mais cedo possível: <b>'+fmtDate(lbDiaParaData(it.base,cfg.inicio))+'</b> (pelas predecessoras e pela equipe vindo do lote anterior). Pôr uma data depois dessa vira atraso manual deste lote em diante; antes dela não dá.</div>'+
      '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">'+
        '<label style="font-size:12.5px">Início<br><input class="einp" type="date" id="lbEdData" value="'+atual+'" min="'+maisCedo+'" style="width:160px"></label>'+
        '<label style="font-size:12.5px">Duração (dias)<br><input class="einp" type="number" min="0.5" step="0.5" id="lbEdDur" value="'+it.dur+'" style="width:110px"></label>'+
      '</div>'+
      '<div class="note" style="margin-top:8px" id="lbEdInfo"></div>'+
      '<div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap">'+
        '<button class="btn" id="lbEdAuto"'+((aj.off>0||aj.dur>0)?'':' disabled')+'>↺ Voltar ao automático</button>'+
        '<span style="display:flex;gap:8px"><button class="btn" id="lbEdCancel">Cancelar</button><button class="btn primary" id="lbEdOk">Aplicar</button></span>'+
      '</div></div>';
    document.body.appendChild(back);
    var inpD=back.querySelector('#lbEdData'), inpDur=back.querySelector('#lbEdDur'), info=back.querySelector('#lbEdInfo');
    function atualiza(){
      var dia=lbDataParaDia(inpD.value,cfg.inicio), dur=Math.max(0.5,parseFloat(inpDur.value)||1);
      if(dia==null){ info.textContent='Data fora do cronograma.'; return; }
      var ini=Math.max(it.base,dia), fim=ini+dur;
      info.innerHTML='Fica de <b>'+fmtDate(lbDiaParaData(ini,cfg.inicio))+'</b> a <b>'+fmtDate(lbDiaParaData(fim-1,cfg.inicio))+'</b>'+
        (ini>it.base?(' · atraso manual de <b>'+(Math.round((ini-it.base)*2)/2)+' dia(s)</b>'):' · no mais cedo possível')+'.';
    }
    inpD.addEventListener('change',atualiza); inpDur.addEventListener('input',atualiza); atualiza();
    function close(){ back.remove(); }
    back.addEventListener('pointerdown',function(ev){ if(ev.target===back)close(); });
    back.querySelector('#lbEdCancel').addEventListener('click',close);
    back.querySelector('#lbEdAuto').addEventListener('click',function(){
      if(e.aj)delete e.aj[loteId];
      close(); lbMarkDirty(); go('cr-lb');
    });
    back.querySelector('#lbEdOk').addEventListener('click',function(){
      var dia=lbDataParaDia(inpD.value,cfg.inicio), dur=Math.max(0.5,parseFloat(inpDur.value)||1);
      if(dia==null){ alert('Data inválida.'); return; }
      var off=Math.max(0,Math.round((dia-it.base)*2)/2);
      lbSetAjuste(e,loteId,{off:off,dur:(dur===(+e.dias||1))?0:dur});
      close(); lbMarkDirty(); go('cr-lb');
    });
  }
  /** Ajuste manual no gráfico: arrastar o corpo da barra atrasa a etapa NAQUELE lote em diante;
   *  arrastar a borda direita muda a duração da etapa só naquele lote. */
  function wireLbDrag(cfg){
    var svg=document.getElementById('lbSvgDrag'); if(!svg)return;
    var totDias=+svg.getAttribute('data-totdias')||1, iwVb=+svg.getAttribute('data-iw')||1, wVb=+svg.getAttribute('data-w')||1;
    var calc=lbCalc(), itens=(calc&&calc.itens)||[];
    function item(eid,lote){ for(var i=0;i<itens.length;i++){ if(itens[i].eid===eid&&itens[i].lote===lote)return itens[i]; } return null; }
    function diasPorPx(){ var r=svg.getBoundingClientRect(); return (totDias/iwVb)*(wVb/(r.width||1)); }
    function arrasta(el,onFim,onClique){
      el.addEventListener('pointerdown',function(ev){
        ev.preventDefault(); ev.stopPropagation();
        var k=diasPorPx(), x0=ev.clientX, dd=0, moveu=false;
        try{ el.setPointerCapture&&el.setPointerCapture(ev.pointerId); }catch(err){}
        function mv(e2){
          dd=Math.round(((e2.clientX-x0)*k)*2)/2;
          if(Math.abs(dd)>0.25)moveu=true;
          el.setAttribute('transform','translate('+((e2.clientX-x0)).toFixed(1)+',0)');
        }
        function up(){
          el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up);
          el.removeAttribute('transform');
          if(moveu)onFim(dd); else if(onClique)onClique();
        }
        el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
      });
    }
    svg.querySelectorAll('[data-lbet-drag]').forEach(function(rect){
      var eid=rect.getAttribute('data-lbet-drag'), lote=rect.getAttribute('data-lblote-drag');
      var e=cfg.etapas.filter(function(x){return x.id===eid;})[0]; if(!e)return;
      arrasta(rect,function(dd){
        var it=item(eid,lote); if(!it)return;
        var novo=Math.max(0,Math.round(((it.ini+dd)-it.base)*2)/2); // nunca antes do mais cedo possível
        lbSetAjuste(e,lote,{off:novo}); lbMarkDirty(); go('cr-lb');
      },function(){ lbAbrirEditor(cfg,eid,lote); });
    });
    svg.querySelectorAll('[data-lbet-res]').forEach(function(h){
      var eid=h.getAttribute('data-lbet-res'), lote=h.getAttribute('data-lblote-res');
      var e=cfg.etapas.filter(function(x){return x.id===eid;})[0]; if(!e)return;
      arrasta(h,function(dd){
        var it=item(eid,lote); if(!it)return;
        var nova=Math.max(0.5,Math.round((it.dur+dd)*2)/2);
        lbSetAjuste(e,lote,{dur:(nova===(+e.dias||1))?0:nova}); lbMarkDirty(); go('cr-lb');
      });
    });
  }
  function wireMacroFluxo(cfg){
    var wrap=document.getElementById('mfWrap'); if(!wrap)return;
    var svg=document.getElementById('mfSvg');
    document.querySelectorAll('[data-mfmode]').forEach(function(b){
      b.addEventListener('click',function(){ MF_MODE=b.getAttribute('data-mfmode'); MF_SEL=null; go('cr-lb'); });
    });
    var add=document.getElementById('mfAdd');
    if(add)add.addEventListener('click',function(){ lbAddEtapa(); });
    if(!svg)return;
    svg.querySelectorAll('[data-mfseta]').forEach(function(path){
      path.addEventListener('click',function(){
        if(MF_MODE!=='apagar')return;
        cfg.setas.splice(+path.getAttribute('data-mfseta'),1); lbMarkDirty(); go('cr-lb');
      });
    });
    var escala=function(){ var r=svg.getBoundingClientRect(); return MF_W/(r.width||1); };
    svg.querySelectorAll('[data-mfno]').forEach(function(g){
      var id=g.getAttribute('data-mfno'), no=cfg.etapas.filter(function(e){return e.id===id;})[0];
      if(!no)return;
      g.addEventListener('dblclick',function(){
        if(MF_MODE!=='mover')return;
        var nome=prompt('Nome da etapa:',no.nome); if(nome===null)return;
        no.nome=nome.trim()||no.nome; lbMarkDirty(); go('cr-lb');
      });
      g.addEventListener('pointerdown',function(ev){
        if(MF_MODE==='apagar'){
          cfg.etapas=cfg.etapas.filter(function(e){return e.id!==id;});
          cfg.setas=cfg.setas.filter(function(e){return e.de!==id&&e.para!==id;});
          lbMarkDirty(); go('cr-lb'); return;
        }
        if(MF_MODE==='ligar'){
          if(!MF_SEL){ MF_SEL=id; go('cr-lb'); return; }
          if(MF_SEL===id){ MF_SEL=null; go('cr-lb'); return; }
          var existe=cfg.setas.some(function(e){return e.de===MF_SEL&&e.para===id;});
          if(!existe)cfg.setas.push({de:MF_SEL,para:id,lat:0});
          MF_SEL=null; lbMarkDirty(); go('cr-lb'); return;
        }
        ev.preventDefault();
        var k=escala(), x0=ev.clientX, y0=ev.clientY, nx=no.x, ny=no.y, moveu=false;
        try{ g.setPointerCapture&&g.setPointerCapture(ev.pointerId); }catch(err){}
        function mv(e2){
          var dx=(e2.clientX-x0)*k, dy=(e2.clientY-y0)*k;
          if(Math.abs(dx)>2||Math.abs(dy)>2)moveu=true;
          var X=Math.max(0,Math.min(MF_W-MF_NW,nx+dx)), Y=Math.max(0,Math.min(MF_H-MF_NH,ny+dy));
          g.setAttribute('transform','translate('+(X-no.x)+','+(Y-no.y)+')');
          g._x=X; g._y=Y;
        }
        function up(){
          g.removeEventListener('pointermove',mv); g.removeEventListener('pointerup',up); g.removeEventListener('pointercancel',up);
          if(moveu&&g._x!=null){ no.x=Math.round(g._x); no.y=Math.round(g._y); lbMarkDirty(); go('cr-lb'); }
        }
        g.addEventListener('pointermove',mv); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
      });
    });
  }

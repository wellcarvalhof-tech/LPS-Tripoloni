<meta charset="utf-8">
<title>LPS Tripoloni · Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --elev:#F5F7F9; --line:#DDE3E9; --line-2:#E9EDF1;
    --ink:#1A2127; --ink-2:#54636F; --muted:#8593A0;
    --nav-bg:#141A20; --nav-ink:#C7D2DC; --nav-ink-2:#8695A2; --nav-active:#5FA0D6; --nav-hover:#1E262E;
    --accent:#2D6FA6; --accent-soft:#D9E8F5;
    --c1:#3E7CB1; --c2:#5F9E6E; --c3:#C98A2B; --c4:#9A6DB0; --c5:#C0653F; --c6:#4FA3A8;
    --good:#2E9E6B; --warn:#C98A2B; --crit:#D33A3F; --info:#3E7CB1;
    --good-bg:#E4F3EC; --warn-bg:#F7EBD6; --crit-bg:#F8E2E3;
    --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.05);
    --radius:12px;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --bg:#0D1115; --surface:#161B21; --elev:#1D242B; --line:#28313A; --line-2:#212932;
    --ink:#EAEEF2; --ink-2:#A6B3BE; --muted:#71808C;
    --nav-bg:#0A0E12; --nav-ink:#C7D2DC; --nav-ink-2:#7A8894; --nav-active:#5FA0D6; --nav-hover:#161D24;
    --accent:#5FA0D6; --accent-soft:#16283A;
    --c1:#5FA0D6; --c2:#5FB98A; --c3:#E0A93F; --c4:#B98BD4; --c5:#DB855C; --c6:#5FC2C8;
    --good:#41C089; --warn:#E0A93F; --crit:#E5565B; --info:#5FA0D6;
    --good-bg:#12281F; --warn-bg:#2C2413; --crit-bg:#301719;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.32);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1115; --surface:#161B21; --elev:#1D242B; --line:#28313A; --line-2:#212932;
    --ink:#EAEEF2; --ink-2:#A6B3BE; --muted:#71808C;
    --nav-bg:#0A0E12; --nav-ink:#C7D2DC; --nav-ink-2:#7A8894; --nav-active:#5FA0D6; --nav-hover:#161D24;
    --accent:#5FA0D6; --accent-soft:#16283A;
    --c1:#5FA0D6; --c2:#5FB98A; --c3:#E0A93F; --c4:#B98BD4; --c5:#DB855C; --c6:#5FC2C8;
    --good:#41C089; --warn:#E0A93F; --crit:#E5565B; --info:#5FA0D6;
    --good-bg:#12281F; --warn-bg:#2C2413; --crit-bg:#301719;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.32);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .num{font-variant-numeric:tabular-nums}

  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .side{background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
  .side-brand .g{width:34px;height:34px;border-radius:9px;flex:0 0 auto;background:linear-gradient(150deg,var(--nav-active),#164a73);display:grid;place-items:center}
  .side-brand .g svg{width:19px;height:19px}
  .side-brand h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:15.5px;margin:0;color:#fff;letter-spacing:-.01em;line-height:1.1}
  .side-brand .sub{font-size:10.5px;color:var(--nav-ink-2);letter-spacing:.06em;text-transform:uppercase}
  .nav{padding:6px 10px;flex:1}
  .nav-group{margin-bottom:3px}
  .nav-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--nav-ink);font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
  .nav-head:hover{background:var(--nav-hover)}
  .nav-head .ic{width:17px;height:17px;flex:0 0 auto;opacity:.85}
  .nav-head .chev{margin-left:auto;transition:transform .15s;opacity:.6}
  .nav-group.open .chev{transform:rotate(90deg)}
  .nav-sub{max-height:0;overflow:hidden;transition:max-height .2s ease}
  .nav-group.open .nav-sub{max-height:340px}
  .nav-item{display:block;width:100%;background:none;border:0;color:var(--nav-ink-2);font-family:inherit;font-size:13px;padding:7px 10px 7px 38px;border-radius:8px;cursor:pointer;text-align:left}
  .nav-item:hover{background:var(--nav-hover);color:var(--nav-ink)}
  .nav-item.active{color:#fff;background:var(--nav-hover)}
  .nav-item.active::before{content:"";position:absolute;left:22px;width:6px;height:6px;border-radius:99px;background:var(--nav-active);margin-top:6px}
  .nav-item{position:relative}
  .nav-solo .nav-head.active{background:var(--nav-hover);color:#fff}
  .nav-solo .nav-head.active .ic{opacity:1;color:var(--nav-active)}
  .side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:var(--nav-ink-2)}

  /* ---------- Topbar ---------- */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .obra-sel{display:flex;align-items:center;gap:8px;background:var(--elev);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;cursor:pointer}
  .obra-sel .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .obra-sel b{font-weight:600}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:9px}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
  .icon-btn:hover{border-color:var(--accent);color:var(--ink)}
  .avatar{width:34px;height:34px;border-radius:99px;background:linear-gradient(140deg,var(--c4),var(--c1));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}

  /* ---------- Content ---------- */
  .content{padding:22px;max-width:1700px;width:100%}
  .page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .page-head h2{font-family:"Archivo",sans-serif;font-weight:800;font-size:22px;margin:0;letter-spacing:-.02em}
  .page-head .desc{font-size:13px;color:var(--muted);margin-top:3px}
  .page-actions{margin-left:auto;display:flex;gap:8px}
  .page-head-mini{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}
  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}

  .subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:0}
  .subtab{font-size:13px;font-weight:600;color:var(--muted);padding:8px 12px;border:0;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
  .subtab:hover{color:var(--ink)}
  .subtab.active{color:var(--ink);border-bottom-color:var(--accent)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 17px;min-width:0}
  .card h3{font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;margin:0 0 3px}
  .card .eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .g-2-1{grid-template-columns:2fr 1fr}.g-1-2{grid-template-columns:1fr 2fr}

  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kpi .lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .kpi .val{font-family:"Archivo",sans-serif;font-weight:800;font-size:25px;line-height:1.05;margin-top:7px;letter-spacing:-.02em}
  .kpi .foot{font-size:11.5px;color:var(--ink-2);margin-top:4px}
  .cv-cardgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .cv-compact .kpi{padding:8px 11px}
  .cv-compact .kpi .lab{font-size:10px}
  .cv-compact .kpi .val{font-size:19px;margin-top:3px}
  .cv-compact .kpi .foot{font-size:10px;margin-top:2px}
  .up{color:var(--good)}.down{color:var(--crit)}.flat{color:var(--warn)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  th.r,td.r{text-align:right}
  .tbl-wrap{overflow-x:auto}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.good{background:var(--good-bg);color:var(--good)}.pill.mut{background:var(--elev);color:var(--ink-2)}
  .swatch{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:6px}
  .inp{width:100%;font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--elev);color:var(--ink)}
  .field{margin-bottom:11px}.field label{display:block;font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:4px}

  /* Matrix (tempo-caminho) */
  .tc-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:76vh}
  .tc-zoom{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .tc-zoom button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700}
  .tc-zoom button:hover{border-color:var(--accent)}
  .tc-zoom .lvl{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);min-width:38px;text-align:center}
  table.tc{border-collapse:separate;border-spacing:0;font-size:11px;min-width:640px}
  table.tc th,table.tc td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:0}
  table.tc thead th{position:sticky;top:0;background:var(--surface);z-index:3;padding:8px 6px;font-size:10.5px;color:var(--ink-2);text-transform:none;letter-spacing:0;text-align:center}
  table.tc tbody th{position:sticky;left:0;background:var(--surface);z-index:2;padding:4px 10px;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap;font-family:"IBM Plex Mono",monospace}
  table.tc td{height:22px;text-align:center;color:#0d0d0d;font-weight:600}
  .cellwk{font-size:9px;line-height:22px}

  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  svg.chart{width:100%;height:auto;display:block;overflow:visible}
  .axm{fill:var(--muted);font-size:10px;font-family:"IBM Plex Mono",monospace}
  .barrow{display:grid;grid-template-columns:70px 1fr 32px;align-items:center;gap:9px;margin:8px 0;font-size:12px}
  .track{height:8px;background:var(--elev);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;border-radius:99px}
  .note{font-size:12px;color:var(--muted)}
  .wip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:99px}

  .banner{display:flex;gap:11px;align-items:flex-start;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink);padding:11px 14px;border-radius:11px;margin-bottom:18px;font-size:13px}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;z-index:60;width:248px;transform:translateX(-100%);transition:transform .2s}
    .side.open{transform:none}
    .g2,.g3,.g4,.g-2-1,.g-1-2{grid-template-columns:1fr}
    .menu-toggle{display:grid!important}
  }
  .menu-toggle{display:none}

  /* ---------- Landing: seleção de obras ---------- */
  .landing{position:fixed;inset:0;overflow-y:auto;background:var(--bg);z-index:80;display:none}
  .landing.show{display:block}
  .land-top{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0}
  .land-top .g{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--accent),#164a73);display:grid;place-items:center}
  .land-top .g svg{width:19px;height:19px}
  .land-top h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:16px;margin:0;letter-spacing:-.01em}
  .land-top .sub{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .land-body{max-width:1080px;margin:0 auto;padding:32px 26px 60px}
  .land-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .land-head h2{font-family:"Archivo",sans-serif;font-weight:800;font-size:26px;margin:0;letter-spacing:-.02em}
  .land-head .desc{font-size:14px;color:var(--muted);margin-top:4px}
  .land-search{margin-left:auto;position:relative}
  .land-search input{font-family:inherit;font-size:13px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:230px}
  .land-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .obras-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .obra-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;text-align:left;padding:0;font-family:inherit;color:inherit;display:block;width:100%}
  .obra-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 28px rgba(20,30,40,.12)}
  .obra-card .top{height:6px}
  .obra-card .in{padding:16px 17px}
  .obra-card .code{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono",monospace;letter-spacing:.03em}
  .obra-card h3{font-family:"Archivo",sans-serif;font-weight:700;font-size:17px;margin:5px 0 2px;letter-spacing:-.01em}
  .obra-card .trecho{font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
  .obra-card .prog{margin-bottom:13px}
  .obra-card .prog .pl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .obra-card .prog .pl b{color:var(--ink);font-weight:600}
  .obra-card .stats{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line-2);padding-top:12px}
  .obra-card .st .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .obra-card .st .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;margin-top:2px}
  .obra-card .st .v.small{font-size:12.5px}
  .obra-new{border:1.5px dashed var(--line);background:transparent;border-radius:14px;display:grid;place-items:center;min-height:210px;cursor:pointer;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;gap:8px;transition:border-color .12s,color .12s}
  .obra-new:hover{border-color:var(--accent);color:var(--accent)}
  .obra-new .plus{width:44px;height:44px;border-radius:99px;border:1.5px solid currentColor;display:grid;place-items:center;font-size:22px;font-weight:400}
  .obra-sel{cursor:pointer}

  /* ---------- Matriz Tempo-Caminho (fiel ao app) ---------- */
  .tc-head h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:0}
  .tc-head p{font-size:12px;color:var(--muted);margin:4px 0 0;max-width:660px;line-height:1.45}
  .assign{border:1px solid var(--line);background:var(--elev);border-radius:10px;padding:12px 13px;margin:14px 0}
  .assign .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .assign select{height:30px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:0 8px;font-family:inherit;font-size:12.5px}
  .lotchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .lotchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
  .lotchip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .lotchip.other{border-style:dashed;color:var(--muted)}
  .tc-svctoggle{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .seqlist{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-width:420px}
  .seqrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px}
  .seqnum{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}
  .seqname{flex:1;font-size:12.5px}
  .seqbtns{display:flex;gap:4px}
  table.tcm{border-collapse:collapse;font-size:11px;min-width:700px;width:100%}
  table.tcm th,table.tcm td{border:1px solid var(--line-2)}
  table.tcm thead th{position:sticky;top:0;background:var(--surface);z-index:3;padding:7px 8px;color:var(--ink-2);font-size:10.5px;text-align:center;white-space:nowrap}
  table.tcm thead th.lot{font-weight:700;color:var(--ink)}
  table.tcm td.dt{padding:3px 8px;color:var(--muted);white-space:nowrap;font-family:"IBM Plex Mono",monospace}
  table.tcm td.wk{padding:3px 8px;text-align:center;font-weight:600;background:var(--elev);font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}
  table.tcm td.cell{padding:0}
  .tcm-row{display:flex;min-height:28px;width:100%}
  .tcm-seg{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:"IBM Plex Mono",monospace;position:relative;padding:2px 3px;cursor:grab;touch-action:none}
  .tcm-seg:active{cursor:grabbing}
  tr.tcm-droprow{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  td.tcm-dropcol{outline:2px dashed var(--accent);outline-offset:-2px}
  .tcm-grip{position:absolute;left:2px;opacity:.4;font-weight:400}
  .tcm-badge{position:absolute;top:0;right:0;display:flex;align-items:center;gap:2px;padding:0 3px;font-size:9px;font-weight:700;color:#fff;border-bottom-left-radius:4px}
  .tcm-team{position:absolute;bottom:0;left:2px;font-size:8px;font-weight:700;line-height:1;opacity:.75}
  .tcm-rain{font-size:9px;font-weight:600;color:var(--info);white-space:nowrap}
  tr.tcm-holrow td{background:var(--elev);color:var(--muted)}
  tr.tcm-rainrow td.dt,tr.tcm-rainrow td.wk,tr.tcm-rainrow td.cell{background:var(--accent-soft)}
  td.tcm-holcell{text-align:center;font-size:11px;font-weight:600;letter-spacing:.03em}
  table.tcm tr.sumrow td{padding:6px 8px;font-weight:600;border-color:var(--line)}
  table.tcm td.sumname{text-align:center;font-weight:700;font-size:11.5px}
  table.tcm td.sumq{text-align:center;font-family:"IBM Plex Mono",monospace;color:var(--ink)}
  .apptoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.32)}
  .apptoast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Editores de cadastro ---------- */
  .edtbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
  .edtbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px;background:var(--elev);border-bottom:1px solid var(--line);white-space:nowrap}
  .edtbl th.r,.edtbl td.r{text-align:right}
  .edtbl td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  .einp{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:0 8px;font-family:inherit;font-size:13px}
  .einp[type=number]{text-align:right}
  .esel{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:0 6px;font-family:inherit;font-size:12px}
  .esw{width:40px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:none}
  .iconbtn{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-grid;place-items:center;font-size:12px;line-height:1}
  .iconbtn:disabled{opacity:.35;cursor:not-allowed}
  .iconbtn:hover{border-color:var(--accent);color:var(--ink)}
  .predwrap{display:flex;flex-wrap:wrap;gap:4px;max-width:280px}
  .predchip{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;background:var(--surface);white-space:nowrap}
  .predchip.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
  .ed-detail td{background:var(--elev)}
  .ed-sec{margin-bottom:14px}
  .ed-sec .lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:block;margin-bottom:7px}
  .ed-team{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 8px;font-size:12px;margin:0 6px 6px 0}
  .ed-team em{color:var(--muted);font-style:normal}
  .ed-checks{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px}
  .ed-checks label{display:flex;align-items:center;gap:6px}
  .mpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
  .mpf{display:flex;flex-direction:column;gap:5px}
  .mpf label{font-size:11px;font-weight:600;color:var(--ink-2)}
  @media (max-width:760px){.mpgrid{grid-template-columns:1fr}}
  .mp-cell{cursor:pointer;border:0;font-family:"IBM Plex Mono",monospace;font-weight:700}
  .mp-badge{position:absolute;top:1px;right:1px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:99px;font-size:10px;font-weight:700;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);padding:0 3px}
  .mp-restr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 10px;font-size:12.5px}
  .mp-tag{color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
  .mp-cats{display:flex;flex-wrap:wrap;gap:6px}
  .mp-catchip{cursor:pointer;border:1px solid;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;background:transparent;font-family:inherit}
  .mp-list{list-style:none;margin:0;padding:0}
  .mp-li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 4px;border-top:1px solid var(--line-2);font-size:12.5px}
  .mp-li:first-child{border-top:0}
  /* ---------- Login (Supabase) ---------- */
  .authgate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:20px}
  .authgate[hidden]{display:none}
  .authbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 26px 22px;width:100%;max-width:360px}
  .authbrand{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .authbrand .g{width:36px;height:36px;border-radius:9px;background:linear-gradient(150deg,var(--accent),#164a73);display:grid;place-items:center}
  .authbrand .g svg{width:20px;height:20px}
  .authbrand b{font-family:"Archivo",sans-serif;font-weight:800;font-size:16px}
  .authbrand span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .authbox h2{font-family:"Archivo",sans-serif;font-weight:700;font-size:18px;margin:0 0 14px}
  .authf{margin-bottom:12px}
  .authf label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
  .authf input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--elev);color:var(--ink);padding:0 11px;font-family:inherit;font-size:14px}
  .autherr{font-size:12.5px;margin-bottom:10px}
  .authbtns{display:flex;gap:8px;margin-top:6px}
  .authbtns .btn{flex:1;justify-content:center}
  .authnote{font-size:11px;color:var(--muted);margin-top:14px;text-align:center}
  .obra-del{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:6px}
  .obra-del:hover{background:var(--crit-bg);color:var(--crit)}

  /* ---------- Brand / logo ---------- */
  .logo{width:auto;display:block;height:30px}
  .logo-color{display:block}
  .logo-white{display:none}
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){ .logo-color{display:none} .logo-white{display:block} } }
  :root[data-theme="dark"]{ .logo-color{display:none} .logo-white{display:block} }
  .on-dark .logo-color{display:none!important}
  .on-dark .logo-white{display:block!important}
  .brand-tag{display:inline-flex;flex-direction:column;line-height:1;border-left:1px solid var(--line);padding-left:12px}
  .brand-tag b{font-family:"Archivo",sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em}
  .brand-tag span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
  .on-dark .brand-tag{border-color:rgba(255,255,255,.16)}
  .on-dark .brand-tag b{color:#fff}
  .on-dark .brand-tag span{color:var(--nav-ink-2)}
  .topbar-brand{display:none;align-items:center;gap:10px;margin-right:2px}
  @media (max-width:900px){ .topbar-brand{display:flex} }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .print-only{display:none}
  @media print{
    @page{size:landscape;margin:10mm}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
    .side,.topbar,.tc-zoom,#cronoToolbar,.banner,.page-actions,.subtabs,.legend,.wip,.apptoast,.assign,.tc-svctoggle,.cv-toolbar{display:none!important}
    .cv-compact svg.chart{max-height:none!important}
    .app{display:block}
    .content{max-width:none!important;padding:0!important}
    .card{box-shadow:none;border:1px solid #ccc}
    .tc-wrap{max-height:none!important;overflow:visible!important}
    .print-only{display:block}
    .print-head{margin-bottom:8px}
    .print-head h2{font-family:"Archivo",sans-serif;font-size:16px;margin:0}
    #printFoot table{border-collapse:collapse;font-size:10.5px;margin-top:6px}
    #printFoot td{padding:3px 8px;border:1px solid #ccc}
    #printFoot .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
    #printFoot ul{margin:8px 0 0;padding-left:16px;font-size:10px;color:#444}
  }

  async function doAuth(mode){
    var em=(document.getElementById('authEmail').value||'').trim(), pw=document.getElementById('authPass').value, err=document.getElementById('authErr');
    err.hidden=true;
    if(!SB){err.style.color='var(--crit)';err.textContent='Supabase não carregou. Abra o arquivo localmente (não como link de artifact) e verifique a internet.';err.hidden=false;return;}
    if(!em||!pw){err.style.color='var(--crit)';err.textContent='Informe e-mail e senha.';err.hidden=false;return;}
    try{
      var r = mode==='up' ? await SB.auth.signUp({email:em,password:pw}) : await SB.auth.signInWithPassword({email:em,password:pw});
      if(r.error)throw r.error;
      if(mode==='up' && !(r.data&&r.data.session)){err.style.color='var(--good)';err.textContent='Conta criada. Se pedir confirmação de e-mail, confirme e depois entre.';err.hidden=false;return;}
      hideAuth(); await enterApp();
    }catch(e){err.style.color='var(--crit)';err.textContent='Falha: '+((e&&e.message)||e);err.hidden=false;}
  }

  /** Aloca o realizado de cada recurso, por semana, proporcionalmente ao previsto de cada serviço que o utiliza naquela semana. */
  function computeServicePR(hist){
    var atbw=activeTeamsByWeek(), tw=atbw.tw, teamsByService=atbw.teamsByService;
    var previsto={}, realizado={};
    SERV.forEach(function(s,si){
      var arr=[], arr2=[]; for(var w=0;w<tw;w++){arr.push(0);arr2.push(0);}
      previsto[si]=arr; realizado[si]=arr2;
      var crew=(s.cfg&&s.cfg.crew)||[], teams=teamsByService[si]||[];
      crew.forEach(function(item){
        for(var w2=0;w2<tw;w2++) arr[w2]+=(teams[w2]||0)*(item.qtyPerTeam||0);
      });
    });
    for(var w=1;w<=tw;w++){
      var d=mondayOf(w).toISOString().slice(0,10);
      RECURSOS.forEach(function(r){
        var rv=REALIZADO_REC[r.id+'::'+d]||0; if(!rv)return;
        var totalPrev=0, shares=[];
        SERV.forEach(function(s,si){
          var crew=(s.cfg&&s.cfg.crew)||[];
          var item=crew.filter(function(c){return c.resourceId===r.id;})[0];
          if(!item)return;
          var teams=(teamsByService[si]||[])[w-1]||0, p=teams*item.qtyPerTeam;
          if(p>0){shares.push({si:si,p:p}); totalPrev+=p;}
        });
        if(totalPrev<=0)return;
        shares.forEach(function(x){ realizado[x.si][w-1]+=rv*(x.p/totalPrev); });
      });
    }
    return {previsto:previsto,realizado:realizado,tw:tw};
  }

    }

      'Mostra só serviços com previsto ou realizado apontado. O realizado apontado por recurso é rateado entre os serviços que o utilizam naquela semana, proporcional ao previsto.',
      null,

    );

  function realizadoHTML(hist){
    var tw=hist.tw;
    if(!RECURSOS.length||!tw)return sectionCard('realizado','Realizado (previsto × realizado)','',null,'<div class="note">Cadastre recursos e o cronograma pra apontar o realizado.</div>');
    var realDirty=Object.keys(REALIZADO_DIRTY).length;
    var list=RECURSOS.filter(function(r){
      if(REAL_FILTER!=='todos'&&r.tipo!==REAL_FILTER)return false;
      var arr=hist.byResource[r.id]||[];

  function scenarioStats(ovr){
    var segs=scheduleWithOverrides(ovr), tw=0, peak=0;
    segs.forEach(function(sg){ tw=Math.max(tw,sg.start+sg.dur-1); });
    for(var w=1;w<=tw;w++){
      var teams=0;
      segs.forEach(function(sg){ if(w>=sg.start&&w<sg.start+sg.dur&&(sg.wq[w-sg.start]||0)>0)teams++; });
      peak=Math.max(peak,teams);
    }
    return {tw:tw,peak:peak};
  }

  function barLine(el,labels,real,prev,colHex){
    if(!el)return;
    var W=660,H=280,pl=48,pr=14,pt=14,pb=32,iw=W-pl-pr,ih=H-pt-pb,n=labels.length||1;
    var mx=Math.max(1,Math.max.apply(null,real.concat(prev)));
    var unit=mx>2000?1000:(mx>200?100:10),top=Math.max(unit,Math.ceil(mx/4/unit)*unit*4);
    var yy=function(v){return pt+ih-ih*v/top;}, gap=iw/n, bw=gap*0.5;
    var s='';
    for(var g=0;g<=4;g++){var val=top*g/4;s+='<line x1="'+pl+'" y1="'+yy(val)+'" x2="'+(W-pr)+'" y2="'+yy(val)+'" stroke="var(--line)"/><text class="axm" x="'+(pl-6)+'" y="'+(yy(val)+3)+'" text-anchor="end">'+fmtBR(val)+'</text>';}
    for(var i=0;i<n;i++){var x=pl+gap*i+(gap-bw)/2,h=Math.max(0,yy(0)-yy(real[i]));
      s+='<rect x="'+x.toFixed(1)+'" y="'+yy(real[i]).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+colHex+'"><title>'+labels[i]+' · realizado '+fmtBR(real[i])+'</title></rect>';
      s+='<text class="axm" x="'+(x+bw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+labels[i]+'</text>';}
    var d=prev.map(function(v,i){return (i?'L':'M')+(pl+gap*i+gap/2).toFixed(1)+' '+yy(v).toFixed(1);}).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="var(--ink-2)" stroke-width="2.5" stroke-dasharray="5 3"/>';
    prev.forEach(function(v,i){s+='<circle cx="'+(pl+gap*i+gap/2).toFixed(1)+'" cy="'+yy(v).toFixed(1)+'" r="3" fill="var(--ink-2)"><title>previsto '+fmtBR(v)+'</title></circle>';});
    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;

    function path(a){var d='',st=false;for(var i=0;i<a.length;i++){if(a[i]==null)continue;d+=(st?'L':'M')+xx(i).toFixed(1)+' '+yy(a[i]).toFixed(1)+' ';st=true;}return d;}
    s+='<path d="'+path(prev)+'" fill="none" stroke="var(--c1)" stroke-width="2.5"/>';
    if(trend)s+='<path d="'+path(trend)+'" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 4"/>';
    s+='<path d="'+path(real)+'" fill="none" stroke="var(--accent)" stroke-width="3"/>';
    var st2=Math.ceil(n/10);
    for(var i=0;i<n;i++){if(i%st2===0)s+='<text class="axm" x="'+xx(i)+'" y="'+(H-8)+'" text-anchor="middle">'+labels[i]+'</text>';}
    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;
  }

  /* ---- Torre: desempenho por serviço + curva S ponderada ---- */
  function renderTorreDesempenho(){
    var svc=window._torreSvc==null?1:+window._torreSvc, per=window._torrePer||8;
    var wq=weeklyQtyBySvc(), end=Math.min(wq.tw,HOJE_W), start=Math.max(1,end-per+1);
    var labels=[],prev=[],real=[];
    for(var w=start;w<=end;w++){labels.push('S'+w);var pv=wq.M[svc][w]||0;prev.push(pv);real.push(Math.round(pv*(0.72+((w*7)%28)/100)));}
    barLine(document.getElementById('torreBar'),labels,real,prev,svcColor(SERV[svc]));
  }
  function svcCumFrac(){
    var wq=weeklyQtyBySvc(),tw=wq.tw;
    var frac=SERV.map(function(s,si){var tot=0;LOTS.forEach(function(l,li){tot+=QTY[li][si];});tot=tot||1;var a=[0],acc=0;for(var w=1;w<=tw;w++){acc+=wq.M[si][w]||0;a[w]=acc/tot;}return a;});
    return {frac:frac,tw:tw};
  }
  function curveWeights(wgt){
    if(wgt==='financeiro'){var s=0;window.PESO.forEach(function(p){s+=(+p||0);});return window.PESO.map(function(p){return (+p||0)/(s||1);});}
    if(wgt==='tempo'){var sp=svcSpan(),d=sp.map(function(x){return x.e>0?x.e-x.s+1:0;}),t=0;d.forEach(function(x){t+=x;});return d.map(function(x){return x/(t||1);});}
    var tq=SERV.map(function(s,si){var t=0;LOTS.forEach(function(l,li){t+=QTY[li][si];});return t;}),g=0;tq.forEach(function(x){g+=x;});return tq.map(function(x){return x/(g||1);});
  }
  function renderTorreCurva(){
    var wgt=window._torreW||'financeiro', sc=window._torreScope==null?-1:+window._torreScope;
    var cf=svcCumFrac(),w=curveWeights(wgt),labels=[],prev=[],real=[];
    for(var t=1;t<=cf.tw;t++){var p=0;if(sc<0){SERV.forEach(function(s,si){p+=w[si]*(cf.frac[si][t]||0);});}else{p=cf.frac[sc][t]||0;}
      labels.push('S'+t);prev.push(Math.min(100,p*100));real.push(t<=HOJE_W?Math.min(100,p*100*0.93):null);}
    curveSVG(document.getElementById('torreCurva'),labels,prev,real,null);
  }

        return '<tr><td class="mono">'+brDate(r.data)+'</td><td>'+(sv?sv.n:'—')+'</td><td>'+loteName+'</td><td class="r num">'+fmtBR(r.qtd)+' '+(sv?sv.u:'')+'</td><td><button class="iconbtn" data-pddel="'+r.id+'">✕</button></td></tr>';
      }).join('');

    } else if(window._prodMode==='tc'){

  }

  /* ---- Gantt + resumo semanal (aba do Cronograma) ---- */
  function ganttHTML(){
    var sp=svcSpan(); var tw=1; sp.forEach(function(x){tw=Math.max(tw,x.e);});
    var W=760,rowH=28,H=SERV.length*rowH+40,pl=160,pr=16,iw=W-pl-pr;
    var xx=function(w){return pl+iw*(w-1)/Math.max(1,tw-1);};
    var s='';
    for(var g=1;g<=tw;g+=Math.ceil(tw/12)){s+='<line x1="'+xx(g)+'" y1="20" x2="'+xx(g)+'" y2="'+(H-16)+'" stroke="var(--line)"/><text class="axm" x="'+xx(g)+'" y="14" text-anchor="middle">S'+g+'</text>';}
    SERV.forEach(function(sv,si){var y=24+si*rowH,x1=xx(sp[si].s||1),x2=xx((sp[si].e||1)+1);
      s+='<text class="axm" x="8" y="'+(y+rowH/2+1)+'" style="fill:var(--ink);font-size:11px">'+sv.n+'</text>';
      s+='<rect x="'+x1.toFixed(1)+'" y="'+(y+4)+'" width="'+Math.max(4,x2-x1).toFixed(1)+'" height="'+(rowH-10)+'" rx="4" fill="'+svcColor(sv)+'"><title>'+sv.n+': S'+sp[si].s+'–S'+sp[si].e+'</title></rect>';});
    var gantt='<div class="card" style="margin-bottom:14px"><div class="eyebrow">Gantt dos serviços</div><div class="tc-wrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" style="min-width:700px">'+s+'</svg></div></div>';
    var wq=weeklyQtyBySvc();
    var th='<th>Serviço</th>'; for(var w=1;w<=wq.tw;w++)th+='<th class="r">S'+w+'</th>';
    var body=SERV.map(function(sv,si){var cells='';for(var w=1;w<=wq.tw;w++){var v=wq.M[si][w]||0;cells+='<td class="r mono"'+(v>0?'':' style="color:var(--muted)"')+'>'+(v>0?fmtBR(v):'·')+'</td>';}return '<tr><td><span class="swatch" style="background:'+svcColor(sv)+'"></span>'+sv.n+' <span class="note">('+sv.u+')</span></td>'+cells+'</tr>';}).join('');
    return gantt+'<div class="card"><div class="eyebrow">Resumo — quantidade por serviço por semana (unidade do tempo-caminho)</div><div class="tbl-wrap"><table class="edtbl"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
  }

  /** Soma semanal (qty) por serviço a partir de uma lista de segmentos, até tw semanas. */
  function weeklyFromSegs(segs,tw){
    var weekly=[]; for(var w=0;w<=tw;w++)weekly[w]=SERV.map(function(){return 0;});
    (segs||[]).forEach(function(sg){ for(var i=0;i<sg.dur;i++){ var w=sg.start+i; if(w<=tw&&w>=0)weekly[w][sg.si]+=sg.wq[i]||0; } });
    return weekly;
  }
  /** Converte quantidade semanal em % acumulado por serviço + total, dado o total de cada serviço. */
  function cumulativePct(weekly,tw,totalByServ,grandTotal){
    var series={}; SERV.forEach(function(s,si){series[si]=[0];});
    var totalSeries=[0], accum=SERV.map(function(){return 0;}), grandAccum=0;
    for(var w=1;w<=tw;w++){
      SERV.forEach(function(s,si){
        accum[si]+=weekly[w][si]||0;
        series[si].push(totalByServ[si]>0?(accum[si]/totalByServ[si]*100):0);
      });
      grandAccum+=weekly[w].reduce(function(a,b){return a+b;},0);
      totalSeries.push(grandTotal>0?(grandAccum/grandTotal*100):0);
    }
    return {series:series,totalSeries:totalSeries};
  }
  /** Dados da Curva S: previsto cliente (linha de base ativa, se houver), previsto executivo
   *  (cronograma atual, ao vivo) e realizado (Produção Diária), por serviço e total. */
  function curvaSData(){
    var baseline=activeBaseline();
    var segsExec=buildSchedule();
    var segsCliente=baseline?scheduleWithOverrides(baseline.ovr):null;
    var twExec=1; segsExec.forEach(function(sg){twExec=Math.max(twExec,sg.start+sg.dur-1);});
    var twCliente=0; if(segsCliente)segsCliente.forEach(function(sg){twCliente=Math.max(twCliente,sg.start+sg.dur-1);});
    var tw=Math.max(twExec,twCliente,1);

    var totalByServ=SERV.map(function(s,si){var t=0;LOTS.forEach(function(l,li){t+=QTY[li][si]||0;});return t;});
    var grandTotal=totalByServ.reduce(function(a,b){return a+b;},0);

    var executivo=cumulativePct(weeklyFromSegs(segsExec,tw),tw,totalByServ,grandTotal);
    var cliente=segsCliente?cumulativePct(weeklyFromSegs(segsCliente,tw),tw,totalByServ,grandTotal):null;

    // realizado: apontamentos reais de Produção Diária, agregados na semana de trabalho correspondente à data
    var realWeekly=[]; for(var w3=0;w3<=tw;w3++)realWeekly[w3]=SERV.map(function(){return 0;});
    var weekIdxCache={};
    (window.PROD_LIST||[]).forEach(function(r){
      var mon=mondayOfIso(r.data), w4=weekIdxCache[mon];
      if(w4===undefined){
        w4=null;
        for(var wi=1;wi<=tw;wi++){ if(mondayOf(wi).toISOString().slice(0,10)===mon){w4=wi;break;} }
        weekIdxCache[mon]=w4;
      }
      if(w4==null)return;
      var si=null; SERV.forEach(function(s,i){if(s.id===r.servId)si=i;});
      if(si==null)return;
      realWeekly[w4][si]+=r.qtd||0;
    });
    var real=cumulativePct(realWeekly,tw,totalByServ,grandTotal);

    var today=new Date(); today.setHours(0,0,0,0);
    var hojeW=0; for(var i=1;i<=tw;i++){ if(mondayOf(i)<=today)hojeW=i; else break; }
    return {tw:tw,hojeW:hojeW,baseline:baseline,cliente:cliente,executivo:executivo,real:real};
  }
  /** Extrai a série (array por semana) de uma "curva" (índice de serviço, ou 'total') de uma fonte cliente/executivo/real. */
  function curveSeries(src,sel){
    if(!src)return null;
    return sel==='total'?src.totalSeries:src.series[sel];
  }
  function sCurve(id,data,sel){
    var el=document.getElementById(id); if(!el)return;
    var W=700,H=210,pl=30,pr=10,pt=10,pb=18,iw=W-pl-pr,ih=H-pt-pb;
    var afs='style="font-size:7.5px"';
    var tw=data.tw;
    if(!SERV.length||!tw){el.innerHTML='';el.removeAttribute('viewBox');return;}
    var n=tw+1;
    var xx=function(i){return pl+iw*i/Math.max(1,n-1);}, yy=function(v){return pt+ih-ih*v/100;};
    var s='';
    for(var g=0;g<=100;g+=25){s+='<line x1="'+pl+'" y1="'+yy(g)+'" x2="'+(W-pr)+'" y2="'+yy(g)+'" stroke="var(--line)"/><text class="axm" '+afs+' x="'+(pl-5)+'" y="'+(yy(g)+2.5)+'" text-anchor="end">'+g+'</text>';}
    var stepLbl=Math.max(1,Math.ceil((n-1)/13));
    for(var i=1;i<n;i+=stepLbl){s+='<text class="axm" '+afs+' x="'+xx(i)+'" y="'+(H-6)+'" text-anchor="middle">S'+isoWeek(mondayOf(i))+'</text>';}
    if((n-1)%stepLbl!==0)s+='<text class="axm" '+afs+' x="'+xx(tw)+'" y="'+(H-6)+'" text-anchor="middle">S'+isoWeek(mondayOf(tw))+'</text>';
    function path(a){if(!a)return '';var d='';for(var j=0;j<a.length;j++){d+=(j?'L':'M')+xx(j).toFixed(1)+' '+yy(a[j]).toFixed(1)+' ';}return d;}
    var cCliente=curveSeries(data.cliente,sel), cExec=curveSeries(data.executivo,sel), cReal=curveSeries(data.real,sel);
    if(cCliente)s+='<path d="'+path(cCliente)+'" fill="none" stroke="var(--crit)" stroke-width="1.6"/>';
    if(cExec)s+='<path d="'+path(cExec)+'" fill="none" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="5 3"/>';
    if(cReal)s+='<path d="'+path(cReal)+'" fill="none" stroke="var(--good)" stroke-width="1.9"/>';
    if(data.hojeW>0&&data.hojeW<=tw){
      var hx=xx(data.hojeW);
      s+='<line x1="'+hx+'" y1="'+pt+'" x2="'+hx+'" y2="'+(pt+ih)+'" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="3 3"/>'+
        '<text x="'+hx+'" y="'+(pt-3)+'" text-anchor="middle" class="axm" '+afs+'>hoje</text>';
    }
    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;
  }
  function kpiCardCv(colorKey,lab,val,foot){
    var colMap={good:'var(--good)',crit:'var(--crit)',warn:'var(--warn)',mut:'var(--muted)'};
    return '<div class="kpi"><div class="stripe" style="background:'+colMap[colorKey]+'"></div><div class="lab">'+lab+'</div><div class="val num">'+val+'</div><div class="foot">'+foot+'</div></div>';
  }
  function renderCurvaS(){
    var data=curvaSData();
    var sel=window._curvaSSel==null?'total':window._curvaSSel;
    var wSel=(window._curvaSWeek!=null&&window._curvaSWeek<=data.tw)?window._curvaSWeek:data.hojeW;

      'Previsto cliente: <b>nenhuma linha de base gerada ainda</b> — congele uma em Cenários ou no Tempo-Caminho pra ativar essa curva.';

    var cCliente=curveSeries(data.cliente,sel), cExec=curveSeries(data.executivo,sel), cReal=curveSeries(data.real,sel);
    var vCliente=(cCliente&&cCliente[wSel]!=null)?cCliente[wSel]:null;

      html+=kpiCardCv('good','Físico realizado',vReal.toFixed(1)+'%','acumulado · '+atWk);
      html+=vCliente!=null?kpiCardCv('crit','Previsto cliente',vCliente.toFixed(1)+'%','curva contratual'):kpiCardCv('mut','Previsto cliente','—','sem linha de base');
      html+=kpiCardCv('warn','Previsto executivo',vExec.toFixed(1)+'%','curva executiva (cronograma atual)');
      html+=idpCliente!=null?kpiCardCv('crit','IDP cliente',idpCliente.toFixed(2),'realizado ÷ previsto cliente'):kpiCardCv('mut','IDP cliente','—','sem linha de base');
      html+=kpiCardCv('warn','IDP executivo',idpExec!=null?idpExec.toFixed(2):'—','realizado ÷ previsto executivo');
      cardsEl.innerHTML=html;
    }
    sCurve('scv2',data,sel);
    renderCvBars(data,sel);
    renderCvIdp(data,sel);
  }
  function weeklyDelta(series,w){
    if(!series||w<1||w>=series.length)return null;
    var prev=series[w-1]!=null?series[w-1]:0, cur=series[w]!=null?series[w]:prev;
    return cur-prev;
  }
  function renderCvBars(data,sel){
    var el=document.getElementById('cvBars'); if(!el)return;
    var hojeW=data.hojeW>0?data.hojeW:1;
    var cCliente=curveSeries(data.cliente,sel), cExec=curveSeries(data.executivo,sel), cReal=curveSeries(data.real,sel);
    var weeks=[]; for(var w=hojeW-3;w<=hojeW+3;w++)weeks.push(w);
    var vals=weeks.map(function(w){
      if(w<1||w>data.tw)return {w:w,p:null,r:null,e:null};
      return {w:w,p:weeklyDelta(cCliente,w),r:weeklyDelta(cReal,w)||0,e:weeklyDelta(cExec,w)||0};
    });
    var W=480,H=180,pl=28,pr=8,pt=14,pb=20,iw=W-pl-pr,ih=H-pt-pb,n=vals.length;
    var maxV=1; vals.forEach(function(v){ [v.p,v.r,v.e].forEach(function(x){if(x!=null)maxV=Math.max(maxV,x);}); });
    var xx=function(i){return pl+iw*i/n;}, yy=function(v){return pt+ih-ih*v/maxV;};
    var grpW=iw/n*0.82, barW=grpW*0.28;
    var s='';
    for(var g=0;g<=3;g++){var val=maxV*g/3; s+='<line x1="'+pl+'" y1="'+yy(val)+'" x2="'+(W-pr)+'" y2="'+yy(val)+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(yy(val)+2.5)+'" text-anchor="end" font-size="7" fill="var(--muted)">'+val.toFixed(0)+'</text>';}
    vals.forEach(function(v,i){

      s+='<text x="'+(x0+grpW/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="8" fill="'+(isHoje?'var(--crit)':'var(--muted)')+'"'+(isHoje?' font-weight="700"':'')+'>'+wLbl+'</text>';
      if(v.w<1||v.w>data.tw)return;
      function bar(idx,val,color,label){
        if(val==null||val<=0)return;
        var bx=x0+idx*barW*1.08, y1=yy(val), y2=yy(0);
        s+='<rect x="'+bx.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,y2-y1).toFixed(1)+'" fill="'+color+'"><title>'+label+' '+wLbl+': '+val.toFixed(1)+'%</title></rect>'+
          '<text x="'+(bx+barW/2)+'" y="'+(y1-2)+'" text-anchor="middle" font-size="6.5" fill="var(--ink-2)">'+val.toFixed(1)+'</text>';
      }
      bar(0,v.p,'var(--crit)','Previsto cliente');
      bar(1,v.r,'var(--good)','Realizado');
      bar(2,v.e,'var(--warn)','Previsto executivo');

    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;

  function renderCvIdp(data,sel){
    var el=document.getElementById('cvIdp'); if(!el)return;
    var hojeW=data.hojeW>0?data.hojeW:1;
    var cCliente=curveSeries(data.cliente,sel), cExec=curveSeries(data.executivo,sel), cReal=curveSeries(data.real,sel);
    var weeks=[]; for(var w=hojeW-5;w<=hojeW;w++)weeks.push(w);
    var vals=weeks.map(function(w){
      if(w<1||w>data.tw)return {w:w,cli:null,exe:null};
      var r=(cReal&&cReal[w]!=null)?cReal[w]:0;
      var p=cCliente&&cCliente[w]!=null?cCliente[w]:null;
      var e=cExec&&cExec[w]!=null?cExec[w]:0;
      return {w:w,cli:(p!=null&&p>0)?(r/p):null,exe:e>0?(r/e):null};
    });
    var W=480,H=180,pl=28,pr=8,pt=14,pb=20,iw=W-pl-pr,ih=H-pt-pb,n=vals.length;
    var maxV=1.3; vals.forEach(function(v){ if(v.cli!=null)maxV=Math.max(maxV,v.cli*1.15); if(v.exe!=null)maxV=Math.max(maxV,v.exe*1.15); });
    var minV=0.5; vals.forEach(function(v){ if(v.cli!=null)minV=Math.min(minV,v.cli*0.9); if(v.exe!=null)minV=Math.min(minV,v.exe*0.9); });
    var xx=function(i){return pl+iw*i/Math.max(1,n-1);}, yy=function(v){return pt+ih-ih*(v-minV)/(maxV-minV);};
    // faixas de referência: verde (>=1), amarelo (0.85-1), vermelho (<0.85)
    function band(y0,y1,col){ s+='<rect x="'+pl+'" y="'+Math.min(y0,y1)+'" width="'+iw+'" height="'+Math.abs(y1-y0)+'" fill="'+col+'" opacity=".12"/>'; }
    var s='';
    band(yy(Math.max(minV,0)),yy(0.85),'var(--crit)');
    band(yy(0.85),yy(1),'var(--warn)');
    band(yy(1),yy(maxV),'var(--good)');
    s+='<line x1="'+pl+'" y1="'+yy(1)+'" x2="'+(W-pr)+'" y2="'+yy(1)+'" stroke="var(--good)" stroke-width="1.2" stroke-dasharray="4 3"/><text x="'+(W-pr)+'" y="'+(yy(1)-3)+'" text-anchor="end" font-size="7" fill="var(--good)">Meta 1,0</text>';
    [minV,1,maxV].forEach(function(val){ s+='<text x="'+(pl-4)+'" y="'+(yy(val)+2.5)+'" text-anchor="end" font-size="7" fill="var(--muted)">'+val.toFixed(2)+'</text>'; });
    function path(key){var d='',started=false;for(var j=0;j<vals.length;j++){var v=vals[j][key];if(v==null){started=false;continue;}d+=(started?'L':'M')+xx(j).toFixed(1)+' '+yy(v).toFixed(1)+' ';started=true;}return d;}
    s+='<path d="'+path('cli')+'" fill="none" stroke="var(--ink)" stroke-width="1.6"/>';
    s+='<path d="'+path('exe')+'" fill="none" stroke="var(--crit)" stroke-width="1.6"/>';
    vals.forEach(function(v,i){
      var wLbl=v.w>=1?('S'+isoWeek(mondayOf(v.w))):'—', isHoje=v.w===hojeW;

  /* ---- Datas / semana ISO ---- */

  }
  function mondayOf(w){

    var feriados={}; calHolidays().forEach(function(f){feriados[mondayOfIso(f)]=true;});
    var count=0, guard=0;

  /* ---- Quantidades por lote × serviço (saldo) e restrições exemplo ---- */
  var QTY=[
    [8000,32000,28000,220,0,0],
    [6000,28000,30000,340,900,0],
    [7000,40000,26000,180,700,1200],
    [5000,24000,22000,260,800,900],

    [4000,20000,18000,150,600,800]

  var RESTR={'2::2':{n:1,cat:'#3b82f6',lab:'Material'},'0::1':{n:2,cat:'#a855f7',lab:'Projeto'}};

  function ovrKey(li,si){var lid=(window._LOTIDS||[])[li],sid=SERV[si]&&SERV[si].id;return lid&&sid?(lid+'::'+sid):null;}
  function ovrGet(li,si){var k=ovrKey(li,si);return k?OVR[k]:null;}
  function topoSortServices(){
    var idToSi={}; SERV.forEach(function(s,i){idToSi[s.id]=i;});
    var visited={},temp={},order=[];
    function visit(si){
      if(visited[si]||temp[si])return;
      temp[si]=true;
      var preds=(SERV[si].cfg&&SERV[si].cfg.predecessors)||[];
      preds.forEach(function(pid){var psi=idToSi[pid];if(psi!=null)visit(psi);});
      temp[si]=false; visited[si]=true; order.push(si);
    }
    SERV.forEach(function(s,si){visit(si);});
    return order;
  }
  /* ---- Calendário: feriados (paralisação total) + períodos de chuva (capacidade parcial) ---- */
  function calData(){
    var f=(window._OBRA&&window._OBRA.feriados)||[];
    if(Array.isArray(f))return {holidayWeeks:f,rainPeriods:[]};
    return {holidayWeeks:Array.isArray(f.holidayWeeks)?f.holidayWeeks:[],rainPeriods:Array.isArray(f.rainPeriods)?f.rainPeriods:[]};
  }
  function calHolidays(){ return calData().holidayWeeks; }
  function calRainPeriods(){ return calData().rainPeriods; }
  function climateFactorForDate(iso,periods){
    if(!periods||!periods.length)return 1;
    var factor=1;
    periods.forEach(function(rp){
      if(!rp.start||!rp.end)return;
      if(iso>=rp.start&&iso<=rp.end){
        var prod=Math.min(100,Math.max(0,+rp.producao||0));
        var dias=Math.min(100,Math.max(0,+rp.dias||0));
        factor*=(1-prod/100)*(1-dias/100);
      }
    });
    return Math.max(0,factor);
  }
  function weekFactor(w,periods,cache){
    if(!periods||!periods.length)return 1;
    if(cache&&cache[w]!=null)return cache[w];
    var monday=mondayOf(w), sum=0;
    for(var day=0;day<7;day++){
      var dt=new Date(monday); dt.setDate(dt.getDate()+day);
      sum+=climateFactorForDate(dt.toISOString().slice(0,10),periods);
    }
    var f=sum/7; if(cache)cache[w]=f; return f;
  }
  /** Aloca weeksNeeded semanas de capacidade a partir de startPos (posição fracionária em
   *  semanas). Semanas de chuva rendem menos (weekFactor<1), alongando a duração real —
   *  e se a equipe termina um lote no meio de uma semana, o próximo lote começa exatamente
   *  dali, consumindo o resto da capacidade daquela mesma semana. */
  function packSegment(startPos,weeksNeeded,prod,qty,periods,cache,fixedDuration){
    if(fixedDuration>0){
      var endPos0=startPos+fixedDuration;
      var start0=Math.floor(startPos+1e-9)+1, end0=Math.max(start0,Math.ceil(endPos0-1e-9));
      var weights=[];
      for(var w0=start0;w0<=end0;w0++){
        var a=Math.max(startPos,w0-1), b=Math.min(endPos0,w0);
        weights.push(Math.max(0,(b-a)*weekFactor(w0,periods,cache)));
      }
      var sum0=weights.reduce(function(x,y){return x+y;},0);
      var wq0=sum0>0?weights.map(function(x){return qty*x/sum0;}):weights.map(function(){return 0;});
      return {start:start0,end:end0,duration:end0-start0+1,endPos:endPos0,wq:wq0};
    }
    var pos=startPos, remaining=weeksNeeded, perWeek={}, guard=0;
    while(remaining>1e-9&&guard++<20000){

      if(f<=0){ pos=wk; continue; }
      var capacity=avail*f;

  function buildSchedule(){

      var earliest=1;
      var preds=(s.cfg&&s.cfg.predecessors)||[];
      preds.forEach(function(pid){
        var psi=null; SERV.forEach(function(x,i){if(x.id===pid)psi=i;});
        if(psi==null)return;
        var pk=li+'::'+psi, pe=endByKey[pk], ps=startByKey[pk];
        if(pe!=null){
          if(s.cfg&&s.cfg.parallelWithPredecessor&&ps!=null)earliest=Math.max(earliest,ps+(s.lag||0));
          else earliest=Math.max(earliest,pe+1+(s.lag||0));

    }
    order.forEach(function(si){
      var s=SERV[si], teams=s.eq, prod=pnum(s.p), hex=svcColor(s);
      if(teams<=0||prod<=0)return;

      // Posição mais cedo em que o lote pode começar: predecessor concluído, defasagem manual
      // do lote e a semana de início do serviço (o que vier depois vale).

      // Entre candidatos, escolhe o que termina mais cedo (considera a produtividade da
      // equipe); empate resolvido pela distância até o último lote que a equipe fez (logística
      // — usa a posição do lote na lista como proxy de distância) e por fim pela sequência.
      function bestCandidate(cands,teamPos,teamProdVal,lastLi){
        var best=null;

          var qty=c.qtyOverride!=null?c.qtyOverride:QTY[c.li][si];
          var packed=packSegment(startPos,qty/effProd,effProd,qty,periods,wfCache,fixedDur);
          var dist=lastLi==null?0:Math.abs(c.li-lastLi);
          if(!best||packed.endPos<best.endPos-1e-9||(Math.abs(packed.endPos-best.endPos)<1e-9&&(dist<best.dist-1e-9||(Math.abs(dist-best.dist)<1e-9&&c.seq<best.seq)))){

        // combinações (lote pronto × equipe), escolhe a que termina mais cedo — considerando
        // predecessoras, produtividade de cada equipe e a logística (distância do último lote
        // que a equipe fez).

        while(remaining.length){

            if(!bestOverall||cand.endPos<bestOverall.endPos-1e-9||(Math.abs(cand.endPos-bestOverall.endPos)<1e-9&&cand.dist<bestOverall.dist-1e-9)){
              bestOverall=cand; bestTeam=tt;
            }
          }
          var packed=bestOverall.packed, li3=bestOverall.li, qty3=bestOverall.qty;
          segs.push({li:li3,si:si,team:bestTeam+1,teams:teams,start:packed.start,dur:packed.duration,qty:qty3,wq:packed.wq,
            color:teamColor(hex,bestTeam+1,Math.max(1,teams)),name:s.n,adjusted:!!(ovrKey(li3,si)&&ADJ_PENDING[ovrKey(li3,si)])});
          startByKey[li3+'::'+si]=packed.start; endByKey[li3+'::'+si]=packed.start+packed.duration-1;
          teamPos[bestTeam]=packed.endPos; teamLastLi[bestTeam]=li3;
          remaining.splice(bestOverall.idx,1);
        }
      } else {
        // Times fixos por lote (manual ou round-robin). Sem paralisações ligado: dentro de
        // cada equipe, escolhe dinamicamente o próximo lote (mais pronto e mais perto do
        // último que a equipe fez) em vez da sequência manual fixa — evita ociosidade. A chuva
        // continua reduzindo a produção normalmente (weekFactor não é ignorado).
        // Um lote pode ter mais de uma equipe (o.teams=[1,3,...]) — divide a quantidade em
        // partes iguais entre elas, cada uma trabalhando em paralelo com sua própria produtividade.
        var teamLots=[]; for(var t=1;t<=teams;t++)teamLots.push([]);
        LOTS.forEach(function(l,li){
          if(QTY[li][si]<=0)return;
          var o=ovrGet(li,si);
          var teamsArr=(o&&Array.isArray(o.teams)&&o.teams.length)?o.teams.filter(function(x){return x>0&&x<=teams;}):null;
          if(!teamsArr||!teamsArr.length)teamsArr=[(o&&o.team>0&&o.team<=teams)?o.team:((li%teams)+1)];
          var seq=(o&&o.seq!=null)?o.seq:li;
          var qtyEach=QTY[li][si]/teamsArr.length;
          teamsArr.forEach(function(t2){
            teamLots[t2-1].push({li:li,seq:seq,ready:readyPosFor(li),qtyOverride:teamsArr.length>1?qtyEach:null});
          });
        });
        if(!noInt)teamLots.forEach(function(arr){arr.sort(function(a,b){return a.seq-b.seq;});});
        teamLots.forEach(function(lotIdxs,tIdx){
          var team=tIdx+1, tPos=0, lastLi=null;
          var teamProd=teamProds[tIdx]>0?teamProds[tIdx]:prod;
          if(noInt){
            var remainingT=lotIdxs.slice();
            while(remainingT.length){
              var pick=bestCandidate(remainingT,tPos,teamProd,lastLi);
              var packedP=pick.packed, liP=pick.li, qtyP=pick.qty;
              segs.push({li:liP,si:si,team:team,teams:teams,start:packedP.start,dur:packedP.duration,qty:qtyP,wq:packedP.wq,
                color:teamColor(hex,team,Math.max(1,teams)),name:s.n,adjusted:!!(ovrKey(liP,si)&&ADJ_PENDING[ovrKey(liP,si)])});
              tPos=packedP.endPos; lastLi=liP;
              remainingT.splice(pick.idx,1);
            }
          } else {
            lotIdxs.forEach(function(item){
              var li=item.li, qty=item.qtyOverride!=null?item.qtyOverride:QTY[li][si], o=ovrGet(li,si);
              var effProd=(o&&o.productivity>0)?o.productivity:teamProd;
              var startPos=Math.max(item.ready,tPos);
              var fixedDur=(o&&o.duration>0)?o.duration:undefined;
              var packed=packSegment(startPos,qty/effProd,effProd,qty,periods,wfCache,fixedDur);
              segs.push({li:li,si:si,team:team,teams:teams,start:packed.start,dur:packed.duration,qty:qty,wq:packed.wq,
                color:teamColor(hex,team,Math.max(1,teams)),name:s.n,adjusted:!!(ovrKey(li,si)&&ADJ_PENDING[ovrKey(li,si)])});
              tPos=packed.endPos;
            });
          }
        });
      }
      // Reconcilia início/fim do lote (pra predecessoras) considerando TODAS as equipes que
      // trabalharam nele, no caso de lote dividido entre mais de uma equipe.
      LOTS.forEach(function(l,li){
        var svcSegsForLot=segs.filter(function(sg){return sg.si===si&&sg.li===li;});
        if(!svcSegsForLot.length)return;
        var minStart=Infinity, maxEnd=-Infinity;
        svcSegsForLot.forEach(function(sg){ minStart=Math.min(minStart,sg.start); maxEnd=Math.max(maxEnd,sg.start+sg.dur-1); });
        startByKey[li+'::'+si]=minStart; endByKey[li+'::'+si]=maxEnd;
      });
      var target=(s.cfg&&s.cfg.targetEndWeek>0)?s.cfg.targetEndWeek:null;
      if(target){
        var svcSegs=segs.filter(function(sg){return sg.si===si;});
        var maxEnd=0; svcSegs.forEach(function(sg){maxEnd=Math.max(maxEnd,sg.start+sg.dur-1);});
        if(maxEnd>target)svcSegs.forEach(function(sg){sg.overTarget=true;});
      }
    });
    return segs;
  }

  /* ================= HISTOGRAMA DE RECURSOS ================= */
  /** Equipes ativas por serviço em cada semana (índice 0 = semana 1). */
  function activeTeamsByWeek(){
    var segs=buildSchedule(); var tw=1; segs.forEach(function(sg){tw=Math.max(tw,sg.start+sg.dur-1);});
    var out={}; SERV.forEach(function(s,si){out[si]=[];for(var w=0;w<tw;w++)out[si].push(0);});
    var seen={};
    segs.forEach(function(sg){
      for(var i=0;i<sg.dur;i++){
        var w=sg.start+i, qty=sg.wq[i]||0; if(qty<=0)continue;
        var key=sg.si+'::'+w; seen[key]=seen[key]||{};
        if(seen[key][sg.team])continue;
        seen[key][sg.team]=true;
        if(out[sg.si]&&w>=1&&w<=tw)out[sg.si][w-1]+=1;
      }
    });
    return {teamsByService:out,tw:tw};
  }
  /** Demanda de recursos por semana = equipes ativas do serviço × qtd/equipe cadastrada. */
  function computeHistogram(){
    var atbw=activeTeamsByWeek(), tw=atbw.tw, teamsByService=atbw.teamsByService;
    var byResource={}; RECURSOS.forEach(function(r){byResource[r.id]=[];for(var w=0;w<tw;w++)byResource[r.id].push(0);});
    var totalByService={}, totalByServiceResource={}, grandTotal=0;
    SERV.forEach(function(s,si){
      var crew=(s.cfg&&s.cfg.crew)||[], svcTotal=0, perRes={};
      crew.forEach(function(item){
        if(!byResource[item.resourceId])return;
        var mobilized=(item.qtyPerTeam||0)*(s.eq||0);
        perRes[item.resourceId]=(perRes[item.resourceId]||0)+mobilized;
        svcTotal+=mobilized;
        var arr=byResource[item.resourceId], teams=teamsByService[si]||[];
        for(var i=0;i<arr.length;i++)arr[i]+=(teams[i]||0)*(item.qtyPerTeam||0);
      });
      totalByServiceResource[si]=perRes; totalByService[si]=svcTotal; grandTotal+=svcTotal;
    });
    var peakByResource={};
    RECURSOS.forEach(function(r){ var arr=byResource[r.id]||[]; peakByResource[r.id]=arr.reduce(function(m,v){return Math.max(m,v);},0); });
    return {byResource:byResource,totalByService:totalByService,totalByServiceResource:totalByServiceResource,peakByResource:peakByResource,grandTotal:grandTotal,tw:tw};
  }

  function excelDateToIso(v){
    if(v==null||v==='')return '';
    if(v instanceof Date)return v.toISOString().slice(0,10);
    if(typeof v==='number'){
      var epoch=new Date(Date.UTC(1899,11,30)); epoch.setUTCDate(epoch.getUTCDate()+Math.round(v));
      return epoch.toISOString().slice(0,10);
    }
    var s=String(v).trim();
    var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0];
    var m2=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m2)return m2[3]+'-'+m2[2]+'-'+m2[1];
    return s;
  }
  function expandRangeToMondays(startIso,endIso){
    var out=[], d=new Date(startIso+'T00:00:00');

    var end=new Date(endIso+'T00:00:00');
    var guard=0;

    return out;
  }

    window._cronoTab='tc'; // relatório sempre a partir da visão limpa (com totais por lote)
    var prevZoom=window._matrixZoom||1;
    var prevTitle=document.title;
    window._matrixZoom=1;
    renderCrono();
    var nome=(window._OBRA&&window._OBRA.nome)||(selectedObra&&selectedObra.nome)||'Obra';
    var segs=buildSchedule(); var tw=1; segs.forEach(function(sg){tw=Math.max(tw,sg.start+sg.dur-1);});
    var d=new Date(), p2=function(n){return (n<10?'0':'')+n;};
    var gerado=p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes());
    var t=document.getElementById('printTitle'); if(t)t.textContent=nome+' — Rascunho';
    var s=document.getElementById('printSub'); if(s)s.textContent='Gerado em '+gerado+' — '+tw+' semana'+(tw===1?'':'s');
    // O navegador usa document.title como nome sugerido do PDF e no cabeçalho de impressão
    // (o carimbo de data/hora do lado esquerdo é do navegador — só some desmarcando
    // "Cabeçalhos e rodapés" no diálogo de impressão, não dá pra remover via código).
    document.title='Tempo Caminho - '+nome;
    var foot=document.getElementById('printFoot');
    if(foot){
      var legRows=SERV.map(function(sv){
        return '<tr><td><span class="swatch" style="background:'+svcColor(sv)+'"></span></td><td>'+sv.n+'</td><td>'+sv.u+'</td><td class="r">'+fmtBR(pnum(sv.p))+'</td><td class="r">'+sv.eq+'</td></tr>';
      }).join('');
      foot.innerHTML='<table><thead><tr><th></th><th>Serviço</th><th>Unidade</th><th class="r">Prod. (un/equipe/sem.)</th><th class="r">Equipes</th></tr></thead><tbody>'+legRows+'</tbody></table>'+
        '<ul><li>Tons mais escuros lado a lado no mesmo serviço identificam diferentes equipes.</li>'+
        '<li>Sub-células lado a lado numa mesma semana = atividades em paralelo no mesmo lote.</li>'+
        '<li>A última semana de uma atividade mostra o saldo (qtd. &lt; produção semanal cheia).</li></ul>';
    }
    // Encolhe a matriz (zoom) pra caber título + matriz + legenda numa única folha paisagem.
    // Reserva espaço extra pro cabeçalho/rodapé que o navegador injeta na impressão (fora do
    // nosso controle) — desmarcar "Cabeçalhos e rodapés" no diálogo de impressão dá mais folga.
    var wrap=document.getElementById('tcWrap');
    var table=wrap?wrap.querySelector('table'):null;
    var head=document.querySelector('.print-head');
    if(table){
      var naturalW=table.scrollWidth, naturalH=table.scrollHeight;
      var pxPerMm=96/25.4;
      var pageW=(297-20)*pxPerMm, pageH=(210-20)*pxPerMm;
      var reserved=(head?head.scrollHeight:40)+(foot?foot.scrollHeight:0)+110;
      if(naturalW>0&&naturalH>0){
        var fitScale=Math.min(1,(pageW-4)/naturalW,(pageH-reserved)/naturalH);
        window._matrixZoom=Math.max(0.12,+fitScale.toFixed(3));
        renderCrono();
      }
    }
    window.onafterprint=function(){ window._matrixZoom=prevZoom; document.title=prevTitle; renderCrono(); window.onafterprint=null; };
    window.print();
  }

  async function applyImportWorkbook(wb){
    if(!selectedObra){alert('Abra uma obra antes de importar.');return;}
    var wsServ=wb.Sheets['Servicos']||wb.Sheets['Serviços'];
    var wsLot=wb.Sheets['Lotes'];
    var wsCal=wb.Sheets['Calendario']||wb.Sheets['Calendário'];
    if(!wsServ&&!wsLot&&!wsCal){
      alert('Planilha não reconhecida. Use um arquivo exportado por este app (abas "Servicos", "Lotes", "Calendario") — gere um modelo com "Exportar dados".');
      return;
    }
    if(!confirm('Importar essa planilha nesta obra? Serviços/lotes com o mesmo nome são atualizados; nomes novos criam registros novos. Isso não apaga o que já existe. O cronograma é recalculado pelo app a partir desses dados (use "Importar Tempo-Caminho" se quiser reproduzir exatamente as semanas de uma aba TempoCaminho).'))return;

    // 1) Serviços (nome/unidade/cor/equipes/produtividade/lag)
    var byName={}; SERV.forEach(function(s){byName[s.n.trim().toLowerCase()]=s;});
    var createdServ=0, updatedServ=0;
    var servRows=sheetRows(wsServ).slice(1);
    for(var i=0;i<servRows.length;i++){
      var r=servRows[i]; if(!r||!r[0])continue;
      var nome=String(r[0]).trim(); if(!nome)continue;
      var patch={nome:nome,unidade:(r[1]!=null&&String(r[1]).trim())||'un',teams:Math.max(1,parseInt(r[3],10)||1),produtividade:pnum(r[4]),lag_semanas:parseInt(r[5],10)||0};
      if(r[2]!=null&&String(r[2]).trim())patch.cor=String(r[2]).trim();
      var existing=byName[nome.toLowerCase()];
      if(existing){ await sbUpdateServico(existing.id,patch); updatedServ++; }
      else { await sbCreateServico(selectedObra.id,Object.assign({ordem:SERV.length+createdServ},patch)); createdServ++; }
    }
    await sbLoadCadastro(selectedObra.id); // recarrega com ids reais antes de gravar predecessores

    // 1b) Predecessores (precisa dos ids reais do banco, por isso roda depois do reload)
    if(wsServ){
      var byNameNow={}; SERV.forEach(function(s){byNameNow[s.n.trim().toLowerCase()]=s;});
      for(var pi=0;pi<servRows.length;pi++){
        var pr=servRows[pi]; if(!pr||!pr[0]||!pr[6])continue;
        var self=byNameNow[String(pr[0]).trim().toLowerCase()]; if(!self)continue;
        var predIds=String(pr[6]).split(';').map(function(n){return n.trim();}).filter(Boolean)
          .map(function(n){var p=byNameNow[n.toLowerCase()];return p?p.id:null;}).filter(Boolean);
        if(predIds.length){
          var cfg=Object.assign({},self.cfg,{predecessors:predIds});
          await sbUpdateServico(self.id,{config:cfg});
          self.cfg=cfg;
        }
      }
    }

    // 2) Lotes + quantidades — uma sheet só: Lote, Ordem, <serviço1>, <serviço2>...
    var createdLot=0, qtyCount=0;
    if(wsLot){
      var lotAoa=sheetRows(wsLot);
      if(lotAoa.length>1){
        var header=lotAoa[0], svcCols=header.slice(2).map(function(n){return String(n||'').trim();});
        var lotByName={}; LOTS.forEach(function(l,li){lotByName[l.trim().toLowerCase()]=li;});
        var rows=[];
        for(var j=1;j<lotAoa.length;j++){
          var row=lotAoa[j]; if(!row||row[0]==null||row[0]==='')continue;
          var lname=String(row[0]).trim(); if(!lname)continue;
          if(!lotByName.hasOwnProperty(lname.toLowerCase())){
            await sbCreateLote(selectedObra.id,{nome:lname,ordem:LOTS.length+createdLot+1});
            createdLot++;
          }
          rows.push(row);
        }
        if(createdLot>0)await sbLoadCadastro(selectedObra.id);
        var lotIdxByName={}; LOTS.forEach(function(l,li){lotIdxByName[l.trim().toLowerCase()]=li;});
        var svcIdxByName={}; SERV.forEach(function(s,si){svcIdxByName[s.n.trim().toLowerCase()]=si;});
        for(var k=0;k<rows.length;k++){
          var qrow=rows[k];
          var li2=lotIdxByName[String(qrow[0]).trim().toLowerCase()]; if(li2==null)continue;
          for(var c2=0;c2<svcCols.length;c2++){
            var si2=svcIdxByName[svcCols[c2].toLowerCase()]; if(si2==null)continue;
            var val=Number(qrow[c2+2]); if(!isFinite(val))continue;
            await sbUpsertQuantidade(selectedObra.id,window._LOTIDS[li2],SERV[si2].id,val,SERV[si2].u);
            qtyCount++;
          }
        }
        await sbLoadCadastro(selectedObra.id);
      }
    }

    // 3) Calendário — linha "Início" (data) + linha(s) "Paralisação"/"Paralisações" (início,fim)
    var calChanged=false;
    if(wsCal){
      var calPatch={};
      var feriadosSet={}; calHolidays().forEach(function(f){feriadosSet[f]=true;});
      sheetRows(wsCal).forEach(function(row){
        if(!row||!row[0])return;
        var label=String(row[0]).trim().toLowerCase();
        if(label.indexOf('inicio')===0||label.indexOf('início')===0){
          if(row[1])calPatch.data_inicio=excelDateToIso(row[1]);
        } else if(label.indexOf('paralisa')===0){
          if(row[1]){
            var s0=excelDateToIso(row[1]), s1=row[2]?excelDateToIso(row[2]):s0;
            expandRangeToMondays(s0,s1).forEach(function(iso){feriadosSet[iso]=true;});
          }
        }
      });
      var feriadosArr=Object.keys(feriadosSet).sort();
      if(calPatch.data_inicio||feriadosArr.length){
        calPatch.feriados={holidayWeeks:feriadosArr,rainPeriods:calRainPeriods()};
        await sbUpdateObra(selectedObra.id,calPatch);
        window._OBRA=Object.assign({},window._OBRA,calPatch);
        calChanged=true;
      }
    }

    go(current);
    toast('Importado: '+createdServ+' serviço(s) novo(s), '+updatedServ+' atualizado(s), '+createdLot+' lote(s) novo(s), '+qtyCount+' quantidade(s)'+(calChanged?', calendário atualizado':'')+'.');
  }

  function buildCalendarRows(totalWorkingWeeks){
    var holidays={}; calHolidays().forEach(function(h){holidays[mondayOfIso(h)]=true;});
    var start=new Date(TC_START()+'T00:00:00');
    var day=start.getDay(), diff=day===0?-6:1-day; start.setDate(start.getDate()+diff);
    var rows=[], cur=new Date(start), working=0, guard=0;
    while(working<totalWorkingWeeks&&guard++<3000){
      var iso=cur.toISOString().slice(0,10), isHol=!!holidays[iso];
      if(!isHol)working++;
      rows.push({date:new Date(cur),working:isHol?null:working,isHoliday:isHol});
      cur=new Date(cur); cur.setDate(cur.getDate()+7);
    }
    return rows;
  }

  function wireMatrixZoom(){

        if(act==='in')z=Math.min(1.6,+(z+0.1).toFixed(2));

          var wrap=document.getElementById('tcWrap');
          if(wrap){
            var table=wrap.querySelector('table');
            var containerW=wrap.parentElement?wrap.parentElement.clientWidth:0;
            var naturalW=table?table.scrollWidth/(window._matrixZoom||1):0;
            if(naturalW>0&&containerW>0)z=Math.max(0.4,Math.min(1.2,+(containerW/naturalW).toFixed(2)));
          }
        }
        window._matrixZoom=z;
        go(current);
      });
    });
    document.querySelectorAll('[data-svcvis]').forEach(function(cb){

  // Arraste: só reposiciona visualmente (transform) durante o movimento — não
  // reconstrói a tabela nem grava no banco a cada pixel. O ajuste só entra em
  // OVR (em memória) no soltar, e só vai pro Supabase quando clicar "Salvar".
  // Ghost solto (position:fixed) que "salta" pra célula alvo — o .tcm-seg
  // original nunca sai do DOM (só fica esmaecido), então o pointer capture
  // nunca se perde, mesmo re-renderizando a matriz depois de soltar.
  var _drag=null, _ghost=null;
  function dragCleanup(){
    if(_drag&&_drag.el){_drag.el.style.opacity='';}
    if(_ghost){_ghost.remove();_ghost=null;}
    if(_drag&&_drag.hlRow)_drag.hlRow.classList.remove('tcm-droprow');
    if(_drag&&_drag.hlCol)_drag.hlCol.classList.remove('tcm-dropcol');
  }
  function wireDragMatrix(){
    document.querySelectorAll('th[data-lotcol]').forEach(function(th){
      th.addEventListener('dragstart',function(e){ window._lotDragSrc=+th.getAttribute('data-lotcol'); try{e.dataTransfer.effectAllowed='move';}catch(err){} th.style.opacity='.5'; });
      th.addEventListener('dragend',function(){ th.style.opacity=''; });
      th.addEventListener('dragover',function(e){ e.preventDefault(); th.style.outline='2px dashed var(--accent)'; });
      th.addEventListener('dragleave',function(){ th.style.outline=''; });
      th.addEventListener('drop',function(e){
        e.preventDefault(); th.style.outline='';
        var src=window._lotDragSrc; window._lotDragSrc=null;
        var target=+th.getAttribute('data-lotcol');
        if(src!=null)reorderLote(src,target,renderCrono);
      });
    });
    document.querySelectorAll('.tcm-seg[data-li]').forEach(function(el){
      el.addEventListener('pointerdown',function(e){
        e.preventDefault();
        try{el.setPointerCapture(e.pointerId);}catch(err){}
        var li=+el.getAttribute('data-li'), si=+el.getAttribute('data-si');
        var seg=buildSchedule().filter(function(sg){return sg.li===li&&sg.si===si;})[0];
        if(!seg)return;
        var r=el.getBoundingClientRect();
        _ghost=document.createElement('div');
        _ghost.className='tcm-seg';
        _ghost.style.cssText='position:fixed;pointer-events:none;z-index:999;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;'+
          'background:'+seg.color+';color:'+pickFont(seg.color)+';border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:left .1s,top .1s,width .1s,height .1s;';
        _ghost.textContent=el.textContent;
        document.body.appendChild(_ghost);
        el.style.opacity='0.25';
        _drag={li:li,si:si,startWeek:seg.start,currentStart:seg.start,currentLi:li,el:el,hlRow:null,hlCol:null};
      });
      el.addEventListener('pointermove',function(e){
        if(!_drag||_drag.el!==el||!_ghost)return;
        var elAt=document.elementFromPoint(e.clientX,e.clientY);
        if(!elAt)return;
        var rowEl=elAt.closest('[data-week]'), lotEl=elAt.closest('[data-lot]');
        if(rowEl){var w=+rowEl.getAttribute('data-week'); if(w>0)_drag.currentStart=w;}
        if(lotEl){
          var li2=+lotEl.getAttribute('data-lot'); if(!isNaN(li2))_drag.currentLi=li2;
          var tr=lotEl.getBoundingClientRect();
          _ghost.style.left=tr.left+'px'; _ghost.style.top=tr.top+'px';
          _ghost.style.width=tr.width+'px'; _ghost.style.height=tr.height+'px';
        }
        if(_drag.hlRow&&_drag.hlRow!==rowEl)_drag.hlRow.classList.remove('tcm-droprow');
        if(rowEl){rowEl.classList.add('tcm-droprow'); _drag.hlRow=rowEl;}
        if(_drag.hlCol&&_drag.hlCol!==lotEl)_drag.hlCol.classList.remove('tcm-dropcol');
        if(lotEl){lotEl.classList.add('tcm-dropcol'); _drag.hlCol=lotEl;}
      });
      el.addEventListener('pointerup',function(e){
        if(!_drag||_drag.el!==el)return;
        try{el.releasePointerCapture(e.pointerId);}catch(err){}
        var d=_drag; dragCleanup(); _drag=null;
        var si=d.si, kOrig=ovrKey(d.li,si), changed=false;
        if(d.currentStart!==d.startWeek&&kOrig){
          OVR[kOrig]=Object.assign({},OVR[kOrig],{startWeek:d.currentStart});
          ADJ_PENDING[kOrig]=true;
          changed=true;
        }
        if(d.currentLi!==d.li){
          var kDst=ovrKey(d.currentLi,si);
          if(kOrig&&kDst){
            var segs=buildSchedule();
            var srcSeg=segs.filter(function(sg){return sg.li===d.li&&sg.si===si;})[0];
            var dstSeg=segs.filter(function(sg){return sg.li===d.currentLi&&sg.si===si;})[0];
            if(srcSeg&&dstSeg&&srcSeg.team!==dstSeg.team){
              OVR[kOrig]=Object.assign({},OVR[kOrig],{team:dstSeg.team});
              OVR[kDst]=Object.assign({},OVR[kDst],{team:srcSeg.team});
              ADJ_PENDING[kOrig]=true; ADJ_PENDING[kDst]=true;
              changed=true;
            }
          }
        }
        if(changed){ ADJ_DIRTY=true; renderCrono(); }
      });
      el.addEventListener('pointercancel',function(){
        if(!_drag||_drag.el!==el)return;
        dragCleanup(); _drag=null;
      });
      el.addEventListener('dblclick',function(){
        var li=+el.getAttribute('data-li'), si=+el.getAttribute('data-si');
        var k=ovrKey(li,si); if(!k||!OVR[k])return;
        delete OVR[k]; delete ADJ_PENDING[k]; ADJ_DIRTY=true; renderCrono();
      });
    });
  }

  function renderAssignPanel(){
    var p=document.getElementById('assignPanel');if(!p)return;
    if(!SERV.length){p.innerHTML='<div class="note">Cadastre um serviço primeiro.</div>';return;}
    var svcOpts=SERV.map(function(s,i){return '<option value="'+i+'">'+s.n+'</option>';}).join('');
    var si=window._tcAssignSvc||0, s=SERV[si]; if(!s){si=0;s=SERV[0];}
    var team=window._tcAssignTeam||1; if(team>s.eq)team=1;
    var teamOpts='';for(var t=1;t<=s.eq;t++)teamOpts+='<option value="'+t+'"'+(t===team?' selected':'')+'>Equipe '+t+'</option>';
    function lotTeams(li){
      var o=ovrGet(li,si);
      if(o&&Array.isArray(o.teams)&&o.teams.length)return o.teams.filter(function(t){return t>0&&t<=s.eq;});
      if(o&&o.team>0&&o.team<=s.eq)return [o.team];
      return [(li%s.eq)+1];
    }
    var chips=LOTS.map(function(l,li){
      if(QTY[li][si]<=0)return '';
      var curTeams=lotTeams(li);
      var mine=curTeams.indexOf(team)>=0;
      var others=curTeams.filter(function(t){return t!==team;});
      return '<label class="lotchip'+(mine?' on':' other')+'"><input type="checkbox" data-li="'+li+'"'+(mine?' checked':'')+'>'+l+(others.length?' <span style="font-size:10px">(+eq.'+others.join(', ')+')</span>':'')+'</label>';
    }).join('');
    var seqItems=[];
    LOTS.forEach(function(l,li){
      if(QTY[li][si]<=0)return;
      if(lotTeams(li).indexOf(team)<0)return;
      var o=ovrGet(li,si);
      seqItems.push({li:li,seq:(o&&o.seq!=null)?o.seq:li});
    });
    seqItems.sort(function(a,b){return a.seq-b.seq;});
    var seqRows=seqItems.map(function(item,idx){
      var others=lotTeams(item.li).filter(function(t){return t!==team;});
      return '<div class="seqrow" draggable="true" data-seqli="'+item.li+'" style="cursor:grab" title="Arraste pra reordenar"><span style="opacity:.4;font-weight:700">⋮</span><span class="seqnum">'+(idx+1)+'</span><span class="seqname">'+LOTS[item.li]+(others.length?' <span style="font-size:10px;color:var(--muted)">(dividido c/ eq.'+others.join(', ')+')</span>':'')+'</span>'+
        '<span class="seqbtns"><button class="iconbtn" data-squp="'+item.li+'" title="Executar antes"'+(idx===0?' disabled':'')+'>↑</button>'+
        '<button class="iconbtn" data-sqdn="'+item.li+'" title="Executar depois"'+(idx===seqItems.length-1?' disabled':'')+'>↓</button></span></div>';
    }).join('');

  async function progCarregar(planoId){
    if(!selectedObra)return;
    PROG_ERRO=''; PROG_CARREGANDO=true; if(current==='lp-semana')go('lp-semana');
    try{
      PROG_PLANOS=await sbProgPlanos(selectedObra.id);
      if(!PROG_CAUSAS.length)PROG_CAUSAS=await sbProgCausas(selectedObra.id);
      PROG_PLANO=planoId?(PROG_PLANOS.filter(function(p){return p.id===planoId;})[0]||null):(PROG_PLANOS[0]||null);
      PROG_ITENS=PROG_PLANO?await sbProgItens(PROG_PLANO.id):[];
    }catch(e){ PROG_ERRO=(e&&e.message)||String(e); }
    PROG_CARREGANDO=false; PROG_LIDO=true;
    if(current==='lp-semana')go('lp-semana');
  }
  function progNovaSemana(){
    var tw=1; try{ buildSchedule().forEach(function(sg){ tw=Math.max(tw,sg.start+sg.dur-1); }); }catch(e){}
    tw=Math.max(tw,1);
    var hoje=hojeWeekNumber(tw)||1;
    var jaTem={}; PROG_PLANOS.forEach(function(p){ jaTem[p.data_inicio]=1; });
    var opts='';
    for(var w=1;w<=tw;w++){
      var info=progSemanaInfo(w), usada=!!jaTem[info.ini];
      opts+='<option value="'+w+'"'+(usada?' disabled':'')+(w===hoje&&!usada?' selected':'')+'>'+
        escAttr(info.rotulo)+(usada?' — já programada':'')+(w===hoje?'  ← semana atual':'')+'</option>';
    }
    var back=document.createElement('div'); back.className='segmenu-backdrop';
    back.innerHTML='<div class="segmenu-panel card" style="max-width:460px">'+
      '<div class="eyebrow" style="margin-bottom:2px">Nova semana de programação</div>'+
      '<div class="note" style="margin-bottom:10px">Escolha a semana do cronograma. As semanas já programadas aparecem desabilitadas.</div>'+
      '<select class="esel" id="progNovaSel" size="12" style="width:100%;height:auto">'+opts+'</select>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">'+
        '<button class="btn" id="progNovaCancel">Cancelar</button>'+
        '<button class="btn primary" id="progNovaOk">Criar programação</button></div></div>';
    document.body.appendChild(back);
    var sel=back.querySelector('#progNovaSel');
    if(sel&&sel.selectedIndex<0)sel.selectedIndex=Math.max(0,Math.min(sel.options.length-1,hoje-1));
    try{ if(sel&&sel.options[sel.selectedIndex])sel.options[sel.selectedIndex].scrollIntoView({block:'center'}); }catch(e){}
    function fechar(){ back.remove(); }
    back.addEventListener('pointerdown',function(ev){ if(ev.target===back)fechar(); });
    back.querySelector('#progNovaCancel').addEventListener('click',fechar);
    back.querySelector('#progNovaOk').addEventListener('click',async function(){
      var w2=+sel.value; if(!w2)return;
      var info2=progSemanaInfo(w2);
      if(jaTem[info2.ini]){ alert('Essa semana já está programada.'); return; }
      fechar();
      try{ var id=await sbProgCriarPlano(selectedObra.id,info2.iso,info2.ini,info2.fim); await progCarregar(id); toast('Programação da '+info2.rotulo+' criada.'); }
      catch(e){ alert('Falha ao criar a semana: '+((e&&e.message)||e)); }
    });
    sel.addEventListener('dblclick',function(){ back.querySelector('#progNovaOk').click(); });
  }
  async function progPuxarSugestoes(){
    if(!PROG_PLANO)return;
    var w=progSemanaDoPlano(PROG_PLANO);
    if(!w){ alert('Não consegui situar essa semana no cronograma.'); return; }
    var sug=progSugestoes(w);
    if(!sug.length){ alert('O cronograma não prevê nada pra esta semana.'); return; }
    var jaTem={};
    PROG_ITENS.forEach(function(it){ jaTem[(it.servico_id||'')+'|'+(it.etapa||'')+'|'+(it.lote_id||'')+'|'+(it.lote_fim_id||'')]=1; });
    var novos=sug.filter(function(s){ return !jaTem[(s.servico_id||'')+'|'+(s.etapa||'')+'|'+(s.lote_id||'')+'|'+(s.lote_fim_id||'')]; });
    if(!novos.length){ alert('As sugestões desta semana já estão na programação.'); return; }
    if(!confirm('Trazer '+novos.length+' linha(s) sugerida(s) pelo cronograma? Elas viram linhas normais da programação — dá pra editar ou apagar depois.'))return;
    try{
      var base=PROG_ITENS.length;
      for(var i=0;i<novos.length;i++){
        await sbProgSalvarItem(Object.assign({id:newUuid(),obra_id:selectedObra.id,plano_id:PROG_PLANO.id,status:'planejado',ordem:base+i},novos[i]));
      }
      await progCarregar(PROG_PLANO.id); toast(novos.length+' sugestão(ões) adicionada(s).');
    }catch(e){ alert('Falha ao trazer as sugestões: '+((e&&e.message)||e)); }
  }
  async function progAddLinha(){
    if(!PROG_PLANO)return;
    try{
      await sbProgSalvarItem({id:newUuid(),obra_id:selectedObra.id,plano_id:PROG_PLANO.id,origem:'manual',
        status:'planejado',ordem:PROG_ITENS.length,etapa:'',grupo:'',detalhamento:''});
      await progCarregar(PROG_PLANO.id);
    }catch(e){ alert('Falha ao incluir: '+((e&&e.message)||e)); }
  }
  function wireProg(){
    var sel=document.getElementById('progSel');
    if(sel)sel.addEventListener('change',function(){ progCarregar(sel.value); });
    var nova=document.getElementById('progNova'); if(nova)nova.addEventListener('click',progNovaSemana);
    var pux=document.getElementById('progPuxar'); if(pux)pux.addEventListener('click',progPuxarSugestoes);
    var add=document.getElementById('progAdd'); if(add)add.addEventListener('click',progAddLinha);
    var chave=document.getElementById('progSemChave');
    if(chave)chave.addEventListener('click',function(){ PROG_SEM_ABERTA=!PROG_SEM_ABERTA; go('lp-semana'); });
    document.querySelectorAll('[data-pgrupo]').forEach(function(b){
      b.addEventListener('click',function(){
        var g=b.getAttribute('data-pgrupo');
        PROG_GRUPO_FECHADO[g]=!PROG_GRUPO_FECHADO[g];
        go('lp-semana');
      });
    });
    document.querySelectorAll('[data-pitem]').forEach(function(el){
      el.addEventListener('change',async function(){
        var id=el.getAttribute('data-pitem'), campo=el.getAttribute('data-pcampo');
        var it=PROG_ITENS.filter(function(x){return x.id===id;})[0]; if(!it)return;
        var v=el.value;
        if(campo==='quantidade_prevista'||campo==='quantidade_realizada')v=(v===''?null:Math.max(0,parseFloat(v)||0));
        if(campo==='servico_id'||campo==='lote_id'||campo==='lote_fim_id'||campo==='causa_id')v=v||null;
        it[campo]=v;
        if(campo==='status'&&v!=='nao_concluido'&&v!=='parcial')it.causa_id=null;
        try{
          await sbProgSalvarItem({id:it.id,obra_id:selectedObra.id,plano_id:PROG_PLANO.id,servico_id:it.servico_id||null,etapa:it.etapa||null,
            grupo:it.grupo||null,lote_id:it.lote_id||null,lote_fim_id:it.lote_fim_id||null,detalhamento:it.detalhamento||null,
            quantidade_prevista:it.quantidade_prevista,quantidade_realizada:it.quantidade_realizada,status:it.status||'planejado',
            causa_id:it.causa_id||null,origem:it.origem||'manual',ordem:it.ordem||0,descricao:progNomeItem(it)});
          if(campo==='status')go('lp-semana');
        }catch(e){ alert('Falha ao salvar: '+((e&&e.message)||e)); }
      });
    });
    document.querySelectorAll('[data-pdel]').forEach(function(b){
      b.addEventListener('click',async function(){
        if(!confirm('Excluir esta linha da programação?'))return;
        try{ await sbProgApagarItem(b.getAttribute('data-pdel')); await progCarregar(PROG_PLANO.id); }
        catch(e){ alert('Falha ao excluir: '+((e&&e.message)||e)); }
      });
    });
  }

  /* ---- Produção Diária: lista / tempo-caminho / matriz de estacas ---- */
  window._prodMode=window._prodMode||'lista';
  window.PROD_LIST=window.PROD_LIST||[]; // {id,data,servId,loteId,qtd} — persistido em producao_diaria
  var EST_OPEN={}; // {li: true} — quais lotes estão expandidos na Matriz de estacas
  function estLabel(loteNum,distM){ var d=Math.round(Number(distM)||0); return loteNum+'+'+(''+d).padStart(3,'0'); }
  function loteIdOfEstaca(estacaId){
    var ids=Object.keys(ESTACAS);
    for(var i=0;i<ids.length;i++){ if((ESTACAS[ids[i]]||[]).some(function(e){return e.id===estacaId;}))return ids[i]; }
    return null;
  }
  /** Controle de produção por estaca — quantidades (corte/aterro/CFT/base...) e avanço (início/
   * término por serviço), dentro de cada lote. Não interfere no cronograma: as quantidades por
   * estaca só somam pra virar a quantidade do lote inteiro (a mesma usada no Tempo-Caminho), e
   * o avanço só alimenta o "realizado" (producao_diaria) que já move a Curva S. Todos os lotes
   * aparecem como grupos recolhíveis — clique no lote pra abrir as estacas dele. */
  /* ---------- Importar o "Informes de produção" ----------
   * A planilha da obra tem uma linha por estaca de 20m e, por serviço, um par Início/Término.
   * O cabeçalho vem em três andares: macro-item da EAP (2 Terraplenagem), código do cronograma
   * contratual (T02, T02.2…) e o item (2.1 Corte). A linha de baixo traz INÍCIO / TÉRMINO.
   *
   * ATENÇÃO ao que a planilha representa: ela controla a OBRA TODA, enquanto o app planeja só
   * o SALDO de serviço. Por isso o volume importado vai pra estaca_quantidades.volume_projeto
   * e nunca pra quantidade — se fosse pra quantidade, somaria em lote_servico e o Tempo-Caminho
   * passaria a ser recalculado sobre o escopo inteiro, inflando prazo e histograma.
   *
   * O que entra: estaca (KM + offset), largura, "nomenclatura de acessos", as datas, e o volume
   * de projeto por serviço — corte/rebaixo/aterro vêm das colunas de volume; as camadas de
   * pavimento saem de largura × espessura × espaçamento.
   *
   * Lote = KM. Só entra em lote que JÁ existe no app: criar lote mexe na matriz do
   * Tempo-Caminho, e isso não pode acontecer de surpresa dentro de uma importação. */
  function estNorm(v){ return String(v==null?'':v).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim(); }
  function estAchaCol(h,regexes){
    for(var j=0;j<regexes.length;j++)
      for(var i=0;i<h.length;i++)
        if(regexes[j].test(h[i]))return i;
    return -1;
  }
  function importarInformesArquivo(){
    if(!selectedObra){ alert('Abra uma obra antes de importar.'); return; }
    if(isReadOnly()){ alert('Seu perfil é só de visualização.'); return; }
    pickExcelFile(function(file){
      readWorkbookFile(file).then(importarInformesWorkbook).catch(function(e){
        alert('Não consegui ler o arquivo: '+((e&&e.message)||e));
      });
    });
  }
  async function importarInformesWorkbook(wb){
    // 1) acha a aba e a linha de cabeçalho (a que tem ESTACAS e os itens da EAP)
    var aoa=null,hdr=-1;
    for(var n=0;n<wb.SheetNames.length&&hdr<0;n++){
      var linhas=sheetRows(wb.Sheets[wb.SheetNames[n]]);
      for(var i=0;i<Math.min(linhas.length,20);i++){
        var h=(linhas[i]||[]).map(estNorm);
        if(estAchaCol(h,[/^ESTACAS?$/])>=0 && estAchaCol(h,[/^KM$/])>=0 && estAchaCol(h,[/LARGURA/])>=0){ aoa=linhas; hdr=i; break; }
      }
    }
    if(hdr<0){ alert('Não achei o cabeçalho.\n\nPreciso de uma aba com as colunas ESTACAS, KM e Largura, e os serviços com INÍCIO/TÉRMINO logo abaixo.'); return; }
    var hItens=(aoa[hdr]||[]).map(estNorm);
    var hSub  =(aoa[hdr+1]||[]).map(estNorm);
    var hCod  =hdr>0?(aoa[hdr-1]||[]).map(estNorm):[];
    var hGrupo=hdr>1?(aoa[hdr-2]||[]).map(estNorm):[];
    // Cada camada tem a espessura numa coluna própria; o item correspondente é reconhecido
    // pelo nome. Corte/rebaixo/aterro não têm espessura — o volume vem pronto da cubação.
    var CAMADAS=[
      {esp:/1.? CFT SOLO/,    item:/CFT 0?1/},
      {esp:/2.? CFT RACHAO/,  item:/CFT 0?2/},
      {esp:/3.? CFT RACHAO/,  item:/CFT 0?3/},
      {esp:/MACADAME/,        item:/SUB.?BASE/},
      {esp:/BGS BASE/,        item:/^\s*[\d.]*\s*BASE$/},
      {esp:/BGTC BASE/,       item:/^\s*[\d.]*\s*BASE$/},
      {esp:/ALTURA CBUQ/,     item:/CBUQ/},
      {esp:/PAV.? RIGIDO/,    item:/PAVIMENTO RIGIDO/}
    ];
    var col={
      km:      estAchaCol(hItens,[/^KM$/]),
      estaca:  estAchaCol(hItens,[/^ESTACAS?$/]),
      acesso:  estAchaCol(hItens,[/NOMECLATURA|NOMENCLATURA/]),
      largura: estAchaCol(hItens,[/^LARGURA$/])
    };
    // CORTE / REBAIXO / ATERRO ficam na linha de baixo, sob "VOLUMES DE PROJETO"
    var volIni=estAchaCol(hItens,[/VOLUMES DE PROJETO/]);
    var cCorte=-1,cReb=-1,cAter=-1;
    if(volIni>=0){
      for(var k=volIni;k<Math.min(volIni+6,hSub.length);k++){
        if(/^CORTE$/.test(hSub[k]))cCorte=k;
        else if(/^REBAIXO$/.test(hSub[k]))cReb=k;
        else if(/^ATERRO$/.test(hSub[k]))cAter=k;
      }
    }
    // 2) serviços: o bloco CONTÍNUO de pares INÍCIO/TÉRMINO. Para no primeiro par que falha —
    // depois do bloco a planilha repete nomes de item (volumes, comparativo) e traz um
    // totalizador do grupo ("2. Terraplenagem", em vermelho) que também tem par de datas mas
    // NÃO é serviço: contá-lo duplicaria o avanço da terraplanagem inteira.
    var servCols=[], ini=-1;
    for(var j0=0;j0<hSub.length;j0++){
      if(/^INICIO$/.test(hSub[j0]||'')&&/^TERMINO$/.test(hSub[j0+1]||'')){ ini=j0; break; }
    }
    for(var j=ini;ini>=0&&j<hItens.length;j+=2){
      if(!/^INICIO$/.test(hSub[j]||'')||!/^TERMINO$/.test(hSub[j+1]||''))break;
      if(!hItens[j])continue;
      var achaAcima=(function(jj){ return function(linha){
        for(var x=jj;x>=Math.max(0,jj-12);x--) if(linha[x])return linha[x];
        return '';
      };})(j);
      servCols.push({c:j,nome:String(aoa[hdr][j]).trim(),
        codigo:(hCod.length?achaAcima(hCod):'').replace(/^.*-->\s*/,''),
        grupo:(hGrupo.length?achaAcima(hGrupo):'')});
    }
    if(!servCols.length){ alert('Não achei nenhum serviço com o par INÍCIO / TÉRMINO.'); return; }
    // Depois do bloco de datas a planilha repete o nome do item numa coluna com o REALIZADO
    // daquela estaca. É de lá que sai o avanço volumétrico — ele não é derivável das datas,
    // porque uma estaca pode estar 95% cortada sem ter término.
    var ehServ={}; servCols.forEach(function(x){ ehServ[x.c]=1; ehServ[x.c+1]=1; });
    var realCol={};
    servCols.forEach(function(sv){
      var alvo=estNorm(sv.nome);
      for(var j=0;j<hItens.length;j++){
        if(j===sv.c||ehServ[j])continue;
        if(hItens[j]===alvo){ realCol[sv.c]=j; break; }
      }
    });

    // 3) linhas de dados agrupadas por KM
    var porKm={}, semKm=0, linhasOk=0;
    // espaçamento das estacas: lido das próprias distâncias da planilha (20m na obra)
    var espacPadrao=20;
    (function(){
      var ds=[];
      for(var L2=hdr+2;L2<Math.min(hdr+12,aoa.length);L2++){
        var v2=(aoa[L2]||[])[col.estaca]; if(v2!=null&&v2!=='')ds.push(Number(v2));
      }
      for(var i2=1;i2<ds.length;i2++){ var d2=ds[i2]-ds[i2-1]; if(d2>0){ espacPadrao=d2; break; } }
    })();
    for(var L=hdr+2;L<aoa.length;L++){
      var row=aoa[L]||[];
      var km=col.km>=0?String(row[col.km]==null?'':row[col.km]).trim():'';
      var est=col.estaca>=0?row[col.estaca]:null;
      if(!km||est==null||est===''){ if(km||est!=null&&est!=='')semKm++; continue; }
      var dist=Number(est); if(!isFinite(dist))continue;
      linhasOk++;
      var larg=col.largura>=0?Number(row[col.largura])||null:null;
      var reg={dist:Math.round(dist),
        largura:larg,
        acesso:col.acesso>=0?(String(row[col.acesso]==null?'':row[col.acesso]).trim()||null):null,
        corte:cCorte>=0?Number(row[cCorte])||null:null,
        rebaixo:cReb>=0?Number(row[cReb])||null:null,
        aterro:cAter>=0?Number(row[cAter])||null:null,
        vols:{}, reals:{}, datas:{}};
      servCols.forEach(function(sv){
        var nm=estNorm(sv.nome), v=null;
        if(/CORTE REBAIXO/.test(nm))v=reg.rebaixo;
        else if(/CORTE/.test(nm))v=reg.corte;
        else if(/ATERRO/.test(nm))v=reg.aterro;
        else {
          var soma=0, achou=false;
          CAMADAS.forEach(function(cm){
            if(!cm.item.test(nm))return;
            var ce=estAchaCol(hItens,[cm.esp]); if(ce<0)return;
            var e=Number(row[ce]); if(!isFinite(e)||e<=0)return;
            if(larg&&larg>0){ soma+=larg*e*espacPadrao; achou=true; }
          });
          if(achou)v=soma;
        }
        if(v!=null&&isFinite(v)&&v>0)reg.vols[sv.c]=v;
        var cr=realCol[sv.c];
        if(cr!=null){ var vr=Number(row[cr]); if(isFinite(vr)&&vr>0)reg.reals[sv.c]=vr; }
      });
      servCols.forEach(function(s){
        var a=excelDateToIso(row[s.c]), b=excelDateToIso(row[s.c+1]);
        var ini=/^\d{4}-\d{2}-\d{2}$/.test(a)?a:'', fim=/^\d{4}-\d{2}-\d{2}$/.test(b)?b:'';
        if(ini||fim)reg.datas[s.c]={inicio:ini,fim:fim};
      });
      (porKm[km]||(porKm[km]=[])).push(reg);
    }
    var kms=Object.keys(porKm).sort();
    if(!kms.length){ alert('Nenhuma linha com KM e estaca preenchidos.'); return; }

    // 4) de-para: KM -> lote existente, e serviço da planilha -> serviço do app
    var loteDe={}, kmSemLote=[];
    var porNome={}, porNum={};
    (window._LOTIDS||[]).forEach(function(id,i){
      porNome[estNorm(LOTS[i])]=id;
      var m=/(\d+)/.exec(LOTS[i]||''); if(m&&!porNum[m[1]])porNum[m[1]]=id;   // "KM 248" / "Lote 248" -> 248
    });
    kms.forEach(function(km){
      var id=porNome[estNorm(km)];
      if(!id&&!/[A-Z]/.test(estNorm(km))){ var m2=/(\d+)/.exec(km); if(m2)id=porNum[m2[1]]; }
      if(id)loteDe[km]=id; else kmSemLote.push(km);
    });
    var servDe={}, servSemPar=[];
    var svcPorCodigo={}, svcPorNome={};
    SERV.forEach(function(s){ if(s.codigo)svcPorCodigo[estNorm(s.codigo)]=s.id; svcPorNome[estNorm(s.n)]=s.id; });
    // O código da EAP é mais grosso que o item: na planilha, T04 cobre "2.2.1 CFT 01" e
    // "2.2.2 CFT 02" ao mesmo tempo. Então o nome manda, e o código só vale quando aparece
    // uma única vez — senão dois serviços diferentes cairiam no mesmo do app.
    var vezesCod={}; servCols.forEach(function(s){ var k=estNorm(s.codigo); if(k)vezesCod[k]=(vezesCod[k]||0)+1; });
    servCols.forEach(function(s){
      var semNum=estNorm(s.nome.replace(/^[\d.]+\s*/,''));
      var alvo=svcPorNome[estNorm(s.nome)]||svcPorNome[semNum];
      if(!alvo&&s.codigo&&vezesCod[estNorm(s.codigo)]===1)alvo=svcPorCodigo[estNorm(s.codigo)];
      if(alvo)servDe[s.c]=alvo; else servSemPar.push(s);
    });

    var escolha=await estDialogoImport({kms:kms,porKm:porKm,servCols:servCols,loteDe:loteDe,
      kmSemLote:kmSemLote,servDe:servDe,servSemPar:servSemPar,linhasOk:linhasOk});
    if(!escolha)return;
    Object.keys(escolha.servDe).forEach(function(c){ if(escolha.servDe[c])servDe[c]=escolha.servDe[c]; else delete servDe[c]; });

    // 5) grava: estacas primeiro (sem repetir as que já existem), depois os apontamentos
    var novasEst=0, novosAp=0, novosVol=0, pulados=0;
    cargaMais();
    try{
      for(var ki=0;ki<kms.length;ki++){
        var km=kms[ki], loteId=loteDe[km];
        if(!loteId){ pulados+=porKm[km].length; continue; }
        if(!ESTACAS[loteId])await sbLoadEstacas(loteId);
        var existe={}; (ESTACAS[loteId]||[]).forEach(function(e){ existe[Math.round(e.dist)]=e.id; });
        var criar=porKm[km].filter(function(r){ return !existe[r.dist]; }).map(function(r){
          return {id:newUuid(),obra_id:selectedObra.id,lote_id:loteId,numero:r.dist,distancia_m:r.dist,
                  largura_m:r.largura,acesso:r.acesso,vol_corte:r.corte,vol_rebaixo:r.rebaixo,vol_aterro:r.aterro};
        });
        for(var ci=0;ci<criar.length;ci+=400){
          var rr=await SB.from('lote_estacas').insert(criar.slice(ci,ci+400));
          if(rr.error)throw rr.error;
        }
        criar.forEach(function(c){ existe[c.numero]=c.id; });
        novasEst+=criar.length;
        // apontamentos
        var aps=[], vols=[];
        porKm[km].forEach(function(r){
          var eid=existe[r.dist]; if(!eid)return;
          Object.keys(r.datas).forEach(function(c){
            var sid=servDe[c]; if(!sid)return;
            aps.push({id:newUuid(),obra_id:selectedObra.id,lote_id:loteId,estaca_id:eid,servico_id:sid,
                      data_inicio:r.datas[c].inicio||null,data_fim:r.datas[c].fim||null});
          });
          var cs={}; Object.keys(r.vols).forEach(function(c){cs[c]=1;}); Object.keys(r.reals).forEach(function(c){cs[c]=1;});
          Object.keys(cs).forEach(function(c){
            var sid=servDe[c]; if(!sid)return;
            // projeto e realizado só: quantidade e lote_servico são do planejamento do saldo
            vols.push({id:newUuid(),obra_id:selectedObra.id,lote_id:loteId,estaca_id:eid,servico_id:sid,
                       volume_projeto:r.vols[c]!=null?r.vols[c]:null,
                       volume_realizado:r.reals[c]!=null?r.reals[c]:null});
          });
        });
        for(var ai=0;ai<aps.length;ai+=400){
          var ra=await SB.from('estaca_apontamentos').upsert(aps.slice(ai,ai+400),{onConflict:'estaca_id,servico_id'});
          if(ra.error)throw ra.error;
        }
        for(var vi=0;vi<vols.length;vi+=400){
          var rv=await SB.from('estaca_quantidades').upsert(vols.slice(vi,vi+400),{onConflict:'estaca_id,servico_id'});
          if(rv.error)throw rv.error;
        }
        novosAp+=aps.length; novosVol+=vols.length;
        delete ESTACAS[loteId];   // força recarregar com o que entrou
      }
    }catch(e){
      alert('Falha na importação: '+((e&&e.message)||e)+'\n\nSe fala em coluna que não existe, rode sql/29_estacas_geometria.sql no Supabase.');
      return;
    } finally { cargaMenos(); }
    renderProd();
    alert(novasEst+' estaca(s) criadas, '+novosAp+' apontamento(s) e '+novosVol+' linha(s) de volume gravadas.'+
      (pulados?'\n\n'+pulados+' linha(s) ficaram de fora: o KM não tem lote correspondente no app.':''));
  }
  /** Resumo antes de gravar: o que casou, o que não casou e o de-para dos serviços que faltam. */
  function estDialogoImport(info){
    return new Promise(function(resolve){
      var back=document.createElement('div'); back.className='segmenu-backdrop';
      var nDatas=0,nVols=0,nReal=0;
      info.kms.forEach(function(km){ info.porKm[km].forEach(function(r){
        nDatas+=Object.keys(r.datas).length; nVols+=Object.keys(r.vols||{}).length;
        nReal+=Object.keys(r.reals||{}).length; }); });
      var kmOk=info.kms.length-info.kmSemLote.length;
      // A lista traz TODOS os serviços da planilha, não só os que ficaram sem par: ver só os
      // pendentes dava a impressão de que os outros tinham sido pulados. Quem já casou vem com
      // o serviço do app selecionado e marcado com ✓ — e dá pra corrigir ali mesmo se o
      // casamento automático errou.
      var opt=function(sel){
        return '<option value="">— ignorar —</option>'+SERV.map(function(s){
          return '<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+escAttr(s.n)+'</option>';
        }).join('');
      };
      var linhasDe=info.servCols.map(function(s){
        var alvo=info.servDe[s.c]||'';
        return '<tr'+(alvo?'':' style="background:var(--warn-bg)"')+'>'+
          '<td style="white-space:nowrap">'+(alvo?'<span style="color:var(--good)">✓</span> ':'<span style="color:var(--warn)">•</span> ')+
            escAttr(s.nome)+(s.codigo?' <span class="note">'+escAttr(s.codigo)+'</span>':'')+'</td>'+
          '<td><select class="esel" data-estdepara="'+s.c+'" style="max-width:260px">'+opt(alvo)+'</select></td></tr>';
      }).join('');
      back.innerHTML='<div class="segmenu-panel card" style="max-width:680px;max-height:86vh;overflow:auto">'+
        '<div class="eyebrow" style="margin-bottom:2px">Importar informes de produção</div>'+
        '<div class="note" style="margin-bottom:12px"><b>'+info.linhasOk+'</b> estacas e <b>'+nDatas+'</b> apontamentos de data na planilha. Nada é gravado até você confirmar.</div>'+
        '<div class="note"><b>'+kmOk+'</b> de '+info.kms.length+' KMs têm lote correspondente no app.'+
          (info.kmSemLote.length?' Sem lote (ficam de fora): <b>'+escAttr(info.kmSemLote.join(', '))+'</b> — crie esses lotes antes se quiser importá-los.':'')+'</div>'+
        '<div class="note" style="margin-top:6px"><b>'+(info.servCols.length-info.servSemPar.length)+'</b> de '+info.servCols.length+' serviços casaram automaticamente (por código da EAP ou nome).</div>'+
        (linhasDe?'<div class="eyebrow" style="margin:14px 0 6px">Serviços da planilha ('+info.servCols.length+') — <span class="note">✓ já casou · • precisa escolher</span></div>'+
          '<div class="tbl-wrap" style="max-height:290px;overflow:auto"><table class="edtbl" style="min-width:0"><thead><tr><th>Na planilha</th><th>Serviço do app</th></tr></thead><tbody>'+linhasDe+'</tbody></table></div>':'')+
        '<div class="note" style="margin-top:6px"><b>'+nVols+'</b> volumes de projeto e <b>'+nReal+'</b> volumes realizados.</div>'+
        '<div class="banner" style="margin-top:12px">Os volumes entram como <b>volume de projeto</b> — o escopo da obra toda, que é o que a planilha controla. '+
        'A <b>quantidade</b> que o Tempo-Caminho usa continua sendo a do planejamento do saldo e não é tocada por esta importação.</div>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">'+
          '<button class="btn" id="estImpCancel">Cancelar</button>'+
          '<button class="btn primary" id="estImpOk">Importar</button></div></div>';
      document.body.appendChild(back);
      function fim(v){ back.remove(); resolve(v); }
      back.addEventListener('pointerdown',function(e){ if(e.target===back)fim(null); });
      back.querySelector('#estImpCancel').addEventListener('click',function(){ fim(null); });
      back.querySelector('#estImpOk').addEventListener('click',function(){
        var mapa={};
        back.querySelectorAll('[data-estdepara]').forEach(function(sel){ mapa[sel.getAttribute('data-estdepara')]=sel.value||''; });
        fim({servDe:mapa});
      });
    });
  }

  /* ---------- Resumo de produção por serviço ----------
   * Duas leituras, lado a lado, porque elas respondem perguntas diferentes e uma não substitui
   * a outra:
   *   EXTENSÃO  — estacas com término ÷ estacas onde o serviço se aplica. É o que casa com o
   *               cronograma, porque estaca é estaca nos dois lados.
   *   VOLUME    — realizado ÷ projeto, da planilha de controle. Mede o esforço de verdade, mas
   *               é do escopo da obra toda, então NÃO se compara com a quantidade planejada.
   * Onde a seção é constante (camadas de pavimento) as duas dão o mesmo número; na terraplanagem
   * elas divergem, e é justamente aí que o resumo vale. */
  var EST_RES_CARREGANDO=false;
  async function estCarregarTudo(){
    if(EST_RES_CARREGANDO)return;
    EST_RES_CARREGANDO=true; renderProd(); cargaMais();
    try{
      var ids=(window._LOTIDS||[]);
      for(var i=0;i<ids.length;i++){ if(!ESTACAS[ids[i]])await sbLoadEstacas(ids[i]); }
    }catch(e){ toast('Falha ao carregar: '+((e&&e.message)||e)); }
    finally{ cargaMenos(); }
    EST_RES_CARREGANDO=false; renderProd();
  }
  function estResumoHTML(){
    var ids=(window._LOTIDS||[]), carregados=ids.filter(function(id){return !!ESTACAS[id];});
    var cab='<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">'+
      '<div><div class="eyebrow" style="margin:0">Resumo de produção</div>'+
      '<div class="note">Extensão sai das datas; volume sai do que foi lançado como executado. Os dois são registros independentes.</div></div>'+
      (carregados.length<ids.length
        ? '<button class="btn" id="estCarregaTudo"'+(EST_RES_CARREGANDO?' disabled':'')+'>'+(EST_RES_CARREGANDO?'Carregando…':('Carregar os '+ids.length+' lotes'))+'</button>'
        : '<span class="note">'+ids.length+' lote(s) carregados</span>')+'</div>';
    if(!carregados.length)return '<div class="card" style="margin-bottom:10px">'+cab+
      '<div class="note" style="margin-top:10px">Abra um lote abaixo, ou carregue todos, pra ver o resumo.</div></div>';
    var espac=LOTE_ESPAC[0]||20;
    var linhas=SERV.map(function(sv){
      var nTot=0,nFim=0,proj=0,real=0;
      carregados.forEach(function(loteId){
        var vol=ESTACA_VOL[loteId]||{}, ap=ESTACA_AVANCO[loteId]||{};
        (ESTACAS[loteId]||[]).forEach(function(e){
          var k=e.id+'::'+sv.id, v=vol[k];
          var aplica=!!(v&&((v.proj||0)>0||(v.real||0)>0));
          if(!aplica)return;              // sem volume de projeto = o serviço não existe nesta estaca
          nTot++; proj+=v.proj||0; real+=v.real||0;
          if((ap[k]||{}).fim)nFim++;
        });
      });
      if(!nTot)return '';
      var pl=nTot?100*nFim/nTot:0, pv=proj?100*real/proj:0;
      var div=Math.abs(pl-pv)>=5;
      return '<tr><td>'+escAttr(sv.n)+'</td>'+
        '<td class="r mono">'+fmtBR(nTot*espac)+' m</td>'+
        '<td class="r mono">'+fmtBR(nFim*espac)+' m</td>'+
        '<td class="r mono" style="font-weight:700">'+pl.toFixed(1)+'%</td>'+
        '<td class="r mono">'+fmtBR(proj)+'</td>'+
        '<td class="r mono">'+fmtBR(real)+'</td>'+
        '<td class="r mono" style="font-weight:700'+(div?';color:var(--warn)':'')+'">'+pv.toFixed(1)+'%</td>'+
        '<td class="r mono">'+fmtBR(proj-real)+'</td></tr>';
    }).filter(Boolean).join('');
    if(!linhas)return '<div class="card" style="margin-bottom:10px">'+cab+
      '<div class="note" style="margin-top:10px">Nenhuma estaca com volume de projeto. Importe os informes de produção.</div></div>';
    return '<div class="card" style="margin-bottom:10px">'+cab+
      '<div class="tbl-wrap" style="margin-top:10px"><table class="edtbl" style="font-size:12.5px">'+
      '<thead><tr><th rowspan="2">Serviço</th><th colspan="3" class="r">Extensão (das datas)</th>'+
      '<th colspan="4" class="r">Volume (do executado)</th></tr>'+
      '<tr><th class="r">Aplicável</th><th class="r">Concluída</th><th class="r">%</th>'+
      '<th class="r">Projeto</th><th class="r">Realizado</th><th class="r">%</th><th class="r">Saldo</th></tr></thead>'+
      '<tbody>'+linhas+'</tbody></table></div>'+
      '<div class="note" style="margin-top:8px">O <b>Saldo</b> é projeto − realizado: é ele que deveria bater com a quantidade cadastrada no planejamento. '+
      'Em amarelo, os serviços onde extensão e volume contam histórias diferentes.</div></div>';
  }

    return '<div class="tbl-wrap est-compact"><table class="edtbl compact"><thead><tr><th rowspan="2">Estaca</th>'+groupHead+'<th rowspan="2"></th></tr><tr>'+subHead+'</tr></thead><tbody>'+body+totRow+'</tbody></table></div>';

  async function deleteEstacaClick(loteId,estacaId){

      Object.keys(ESTACA_AVANCO[loteId]||{}).forEach(function(k){if(k.indexOf(estacaId+'::')===0)delete ESTACA_AVANCO[loteId][k];});
      Object.keys(ESTACA_QTY_DIRTY).forEach(function(k){if(k.indexOf(estacaId+'::')===0)delete ESTACA_QTY_DIRTY[k];});

  /** Salva todas as quantidades pendentes (de qualquer lote expandido) e recalcula o total de
   * cada lote+serviço tocado, atualizando a mesma tabela de quantidades que o cronograma usa. */
  async function saveEstacaQtdAll(){
    var keys=Object.keys(ESTACA_QTY_DIRTY); if(!keys.length)return;
    try{
      var touched={};
      for(var i=0;i<keys.length;i++){
        var k=keys[i], parts=k.split('::'), estacaId=parts[0], servicoId=parts[1];
        var loteId=loteIdOfEstaca(estacaId); if(!loteId)continue;
        var val=Math.max(0,+ESTACA_QTY_DIRTY[k]||0);
        await sbUpsertEstacaQtd(loteId,estacaId,servicoId,val);
        ESTACA_QTY[loteId]=ESTACA_QTY[loteId]||{}; ESTACA_QTY[loteId][k]=val;
        touched[loteId+'::'+servicoId]=true;
      }
      ESTACA_QTY_DIRTY={};
      var tks=Object.keys(touched);
      for(var j=0;j<tks.length;j++){
        var tp=tks[j].split('::'), loteId2=tp[0], sid=tp[1];
        var li2=(window._LOTIDS||[]).indexOf(loteId2), si2=-1; SERV.forEach(function(s,idx){if(s.id===sid)si2=idx;});
        if(li2<0||si2<0)continue;
        var sum=0; (ESTACAS[loteId2]||[]).forEach(function(e){sum+=(ESTACA_QTY[loteId2]||{})[e.id+'::'+sid]||0;});
        await sbUpsertQuantidade(selectedObra.id,loteId2,sid,sum,SERV[si2].u);
        QTY[li2][si2]=sum;
      }
      renderProd(); toast('Quantidades por estaca salvas — total do(s) lote(s) atualizado.');
    }catch(e){ alert('Falha ao salvar: '+((e&&e.message)||e)); }
  }
  async function saveEstacaAvanco(loteId,estacaId,servicoId,field,val){
    var k=estacaId+'::'+servicoId;
    ESTACA_AVANCO[loteId]=ESTACA_AVANCO[loteId]||{};
    var ap=Object.assign({inicio:'',fim:'',prodId:null},ESTACA_AVANCO[loteId][k]);
    ap[field]=val;
    try{
      if(field==='fim'){
        var qty=(ESTACA_QTY[loteId]||{})[k]||0;
        if(val){
          if(ap.prodId){
            await sbUpdateProducao(ap.prodId,{data:val,quantidade:qty});
            var ex=window.PROD_LIST.filter(function(r){return r.id===ap.prodId;})[0];
            if(ex){ex.data=val;ex.qtd=qty;}
          } else {
            var li3=(window._LOTIDS||[]).indexOf(loteId);
            var estRow=(ESTACAS[loteId]||[]).filter(function(e){return e.id===estacaId;})[0];
            var newId=await sbCreateProducao(selectedObra.id,{servico_id:servicoId,lote_id:loteId,data:val,quantidade:qty,observacao:'Estaca '+estLabel(li3>=0?LOTS[li3]:'',estRow?estRow.dist:0)});
            window.PROD_LIST.unshift({id:newId,data:val,servId:servicoId,loteId:loteId,qtd:qty});
            ap.prodId=newId;
          }
        } else if(ap.prodId){
          await sbDeleteProducao(ap.prodId);
          window.PROD_LIST=window.PROD_LIST.filter(function(r){return r.id!==ap.prodId;});
          ap.prodId=null;
        }
      }
      await sbUpsertEstacaApontamento(loteId,estacaId,servicoId,{data_inicio:ap.inicio||null,data_fim:ap.fim||null,producao_diaria_id:ap.prodId||null});
      ESTACA_AVANCO[loteId][k]=ap;
      renderProd();
    }catch(e){ alert('Falha ao salvar avanço: '+((e&&e.message)||e)); }
  }
  /** Aplica a mesma data (início ou término) a várias estacas de uma vez, num único serviço —
   * em lotes de escrita (upsert em massa) em vez de uma chamada por estaca. */
  async function saveEstacaAvancoBulk(loteId,estacaIds,servicoId,field,val){
    if(!estacaIds.length)return 0;
    ESTACA_AVANCO[loteId]=ESTACA_AVANCO[loteId]||{};
    var apRows=[], prodUpserts=[], prodDeleteIds=[];
    estacaIds.forEach(function(estacaId){
      var k=estacaId+'::'+servicoId;
      var ap=Object.assign({inicio:'',fim:'',prodId:null},ESTACA_AVANCO[loteId][k]);
      ap[field]=val;
      if(field==='fim'){
        var qty=(ESTACA_QTY[loteId]||{})[k]||0;
        if(val){
          var prodId=ap.prodId||newUuid();
          prodUpserts.push({id:prodId,obra_id:selectedObra.id,servico_id:servicoId,lote_id:loteId,data:val,quantidade:qty});
          ap.prodId=prodId;
        } else if(ap.prodId){
          prodDeleteIds.push(ap.prodId);
          ap.prodId=null;
        }
      }
      apRows.push({obra_id:selectedObra.id,lote_id:loteId,estaca_id:estacaId,servico_id:servicoId,data_inicio:ap.inicio||null,data_fim:ap.fim||null,producao_diaria_id:ap.prodId||null});
      ESTACA_AVANCO[loteId][k]=ap;
    });
    if(prodUpserts.length){
      var r1=await SB.from('producao_diaria').upsert(prodUpserts,{onConflict:'id'});
      if(r1.error)throw r1.error;
      prodUpserts.forEach(function(p){
        var ex=window.PROD_LIST.filter(function(r){return r.id===p.id;})[0];
        if(ex){ex.data=p.data;ex.qtd=p.quantidade;}
        else window.PROD_LIST.unshift({id:p.id,data:p.data,servId:p.servico_id,loteId:p.lote_id,qtd:p.quantidade});
      });
    }
    if(prodDeleteIds.length){
      var r2=await SB.from('producao_diaria').delete().in('id',prodDeleteIds);
      if(r2.error)throw r2.error;
      window.PROD_LIST=window.PROD_LIST.filter(function(r){return prodDeleteIds.indexOf(r.id)<0;});
    }
    var r3=await SB.from('estaca_apontamentos').upsert(apRows,{onConflict:'estaca_id,servico_id'});
    if(r3.error)throw r3.error;
    return estacaIds.length;
  }
  async function applyBulkAvanco(li){
    var loteId=(window._LOTIDS||[])[li]; if(!loteId)return;
    var fromInp=document.querySelector('[data-bulkfrom="'+li+'"]'), toInp=document.querySelector('[data-bulkto="'+li+'"]');
    var svcSel=document.querySelector('[data-bulksvc="'+li+'"]'), fieldSel=document.querySelector('[data-bulkfield="'+li+'"]'), dateInp=document.querySelector('[data-bulkdate="'+li+'"]');
    if(!svcSel||!fieldSel)return;
    var from=(fromInp&&fromInp.value!=='')?+fromInp.value:-Infinity;
    var to=(toInp&&toInp.value!=='')?+toInp.value:Infinity;
    var estacas=(ESTACAS[loteId]||[]).filter(function(e){return e.dist>=from&&e.dist<=to;});
    if(!estacas.length){alert('Nenhuma estaca nesse trecho.');return;}
    var sv=SERV[+svcSel.value]; if(!sv)return;
    var field=fieldSel.value, val=(dateInp&&dateInp.value)||'';
    if(!val&&!confirm('Data em branco vai LIMPAR o campo "'+(field==='fim'?'Término':'Início')+'" de '+estacas.length+' estaca(s) do serviço "'+sv.n+'". Continuar?'))return;
    else if(val&&!confirm('Aplicar '+(field==='fim'?'Término':'Início')+' = '+brDate(val)+' em '+estacas.length+' estaca(s) do serviço "'+sv.n+'"?'))return;
    var btn=document.querySelector('[data-bulkapply="'+li+'"]');
    if(btn){btn.disabled=true;btn.textContent='Aplicando…';}
    try{
      var n=await saveEstacaAvancoBulk(loteId,estacas.map(function(e){return e.id;}),sv.id,field,val);
      renderProd(); toast('Aplicado a '+n+' estaca(s).');
    }catch(e){ alert('Falha ao aplicar: '+((e&&e.message)||e)); if(btn){btn.disabled=false;btn.textContent='Aplicar ao trecho';} }
  }
  /** Exporta um modelo Excel pra importar o estaqueamento em massa: Lote, Estaca (m) e uma
   * coluna de quantidade por serviço cadastrado. */
  function exportEstacasModelo(){
    if(typeof XLSX==='undefined'){alert('Biblioteca de planilha não carregou.');return;}
    var header=['Lote','Estaca (m)'].concat(SERV.map(function(s){return s.n+' ('+s.u+')';}));
    var rows=[header];
    if(LOTS.length&&SERV.length){
      rows.push([LOTS[0],0].concat(SERV.map(function(){return '';})));
      rows.push([LOTS[0],20].concat(SERV.map(function(){return '';})));
    }
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Estacas');
    XLSX.writeFile(wb,'modelo-estaqueamento.xlsx');

  /** Importa o estaqueamento em massa: cria lotes/estacas que faltarem (por nome/distância) e
   * grava as quantidades por estaca, com o mesmo rollup automático pro total do lote. */
  async function importEstacasWorkbook(wb){
    if(!selectedObra){alert('Abra uma obra antes de importar.');return;}
    var ws=wb.Sheets['Estacas']||wb.Sheets[wb.SheetNames[0]];
    if(!ws){alert('Planilha vazia.');return;}
    var aoa=sheetRows(ws);
    if(aoa.length<2){alert('Planilha vazia.');return;}
    if(!confirm('Importar esse estaqueamento? Lotes/estacas com o mesmo nome/distância são atualizados; novos são criados. Isso não apaga o que já existe.'))return;
    var header=aoa[0], svcCols=header.slice(2).map(function(n){return String(n||'').trim().replace(/\s*\([^)]*\)\s*$/,'');});
    var svcIdxByName={}; SERV.forEach(function(s,si){svcIdxByName[s.n.trim().toLowerCase()]=si;});
    var lotByName={}; LOTS.forEach(function(l,li){lotByName[l.trim().toLowerCase()]=li;});
    var createdLot=0, createdEst=0, qtyCount=0;
    var rows=aoa.slice(1).filter(function(r){return r&&r[0]!=null&&r[0]!==''&&r[1]!=null&&r[1]!=='';});
    for(var j=0;j<rows.length;j++){
      var lname=String(rows[j][0]).trim(); if(!lname)continue;
      if(!lotByName.hasOwnProperty(lname.toLowerCase())){
        await sbCreateLote(selectedObra.id,{nome:lname,ordem:LOTS.length+createdLot+1});
        createdLot++; lotByName[lname.toLowerCase()]=LOTS.length+createdLot-1;
      }
    }
    if(createdLot>0)await sbLoadCadastro(selectedObra.id);
    var lotIdxByName={}; LOTS.forEach(function(l,li){lotIdxByName[l.trim().toLowerCase()]=li;});
    var touched={};
    for(var k=0;k<rows.length;k++){
      var row=rows[k];
      var li=lotIdxByName[String(row[0]).trim().toLowerCase()]; if(li==null)continue;
      var loteId=(window._LOTIDS||[])[li]; if(!loteId)continue;
      var dist=Math.max(0,Math.round(Number(row[1])||0));
      if(ESTACAS[loteId]==null)await sbLoadEstacas(loteId);
      var est=(ESTACAS[loteId]||[]).filter(function(e){return e.dist===dist;})[0];
      if(!est){
        var newEstId=newUuid();
        var rIns=await SB.from('lote_estacas').insert({id:newEstId,obra_id:selectedObra.id,lote_id:loteId,numero:dist,distancia_m:dist});
        if(rIns.error){
          if(!/duplicate|unique/i.test(rIns.error.message||''))throw rIns.error;
          await sbLoadEstacas(loteId); est=(ESTACAS[loteId]||[]).filter(function(e){return e.dist===dist;})[0];
        } else { est={id:newEstId,numero:dist,dist:dist}; ESTACAS[loteId].push(est); createdEst++; }
        if(LOTE_COMPR[li]==null||dist>LOTE_COMPR[li]){ await sbSetLoteComprimento(loteId,dist,LOTE_ESPAC[li]||20); LOTE_COMPR[li]=dist; }
      }
      if(!est)continue;
      for(var c=0;c<svcCols.length;c++){
        var si=svcIdxByName[svcCols[c].toLowerCase()]; if(si==null)continue;
        var val=row[c+2]; if(val==null||val===''||!isFinite(+val))continue;
        val=Math.max(0,+val);
        await sbUpsertEstacaQtd(loteId,est.id,SERV[si].id,val);
        ESTACA_QTY[loteId]=ESTACA_QTY[loteId]||{}; ESTACA_QTY[loteId][est.id+'::'+SERV[si].id]=val;
        touched[loteId+'::'+SERV[si].id]=true; qtyCount++;
      }
    }
    var tks=Object.keys(touched);
    for(var t=0;t<tks.length;t++){
      var tp=tks[t].split('::'), loteId2=tp[0], sid=tp[1];
      var li2=(window._LOTIDS||[]).indexOf(loteId2), si2=-1; SERV.forEach(function(s,idx){if(s.id===sid)si2=idx;});
      if(li2<0||si2<0)continue;
      var sum=0; (ESTACAS[loteId2]||[]).forEach(function(e){sum+=(ESTACA_QTY[loteId2]||{})[e.id+'::'+sid]||0;});
      await sbUpsertQuantidade(selectedObra.id,loteId2,sid,sum,SERV[si2].u);
      QTY[li2][si2]=sum;
    }
    renderProd();
    toast('Importado: '+createdLot+' lote(s) novo(s), '+createdEst+' estaca(s) nova(s), '+qtyCount+' quantidade(s).');
  }

  /* ---- Gantt + resumo semanal (aba do Cronograma) ---- */
  /** Gantt dos serviços (barra = 1ª à última semana do serviço no cronograma). Rótulos das semanas
   *  em semana do calendário (S+isoWeek), com a data em tooltip. */
  function ganttSVG(opts){
    opts=opts||{};
    var sp=svcSpan(); var tw=1; sp.forEach(function(x){tw=Math.max(tw,x.e);});
    var W=opts.W||760,rowH=opts.rowH||28,H=SERV.length*rowH+40,pl=160,pr=16,iw=W-pl-pr;
    var xx=function(w){return pl+iw*(w-1)/Math.max(1,tw-1);};
    var s='';
    for(var g=1;g<=tw;g+=Math.ceil(tw/12)){s+='<line x1="'+xx(g)+'" y1="20" x2="'+xx(g)+'" y2="'+(H-16)+'" stroke="var(--line)"/><text class="axm" x="'+xx(g)+'" y="14" text-anchor="middle">S'+isoWeek(mondayOf(g))+'<title>'+fmtDate(mondayOf(g))+'</title></text>';}
    SERV.forEach(function(sv,si){var y=24+si*rowH,x1=xx(sp[si].s||1),x2=xx((sp[si].e||1)+1);
      s+='<text class="axm" x="8" y="'+(y+rowH/2+1)+'" style="fill:var(--ink);font-size:'+(rowH<22?9:11)+'px">'+sv.n+'</text>';
      s+='<rect x="'+x1.toFixed(1)+'" y="'+(y+(rowH<22?2:4))+'" width="'+Math.max(4,x2-x1).toFixed(1)+'" height="'+(rowH-(rowH<22?5:10))+'" rx="3" fill="'+svcColor(sv)+'"><title>'+sv.n+': S'+isoWeek(mondayOf(sp[si].s||1))+' ('+fmtDate(mondayOf(sp[si].s||1))+') – S'+isoWeek(mondayOf(sp[si].e||1))+'</title></rect>';});
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="min-width:700px'+(opts.maxH?';max-height:'+opts.maxH:'')+'">'+s+'</svg>';
  }
  function ganttHTML(){
    var gantt='<div class="card" style="margin-bottom:14px"><div class="eyebrow">Gantt dos serviços</div><div class="tc-wrap">'+ganttSVG()+'</div></div>';
    var wq=weeklyQtyBySvc();
    var th='<th>Serviço</th>'; for(var w=1;w<=wq.tw;w++)th+='<th class="r">S'+w+'</th>';
    var body=SERV.map(function(sv,si){var cells='';for(var w=1;w<=wq.tw;w++){var v=wq.M[si][w]||0;cells+='<td class="r mono"'+(v>0?'':' style="color:var(--muted)"')+'>'+(v>0?fmtBR(v):'·')+'</td>';}return '<tr><td><span class="swatch" style="background:'+svcColor(sv)+'"></span>'+sv.n+' <span class="note">('+sv.u+')</span></td>'+cells+'</tr>';}).join('');
    return gantt+'<div class="card"><div class="eyebrow">Resumo — quantidade por serviço por semana (unidade do tempo-caminho)</div><div class="tbl-wrap"><table class="edtbl"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div></div>';
  }

  /** Soma semanal (qty) por serviço a partir de uma lista de segmentos, até tw semanas. */
  function weeklyFromSegs(segs,tw){
    var weekly=[]; for(var w=0;w<=tw;w++)weekly[w]=SERV.map(function(){return 0;});
    (segs||[]).forEach(function(sg){ for(var i=0;i<sg.dur;i++){ var w=sg.start+i; if(w<=tw&&w>=0)weekly[w][sg.si]+=sg.wq[i]||0; } });
    return weekly;
  }
  /** Converte quantidade semanal em % acumulado por serviço + total, dado o total de cada serviço. */
  function cumulativePct(weekly,tw,totalByServ,grandTotal){
    var series={}; SERV.forEach(function(s,si){series[si]=[0];});
    var totalSeries=[0], accum=SERV.map(function(){return 0;}), grandAccum=0;
    for(var w=1;w<=tw;w++){
      SERV.forEach(function(s,si){
        accum[si]+=weekly[w][si]||0;
        series[si].push(totalByServ[si]>0?(accum[si]/totalByServ[si]*100):0);
      });
      grandAccum+=weekly[w].reduce(function(a,b){return a+b;},0);
      totalSeries.push(grandTotal>0?(grandAccum/grandTotal*100):0);
    }
    return {series:series,totalSeries:totalSeries};
  }

  /* ---- Filtro global de lotes (só visualização) ----
     O cronograma continua calculado integrado, com TODOS os lotes (predecessoras, filas de

  var LOT_VIEW=null; // {loteId:true,...} ou null

  }

  /** Filtra segmentos pra só os lotes de um pacote contratual (ou todos, se pacote for vazio),
   *  e sempre também pelo filtro global de lotes em exibição. */
  function filterSegsByPacote(segs,pacote){
    segs=viewSegs(segs||[]);
    if(!pacote)return segs;
    return segs.filter(function(sg){return pacoteOfLote(sg.li)===pacote;});
  }
  /** Dados da Curva S: previsto cliente (linha de base ativa, se houver), previsto executivo
   *  (cronograma atual, ao vivo) e realizado (Produção Diária), por serviço e total. Se
   *  window._curvaSPacote estiver setado, filtra pra só os lotes daquele pacote contratual —
   *  o cronograma continua calculado integrado (predecessoras entre pacotes funcionam), só a
   *  visão/curva mostrada é que fica recortada. */
  function curvaSData(){
    var pacote=window._curvaSPacote||'';
    var baseline=activeBaseline();
    var segsExecAll=buildSchedule();
    var segsClienteAll=baseline?scheduleWithSnapshot(baseline.snap):null;
    var segsExec=filterSegsByPacote(segsExecAll,pacote);
    var segsCliente=segsClienteAll?filterSegsByPacote(segsClienteAll,pacote):null;
    var twExec=1; segsExecAll.forEach(function(sg){twExec=Math.max(twExec,sg.start+sg.dur-1);});
    var twCliente=0; if(segsClienteAll)segsClienteAll.forEach(function(sg){twCliente=Math.max(twCliente,sg.start+sg.dur-1);});
    var tw=Math.max(twExec,twCliente,1); // horizonte sempre com base no cronograma integrado inteiro

    var totalByServ=SERV.map(function(s,si){var t=0;LOTS.forEach(function(l,li){if(!lotInView(li))return;if(pacote&&pacoteOfLote(li)!==pacote)return;t+=QTY[li][si]||0;});return t;});
    var grandTotal=totalByServ.reduce(function(a,b){return a+b;},0);

    var executivo=cumulativePct(weeklyFromSegs(segsExec,tw),tw,totalByServ,grandTotal);
    var cliente=segsCliente?cumulativePct(weeklyFromSegs(segsCliente,tw),tw,totalByServ,grandTotal):null;

    // realizado: apontamentos reais de Produção Diária, agregados na semana de trabalho correspondente à data
    var realWeekly=[]; for(var w3=0;w3<=tw;w3++)realWeekly[w3]=SERV.map(function(){return 0;});
    var weekIdxCache={};
    (window.PROD_LIST||[]).forEach(function(r){
      var li0=(window._LOTIDS||[]).indexOf(r.loteId);
      if(li0>=0&&!lotInView(li0))return;
      if(pacote){
        if(li0<0||pacoteOfLote(li0)!==pacote)return;
      }
      var mon=mondayOfIso(r.data), w4=weekIdxCache[mon];
      if(w4===undefined){
        w4=null;
        for(var wi=1;wi<=tw;wi++){ if(mondayOf(wi).toISOString().slice(0,10)===mon){w4=wi;break;} }
        weekIdxCache[mon]=w4;
      }
      if(w4==null)return;
      var si=null; SERV.forEach(function(s,i){if(s.id===r.servId)si=i;});
      if(si==null)return;
      realWeekly[w4][si]+=r.qtd||0;
    });
    var real=cumulativePct(realWeekly,tw,totalByServ,grandTotal);

    var hojeW=hojeWeekNumber(tw);

    // cronograma dinâmico: até hoje usa o realizado real; dali em diante, projeta o restante
    // no ritmo previsto ou no ritmo histórico observado (conforme window._curvaSProjMode).
    var projMode=window._curvaSProjMode||null;
    var projetado=null;
    if(projMode==='previsto'||projMode==='historico'){
      var segsProj=filterSegsByPacote(buildProjectedSchedule(projMode),pacote);
      var weeklyProj=[]; for(var wp=0;wp<=tw;wp++)weeklyProj[wp]=SERV.map(function(){return 0;});
      for(var wp2=1;wp2<=Math.min(hojeW,tw);wp2++)weeklyProj[wp2]=realWeekly[wp2].slice();
      segsProj.forEach(function(sg){ for(var i=0;i<sg.dur;i++){ var w5=sg.start+i; if(w5>hojeW&&w5<=tw)weeklyProj[w5][sg.si]+=sg.wq[i]||0; } });
      projetado=cumulativePct(weeklyProj,tw,totalByServ,grandTotal);
    }
    return {tw:tw,hojeW:hojeW,baseline:baseline,cliente:cliente,executivo:executivo,real:real,projetado:projetado,projMode:projMode,pacote:pacote};
  }
  /** Extrai a série (array por semana) de uma "curva" (índice de serviço, ou 'total') de uma fonte cliente/executivo/real. */
  function curveSeries(src,sel){
    if(!src)return null;
    return sel==='total'?src.totalSeries:src.series[sel];
  }
  function sCurve(id,data,sel){
    var el=document.getElementById(id); if(!el)return;
    var W=700,H=210,pl=30,pr=10,pt=10,pb=18,iw=W-pl-pr,ih=H-pt-pb;
    var afs='style="font-size:7.5px"';
    var tw=data.tw;
    if(!SERV.length||!tw){el.innerHTML='';el.removeAttribute('viewBox');return;}
    var n=tw+1;
    var xx=function(i){return pl+iw*i/Math.max(1,n-1);}, yy=function(v){return pt+ih-ih*v/100;};
    var s='';
    for(var g=0;g<=100;g+=25){s+='<line x1="'+pl+'" y1="'+yy(g)+'" x2="'+(W-pr)+'" y2="'+yy(g)+'" stroke="var(--line)"/><text class="axm" '+afs+' x="'+(pl-5)+'" y="'+(yy(g)+2.5)+'" text-anchor="end">'+g+'</text>';}
    var stepLbl=Math.max(1,Math.ceil((n-1)/13));
    for(var i=1;i<n;i+=stepLbl){s+='<text class="axm" '+afs+' x="'+xx(i)+'" y="'+(H-6)+'" text-anchor="middle">S'+isoWeek(mondayOf(i))+'</text>';}
    if((n-1)%stepLbl!==0)s+='<text class="axm" '+afs+' x="'+xx(tw)+'" y="'+(H-6)+'" text-anchor="middle">S'+isoWeek(mondayOf(tw))+'</text>';
    function path(a){if(!a)return '';var d='';for(var j=0;j<a.length;j++){d+=(j?'L':'M')+xx(j).toFixed(1)+' '+yy(a[j]).toFixed(1)+' ';}return d;}
    var cCliente=curveSeries(data.cliente,sel), cExec=curveSeries(data.executivo,sel), cReal=curveSeries(data.real,sel);
    var cProj=data.projetado?curveSeries(data.projetado,sel):null;
    if(cCliente)s+='<path d="'+path(cCliente)+'" fill="none" stroke="var(--crit)" stroke-width="1.6"/>';
    if(cExec)s+='<path d="'+path(cExec)+'" fill="none" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="5 3"/>';
    if(cProj)s+='<path d="'+path(cProj)+'" fill="none" stroke="var(--c5)" stroke-width="1.5" stroke-dasharray="2 2"/>';
    if(cReal)s+='<path d="'+path(cReal)+'" fill="none" stroke="var(--good)" stroke-width="1.9"/>';
    if(data.hojeW>0&&data.hojeW<=tw){
      var hx=xx(data.hojeW);
      s+='<line x1="'+hx+'" y1="'+pt+'" x2="'+hx+'" y2="'+(pt+ih)+'" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="3 3"/>'+
        '<text x="'+hx+'" y="'+(pt-3)+'" text-anchor="middle" class="axm" '+afs+'>hoje</text>';
    }
    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;
  }
  function kpiCardCv(colorKey,lab,val,foot){

    return '<div class="kpi"><div class="stripe" style="background:'+colMap[colorKey]+'"></div><div class="lab">'+lab+'</div><div class="val num">'+val+'</div><div class="foot">'+foot+'</div></div>';

      html+=kpiCardCv('warn','IDP executivo',idpExec!=null?idpExec.toFixed(2):'—','realizado ÷ previsto executivo');
      if(data.projetado){
        var cProjArr=curveSeries(data.projetado,sel), doneWeek=null;

        var projTxt=doneWeek!=null?('S'+isoWeek(mondayOf(doneWeek))):'além do horizonte atual';
        html+=kpiCardCv('mut','Previsão de término','🔮 '+projTxt,'ritmo '+(data.projMode==='historico'?'histórico':'previsto')+' a partir de hoje');

  function weeklyDelta(series,w){
    if(!series||w<1||w>=series.length)return null;

  function renderCvBars(data,sel){
    var el=document.getElementById('cvBars'); if(!el)return;

    var weeks=[]; for(var w=hojeW-3;w<=hojeW+3;w++)weeks.push(w);
    var vals=weeks.map(function(w){
      if(w<1||w>data.tw)return {w:w,p:null,r:null,e:null};
      return {w:w,p:weeklyDelta(cCliente,w),r:weeklyDelta(cReal,w)||0,e:weeklyDelta(cExec,w)||0};
    });
    var W=480,H=180,pl=28,pr=8,pt=14,pb=20,iw=W-pl-pr,ih=H-pt-pb,n=vals.length;
    var maxV=1; vals.forEach(function(v){ [v.p,v.r,v.e].forEach(function(x){if(x!=null)maxV=Math.max(maxV,x);}); });
    var xx=function(i){return pl+iw*i/n;}, yy=function(v){return pt+ih-ih*v/maxV;};
    var grpW=iw/n*0.82, barW=grpW*0.28;
    var s='';
    for(var g=0;g<=3;g++){var val=maxV*g/3; s+='<line x1="'+pl+'" y1="'+yy(val)+'" x2="'+(W-pr)+'" y2="'+yy(val)+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(yy(val)+2.5)+'" text-anchor="end" font-size="7" fill="var(--muted)">'+val.toFixed(0)+'</text>';}
    vals.forEach(function(v,i){
      var x0=xx(i), wLbl=v.w>=1?('S'+isoWeek(mondayOf(v.w))):'—', isHoje=v.w===hojeW;
      s+='<text x="'+(x0+grpW/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="8" fill="'+(isHoje?'var(--crit)':'var(--muted)')+'"'+(isHoje?' font-weight="700"':'')+'>'+wLbl+'</text>';
      if(v.w<1||v.w>data.tw)return;
      function bar(idx,val,color,label){
        if(val==null||val<=0)return;

        s+='<rect x="'+bx.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,y2-y1).toFixed(1)+'" fill="'+color+'"><title>'+label+' '+wLbl+': '+val.toFixed(1)+'%</title></rect>'+

    var xx=function(i){return pl+iw*i/Math.max(1,n-1);}, yy=function(v){return pt+ih-ih*(v-minV)/(maxV-minV);};

    [minV,1,maxV].forEach(function(val){ s+='<text x="'+(pl-4)+'" y="'+(yy(val)+2.5)+'" text-anchor="end" font-size="7" fill="var(--muted)">'+val.toFixed(2)+'</text>'; });

      if(v.exe!=null)s+='<circle cx="'+xx(i)+'" cy="'+yy(v.exe)+'" r="2.2" fill="var(--crit)"/><text x="'+xx(i)+'" y="'+(yy(v.exe)+9)+'" text-anchor="middle" font-size="6.5" fill="var(--crit)">'+v.exe.toFixed(2)+'</text>';

  function renderHistChart(){
    var el=document.getElementById('histSvg'); if(!el)return;
    var hist=computeHistogram(), tw=hist.tw;
    var visRes=RECURSOS.filter(function(r){
      if(HIST_FILTER!=='todos'&&r.tipo!==HIST_FILTER)return false;
      return passaClasse(r,HIST_CLASSE);
    });
    var legEl=document.getElementById('histLeg');
    if(!tw||!visRes.length){ el.innerHTML=''; if(legEl)legEl.innerHTML=''; return; }
    // HIST_ORIGEM decompõe direto (serviços) × indireto (apoio administrativo). O previsto já
    // vem separado (byResourceDireto/byResourceIndireto); o realizado apontado por recurso não
    // é separado por origem, então rateia proporcional ao previsto de cada lado naquela semana —
    // mesma lógica de computeServicePR, só que aqui por tipo de recurso filtrado (visRes).
    var prevWeek=[], realWeek=[];
    for(var w=0;w<tw;w++){
      var d=calWeekDate(w+1).toISOString().slice(0,10), p=0, r=0;
      visRes.forEach(function(res){
        var pd=(hist.byResourceDireto[res.id]||[])[w]||0, pi=(hist.byResourceIndireto[res.id]||[])[w]||0;
        var rvTotal=realRec(res.id,d,res.tipo==='equipamento'?HIST_CLASSE_EQ:'todos');
        if(HIST_ORIGEM==='direto'){ p+=pd; if(pd+pi>0)r+=rvTotal*(pd/(pd+pi)); }
        else if(HIST_ORIGEM==='indireto'){ p+=pi; if(pd+pi>0)r+=rvTotal*(pi/(pd+pi)); }
        else { p+=pd+pi; r+=rvTotal; }
      });
      prevWeek.push(p); realWeek.push(r);
    }
    var W=900,H=290,pl=44,pr=64,pt=26,pb=48,iw=W-pl-pr,ih=H-pt-pb; // pt maior: cabe o rótulo em cima da barra
    var maxVal=1;
    for(var w2=0;w2<tw;w2++)maxVal=Math.max(maxVal,prevWeek[w2],realWeek[w2]);
    var xx=function(w3){return pl+iw*w3/tw;}, grpW=iw/tw*0.82, barW=grpW*0.42;
    var yy=function(v){return pt+ih-ih*v/maxVal;};
    var s='', steps=4;
    for(var g=0;g<=steps;g++){var val=Math.round(maxVal*g/steps);s+='<line x1="'+pl+'" y1="'+yy(val)+'" x2="'+(W-pr)+'" y2="'+yy(val)+'" stroke="var(--line)"/><text class="axm" x="'+(pl-6)+'" y="'+(yy(val)+3)+'" text-anchor="end">'+val+'</text>';}
    var wnAll=[]; for(var wi=0;wi<tw;wi++)wnAll.push(wi+1);
    s+=weekAxisSVG(wnAll,function(i){return xx(i)+grpW/2;},iw/tw,pt+ih,pl,W-pr);
    var hol=hist.isHoliday||[];
    for(var wh=0;wh<tw;wh++){ if(hol[wh])s+='<rect x="'+xx(wh).toFixed(1)+'" y="'+pt+'" width="'+(iw/tw).toFixed(1)+'" height="'+ih+'" fill="var(--warn)" opacity="0.10"><title>Recesso / feriado — S'+isoWeek(calWeekDate(wh+1))+' (recursos mobilizados, sem produção)</title></rect>'; }
    // Rótulos de dados: um por barra quando há espaço; em obra longa, um por semana
    // ("previsto·realizado", na vertical) a cada N semanas, pra não virar borrão.
    var parCabe=barW>=7, fsLbl=parCabe?0:6, passoLbl=parCabe?1:labelStep(iw/tw,fsLbl);
    for(var w4=0;w4<tw;w4++){
      var pv=prevWeek[w4], rv=realWeek[w4]; if(pv<=0&&rv<=0)continue;
      var x0=xx(w4), wkLbl='S'+isoWeek(calWeekDate(w4+1));
      if(parCabe){
        s+=barLabelSVG(x0+barW/2,yy(pv),barW,pv);
        s+=barLabelSVG(x0+barW*1.15+barW/2,yy(rv),barW,rv);
      } else if(w4%passoLbl===0){
        var txtL=fmtBR(pv)+(rv>0?'·'+fmtBR(rv):'');
        s+='<text class="axm" font-size="'+fsLbl+'" transform="translate('+(x0+grpW/2+fsLbl*0.35).toFixed(1)+','+(Math.min(yy(pv),yy(rv))-3).toFixed(1)+') rotate(-90)" text-anchor="start">'+txtL+'</text>';
      }
      if(pv>0){
        var yP1=yy(pv), yP2=yy(0);
        s+='<rect x="'+x0.toFixed(1)+'" y="'+yP1.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,yP2-yP1).toFixed(1)+'" fill="var(--line-2)" stroke="var(--muted)"><title>Previsto — '+wkLbl+': '+fmtBR(pv)+'</title></rect>';

      }
      if(rv>0){
        var col=rv>pv?'var(--crit)':(rv<pv?'var(--warn)':'var(--good)');
        var yR1=yy(rv), yR2=yy(0);
        s+='<rect x="'+(x0+barW*1.15).toFixed(1)+'" y="'+yR1.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,yR2-yR1).toFixed(1)+'" fill="'+col+'"><title>Realizado — '+wkLbl+': '+fmtBR(rv)+'</title></rect>';

      }
    }
    // Acumulado no mesmo gráfico (eixo da direita): previsto na obra inteira; realizado só até a
    // última semana com apontamento (depois disso a curva ficaria plana e enganaria — corta ali).
    var lastReal=-1; for(var w5=0;w5<tw;w5++){ if(realWeek[w5]>0)lastReal=w5; }
    var accP=[], accR=[], sP=0, sR=0;
    for(var w6=0;w6<tw;w6++){ sP+=prevWeek[w6]; accP.push(sP); if(w6<=lastReal){ sR+=realWeek[w6]; accR.push(sR); } }
    var wkLabels=[]; for(var w7=0;w7<tw;w7++)wkLabels.push('S'+isoWeek(calWeekDate(w7+1)));
    s+=accLinesSVG({prev:accP,real:accR},function(i){return xx(i)+grpW/2;},W-pr,pt,ih,wkLabels);
    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;
    if(legEl)legEl.innerHTML='<span><span class="swatch" style="background:var(--line-2);border:1px solid var(--muted)"></span>Previsto</span>'+
      '<span><span class="swatch" style="background:var(--good)"></span>Realizado = previsto</span>'+
      '<span><span class="swatch" style="background:var(--warn)"></span>Realizado abaixo</span>'+
      '<span><span class="swatch" style="background:var(--crit)"></span>Realizado acima</span>'+
      '<span><span class="swatch" style="background:var(--warn);opacity:.35"></span>Semana de recesso (equipe mobilizada)</span>'+
      '<span><span class="swatch" style="background:var(--muted)"></span>Previsto acumulado (tracejado, eixo à direita)</span>'+
      '<span><span class="swatch" style="background:var(--accent)"></span>Realizado acumulado (até a última semana apontada)</span>';
  }

  /** Linhas dos gráficos comparativos da aba Cenários: cronograma ao vivo + cada cenário, com
   *  cor fixa por posição e a marcação de "entra ou não" (CMP_SEL) — a mesma lista alimenta a
   *  Curva S e o histograma comparativo, pra que a seleção valha pros dois. */
  function cmpLines(){
    var palette=['#1e3a8a','#0ea5e9','#65a30d','#f97316','#7c3aed','#dc2626','#14b8a6','#a855f7'];
    var lines=[{key:'live',nome:'Cronograma atual',snap:null,color:'var(--muted)',on:CMP_SEL.live!==false}];
    CENARIOS.forEach(function(c,ci){
      lines.push({key:c.id,nome:c.nome+(c.tipo==='baseline'?(' — '+c.revisao):''),snap:c.snap,color:palette[ci%palette.length],on:CMP_SEL[c.id]!==false});
    });
    return lines;
  }
  // Cache por render da aba Cenários: cada linha (cronograma atual / cenário) tem seu cronograma
  // e histograma calculados uma vez só, compartilhados pela Curva S, pelo histograma comparativo
  // e pela comparação de matrizes. Zerado em cmpAll().
  var _cmpMemo={segs:{},hist:{}};
  function cmpSegs(l){ if(!_cmpMemo.segs[l.key])_cmpMemo.segs[l.key]=scheduleWithSnapshot(l.snap); return _cmpMemo.segs[l.key]; }
  function cmpHistFor(l){ if(!_cmpMemo.hist[l.key])_cmpMemo.hist[l.key]=histogramWithSnapshot(l.snap); return _cmpMemo.hist[l.key]; }
  function cmpAll(){ _cmpMemo={segs:{},hist:{}}; cmpCurves(); cmpHist(); cmpMatrix(); }
  /** Comparação visual das matrizes (aba Cenários): uma mini-matriz por linha selecionada, só
   *  com a cor dos serviços em cada lote × semana (sem números), pra enxergar onde o cronograma
   *  muda de um cenário pro outro. A primeira linha selecionada é a referência; nas demais, as
   *  células cujo conjunto de serviços difere da referência ganham contorno vermelho. */
  function cmpMatrix(){
    var el=document.getElementById('cmpMat'); if(!el)return;
    var lines=cmpLines().filter(function(l){return l.on;});
    if(!SERV.length||!LOTS.length||!lines.length){ el.innerHTML=''; return; }
    var lotIdxs=viewLotIdxs();
    var data=lines.map(function(l){
      var all=cmpSegs(l), tw=1; all.forEach(function(sg){tw=Math.max(tw,sg.start+sg.dur-1);});
      var cell={}; // 'semana::li' -> [si,...]
      viewSegs(all).forEach(function(sg){
        for(var i=0;i<sg.dur;i++){ if(!(sg.wq[i]>0))continue; var k=(sg.start+i)+'::'+sg.li; var arr=cell[k]||(cell[k]=[]); if(arr.indexOf(sg.si)<0)arr.push(sg.si); }
      });
      return {line:l,cell:cell,tw:tw};
    });
    var tw=1; data.forEach(function(d){tw=Math.max(tw,d.tw);});
    var ref=data[0];
    function ck(arr){ return (arr||[]).slice().sort(function(a,b){return a-b;}).join(','); }
    el.innerHTML=data.map(function(d,di){
      var diffs=0;
      if(di>0){
        var keys={}; Object.keys(d.cell).concat(Object.keys(ref.cell)).forEach(function(k){keys[k]=1;});
        Object.keys(keys).forEach(function(k){ if(ck(d.cell[k])!==ck(ref.cell[k]))diffs++; });
      }
      var title='<span class="swatch" style="background:'+d.line.color+'"></span><b>'+d.line.nome+'</b>'+
        (di===0?' <span class="note">(referência) · '+d.tw+' sem</span>':' <span class="note">· '+d.tw+' sem · <b style="color:'+(diffs?'var(--crit)':'var(--good)')+'">'+diffs+' célula'+(diffs===1?'':'s')+' diferente'+(diffs===1?'':'s')+'</b> da referência</span>');
      return '<div><div style="font-size:12px;margin-bottom:4px">'+title+'</div>'+miniMatrixSVG(d,lotIdxs,tw,di>0?ref:null)+'</div>';
    }).join('');
  }
  function miniMatrixSVG(d,lotIdxs,tw,ref,opts){
    opts=opts||{};
    var all=!!opts.all; // relatório: todos os lotes e semanas rotulados (lotes na vertical)
    var n=Math.max(1,lotIdxs.length), W=opts.W||620, labelW=26, labelH=12, footH=all?44:labelH;
    var cw=(W-labelW)/n, ch=Math.max(3,Math.min(all?10:9,Math.floor((all?480:360)/tw)));
    var H=labelH+tw*ch+footH;
    function ck(arr){ return (arr||[]).slice().sort(function(a,b){return a-b;}).join(','); }
    var s='<rect x="'+labelW+'" y="'+labelH+'" width="'+(W-labelW)+'" height="'+(tw*ch)+'" fill="var(--elev)"/>';
    var stepW=all?1:Math.max(1,Math.ceil(tw/12)), stepL=all?1:Math.max(1,Math.ceil(n/14));
    var wkFs=all?Math.min(6,Math.max(4,ch-1.5)):6;
    var cells='', marks='';
    for(var r=0;r<tw;r++){
      var w=tw-r, y=labelH+r*ch;
      if((w-1)%stepW===0)s+='<text class="axm" x="'+(labelW-3)+'" y="'+(y+ch*0.5+wkFs*0.35)+'" text-anchor="end" style="font-size:'+wkFs+'px">S'+isoWeek(mondayOf(w))+'</text>';
      for(var c=0;c<n;c++){
        var li=lotIdxs[c], k=w+'::'+li, arr=d.cell[k], x=labelW+c*cw;
        if(arr&&arr.length){
          var sw=cw/arr.length;
          for(var j=0;j<arr.length;j++){ cells+='<rect x="'+(x+j*sw).toFixed(2)+'" y="'+y+'" width="'+Math.max(0.5,sw-0.3).toFixed(2)+'" height="'+(ch-0.5)+'" fill="'+svcColor(SERV[arr[j]])+'"/>'; }
        }
        if(ref&&ck(arr)!==ck(ref.cell[k]))marks+='<rect x="'+x.toFixed(2)+'" y="'+y+'" width="'+cw.toFixed(2)+'" height="'+ch+'" fill="none" stroke="#dc2626" stroke-width="1"/>';
      }
    }
    for(var c2=0;c2<n;c2+=stepL){
      if(all){ var lfs=Math.min(6.5,Math.max(4,cw-1.5)); s+='<text class="axm" transform="translate('+(labelW+c2*cw+cw/2+lfs*0.35).toFixed(2)+','+(labelH+tw*ch+3)+') rotate(90)" text-anchor="start" style="font-size:'+lfs+'px">'+LOTS[lotIdxs[c2]]+'</text>'; }
      else s+='<text class="axm" x="'+(labelW+c2*cw+cw/2)+'" y="'+(H-2)+'" text-anchor="middle" style="font-size:6px">'+LOTS[lotIdxs[c2]]+'</text>';
    }
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+s+cells+marks+'</svg>';
  }
  /** Gráfico de linhas simples (usado pelo histograma comparativo): cada série é um array
   *  indexado pela semana (índice 0 = semana 1). Eixo Y começa no zero e vai até o maior valor. */
  function lineChartSVG(el,series,opts){
    opts=opts||{};
    var W=opts.W||620,H=opts.H||220,pl=52,pr=10,pt=10,pb=22,iw=W-pl-pr,ih=H-pt-pb, w0=opts.weekStart||1, dateFn=opts.dateFn||calWeekDate;
    var n=1, ymax=opts.ymax||0;
    series.forEach(function(sr){ n=Math.max(n,sr.values.length); if(!opts.ymax)sr.values.forEach(function(v){ymax=Math.max(ymax,v||0);}); });
    if(ymax<=0)ymax=1;
    var xx=function(i){return pl+iw*i/Math.max(1,n-1);}, yy=function(v){return pt+ih-ih*v/ymax;};
    function path(a){var d='';for(var j=0;j<a.length;j++){d+=(j?'L':'M')+xx(j).toFixed(1)+' '+yy(a[j]||0).toFixed(1)+' ';}return d;}
    var s='';
    for(var g=0;g<=4;g++){ var v=ymax*g/4; s+='<line x1="'+pl+'" y1="'+yy(v)+'" x2="'+(W-pr)+'" y2="'+yy(v)+'" stroke="var(--line)"/><text class="axm" x="'+(pl-6)+'" y="'+(yy(v)+3)+'" text-anchor="end">'+(opts.fmt||fmtBR)(v)+'</text>'; }
    var step=Math.max(1,Math.ceil(n/8));
    for(var i=0;i<n;i+=step){ s+='<text class="axm" x="'+xx(i)+'" y="'+(H-6)+'" text-anchor="middle">S'+isoWeek(dateFn(w0+i))+'</text>'; }
    series.forEach(function(sr){ s+='<path d="'+path(sr.values)+'" fill="none" stroke="'+sr.color+'" stroke-width="2"'+(sr.dashed?' stroke-dasharray="6 4"':'')+'/>';
      if(sr.dots)sr.values.forEach(function(v,j){ s+='<circle cx="'+xx(j).toFixed(1)+'" cy="'+yy(v||0).toFixed(1)+'" r="2.5" fill="'+sr.color+'"><title>S'+isoWeek(dateFn(w0+j))+' · '+(opts.fmt||fmtBR)(v||0)+'</title></circle>'; }); });
    el.setAttribute('viewBox','0 0 '+W+' '+H); el.innerHTML=s;
  }
  /** Histograma comparativo entre cenários (aba Cenários): total de recursos mobilizados por
   *  semana (mão de obra, equipamentos ou os dois) em cada cenário selecionado — uma curva
   *  semanal e outra acumulada (recurso × semana). */
  function cmpHist(){
    var elW=document.getElementById('cmpHistW'), elA=document.getElementById('cmpHistA');
    if(!elW||!elA)return;
    var legEl=document.getElementById('cmpHistLeg');
    var lines=cmpLines().filter(function(l){return l.on;});
    if(!SERV.length||!RECURSOS.length||!lines.length){ elW.innerHTML=''; elA.innerHTML=''; if(legEl)legEl.innerHTML=''; return; }
    var recIds=RECURSOS.filter(function(r){return CMP_HIST_TIPO==='todos'||r.tipo===CMP_HIST_TIPO;}).map(function(r){return r.id;});
    var computed=lines.map(function(l){
      var h=cmpHistFor(l);
